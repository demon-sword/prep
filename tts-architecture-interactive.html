wer before the caller hears it, and per-stage timers that attribute a slowdown to the stage that caused it. Note also that the transcript is legally the record in healthcare, so you will run an ASR anyway: S2S doesn't remove ASR from your bill, it removes it from the critical path and leaves you a second model to keep aligned with the one actually talking.","bestChoice":"Hybrid, split per capability not per product: full-duplex S2S for the conversational shell (turn-taking, backchannels, graceful interruption) with a strict handoff, and a cascade for identity verification, scheduling and anything transactional. Or keep the cascade and steal only the good part — let an acoustic turn-taking model drive the endpointer while text still carries the content.","whyBest":"Full duplex is genuinely better at conversation and genuinely worse at transactions, where a wrong token is a wrong appointment. Splitting by capability gets the natural turn-taking without giving up the text boundary where biasing, redaction, validation and the legal transcript all attach.","gotcha":"Three. (1) 'Speech-to-speech' names three different systems and vendors blur them — a blob-in/blob-out API is a hidden cascade that removes none of your stages. (2) The phone leg: these models are trained at 24 kHz on clean speech and your PSTN call hands them 8 kHz mu-law with jitter and packet loss — a band and noise profile they barely saw, and you CANNOT patch it with a front end because the front end is the model. Evaluate on real narrowband call audio, not the demo. (3) The caller's voice now lives in the model's context instead of being converted to text and discarded — voice is a biometric identifier, so retention, region and BAA scope bind on the audio context itself, and unlike the cascade there is no point at which you can redact before persisting. And the deeper cost is diagnosability: the cascade fails with a line number, S2S fails as a learned behaviour.","interviewLine":"\"The cascade's latency problem isn't that any one stage is slow — it's that there are four sequential commit points... around 1.2 seconds, and half a second of that is one silence threshold. A full-duplex model collapses those four into one learned decision to start speaking, so you're looking at roughly 700 ms on the same call, and it's making that decision from the pitch contour and the hesitation rather than from a silence timer. What you pay for it is the text checkpoint. That boundary throws away about 99.8% of the bits — 64 kbps of mu-law down to roughly a hundred bits per second of words — but it's also where contextual biasing for drug names lives, where redaction happens before storage, where the guardrail runs before the caller hears anything, and where the transcript that is legally the record comes from. So I'd deploy it per capability, not per product: full duplex for the conversational shell, cascade for anything transactional.\"","numbers":[{"value":"1190 ms vs 725 ms","means":"Cascade (60 net + 500 endpoint + 120 ASR finalise + 320 TTFT + 130 TTFA + 60 net) against commit-then-generate S2S. Note 500 of the cascade's number is ONE threshold."},{"value":"4 commit points -> 1","means":"The actual source of the saving. Not faster tokens — fewer sequential decisions."},{"value":"~580:1","means":"Information cut at the ASR boundary: 64,000 bps of mu-law -> ~1,100 bps of codec tokens -> ~110 bps of text. About 99.8% discarded."},{"value":"64,000 bps","means":"mu-law 8 kHz phone audio: 8000 samples x 8 bits. The full signal before any model touches it."},{"value":"1,100 bps","means":"Codec tokens: 12.5 frames/sec x 8 codebooks x 11 bits. Compressed audio that still carries prosody."},{"value":"110 bps","means":"ASR text at 150 words/min: ~13.75 characters x 8 bits. Everything the cascade's LLM ever sees."},{"value":"12.5 Hz","means":"Moshi's frame rate — two parallel audio streams, model's and user's, one frame every 80 ms."},{"value":"Inner Monologue","means":"Moshi predicts a TEXT stream ahead of the acoustic tokens. Even the flagship full-duplex model keeps text as a prior; the dichotomy is softer than the marketing."},{"value":"24 kHz vs 8 kHz","means":"Most S2S models are trained on clean 24 kHz speech; a phone leg hands them 8 kHz mu-law with everything above 3.4 kHz gone. No front end fixes it, because the front end IS the model."},{"value":"~800 ms","means":"Where a caller stops treating the pause as thought. Human turn transitions cluster around a couple of hundred ms."},{"value":"days vs minutes","means":"Mean time to diagnosis. A cascade failure has a stage, a metric and a knob you change in minutes; an S2S failure is learned behaviour fixed with data over days. That is the real trade."}],"archNote":""},{"id":"25","title":"Speaker Embeddings","stage":0,"oneLiner":"A short list of numbers that stands for who is speaking.","problem":"Without a numeric handle on identity, a multi-speaker synthesiser has no way to be told 'use this person's voice', and nobody can check whether a generated voice actually resembles the target. Voice similarity stays a matter of opinion, so you cannot set a pass/fail threshold, cannot gate a release in CI, and cannot notice when the carrier changes codec and your verifier silently starts recognising the phone line instead of the caller.","how":"Feed audio of any length into a small network. It produces one row of features per 10-millisecond frame, and then the trick called statistics pooling collapses time: take the mean of every feature across all frames, take the standard deviation of every feature across all frames, and glue the two together. A 3-second clip and a 30-second clip both come out as one fixed-length vector, typically 192 or 512 numbers. The standard deviation half earns its place because how much a person's voice moves is as identifying as where it sits. The network is trained only to push the same person's clips together and different people apart, never to reconstruct audio, so every comparison is just the angle between two vectors (cosine): near 1 means same person, near 0 means strangers. It is a fingerprint reader for voices, not a recording: it throws away the words and keeps the identity, and like a fingerprint it is a biometric, not an anonymous summary.","bestChoice":"ECAPA-TDNN with attentive pooling and an additive-margin softmax, scored with plain cosine (no PLDA backend). Enrol through the exact codec path you serve on, subtract a per-channel mean before scoring, calibrate the accept threshold per phone leg, run it in parallel with ASR (never gate the first reply on it), and hold a second, independent encoder back purely for evaluation.","whyBest":"ECAPA-TDNN sharpened statistics pooling enough that a plain cosine works without the extra PLDA scoring backend, so verification is one dot product. Everything else on the list is about the phone line: a threshold tuned on studio audio is meaningless on an 8 kHz mu-law leg.","gotcha":"Two silent failures. (1) The codec is a direction in the space. Every embedding cut from an 8 kHz mu-law leg gets pushed the same way, and the discarded high band takes part of the speaker cue with it. Past a point, the same person across two channels scores LOWER than two different callers on one channel - your verifier is now sorting by phone, not by person, and nothing throws an error. (2) If you score cloning similarity with the same encoder you conditioned the synthesiser on, you are measuring vector copying, not voice copying: the number climbs release over release while nothing actually sounds closer.","interviewLine":"A speaker embedding is a fixed-length vector trained discriminatively - d-vectors averaged a hidden layer over frames, x-vectors introduced statistics pooling, which concatenates the mean and the standard deviation across time so any length collapses to one vector, and ECAPA-TDNN sharpened that with attentive pooling and a margin softmax until plain cosine scoring works without PLDA. The thing I'd actually watch in production is channel mismatch: a codec change isn't noise, it's a shared offset, and once that offset is on the order of the gap between two speakers your verifier is recognising the phone. So I enrol through the same codec path I serve on, subtract a per-channel mean, and calibrate the threshold on trials from that leg - tau is a property of the channel, not of the checkpoint.","numbers":[{"value":"192 or 512 dimensions","means":"The whole of 'who is speaking' compressed to a few hundred numbers. Small enough to store per caller, index, and compare with one dot product."},{"value":"(T, F) frames -> 2F vector","means":"Statistics pooling: T frames of F features become one vector twice as wide (mean half plus standard-deviation half). This is the mechanism that makes any clip length collapse to a fixed size."},{"value":"1/sqrt(T)","means":"How fast averaging cleans up per-clip randomness in theory. In practice frames 10 ms apart are highly correlated, so the effective sample count is far below T and the curve flattens early."},{"value":"3 s buys most of what 30 s buys","means":"Why enrolment prompts are short. Asking a caller for thirty seconds of speech gets you almost nothing over three, and annoys them."},{"value":"~60 ms of GPU for 3 s of audio (RTF 0.02)","means":"A few million parameters, far smaller than the ASR or TTS models beside it. Run concurrently with ASR and it costs zero in the 800 ms conversational turn budget - as long as you never make the first reply wait on enrolment."},{"value":"10 ms hop","means":"The frame rate feeding the pooling layer. It is also why frames are correlated and the duration gains saturate."},{"value":"EER","means":"Equal Error Rate: the single operating point where the rate of wrongly rejecting the same person equals the rate of wrongly accepting a stranger. One number for how separable your genuine and impostor score distributions are, on your data and your channel."}],"archNote":""},{"id":"26","title":"Zero-Shot Voice Cloning","stage":0,"oneLiner":"Copying a voice from three seconds of audio, with no training run.","problem":"The thing zero-shot solves is real: normally a new voice means collecting a corpus, running a fine-tune, and cutting a release, per speaker. Zero-shot gets a usable new voice in three seconds. The thing it breaks, on a live phone agent, is also real and concrete: each generated frame must be produced in under 13.3 milliseconds or the caller hears the agent stop dead mid-word; the model can repeat a word, drop a word, or never stop talking; the clone inherits the reference clip's room, hiss and phone-line bandwidth; and the caller's three-second clip is now a voiceprint sitting in your prompt store, which is a HIPAA biometric identifier with a retention clock.","how":"Stop thinking of synthesis as drawing a spectrogram and think of it as autocomplete over audio. Run the reference clip through a neural codec (EnCodec at 24 kHz) which turns it into a grid of integers: one frame every 320 samples, so 75 frames per second, 8 numbers per frame. Three seconds of enrolment becomes a 225-by-8 grid, 1,800 integers. Now write down the phonemes of what the reference said, the phonemes of what you want said next, and the reference's integers - and ask a language model to continue the sequence. Nothing in the training objective ever says 'clone a voice'; the model matches the voice because the most plausible continuation of someone speaking is that same person still speaking. Generation splits in two: an autoregressive stage grinds out the first codebook one frame at a time (this is the part on the 13.3 ms treadmill), and a non-autoregressive stage fills codebooks 2 through 8 in seven parallel passes. It is autocomplete for audio - which means it also autocompletes the air conditioning that was running behind the speaker.","bestChoice":"Do not ship it as the production agent voice. Ship ONE consented, contracted agent voice, fine-tuned into a fixed-speaker non-autoregressive model (the VITS the rest of this stack already uses). Keep zero-shot for three legitimate jobs: prototyping, multilingual continuity for a single speaker, and knowing how good it has become, because the fraud team will ask whether voice still authenticates anyone.","whyBest":"A fine-tuned fixed-speaker model has no per-step sequential floor, no repetition or non-termination failure mode, and its consent paperwork is done once instead of once per caller. It is faster, more stable, and legally simpler at the same time - the rare case where the compliance answer and the engineering answer agree.","gotcha":"The failures are discrete, not gradual. You do not get slightly worse audio - attention here is not monotonic and nothing forces every phoneme to be spoken exactly once, so you get a repeated word, a dropped word, or an utterance that will not terminate. Temperature is the only direct lever and it is a straight trade: turn it down and prosody flattens toward the prompt's cadence, turn it up and repetition climbs. Second trap: never compare a narrowband clone's similarity score against a studio clone's. The speaker encoder is band-sensitive too, so you will read channel mismatch as speaker mismatch and 'fix' the wrong thing.","interviewLine":"For a production voice agent I'd still not ship it. The AR stage has to emit 75 frames a second, so every decode step has to land under 13.3 milliseconds or you underrun and the caller hears the agent stop mid-word - and the failure modes are repetition and non-termination, not graceful degradation. One consented, fine-tuned agent voice is faster and more stable. And a member's voice is a HIPAA biometric identifier, so keeping their clip around as a cloning prompt is a retention and consent decision before it's an engineering one.","numbers":[{"value":"75 frames per second (24000 / 320)","means":"The codec's frame rate. Everything about the latency argument falls out of this one number."},{"value":"13.3 ms (1000 / 75)","means":"THE number. One autoregressive decode step must finish in under 13.3 ms including the growing KV-cache read, or generation falls behind playout. This is the whole per-step budget and it does not get bigger."},{"value":"step = 12 ms vs step = 15 ms","means":"12 ms sustains, giving roughly 600 ms to first audio with 10% headroom. 15 ms underruns - the agent stops mid-word. A 3 ms difference flips it from working to broken."},{"value":"225 x 8 = 1,800 tokens for a 3 s prompt","means":"What a three-second enrolment clip actually is inside the model: a grid of integers, not a waveform or an embedding."},{"value":"AR prefix = 225 tokens, NAR = 1,800","means":"The two stages see different prompts. The sequential stage only reads the coarse first codebook; the parallel stage reads the whole grid. Cheaper than it looks."},{"value":"300 sequential steps, not 2,400","means":"A 4-second reply costs 300 AR steps plus seven parallel forward passes - because seven of the eight codebooks are filled in parallel."},{"value":"800 ms turn budget, ~300 ms already gone","means":"Endpointing and ASR finalisation eat 300 ms before TTS starts. A cloning stack's several-hundred-ms first audio is most of what is left."},{"value":"60,000 hours (LibriLight) vs a few hundred (LibriTTS-scale)","means":"Why zero-shot reaches an unseen speaker at all. It is a scale story, not a clever-architecture story."},{"value":"~256 numbers (d-vector bottleneck)","means":"What the previous generation squeezed identity through. Trained to be invariant to everything except identity - which throws away exactly the paralinguistic detail that makes someone recognisable."},{"value":"3.4 kHz PSTN ceiling; sibilant identity above 4 kHz","means":"A prompt taken from a recorded phone call has literally none of the band where 's' sounds carry a person's identity. The model either clones a band-limited timbre or invents a top end that isn't theirs."},{"value":"1 s prompt = 75 frames = 10-12 phonemes","means":"Two or three words, a quarter of the English sound inventory at best. The model has no evidence of how this speaker makes the rest and falls back toward the population average."},{"value":"1 s -> 3 s buys far more than 3 s -> 30 s","means":"Diminishing returns arrive fast, which is why enrolment prompts are short."}],"archNote":""},{"id":"27","title":"Emotion and Style Control","stage":0,"oneLiner":"Changing how a line is said without changing who says it.","problem":"Without style control, one voice reads a cheerful appointment confirmation and a bad lab result in exactly the same tone. Without measuring style-speaker entanglement, the far worse thing happens quietly: turning the 'empathetic' dial also changes who the caller thinks they are talking to, so the agent's voice shifts between the greeting and the bad news - which is a consent problem before it is an aesthetic one.","how":"Take a reference clip's spectrogram, push it through strided convolutions and a recurrent layer, and keep the final state: one fixed-length vector for a clip of any length. Nothing labels it. It is trained only by whether the synthesiser reconstructs the audio, so it soaks up everything the text did not already specify - register, rate, emphasis, yes, but also the speaker, the microphone, the room, the codec and the noise floor. Global Style Tokens add one indirection: that reference vector is not used as the conditioning signal, it is used as a QUERY into an attention over a bank of about ten randomly-initialised, trainable vectors. Attention produces ten weights, the style embedding is their weighted sum, and that single vector is copied onto every encoder step so it colours the whole utterance. Think of it as ten mixing-desk faders the model invented for itself, learned with zero style labels - you listen afterwards and name them, and token 3 might turn out to be 'brightness', or 'faster', or 'recorded on the bad headset'. At inference you throw the reference clip away entirely and set the ten faders by hand.","bestChoice":"GST with the named-style-to-weight-vector mapping shipped as a versioned artifact so a 'calm' render reproduces across model versions; weights kept inside the simplex (non-negative, summing to about one); entanglement measured in CI against an independent speaker encoder with a gated threshold; style chosen from state you already hold - call reason, result type - rather than from an emotion classifier in the turn loop; and every style pair A/B'd through the 8 kHz codec, not in the studio.","whyBest":"It is unsupervised - you never label a single utterance as 'empathetic' - and the style embedding is a ten-way weighted sum, i.e. microseconds, precomputable per named style, so it costs literally nothing in the turn budget. The cost only appears if you put a model in the loop to CHOOSE the style.","gotcha":"Three traps. (1) When a slider leaves the simplex the artifact does not sound like a bad style, it sounds like a broken vocoder - buzz, hoarseness, a crushed voice - so you will spend a day debugging the vocoder when the actual bug is a weight of 3.0. (2) Entanglement is not a bug in the token bank, it is the training objective working exactly as written: the reference encoder was never told to ignore the speaker, so the tokens will happily use identity as a style dimension. Nobody notices until you measure it - same text, same speaker, two style settings, cosine between INDEPENDENT speaker embeddings. (3) A style pair that is obvious in a 24 kHz A/B can be near-indistinguishable at 8 kHz, so studio listening tests will pass styles that do nothing on a real call.","interviewLine":"The catch is what the reference encoder is actually compressing, which is everything the text didn't specify - so that includes the speaker, the mic and the room, not just the style. Which means style transfer drags identity: I'd check it by synthesising the same line for the same speaker under two style settings and taking the cosine between independent speaker embeddings. If that moves when only the style moved, the bank is entangled, and I'd reach for a gradient-reversal speaker classifier on the style embedding, or a tighter bottleneck, knowing both cost me some real expressivity. And hand-set weights are extrapolation the moment they leave the simplex - off that hull the vocoder buzzes.","numbers":[{"value":"10 style tokens","means":"The size of the learned basis in the original work. Small on purpose: the bottleneck is what keeps some of the reference clip's idiosyncrasy out of the style vector."},{"value":"w >= 0, sum(w) = 1","means":"Softmax attention weights are non-negative and add to one, so every style embedding the decoder saw during training was a blend of the ten tokens. Your hand-set sliders have no such constraint."},{"value":"0.3 -> 1.0 is control; -> 3.0 is extrapolation","means":"Where the knob stops being a knob. Past the blend region the decoder is producing spectrograms it was never trained on."},{"value":"cos = 1 / sqrt(1 + ||d||^2)","means":"Converts a speaker-cosine drop into a readable displacement: how far the style change pushed the voice off the target speaker's direction. Lets you set a numeric CI gate instead of arguing about it."},{"value":"3.4 kHz","means":"The PSTN ceiling. Spectral tilt, breathiness and fricative energy - most of what a listener hears as 'warm' or 'brisk' - live largely above it and are simply thrown away."},{"value":"speaker leak x0.28, style x0.92 (illustrative demo constants)","means":"The shape of the gradient-reversal trade: it crushes the speaker component hard but also shaves off a slice of the legitimate style variance that correlates with the speaker. You buy disentanglement with expressivity."},{"value":"microseconds / zero in the 800 ms turn budget","means":"The style embedding itself is free. Only the decision of WHICH style costs anything, and only if it is serial rather than run alongside ASR."}],"archNote":""},{"id":"28","title":"Watermarking, Consent and Voice Safety","stage":0,"oneLiner":"Proving the audio came from you, and getting permission you can take back.","problem":"Without a mark that survives a phone line, you cannot show a clip attributed to your agent actually came from your system - or that it did not. Without consent held as a droppable artifact, a speaker withdrawing consent means retraining a base model, which nobody will actually do. Without a hard-coded answer, a model told to be reassuring will deny being a robot when a caller asks. And without treating the waveform itself as an identifier, you will scrub the transcript, feel de-identified, and still be storing a voiceprint.","how":"A watermark is a quiet signal added on top of synthesised speech: a learned generator produces a perturbation shaped by the host audio, and a matched detector, trained against simulated distortions, scores every frame looking for it. The payload is tiny - tens of bits - so it can say 'model v7, tenant 12' and nothing more; it does not encode a sentence. Detection is statistical, like straining to hear a faint steady tone in a noisy room: evidence accumulates over the listening window, so confidence grows roughly as the square root of duration, which is why two seconds is a far stronger claim than 150 milliseconds. The crucial reframe: a watermark makes YOUR OWN output attributable. It says nothing about audio from a model that does not watermark, so absence of a mark is not evidence of a human. The other half of the topic is consent, and the engineering trick there is the same shape: keep the speaker as a droppable piece - a conditioning embedding or a per-speaker adapter bolted onto a frozen base - so withdrawal is deleting an artifact and re-serving, not un-training a model, which you cannot cheaply do.","bestChoice":"In-band watermark (inside 300-3400 Hz, the same narrow band as the speech), verified through the real codec chain rather than on the clean render; detection run offline over stored calls, never in the turn loop; consent held as a per-speaker adapter or embedding so revocation is a delete; per-utterance provenance in a versioned manifest (source, consent record id, licence, date); a pre-rendered disclosure played at call start; a deterministic branch answering 'am I talking to a robot?' ahead of the LLM; the cloning path restricted to enrolled, consented voices; and where possible transcribe-scrub-drop so the waveform is never stored at all.","whyBest":"Each choice converts an unbounded problem into a bounded engineering one: 'un-train the model' becomes 'delete a file'; 'detect deepfakes' becomes 'prove my own output'; 'make the model honest' becomes 'a code branch before the model runs'. The retention and deletion problem is cheapest to solve by never holding the waveform - and that is a decision made at the first pipeline stage, not in a quarterly review.","gotcha":"Someone will propose the watermark as anti-fraud or deepfake detection. It is not: absence of a mark just means the audio came from a model that does not watermark, or from a person. Say this out loud before the idea gets into a roadmap. The second trap is verifying the mark on the clean 24 kHz render - it passes, and then fails on every real call, because the network is the attack chain and it is not even adversarial. The third is a delete that stops at the audio bucket: a speaker embedding derived from patient audio is itself a biometric identifier, so are ASR caches and prompt logs.","interviewLine":"Watermarking makes my own output attributable - it doesn't detect deepfakes, because absence of a mark just means it came from a model that doesn't watermark. And on a phone call the network is already the attack: 24 kHz down to 8, band-limited to roughly 300-3400 Hz, mu-law, packet loss. Hide the mark at 6 kHz where it's inaudible and resampling deletes it, so it has to sit in the narrow band - the hardest place to hide it. And detection is a correlation over a window, going as the square root of duration, so a 150 ms barged-in chunk is near undetectable. On consent I'd care most about revocation: keep the speaker as an adapter so withdrawal deletes an artifact instead of triggering a retrain.","numbers":[{"value":"tens of bits of payload","means":"Enough to identify a model version or a tenant. Not enough to encode who said what - do not promise per-utterance forensics."},{"value":"d' = sqrt(2 * gamma * G)","means":"Detector strength. gamma is how much of the mark survived the chain; G is processing gain = window x chip rate / payload bits. Bigger payload directly costs you detectability."},{"value":"detection grows as sqrt(window)","means":"Doubling the clip length does not double confidence - it multiplies it by 1.41. Duration is the scarce resource."},{"value":"150 ms vs 2 s","means":"A barged-in 150 ms chunk is near-undetectable while two seconds is solid. Barge-in truncation and packet loss attack the detector directly, not incidentally."},{"value":"~38 dB mu-law SNR","means":"G.711's roughly constant signal-to-quantisation-noise across its dynamic range. Mu-law is the MILD part of the chain - resynthesising codecs and storage re-encodes are worse than their bitrate suggests."},{"value":"300-3400 Hz","means":"What a PSTN leg keeps. Anything the mark puts outside this is deleted by resampling before any adversary shows up."},{"value":"a mark at 6 kHz","means":"The tempting place - inaudible, easy to hide. Also exactly where 24 kHz-to-8 kHz resampling erases it outright and no detector recovers it."},{"value":"~10 ms per 200 ms chunk (RTF 0.05)","means":"Watermark embedding is NOT free. It lands on time to first audio inside an 800 ms turn budget, so measure it. Detection is the opposite - run it offline."},{"value":"FCC Feb 2024 / California B.O.T. Act / EU AI Act Art. 50 from Aug 2026","means":"Three regimes with different triggers but one stable engineering answer: pre-rendered disclosure plus a deterministic bot answer."}],"archNote":""},{"id":"29","title":"Listening Tests (MOS / CMOS)","stage":0,"oneLiner":"Asking real people to rate how natural the voice sounds, done properly.","problem":"Without a properly designed listening test you ship voice changes based on numbers that are mostly noise: a typical 20-listener panel reporting '+0.3 MOS, p\u003c0.05' is statistically indistinguishable from an experiment that could have declared the WORSE system the winner. And a score measured on studio headphones tells you nothing about the 8 kHz phone line the caller is actually on.","how":"MOS means Mean Opinion Score: you play one audio clip to a listener and ask them to rate it 5 (excellent) down to 1 (bad), then average everyone's ratings. The catch is that people don't have an absolute internal ruler - they calibrate to whatever range of clips you put in front of them, so a score is a property of that particular test, not of the system, and two scores from two different papers cannot be compared. The fix is comparison: put both systems in the SAME test, and better still, have the SAME listener judge both. That is CMOS (Comparative MOS) - one listener hears A and B back to back and says on a -3 to +3 scale how much better B is. Pairing works because every listener has a personal offset (some people rate everything a 4, some rate everything a 2); when the same person judges both systems, that offset cancels out exactly instead of being noise you have to average away. This is why a paired test needs roughly 260 judgements where the naive independent test needs 5,300 - the design does more work than the panel size.","bestChoice":"CMOS (paired comparison, ITU-T P.800 CCR) on a consented scripted corpus, played through the real 8 kHz mu-law telephony path; run periodically, never in CI.","whyBest":"Pairing cancels each listener's personal rating offset, so you get a real answer from a few hundred judgements instead of a thousand recruited listeners. Playing through the shipping codec path stops you measuring quality the caller never hears.","gotcha":"The dangerous cell is not the test that finds nothing - it's the small test that finds something. When power is low, the only results that clear the significance bar are the ones that happened to land far from zero, so the reported gain is inflated (Type M) and a real share of them point the wrong way (Type S). '+0.3 MOS, p\u003c0.05, 20 listeners' is a reason to rerun, not to ship. Second silent trap: crowd listeners sit outside your BAA, so recorded patient calls can never go to a panel.","interviewLine":"MOS is still the ground truth for naturalness, but it's a property of the test, not of the system - listeners calibrate to whatever range you show them, so my MOS and a paper's aren't comparable. Both systems go in one test, or I don't quote a difference. At a rating SD around 0.9, detecting 0.1 MOS at 80% power needs roughly 1,300 independent ratings per system, and ratings cluster by listener - at ICC 0.35 with ten utterances each the design effect is 4.15, so you really need 5,300, a thousand listeners. That's why I reach for CMOS: the same listener judges the pair, their offset cancels, and you measure the difference directly. The failure mode isn't a test that misses; it's an underpowered test that finds something.","numbers":[{"value":"5-point ACR scale (5 excellent to 1 bad)","means":"The standard MOS rating scale from ITU-T P.800. It is ordinal - the gap between 4 and 5 is not the same size as the gap between 1 and 2 - so averaging it is a convention people agree to, not a real measurement."},{"value":"-3 to +3 (7-point CCR scale)","means":"The CMOS scale: how much better is B than A, from 'much worse' through 'about the same' to 'much better'. One judgement of the difference instead of two noisy absolute scores."},{"value":"sigma = 0.9","means":"The typical spread (standard deviation) of individual ratings on the 5-point scale. It is huge relative to the 0.1 differences people try to detect, which is the whole reason listening tests need so many ratings."},{"value":"~1,300 ratings per system","means":"How many INDEPENDENT ratings you need to reliably detect a 0.1 MOS difference (80% power, 5% false-positive rate). Already far more than most papers collect."},{"value":"ICC rho = 0.35","means":"Intra-class correlation: 35% of the variation in ratings comes from WHICH LISTENER gave them, not from the audio. Ratings from one person are not independent evidence."},{"value":"design effect 4.15","means":"Kish correction 1+(m-1)*rho with 10 clips per listener. Because ratings cluster by person, your confidence interval computed as if they were independent is about 2x too narrow - you are twice as confident as you should be."},{"value":"~5,300 ratings = 1,056 listeners","means":"The real requirement for an unpaired 0.1 MOS test once clustering is accounted for. Nobody recruits a thousand listeners, which is exactly why you must pair instead."},{"value":"~830 ratings (paired ACR) / ~260 (CMOS)","means":"Same statistical power, achieved by design instead of headcount. This is the single most useful number on the page."},{"value":"200 ms added to an 800 ms turn","means":"A voice 0.1 MOS better that costs 200ms of extra delay is WORSE on a phone call. Naturalness and latency are separate gates and MOS is blind to the second one."},{"value":"3.4 kHz","means":"The upper limit of a phone line. The 's', 'f' and 'th' cues live above it, so headphone-judged MOS credits the model for sounds the caller literally cannot hear."}],"archNote":""},{"id":"30","title":"Objective Metrics (the automated proxies)","stage":0,"oneLiner":"Cheap computed scores that stand in for human listeners so CI can run them.","problem":"A listening test takes days and costs money, so it cannot gate every commit; without automated proxies a bad model reaches production between panels. But run the proxies naively and you ship the model that games them - pushed hard on MCD, the winning model is the one that hedges toward a bland average, which is precisely what listeners hate.","how":"There are three proxies and each one lies in a different direction, which is why you run all three. MCD (mel-cepstral distortion) measures, in decibels, how far the synthesised spectrum sits from a real human recording of the same sentence - but your synthesis has different timing than the reference, so you must time-warp the two onto each other first (DTW), otherwise you are measuring rhythm mismatch and calling it spectrum. WER (word error rate) runs the synthesised audio back through a speech recogniser and checks whether the words came out; the raw number includes the recogniser's own mistakes, so you always report it as a DELTA against that same recogniser's error rate on human readings of the same prompts. Speaker cosine similarity takes a numeric 'voiceprint' of the clone and of the real speaker and measures the angle between them - useful for voice cloning, but the scale belongs entirely to the voiceprint model, so a bare number is meaningless until you calibrate a threshold on known same-speaker and different-speaker pairs. Think of them as three witnesses who each have a blind spot: MCD is deaf to expressiveness, WER is deaf to buzzy artefacts, cosine is fooled by copying the room's echo.","bestChoice":"The triad: gate hard on delta-WER; screen (not gate) on MCD and speaker cosine; re-check the metric-vs-MOS correlation against a periodic listening panel. Compute everything through the 8 kHz mu-law path, self-hosted ASR, on a consented scripted golden set.","whyBest":"delta-WER is the only one whose direction listeners reliably agree with, and it catches skipped or repeated words that MOS raters miss entirely because they never see the prompt text. The other two screen cheaply but must never be the verdict, because whichever metric you optimise stops being a measure.","gotcha":"Each metric confidently disagrees with listeners in its own direction, and if you tune on one you ship its blind spot. MCD rewards hedging - an over-smoothed non-autoregressive system can beat an actual human recording of the same sentence on MCD and lose the listening test. WER is the mirror image: a dropped word from an attention failure barely dents MOS (raters never see the prompt) but dominates WER, while a recogniser happily transcribes vocoder buzz that listeners find unpleasant. Whisper-class recognisers also hallucinate text over silence, so a system whose only fault is a long trailing pause gets punished as insertions. Cosine rewards copying the reference clip's room reverb and mic colour, so the top-scoring clone is often the one that dragged the acoustics along with the voice.","interviewLine":"I run three, and I know what each one lies about. MCD needs DTW first or you're scoring duration mismatch, and because it rewards sitting near the conditional mean, an over-smoothed model can beat a real human recording on MCD and still lose the listening test. WER through an ASR is the one I actually gate on, as a delta against the recogniser's own floor on human reads of the same prompts, because it catches skipped and repeated words that MOS raters miss entirely - they never see the text. Speaker cosine is for cloning, and its scale belongs to the embedding model, so it means nothing until I calibrate a threshold on same- and different-speaker pairs. Compute all of it through the 8 kHz mu-law path - roughly 39% of the mel axis at 24 kHz is above the phone band - and remember none of the three sees latency, so they can all improve while the agent gets slower.","numbers":[{"value":"MCD = (10/ln10) * sqrt(2 * sum of squared coefficient differences)","means":"The formula, read out in decibels. The c0 coefficient is dropped because it encodes loudness, not spectral shape - you don't want a volume difference scoring as a quality difference."},{"value":"~39% of the mel axis","means":"At 24 kHz the mel scale runs to ~3267 mel but the phone band ends at ~1992 mel, so about 39% of what wideband MCD scores is audio a phone line throws away. Compute on the wire and the ranking of your systems changes."},{"value":"200 prompts x ~5 s = 1,000 s of audio","means":"The size of a practical golden set for CI - big enough to be stable, small enough to run per build."},{"value":"ASR RTF 0.05 -> ~50 GPU-seconds","means":"Transcribing the whole golden set costs under a minute of GPU. MCD and cosine cost far less, so the full metric sweep is about a minute per build - cheap enough that there is no excuse not to run it."},{"value":"m = 2595 * log10(1 + f/700)","means":"The mel warping formula that converts real frequency to perceptual frequency - it is what makes the 39% figure computable."},{"value":"EER operating point","means":"The similarity threshold at which false-accept and false-reject rates are equal - the defensible place to set a cloning cutoff, and you must quote both the threshold and the point you chose."}],"archNote":""},{"id":"31","title":"Serving Cost Economics","stage":0,"oneLiner":"What a minute of synthetic speech really costs once you count rented hours, not GPU-seconds.","problem":"You cost the pilot at the marginal GPU rate, quote $0.00026 a minute, and the first invoice is twenty times that - because you bought always-on capacity to serve a nine-hour clinic day. The mirror-image failure is winning the price argument by running the fleet at 95% utilisation, which is exactly the fleet where p95 time-to-first-audio disappears into queueing and callers hear dead air.","how":"Think of it like renting a taxi fleet rather than buying petrol. The petrol number - how much GPU time one second of speech burns - is genuinely tiny: about half a cent per hundred minutes. But you cannot buy GPU-seconds; you rent whole cards by the hour whether they are busy or idle. And you must size the fleet for the busiest moment, not the monthly average, because a phone call cannot queue until morning. Clinic traffic lands in roughly nine hours a day, five days a week, so peak concurrency runs about five times the month mean; that pushes you to three cards that are busy about 5% of the hours you pay for. Then add the line nobody puts in the spreadsheet: the engineer who maintains the serving stack, the voice regression suite, model upgrades and the 3 a.m. page - at roughly half an engineer fully loaded, that human is over three times the GPU bill and it is what actually decides build-versus-buy. And before any of that, check compliance: the text you send a vendor ('your results from Dr Chen are ready') is patient health information, so without a signed BAA, contractual zero retention, and no training on your submissions, the economics never get a vote.","bestChoice":"Self-host, sized on PEAK concurrency at ~70% target utilisation with an N+1 spare, priced on wall-clock rented hours WITH engineering carry included; Redis phrase cache for invariant carrier phrases; Triton dynamic batching with the window bounded by the TTFA budget; PHI/BAA check runs before the economics.","whyBest":"At the illustrative regional volume, self-hosting is still ~2.6x cheaper than per-character vendor pricing even after carry, and the PHI constraint often removes the vendor option outright. Sizing on peak with headroom keeps the latency budget intact, which the cheapest possible fleet would destroy.","gotcha":"Two symmetric traps. First: quoting the marginal rate ($0.00026/min) in a business case when the invoice will reflect rented wall-clock hours ($0.0048, or $0.0212 with carry) - a 20x-80x understatement. Second and subtler: 'winning the price argument and losing the SLO' - the cheapest fleet is the one running at 95% utilisation, which is precisely the fleet where p95 TTFA turns into queueing and callers hear dead air. Keep utilisation and p95 TTFA on the SAME Grafana board so nobody optimises one blind to the other. Third, easy to miss: a good phrase cache scales the vendor bill linearly but scales yours in whole GPUs, so near the crossover a cache argues FOR buying. Also: TTS is usually the cheap leg - streaming ASR runs at near 100% duty cycle because you keep listening while the agent talks, and the LLM bills per token every turn.","interviewLine":"I'd start from RTF, but I wouldn't stop there, because the marginal number is misleading. At batch 8 with a p95 batch-1 RTF of 0.05 you're spending about 0.013 GPU-seconds per audio-second - fifty to one against per-character vendor pricing. But you don't buy GPU-seconds: you size on peak concurrency and pay by the hour, and clinic traffic lands in about nine hours a day, so peak runs five-ish times the month mean. At half a million calls a month that's three cards including an N+1 spare, running at roughly five percent utilisation, and the real figure is about half a cent a minute. The thing that actually decides it is the line nobody puts in the sheet: the serving stack, the voice regression suite, the upgrades and the on-call - half an engineer moves the crossover from a hundred and thirty thousand calls a month to the better part of a million. And before any of that, the text we submit is PHI, so if the vendor won't sign a BAA with zero retention and no training on our submissions, the crossover doesn't matter, we self-host.","numbers":[{"value":"$0.00026 / audio-minute","means":"The MARGINAL compute cost - what one minute of speech costs in raw GPU time at batch 8. It is the number that misleads everyone, because you never buy compute this way."},{"value":"$0.0126 / minute (vendor)","means":"Per-character vendor pricing at $15/million chars and 14 chars/s of speech. Flat - it does not fall with volume, which is both its weakness at scale and its strength at pilot scale."},{"value":"~50x","means":"How much cheaper marginal compute looks than the vendor. The page calls this comparison 'close to worthless' - it's the trap, not the answer."},{"value":"$0.0048 / minute (GPUs only)","means":"The honest self-hosted figure once you pay for three whole rented cards for 730 hours. 19x the marginal number, and still 2.6x better than the vendor."},{"value":"$0.0212 / minute (all-in)","means":"The truly honest figure once the $9,000/month engineering carry is included. This is the number that belongs in the build-vs-buy deck."},{"value":"$9,000/month engineering carry","means":"Half an engineer fully loaded: serving stack, voice regression suite, model upgrades, capacity work, 3 a.m. on-call. It is 3.4x the GPU bill at three cards."},{"value":"127,000 -> 904,000 calls/month","means":"Where build beats buy, before and after including the carry. A 7x shift decided entirely by the line item that never makes it into the RTF arithmetic. (The curve first dips under the vendor at ~841k, but the fleet's step from 3 to 4 cards pushes it back above, so 904k is where it stays below.)"},{"value":"rtf_eff = 0.0128 GPU-s per audio-s","means":"Effective real-time factor at batch 8 given a measured p95 batch-1 RTF of 0.05. This, times the GPU price, is the marginal cost."},{"value":"peak : month-mean = 5x","means":"Clinic traffic isn't spread over 730 hours - it lands in ~9 hours a day, 5 days a week. You size for 63 audio-seconds/wall-second, not the 12.5 the monthly average suggests."},{"value":"5.4% fleet utilisation","means":"You rent 730 hours a month and the clinic is open about 200. The idle share IS the product - real-time voice cannot defer work to off-peak."},{"value":"3 GPUs","means":"ceil(1.15) = 2 at 70% target utilisation, plus an N+1 spare. The integer ceiling is why RTF improvements often buy nothing."},{"value":"kappa = 1 + beta(B-1), beta = 0.15","means":"How batching scales cost: a batch of 8 costs 2.05 singles' worth of compute for 8 streams. Batch 8 -> 32 cuts compute 31%."},{"value":"~90 ms of batch service time","means":"What batch 32 costs every caller versus batch 8 (141 ms vs 51 ms on 0.5 s chunks), inside an 800 ms turn budget - to save $876/month. Bad trade at 3 cards, obvious win at 300."},{"value":"30% phrase-cache hit rate","means":"Disclosures, hold prompts and menu options are identical every call; a Redis lookup replaces a GPU render for nearly a third of speech. 'Unremarkable' to achieve."},{"value":"12% barge-in waste","means":"Speech you synthesise and then throw away because the caller interrupted. Real cost, invisible in naive volume math."},{"value":"35% agent talk share","means":"The agent is only speaking about a third of a call, so calls are not the same as concurrent synthesis streams."}],"archNote":""},{"id":"32","title":"Voice Agent Regression Testing","stage":0,"oneLiner":"Replaying recorded calls through the whole system to catch breakage before callers do.","problem":"Every stage can pass its own unit tests while the assembled call is wrong: the recogniser hears one digit differently, the LLM answers perfectly for the text it was given, the TTS faithfully speaks that answer, and the caller is told the wrong copay. Nothing throws an exception, no test goes red, and you find out from a complaint.","how":"You keep a fixed set of recorded caller-side calls - a 'golden set' - and replay them through the real front door the phone carrier uses: 8 kHz mu-law audio, 20 ms packets at 50 per second, through the actual jitter buffer. Crucially you play them at real speed, not as fast as the file can be read, because endpointing hangover, jitter buffering and barge-in cancellation are all wall-clock phenomena: shove the WAV in at max speed and a 300 ms silence elapses in microseconds, the race between 'vocoder is still talking' and 'cancel just arrived' never happens, and the suite goes green while callers are being talked over. You never compare waveform bytes - synthesis is deliberately random (stochastic duration, sampling temperature) and isn't even bit-identical across a driver upgrade, so a byte-diff suite is red on day one and switched off by week two. Instead you assert on four things: the exact TEXT handed to the TTS, exact match on risk-carrying ENTITIES (member ID, date of birth, dosage, appointment time), exact TOOL CALLS with their arguments, and TIMING (endpoint delay, first-audio latency, trailing audio after a barge-in). To find WHICH stage broke it, you climb a ladder - baseline, then swap in the new ASR, then ASR+LLM, then all three - four replays instead of the eight a full grid would need, with the same random seeds each rung so a difference between rungs is the swap and not luck.","bestChoice":"Real-time-paced golden-call replay through the real SIP/8 kHz mu-law ingress, asserting on entities + tool arguments + delta-WER + timing; a 4-rung attribution ladder with common random numbers; thresholds derived from measured baseline variance; plus a fast text-in/text-out lane on every commit that is forbidden from certifying anything with a millisecond in it.","whyBest":"It is the only structure that catches boundary failures no stage's own tests can see, and the two-lane split keeps per-commit CI cheap while still making turn-taking races actually happen before release.","gotcha":"The characteristic failure here is ABANDONMENT, not a false green: a byte-diff suite is red on its first run and switched off by its second week, and a suite that flakes 27% of the time gets the same treatment. The second silent trap is the fast lane certifying timing - if the harness pushes the WAV in as fast as it can read the file, a 300 ms hangover elapses in microseconds, the barge-in race never happens, and the suite is green while callers get talked over. Third: a vendor ASR that silently updates underneath you invalidates the baseline, and you will confidently attribute its regression to your own commit - so pin model digests, decoding parameters, prompt-template version and the ASR's version string into every run's metadata. Fourth: the ladder is incomplete by construction - it cannot see an interaction that only appears when the new TTS meets the old ASR, so when it attributes nothing, fall back to the full eight. Fifth: the run ARTIFACTS inherit the PHI classification, not just the audio - the transcripts, prompts and tool arguments a regression run writes are PHI too.","interviewLine":"I replay a golden call set through the whole loop - real SIP ingress, 8 kHz mu-law, 20 ms packets - and I assert on meaning and milliseconds, never on waveform bytes. Synthesis is stochastic by design and isn't even bit-stable across a driver upgrade, so a byte-diff suite is red on day one and disabled by week two. So: exact match on entities and tool arguments, delta WER against that same recogniser's floor, and timing - endpoint delay, first-audio latency, trailing audio after a barge-in cancel. The thing I'd insist on is pacing the replay in real time: if you shove the WAV in as fast as you can read it, a 300 ms endpointing hangover elapses in microseconds and the barge-in race never happens - the suite is green while callers are getting talked over. And for attribution I run a ladder rather than a full factorial: baseline, then ASR, then ASR+LLM, then all three, with common random numbers, so each new failure lands on the stage swapped at that rung. That's how you catch the compounding case where a better ASR hears one digit differently, the LLM answers perfectly for what it was given, and the caller still gets the wrong member ID read back.","numbers":[{"value":"8 kHz mu-law, 20 ms packets, 50 packets/s","means":"The exact wire format the carrier delivers. Replaying through anything else means you tested a system you don't ship."},{"value":"120 calls x 75 s = 9,000 s of audio","means":"A realistic golden set. At real-time pacing that is 2.5 hours run serially, or ~7.5 minutes at 20 concurrent sessions - and it costs 20 concurrent GPU-backed sessions for those minutes. Real-time pacing has a real bill."},{"value":"~800 ms","means":"The point at which a caller reads a pause as dead air. First-audio latency is asserted against this, not against a vibe."},{"value":"2^3 = 8 vs 4 replays","means":"Full factorial over three stages at two versions each is 8 whole-set replays; the ladder (A/A/A -> B/A/A -> B/B/A -> B/B/B) gets attribution in 4."},{"value":"~3 standard deviations","means":"Where to set a timing gate: measured from K baseline replays of unchanged HEAD, never picked by taste."},{"value":"sd 45 ms, tolerance +/-50 ms, N=1 -> ~27% flake rate","means":"A single measurement of a metric that naturally varies by 45 ms will trip a 50 ms gate more than a quarter of the time. That is a suite people will start ignoring."},{"value":"N = 9 repeats -> SE 15 ms -> under 0.1% flake","means":"Averaging shrinks the standard error as sqrt(N). Nine repeats turns a 27% flake rate into a non-issue. This is the whole flake budget in one line: tighten the tolerance or raise the repeats, and pay in wall clock either way."},{"value":"3% WER","means":"Meaningless as a corpus number - 3% spread over filler words is fine, 3% landing on the digits of a member ID is an incident. Corpus-level WER cannot distinguish them, which is why you assert on entities exactly."},{"value":"WER_TOL = 0.010 absolute","means":"The delta-WER tolerance, and only ever as a delta versus the same recogniser's own floor."}],"archNote":""}]}</script>
<script>
'use strict';
const D = JSON.parse(document.getElementById('arch-data').textContent);

/* ================= glossary tooltips ================= */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// alias (lowercased surface form) -> canonical display term
const LOOKUP = D.aliasMap;

const TERMS = D.linkable.slice().sort((a, b) => b.length - a.length);
const RE = new RegExp(
  '(?<![\\w-])(' + TERMS.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')(?![\\w-])',
  'gi'
);

const MAX_LINKS = 6;
function gl(text) {
  const s = esc(text);
  if (!s) return '';
  const seen = new Set();
  let n = 0;
  return s.replace(RE, m => {
    if (n >= MAX_LINKS) return m;
    const key = m.toLowerCase();
    if (seen.has(key)) return m;
    const canon = LOOKUP[key];
    if (!canon) return m;
    seen.add(key); n++;
    return `<span class="gloss" tabindex="0" data-t="${esc(canon)}">${m}</span>`;
  });
}

/* ================= sections ================= */
function primer() {
  return `
  <p>A voice agent has to do six things between the moment you stop talking and the moment it answers: <b>notice you stopped</b>, <b>work out what you said</b>, <b>decide what to reply</b>, <b>turn that reply into sounds</b>, <b>turn those sounds into a wave</b>, and <b>get that wave down a phone line</b>. This page is about the last three, plus the first one — the speech side, not the thinking side.</p>
  <p>The hard part is not quality. It is that all of this has to finish in about <b>800 milliseconds</b>, and that almost every way it fails is <b>silent</b>. A wrong number in the audio settings does not crash anything; the caller just hears a buzz. A model that runs 5× slower under load does not return an error; the caller just hears the agent stop mid-word. That is why this page keeps pointing at the same two things: <b>where the milliseconds go</b>, and <b>what to measure so you find out before a caller does</b>.</p>
  <p><b>Any dotted-underlined word has a plain-English definition</b> — hover it, or tap it on a phone. There are ${Object.keys(D.glossary).length} of them, all searchable in the glossary at the bottom. Switch to <b>Expert</b> in the bar above to reveal the precise configs and numbers underneath every plain-English line.</p>`;
}

function stageHTML(s) {
  const cs = 'Concepts ' + s.concepts.join(', ');
  const rows = s.rows.map(r => `
    <div class="row">
      <div class="row-k">${esc(r.k)}</div>
      <div>
        <div class="row-plain">${gl(r.plain)}</div>
        <div class="row-expert expert-only">${gl(r.expert)}</div>
      </div>
    </div>`).join('');

  const paths = s.paths ? `
    <div class="paths">
      <div class="path">
        <h5>${esc(s.paths.cascade.title)}</h5>
        <div class="pl">${gl(s.paths.cascade.plain)}</div>
        <div class="pe expert-only">${gl(s.paths.cascade.expert)}</div>
      </div>
      <div class="path rec">
        <h5>${esc(s.paths.e2e.title)}</h5>
        <div class="pl">${gl(s.paths.e2e.plain)}</div>
        <div class="pe expert-only">${gl(s.paths.e2e.expert)}</div>
      </div>
    </div>` : '';

  return `
  <div class="stage ${s.color === 'green' ? 'green' : s.color === 'amber' ? 'amber' : ''}" data-stage="${s.id}">
    <button class="stage-head" aria-expanded="false">
      <span class="stage-num">${s.n}</span>
      <span class="stage-body">
        <span class="stage-t">${esc(s.title)}</span>
        <span class="stage-p">${gl(s.plain)}</span>
        <span class="stage-c">${esc(cs)}</span>
      </span>
      <span class="chev">▶</span>
    </button>
    <div class="stage-detail" hidden>
      <div class="why">${gl(s.why)}</div>
      ${paths}
      <div class="rows">${rows}</div>
      <div class="gotchas">
        <h5>Silent failure modes</h5>
        <ul>${s.gotchas.map(g => `<li>${gl(g)}</li>`).join('')}</ul>
      </div>
    </div>
  </div>`;
}

function latencyHTML() {
  const L = D.latency;
  if (!L) return '';
  const rows = L.rows.map(r => {
    const isTotal = /^TOTAL/.test(r.stage);
    const isRisk = /^(TAIL RISK|ALTERNATIVE)/.test(r.stage);
    const ov = r.overlappable
      ? `<span class="ov ${/^yes/.test(r.overlappable) ? 'yes' : ''}">${esc(r.overlappable)}</span>` : '';
    return `<tr class="${isTotal ? 'total' : isRisk ? 'risk' : ''}">
      <td class="s">${gl(r.stage)}</td>
      <td class="b">${esc(r.budget)}</td>
      <td>
        <div>${gl(r.plain)}</div>
        <div class="blow expert-only"><b>If it blows:</b> ${gl(r.ifItBlows)}</div>
        ${ov}
      </td>
    </tr>`;
  }).join('');
  return `
    <div class="lat-total">${gl(L.total)}</div>
    <div class="tbl-scroll">
      <table class="lat">
        <thead><tr><th>Stage</th><th>Budget</th><th>What is happening</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function conceptCard(c) {
  const nums = (c.numbers || []).slice(0, 8).map(n =>
    `<div class="num"><b>${esc(n.value)}</b> — <span>${gl(n.means)}</span></div>`).join('');
  return `
  <article class="card" data-c="${c.id}">
    <button class="card-head" aria-expanded="false">
      <span class="card-id">${esc(c.id)}</span>
      <span class="card-t">${esc(c.title)}</span>
      <span class="chev">▶</span>
    </button>
    <div class="card-one">${gl(c.oneLiner)}</div>
    <div class="card-detail" hidden>
      <div class="fld"><h6>What breaks without it</h6><p>${gl(c.problem)}</p></div>
      <div class="fld"><h6>How it works</h6><p>${gl(c.how)}</p></div>
      <div class="fld expert-only"><h6>What to ship</h6><p>${gl(c.bestChoice)}</p></div>
      <div class="fld expert-only"><h6>Why that wins</h6><p>${gl(c.whyBest)}</p></div>
      ${nums ? `<div class="fld expert-only"><h6>Numbers that matter</h6><div class="nums">${nums}</div></div>` : ''}
      <div class="fld gotcha"><h6>The trap</h6><p>${gl(c.gotcha)}</p></div>
      ${c.interviewLine ? `<div class="fld say expert-only"><h6>How you'd say it out loud</h6><p>${gl(c.interviewLine)}</p></div>` : ''}
    </div>
  </article>`;
}

function render() {
  const byStage = n => D.concepts.filter(c => c.stage === n);
  const app = document.getElementById('app');
  app.innerHTML = `
  <div class="bar"><div class="bar-in">
    <label>Reading level</label>
    <div class="seg" id="mode">
      <button data-m="plain" aria-pressed="true">Plain English</button>
      <button data-m="expert" aria-pressed="false">Expert</button>
    </div>
    <div class="jump">
      <a href="#primer">Start</a><a href="#pipeline">Pipeline</a><a href="#latency">Latency</a>
      <a href="#concepts">32 concepts</a><a href="#glossary">Glossary</a>
      <a href="#principles">Principles</a><a href="#stack">Stack</a>
    </div>
  </div></div>

  <div class="wrap">
    <header class="header">
      <h1>TTS &amp; Voice Agent Architecture</h1>
      <p class="sub">The complete speech path for a phone-based voice agent — from the caller's first packet to the agent's first audible word — assembled from all 32 concept pages.</p>
      <div class="tags">
        <span class="tag primary">32 concepts</span>
        <span class="tag green">4 pipeline stages</span>
        <span class="tag amber">800 ms budget</span>
        <span class="tag">${Object.keys(D.glossary).length} terms defined</span>
        <span class="tag">Self-contained</span>
      </div>
    </header>

    <section class="section" id="primer">
      <h2 class="section-title"><span class="n">00</span> Start here</h2>
      <div class="primer">${primer()}</div>
    </section>

    <section class="section" id="pipeline">
      <h2 class="section-title"><span class="n">01</span> The pipeline</h2>
      <p class="section-lede">Four stages, each named by <b>what it is responsible for</b> rather than by the data format it emits — because the format in the middle is exactly what the modern answer deletes. Click any stage to open it.</p>
      <div class="flow">
        ${D.stages.map((s, i) => stageHTML(s) + (i < D.stages.length - 1 ? '<div class="arrow">▼</div>' : '')).join('')}
      </div>
    </section>

    <section class="section" id="latency">
      <h2 class="section-title"><span class="n">02</span> Where the 800 ms goes</h2>
      <p class="section-lede">The single most useful table on this page. Laid end to end these stages cost more than the budget allows; the pipeline only fits because two of them hide inside a third.</p>
      ${latencyHTML()}
    </section>

    <section class="section" id="control">
      <h2 class="section-title"><span class="n">03</span> Cross-cutting concerns</h2>
      <p class="section-lede">These do not sit at one point in the pipeline — they constrain all of it: turn-taking, identity, ethics, evaluation and cost.</p>
      <div class="cgrid">${D.controlPlane.map(conceptCard).join('')}</div>
    </section>

    <section class="section" id="concepts">
      <h2 class="section-title"><span class="n">04</span> All 32 concepts</h2>
      <p class="section-lede">Every concept, grouped by the stage it belongs to. Each opens with what breaks without it, then how it actually works.</p>
      ${[1, 2, 3, 4].map(n => `
        <h3 style="font-size:0.95rem;margin:1.5rem 0 0.7rem;color:var(--fg-muted);font-family:var(--font-mono)">
          Stage ${n} — ${esc(D.stages[n - 1].title)}
        </h3>
        <div class="cgrid">${byStage(n).map(conceptCard).join('')}</div>`).join('')}
    </section>

    <section class="section" id="glossary">
      <h2 class="section-title"><span class="n">05</span> Glossary</h2>
      <p class="section-lede">Every term of art from all 32 pages, in plain English. This is the section to reach for when a sentence anywhere stops making sense.</p>
      <input class="gsearch" id="gs" type="search" placeholder="Search ${Object.keys(D.glossary).length} terms — try 'mel', 'jitter', 'monotonic'…" autocomplete="off">
      <div class="gcount" id="gc"></div>
      <div class="glist" id="glist"></div>
    </section>

    <section class="section" id="principles">
      <h2 class="section-title"><span class="n">06</span> Cross-cutting principles</h2>
      <p class="section-lede">The nine rules that survive every architecture choice on this page.</p>
      <div class="pgrid">${D.principles.map(p => `
        <div class="pcard"><div class="n">${esc(p.n)}</div><h4>${esc(p.t)}</h4><p>${gl(p.d)}</p></div>`).join('')}</div>
    </section>

    <section class="section" id="stack">
      <h2 class="section-title"><span class="n">07</span> Recommended production stack</h2>
      <p class="section-lede">One defensible set of choices for a phone-based agent, with the reason attached to each.</p>
      <div class="tbl-scroll"><table class="stbl">
        <thead><tr><th>Layer</th><th>Choice</th><th>Config</th><th>Why</th></tr></thead>
        <tbody>${D.stack.map(r => `<tr>${r.map((c, i) => `<td>${i === 3 ? gl(c) : esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>
    </section>

    <footer class="footer">
      Synthesized from <code>tts/concepts/01–32.html</code> ·
      <a href="tts/concepts/index.html">concept index</a> ·
      <a href="index.html">prep index</a>
    </footer>
  </div>`;

  renderGlossary('');
  wire();
}

/* ================= glossary list ================= */
function renderGlossary(q) {
  const terms = Object.keys(D.glossary).sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
  const ql = q.trim().toLowerCase();
  const hits = ql
    ? terms.filter(t => t.toLowerCase().includes(ql) || D.glossary[t].toLowerCase().includes(ql))
    : terms;
  document.getElementById('gc').textContent =
    ql ? `${hits.length} of ${terms.length} terms` : `${terms.length} terms`;
  document.getElementById('glist').innerHTML = hits.length
    ? hits.map(t => `<div class="gitem"><b>${esc(t)}</b><span>${esc(D.glossary[t])}</span></div>`).join('')
    : `<div class="gitem"><span>No term matches that. Try a shorter word.</span></div>`;
}

/* ================= interactions ================= */
function wire() {
  // expand / collapse
  document.getElementById('app').addEventListener('click', e => {
    const head = e.target.closest('.stage-head, .card-head');
    if (!head) return;
    const box = head.parentElement;
    const detail = box.querySelector('.stage-detail, .card-detail');
    const open = detail.hidden;
    detail.hidden = !open;
    box.classList.toggle('open', open);
    head.setAttribute('aria-expanded', String(open));
  });

  // reading level
  document.getElementById('mode').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.body.dataset.mode = b.dataset.m;
    [...e.currentTarget.children].forEach(x =>
      x.setAttribute('aria-pressed', String(x === b)));
  });

  // glossary search
  const gs = document.getElementById('gs');
  gs.addEventListener('input', () => renderGlossary(gs.value));

  // tooltips
  const tip = document.getElementById('tip');
  const show = el => {
    const t = el.dataset.t;
    const def = D.glossary[t];
    if (!def) return;
    tip.innerHTML = `<b>${esc(t)}</b>${esc(def)}`;
    tip.hidden = false;
    const r = el.getBoundingClientRect();
    const tr = tip.getBoundingClientRect();
    let left = r.left + window.scrollX;
    left = Math.max(8, Math.min(left, window.innerWidth - tr.width - 8));
    let top = r.top + window.scrollY - tr.height - 8;
    if (top < window.scrollY + 4) top = r.bottom + window.scrollY + 8;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  };
  const hide = () => { tip.hidden = true; };

  document.addEventListener('mouseover', e => {
    const g = e.target.closest('.gloss'); if (g) show(g);
  });
  document.addEventListener('mouseout', e => {
    if (e.target.closest('.gloss')) hide();
  });
  document.addEventListener('focusin', e => {
    const g = e.target.closest('.gloss'); if (g) show(g);
  });
  document.addEventListener('focusout', hide);
  document.addEventListener('click', e => {
    const g = e.target.closest('.gloss');
    if (g) { e.preventDefault(); tip.hidden ? show(g) : hide(); } else hide();
  });
  window.addEventListener('scroll', hide, { passive: true });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });
}

document.body.dataset.mode = 'plain';
render();

</script>
</body>
</html>
