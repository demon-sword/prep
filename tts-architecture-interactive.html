eans":"Cost of a dictionary hit — a hash lookup. This is why lexicon-first costs nothing."},{"id":"07","value":"2% OOV on a 15-word chunk","means":"Realistic out-of-vocabulary rate: 0.3 words per streamed chunk actually reach the learned model."},{"id":"07","value":"~1 ms of a ~150 ms TTFA","means":"What that 0.3 model calls costs. G2P is a quality risk, not a latency risk — so don't spend engineering effort shaving its decode time, spend it on the overlay lexicon."},{"id":"07","value":"3.4 kHz","means":"The top of the phone network's passband. The acoustic energy that distinguishes /s/ from /f/ from /th/ lives above it, so a mispronunciation on a phone line is harder for the listener to mentally repair than in person."},{"id":"08","value":"85-180 Hz / 165-255 Hz","means":"Typical adult pitch ranges for men and women. Why models normalise pitch per-speaker: the same 'high note' is a different Hz value for each person."},{"id":"08","value":"11.61 ms","means":"One frame at 22.05 kHz with a 256-sample hop (1000*256/22050). This is the clock everything downstream ticks on."},{"id":"08","value":"~10 frames","means":"How many frames a 120 ms vowel occupies on that grid — the granularity the duration predictor is actually working at."},{"id":"08","value":"alpha = 1.15","means":"The speaking-rate dial: divide predicted durations by alpha to speak 1.15x faster. A single serve-time scalar, no retraining."},{"id":"08","value":"300-3400 Hz","means":"The phone line's passband. A 110 Hz fundamental is filtered out entirely by it — and yet the melody still survives (see next)."},{"id":"08","value":"330, 440, 550 Hz","means":"The harmonics of a 110 Hz voice that DO fit inside the passband. They're spaced by exactly F0, so the ear reconstructs the 'missing fundamental'. Telephony costs you fricatives, not intonation."},{"id":"08","value":"L-L% / H-H%","means":"ToBI notation for the two terminal contours: a statement falls to the bottom of the speaker's range, a yes/no question rises. This is the actual turn-yield cue."},{"id":"08","value":"256 bins","means":"Pitch and energy are quantised into 256 buckets each and looked up in an embedding table, rather than used as raw continuous values."},{"id":"09","value":"3 states per phone","means":"The standard onset/steady/offset breakdown of each sound, with self-loops and no skip arcs."},{"id":"09","value":"10 ms shift / 25 ms window","means":"The aligner's frame grid — the resolution at which boundaries can be placed."},{"id":"09","value":"30 ms floor","means":"Three states at 10 ms each means nothing shorter than 30 ms is representable. A flapped /t/ (the fast 'd'-like t in 'butter') is genuinely shorter and simply cannot be expressed."},{"id":"09","value":"48 states x 127 frames = ~6,100 cells","means":"The entire search for the phrase 'call the clinic back' (14 sounds + 2 silences, 1.27 s). The search grid is free — the acoustic model's forward pass is the whole cost."},{"id":"09","value":"O(T*S) not O(T*S^2)","means":"Cost is linear in frames times states because each state has at most two predecessors, instead of the quadratic cost of a general HMM. This is what makes it cheap."},{"id":"09","value":"2L+1","means":"Size of the CTC alignment graph: L target labels with a blank symbol interleaved around each one."},{"id":"09","value":"10 ms -> 11.61 ms","means":"The aligner's grid versus the mel grid at 22.05 kHz with hop 256. Durations must be integers summing EXACTLY to the mel frame count, so you round cumulative boundaries and difference them — rounding each duration independently lets the sum drift."},{"id":"09","value":"+/-30 ms","means":"Timestamp precision that's ample for redaction — enough to zero exactly the samples where a member ID was spoken without clipping neighbouring words."},{"id":"09","value":"3.4 kHz","means":"Where the phone band ends. Fricative boundaries (/s/ vs /f/) are cued above it, so on an 8 kHz leg the aligner is guessing sibilant onsets to within a couple of frames."},{"id":"10","value":"MOS 4.53 vs 4.58","means":"Human listeners rated Tacotron 2 with a WaveNet vocoder 4.53 out of 5, against 4.58 for actual recorded human speech - statistically that is basically parity, which is why this paper mattered."},{"id":"10","value":"12.5 ms hop","means":"Each spectrogram stripe covers 12.5 ms of audio, so one second of speech needs 80 sequential decoder steps. This single constant drives every latency number on the page."},{"id":"10","value":"~180 ms for a 1.5 s reply","means":"120 sequential steps at an illustrative 1.5 ms per step. RTF about 0.12 - i.e. it takes about an eighth of real time to generate. This is compute, not wall-clock-to-first-sound."},{"id":"10","value":"RTF ~0.12","means":"Real-time factor: generating 1 second of audio costs 0.12 seconds of GPU. Below 1.0 means you can keep up with a live call."},{"id":"10","value":"post-net receptive field 21 frames (non-causal)","means":"The 5-layer smoothing network at the end looks 10 frames forward and 10 back, so frame 0 is not final until frame 10 exists. Ten extra decoder steps = ~15 ms of wall clock even though those frames represent 125 ms of audio - do not confuse audio duration with compute time."},{"id":"10","value":"~37 ms time-to-first-audio","means":"11 decoder steps (17 ms) plus one vocoder chunk (~20 ms). This fits the ~170 ms the TTS stage actually gets inside an 800 ms turn; the 180 ms full-synthesis figure does not. That gap is the entire argument for streaming."},{"id":"10","value":"max_decoder_steps = 1000","means":"The safety cap on how many stripes it may paint. At 12.5 ms each that is 12.5 seconds - so hitting the cap means the caller hears 12.5 seconds of drone. This is the default in NVIDIA's reference config."},{"id":"10","value":"32 filters, width 31","means":"The convolution applied to the running tally of past attention. This is the specific mechanism that gives the model a memory of where it has been and makes alignment come out diagonal."},{"id":"10","value":"dropout 0.5 kept on at inference","means":"Unusual: normally dropout is disabled at serving time. Here the noise is load-bearing - it stops the decoder from locking onto its own predictions and collapsing."},{"id":"10","value":"300-3400 Hz PSTN passband","means":"A phone line only carries this frequency band. The mel spectrogram goes up to ~7.6 kHz, so most of the detail this model renders never reaches a phone caller - while its runaway-babble failure reaches them completely intact."},{"id":"11","value":"focus rate F = mean of the peak of each row","means":"How sharply the model is pointing. Near 1.0 means it is looking at one phoneme; falling toward 1/L means it is smeared across the whole sentence. From the FastSpeech paper."},{"id":"11","value":"abort at focus \u003c 0.30","means":"A practical trip-wire: once the exponentially-smoothed focus rate drops under 0.3 the output is a drone, so cancel synthesis and play a cached prompt."},{"id":"11","value":"abort at 3 backward jumps","means":"Three regressions of the reading position is a stutter, not noise. Trip and abort."},{"id":"11","value":"budget = 1.6 x 7 x n_phonemes frames","means":"An overrun guard. About 7 frames per phoneme is normal, so 60% headroom above that means the stop token has failed. Trip and abort."},{"id":"11","value":"~7 frames per phoneme, ~87 ms each","means":"At a 12.5 ms hop this is normal speaking rate, so 17 phonemes takes about 120 frames, 1.5 seconds. This is how you sanity-check whether a duration is plausible."},{"id":"11","value":"guided attention g = 0.2","means":"The width parameter of the training-time penalty that pays the model to stay near the diagonal (DC-TTS, Tachibana 2018). Weight = 1 - exp(-(t/T - s/L)^2 / 2g^2)."},{"id":"11","value":"1000 steps = 12.5 s of buzz","means":"The cost of a collapse: about ten times the GPU-seconds the utterance was budgeted, and the caller hears all of it."},{"id":"12","value":"11.61 ms per frame","means":"At 22.05 kHz with a 256-sample hop. One second of audio is 86.1 frames. Note this differs from Tacotron 2's 12.5 ms - do not mix the two constants."},{"id":"12","value":"1 parallel pass vs T serial passes","means":"The entire architectural argument. An AR decoder pays one forward pass per frame; FastSpeech 2 pays one pass total, regardless of length."},{"id":"12","value":"~270x faster mel, 38x end-to-end","means":"FastSpeech 1's reported speedup against Transformer TTS - their batch size, their hardware, not a guarantee at yours."},{"id":"12","value":"256 quantisation bins","means":"Pitch and energy are each bucketed into 256 levels, embedded, and added to the frame. Discretising them makes them learnable as embeddings rather than raw numbers."},{"id":"12","value":"clamp(d, min=1)","means":"The one-line fix for the sharpest bug in the architecture. round(0.4) is 0, which silently deletes a phone - 'sixty' loses its /t/ and becomes 'sixy'."},{"id":"12","value":"4 FFT blocks encoder + 4 decoder","means":"Feed-forward Transformer blocks: self-attention with a 1-D convolution in place of the usual position-wise feed-forward layer."},{"id":"12","value":"MSE in the log domain","means":"Durations are regressed as log d, so the mean-squared-error loss learns the conditional mean of log d - a geometric mean in frames. That pulls the long tail in, and is a specific reason synthetic rhythm sounds tidier than human rhythm."},{"id":"13","value":"431 frames for a 5 s reply","means":"At 22.05 kHz / 256-sample hop, 86.13 frames per audio second. This is the unit of work both families are measured in."},{"id":"13","value":"647 ms AR total vs ~26 ms NAR total","means":"431 sequential steps at 1.5 ms each, versus one parallel pass. A rout - and the wrong number to decide on."},{"id":"13","value":"AR first-audio ~47 ms, FLAT in length","means":"30 frames decoded (45 ms) plus vocoding them (2 ms). Because it streams, this figure does not grow with reply length - the key advantage of AR."},{"id":"13","value":"NAR first-audio \u003c30 ms at 5 s, 93 ms at 12 s","means":"It grows with T because nothing is final until the whole pass ends. Chunking at clauses flattens this, at the cost of audible seams."},{"id":"13","value":"~100 ms left for TTS in an 800 ms turn","means":"Endpoint hangover ~250 ms + ASR finalisation ~80 ms + LLM time-to-first-token ~280 ms + egress/jitter ~90 ms = about 700 ms gone before the synthesiser emits a sample."},{"id":"13","value":"HiFi-GAN V1: 3.7 MHz on V100 = 167.9x real time","means":"0.069 ms per frame. Vocoding is common to both families and effectively free - about 30 ms for a five-second reply either way - so it is never the thing to optimise here."},{"id":"13","value":"0.5% stop-token failure hits p99.5, not p99","means":"Be precise about percentiles in interviews: a 0.5% failure rate corrupts the worst 0.5% of turns, leaving p99 clean. You need about 1% before p99 moves at all."},{"id":"13","value":"1000 max_decoder_steps = 1.5 s GPU, 11.6 s babble","means":"The cost of one runaway. Under dynamic batching it is worse than one bad call: the batch keeps stepping until its longest member terminates, so one runaway stalls every call sharing it."},{"id":"13","value":"reduction factor r","means":"Emitting r frames per AR step divides the step count - Tacotron 1's cheapest speed lever, dropped in Tacotron 2."},{"id":"14","value":"MOS 4.43 vs 4.46 ground truth","means":"On LJSpeech, with the paper's raters and test set. Essentially indistinguishable from real recordings in that setup - but it is their number, not a promise about your data or your voice."},{"id":"14","value":"11.61 ms per latent frame","means":"22.05 kHz with a 256-sample hop. A 1.6 s utterance is about 139 latent frames."},{"id":"14","value":"32-frame training slices (~372 ms)","means":"The decoder is trained on random short slices of the latent because a full utterance of waveform will not fit in GPU memory. The generator sees the whole sequence only at inference."},{"id":"14","value":"log|det J| = 0","means":"The flow is built volume-preserving on purpose, so the change-of-variables correction vanishes and the KL divergence term reduces to two Gaussian log-densities. This is an engineering simplification, not an accident."},{"id":"14","value":"upsample stack 8 x 8 x 2 x 2 = 256","means":"How the HiFi-GAN decoder blows one 11.61 ms latent frame up into 256 audio samples, giving 22,050 samples per second."},{"id":"14","value":"2.76x wasted samples on a PSTN leg","means":"A 22.05 kHz decoder feeding an 8 kHz mu-law phone leg builds 2.76 times more samples than the caller can possibly hear. Export a narrowband decoder instead."},{"id":"14","value":"RTF 0.05 (illustrative)","means":"Generating 1 s of audio takes 50 ms of GPU. At that rate a 4 s answer is 200 ms of time-to-first-audio and blows the ~100 ms TTS slice, while a 0.8 s clause is 40 ms and fits. Measure your own hardware."},{"id":"14","value":"noise_scale_w = 0.8, noise_scale = 0.667","means":"Repo defaults. The first controls how much the RHYTHM varies between calls; the second controls latent/timbre spread. Turn them up too far and you get the signature artefact: one phone drawled several times too long."},{"id":"14","value":"five loss terms","means":"L1 mel reconstruction, KL divergence, the duration variational bound, LSGAN adversarial and feature matching. One training loop, not two stages."},{"id":"15","value":"16,000 forward passes per second of audio","means":"At 16 kHz you must run the whole network once per audio sample, strictly in order. At 24 kHz it is 24,000; on a phone line at 8 kHz it is 8,000 — narrowband halves the work for free."},{"id":"15","value":"30 layers → 3,070 samples ≈ 192 ms of context","means":"How far back the model can see. A plain non-skipping stack would need 3,069 layers for the same reach — that is the whole point of the doubling trick."},{"id":"15","value":"~1.1 M MACs per sample, ~18 GMAC/s","means":"The actual multiply-add arithmetic per second of audio. Trivial for any modern GPU — proof that raw math is not the bottleneck."},{"id":"15","value":"480,000 ordered kernel launches per second of audio","means":"30 layers × 16,000 samples. At about 5 microseconds of launch and memory latency each, that alone is 2.4 s of wall clock per 1 s of audio."},{"id":"15","value":"RTF 2.4 (naive), 0.32 (fused kernel)","means":"Real-time factor: seconds of compute per second of audio. Above 1.0 the model can never catch playback, no matter how long you wait. Fusing all 30 layers into one persistent kernel gets you under 1.0 but still nowhere near a feed-forward vocoder's ~0.02."},{"id":"15","value":"4.46 MOS vs 4.55 MOS","means":"Listener quality score for natural speech squeezed into 8-bit mu-law versus full 16-bit. The phone network's quantisation costs roughly a tenth of a quality point on its own — cheap, but not free."},{"id":"16","value":"~2 real numbers per sample (bins/hop = 513/256)","means":"At 75% overlap the magnitudes alone contain twice as much data as the audio they came from. So recovery is possible in principle — the problem is that there is no formula for it, not that information is missing."},{"id":"16","value":"50 iterations, magnitudes raised to power 1.2","means":"Tacotron 1's actual recipe. The power is a sharpening hack the paper credits with reducing artefacts."},{"id":"16","value":"~5,500 FFTs per second of audio ≈ 0.28 GFLOP/s (32 iterations)","means":"The arithmetic is essentially free. Compute is never the reason to reject Griffin-Lim."},{"id":"16","value":"46 ms of pre-echo (1024-point window at 22.05 kHz)","means":"How far ahead of a 'p' or 't' the whoosh arrives — one analysis window's worth of energy smeared backwards in time."},{"id":"16","value":"80 → 513 bins","means":"Going from mel back to linear frequency is underdetermined; the pseudo-inverse smears each band across its triangle before Griffin-Lim even starts. This is a hard ceiling that more iterations cannot lift."},{"id":"16","value":"300 ms chunk vs ~150 ms TTS budget","means":"Every iteration needs the whole chunk, so the chunk is pure waiting time. Whole-utterance Griffin-Lim cannot fit an 800 ms conversational turn."},{"id":"17","value":"~168x real time on a V100","means":"SOURCE ATTRIBUTES THIS TO V1, NOT V2. One second of audio takes about 6 ms of GPU. A 232 ms streaming chunk costs about 1.4 ms — the vocoder is never why a turn feels slow. On CPU it is 'barely above real time'."},{"id":"17","value":"strides 8 × 8 × 2 × 2 = 256","means":"Exactly the mel hop, so the upsampling stack lands on the right number of audio samples with no fudge factor. If you change the hop you must change the strides."},{"id":"17","value":"13.92 M parameters (V1)","means":"Small enough that the vocoder checkpoint sits beside the acoustic model on one Triton instance."},{"id":"17","value":"~27 mel frames of receptive field ≈ 314 ms, ~150 ms of it future","means":"THE REAL LATENCY COST. The generator is symmetric, not causal, so each output sample depends on mel roughly 150 ms ahead of it. You either budget that lookahead or you chunk with overlap and pay in seams."},{"id":"17","value":"λ_mel = 45, λ_feature-matching = 2","means":"The mel-matching loss dominates by more than 20:1 early in training and does the work of putting the right sounds in the right places; the adversarial terms only supply texture."},{"id":"17","value":"MPD periods 2, 3, 5, 7, 11 → 647 rows reach","means":"Prime periods guarantee no two critics share a sampling grid. The stack reaches 59 ms at period 2 and 323 ms at period 11 — long-range periodicity policed for almost no compute."},{"id":"17","value":"kernels 3 / 7 / 11, dilations 1 / 3 / 5","means":"The parallel filter widths averaged after each upsample stage. Kernel 11 spans ~120 positions — a whole pitch period at coarse stages."},{"id":"17","value":"27% fewer samples at 16 kHz","means":"Training natively at 16 kHz instead of 22.05 kHz for a phone deployment: fewer samples to emit and Nyquist at 8 kHz instead of 11.025 kHz, both pure savings on a 3.4 kHz phone leg."},{"id":"18","value":"strides 2 × 4 × 5 × 8 = 320","means":"EnCodec's 24 kHz downsampling factor. 24,000 / 320 = 75 latent frames per second."},{"id":"18","value":"75 Hz, one frame every 13.3 ms","means":"The frame rate, and simultaneously the streaming model's floor on algorithmic latency — you cannot emit faster than one frame per 13.3 ms."},{"id":"18","value":"1,024 entries = 10 bits → 750 bps per codebook","means":"Each codebook costs 75 frames/s × 10 bits = 750 bits per second. Multiply by the number of stages for the bitrate."},{"id":"18","value":"n_q = 2, 4, 8, 16, 32 → 1.5, 3, 6, 12, 24 kbps","means":"The bitrate dial. 6 kbps against 384 kbps raw 24 kHz 16-bit PCM is 64:1 compression."},{"id":"18","value":"600 acoustic tokens per second (75 × 8)","means":"THE NUMBER THAT SIZES YOUR ARCHITECTURE. Decoding all of them serially means one token every 1.67 ms to hold real time — impossible, which is why nobody does it flat."},{"id":"18","value":"VALL-E: 75 tokens/s AR + NAR for the rest","means":"Autoregressive over codebook 1 only gives a forgiving 13.3 ms per token; codebooks 2-8 are filled in one non-autoregressive pass conditioned on it."},{"id":"18","value":"Mimi: 12.5 Hz, ~1.1 kbps, 8 codebooks → 100 tokens/s","means":"The codec inside Moshi. A sixth of EnCodec's token rate — that reduction is why full-duplex speech-to-speech becomes feasible."},{"id":"18","value":"2^80 ≈ 1.2 × 10^24 vs 8 × 1024 = 8,192","means":"Flat quantisation at the same bit budget vs residual. The entire justification for RVQ in one comparison."},{"id":"18","value":"MusicGen delay pattern: codebook k offset by k steps","means":"Flatten the stack into one stream at the cost of n_q − 1 frames of latency, buying a single AR pass."},{"id":"19","value":"357 ms batched vs ~16 ms streamed","means":"7.14 s of speech at RTF 0.05, all at once versus a 320 ms first chunk. Same model, same total compute, order-of-magnitude difference in what the caller experiences."},{"id":"19","value":"800 ms turn budget, ~650 ms already spent","means":"Endpoint hangover 200-300 ms, ASR finalisation 50-150, LLM time-to-first-token 200-400, transit + far-end jitter buffer 40-80. TTS gets what is left, often under 150 ms."},{"id":"19","value":"RTF_eff = RTF·(n+2L)/n + overhead/(n·frame_ms)","means":"Effective real-time factor including recomputed context and fixed per-chunk cost. Both correction terms scale as 1/n, so they explode as chunks shrink."},{"id":"19","value":"RTF_eff 0.081 at 533 ms vs 0.36 at 53 ms","means":"With RTF 0.05, L=8, 8 ms overhead, 10.67 ms frames. Shrinking the chunk tenfold buys ~25 ms of first-audio and costs three quarters of your concurrency (capacity ≈ 1/RTF_eff)."},{"id":"19","value":"RTF_eff crossing 1.0","means":"A chunk takes longer to compute than to play. The playout buffer starves and the caller hears the agent stutter mid-word — worse than a later start, because it recurs."},{"id":"19","value":"10.67 ms per mel frame (24 kHz, hop 256)","means":"The atomic unit of mel-frame streaming."},{"id":"19","value":"20 ms RTP packets = 160 samples of G.711 at 8 kHz","means":"Snap chunk sizes to multiples of 20 ms, or you buffer a partial packet and hand the far-end jitter buffer a ragged arrival pattern."},{"id":"19","value":"1.66 s first phrase → 83 ms; 320 ms → 16 ms","means":"The three cut points on the same sentence. Shorter first chunk, faster first word — with diminishing returns and rising per-chunk cost."},{"id":"20","value":"800 ms","means":"The design target for the whole silence. It is a convention, not a measured constant — roughly where a caller stops hearing thought and starts hearing a broken line. The page is explicit that this number is chosen, not proven."},{"id":"20","value":"150 ms / 400 ms","means":"ITU-T G.114's acceptable one-way mouth-to-ear transmission delay, degrading through 400 ms. Crucially this covers only the two network legs — your agent's thinking time sits on TOP of it, not inside it."},{"id":"20","value":"~0 ms modal gap","means":"Stivers et al. (PNAS 2009) found the most common gap between human turns across ten languages sits near zero, with language means spread over a few hundred ms. That is the bar you are being judged against."},{"id":"20","value":"1060 ms","means":"The eight stages laid end to end with no overlap. This is what a naively-built cascade actually costs."},{"id":"20","value":"760 ms","means":"The same pipeline after hiding ASR finalisation and speculative prefill inside the hangover window. No model changed, no hardware bought."},{"id":"20","value":"320 ms","means":"The endpoint hangover — the silence you sit through before declaring the turn over. Largest single line item, and the only free overlap resource in the pipeline."},{"id":"20","value":"180 ms (10 tokens x 18 ms)","means":"Decode to the first CLAUSE. The stage people forget: TTS cannot start on a single token, it needs a synthesisable span, so ~10 more tokens elapse after the LLM's advertised time-to-first-token."},{"id":"20","value":"5x at rho=0.8","means":"M/M/1 queueing: a stage at 80% utilisation waits S/(1-rho) = 5x its own service time. A 180 ms prefill becomes 900 ms and the whole budget is gone to a model that never slowed down."},{"id":"20","value":"~1.2 s","means":"Where dead air turns into oscillation — the caller says 'hello?', that speech cancels the in-flight synthesis, the turn restarts, and the next reply is later still."},{"id":"20","value":"140 ms (semantic endpointing preset)","means":"Dropping the hangover from 320 to 140 via a completeness classifier is the single biggest further cut available."},{"id":"21","value":"140 ms","means":"Inbound 75 + outbound 65: the unavoidable floor of talk-over. Any barge-in latency figure that excludes these describes your process, not the call."},{"id":"21","value":"60 ms (3 x 20 ms frames)","means":"Evidence needed to duck. Three consecutive voiced frames — enough to not fire on a click, cheap enough to be wrong about."},{"id":"21","value":"9-12 dB","means":"How much to attenuate your own outbound audio when ducking. Audible as yielding, not as stopping."},{"id":"21","value":"280 ms","means":"Sustained speech before committing to a real cancel. Ducking is what buys you those extra 220 ms of certainty."},{"id":"21","value":"420 ms","means":"Total agent audio the caller hears after they start talking: 75 IN + 280 commit + 65 OUT. Brisk enough to read as yielding the floor."},{"id":"21","value":"400 ms","means":"Typical playout buffer depth. Forget to flush it on cancel and this adds directly to talk-over — the jitter insurance from the streaming design charged straight back."},{"id":"21","value":"700 ms","means":"Override: past this, commit anyway even if the words look like a backchannel, because a long 'yeaaah, but—' is a real turn attempt."},{"id":"21","value":"300 ms lookback ring","means":"Pre-trigger audio buffer. Open the ASR only at the trigger and you clip the caller's first syllable."},{"id":"21","value":"150 ms safety margin","means":"Subtracted when truncating history. Always subtract, never add: repetition is the cheap error, omission the expensive one."},{"id":"21","value":">25 dB ERLE","means":"Echo cancellation quality needed before your own voice (~-20 dBov) stops tripping a VAD floored at -45 dBov. Below that the agent interrupts itself."},{"id":"21","value":"12.5 Hz / Moshi","means":"The full-duplex reference point — a model with parallel input and output streams handles interruption internally instead of in your scheduler."},{"id":"21","value":"26 / 18 / 11 words","means":"The worked example: LLM generated 26 words, vocoder rendered 18, caller heard 11. Only the 11 belong in the transcript."},{"id":"22","value":"700 ms","means":"The common fixed silence timeout. Correct for confirmations, catastrophically wrong for dictated numbers."},{"id":"22","value":"1430 ms","means":"Full serial path with a 700 ms fixed timeout: 700 endpoint + 120 ASR finalise + 320 LLM first token + 150 TTS first audio + 140 network. The 700 is nearly half of it."},{"id":"22","value":"600-900 ms","means":"Mid-utterance gaps when a caller reads a member ID off a card — longer than the 700 ms timer, which is why it fires inside the number."},{"id":"22","value":"t_min 200 / t_max 1600 ms","means":"The clamp bounds of the adaptive policy. t_max is not optional: without it a trailing-off caller stalls the agent forever."},{"id":"22","value":"270 ms","means":"What the adaptive policy waits on 'yes, Tuesday works' (completeness p = 0.95) — faster than any safe fixed value."},{"id":"22","value":"1530 ms","means":"What it waits on 'my member ID is' (p = 0.05) — a second and a half of grace exactly where a fixed timer would have cut in."},{"id":"22","value":"80-200 ms","means":"ASR partial latency. Plus classifier inference, this is a floor the adaptive policy cannot beat — at high completeness, that floor IS your threshold."},{"id":"22","value":"1080 ms","means":"What you get by naively cutting the fixed timeout 700 -> 350. Cheap, and exactly how agents start interrupting people."},{"id":"22","value":"60 ms","means":"Jitter buffer depth sitting in front of everything — your silence clock starts 60 ms late, threshold you have already spent."},{"id":"22","value":"RFC 3389","means":"Comfort noise / silence suppression: the far end stops sending during silence, so silence arrives as ABSENT packets, not quiet ones."},{"id":"23","value":"1190 ms vs 725 ms","means":"Cascade (60 net + 500 endpoint + 120 ASR finalise + 320 TTFT + 130 TTFA + 60 net) against commit-then-generate S2S. Note 500 of the cascade's number is ONE threshold."},{"id":"23","value":"4 commit points -> 1","means":"The actual source of the saving. Not faster tokens — fewer sequential decisions."},{"id":"23","value":"~580:1","means":"Information cut at the ASR boundary: 64,000 bps of mu-law -> ~1,100 bps of codec tokens -> ~110 bps of text. About 99.8% discarded."},{"id":"23","value":"64,000 bps","means":"mu-law 8 kHz phone audio: 8000 samples x 8 bits. The full signal before any model touches it."},{"id":"23","value":"1,100 bps","means":"Codec tokens: 12.5 frames/sec x 8 codebooks x 11 bits. Compressed audio that still carries prosody."},{"id":"23","value":"110 bps","means":"ASR text at 150 words/min: ~13.75 characters x 8 bits. Everything the cascade's LLM ever sees."},{"id":"23","value":"12.5 Hz","means":"Moshi's frame rate — two parallel audio streams, model's and user's, one frame every 80 ms."},{"id":"23","value":"Inner Monologue","means":"Moshi predicts a TEXT stream ahead of the acoustic tokens. Even the flagship full-duplex model keeps text as a prior; the dichotomy is softer than the marketing."},{"id":"23","value":"24 kHz vs 8 kHz","means":"Most S2S models are trained on clean 24 kHz speech; a phone leg hands them 8 kHz mu-law with everything above 3.4 kHz gone. No front end fixes it, because the front end IS the model."},{"id":"23","value":"~800 ms","means":"Where a caller stops treating the pause as thought. Human turn transitions cluster around a couple of hundred ms."},{"id":"23","value":"days vs minutes","means":"Mean time to diagnosis. A cascade failure has a stage, a metric and a knob you change in minutes; an S2S failure is learned behaviour fixed with data over days. That is the real trade."},{"id":"24","value":"RTF 0.03 = 33x","means":"The same machine described two ways. Always ask which convention is being quoted before comparing anything."},{"id":"24","value":"168x on V100","means":"HiFi-GAN's paper figure for its V1 generator — vocoder only, single stream, idle card. An idle single-stream RTF flatters a fleet that will run dozens of streams per GPU."},{"id":"24","value":"35% duty cycle","means":"Share of wall-clock the agent actually speaks in a triage or scheduling call. The biggest single lever in the whole calculation — go and measure yours."},{"id":"24","value":"10-15% waste","means":"Audio synthesised, queued, then cancelled on barge-in. It cost GPU-seconds regardless."},{"id":"24","value":"~100% ASR duty cycle","means":"Streaming recognition never stops, because you must listen THROUGH the agent's own speech to detect barge-in at all. TTS is the model people size; ASR often dominates the invoice."},{"id":"24","value":"313.6 audio-sec/sec","means":"800 calls x 0.35 duty x 1.12 waste. The actual synthesis demand, versus the 800 the question implied."},{"id":"24","value":"A = 2.41 GPU-equivalents","means":"313.6 audio-seconds x 0.0077 effective RTF. Capacity says 3 GPUs; the SLO says otherwise."},{"id":"24","value":"kappa = 1 + beta(B-1) = 2.05","means":"A batch of 8 at beta 0.15 costs 2.05 single items — not 8, not 1."},{"id":"24","value":"beta = 0.15 -> 6.7x ceiling","means":"Batching's hard floor: RTF_eff can never be better than beta x RTF_1, whatever B you choose. B = 40 is already within 15% of it."},{"id":"24","value":"(B-1)/2*lambda","means":"Formation wait — the clock you pay while the arrival stream supplies enough requests to fill a batch."},{"id":"24","value":"rho 0.80 -> 35 ms wait; rho 0.60 -> 6 ms","means":"3 GPUs vs 4 GPUs on the same load. One extra card cuts queue wait 6x."},{"id":"24","value":"T = 30.8 ms","means":"Service time for one batch: chunk length 0.5 s x RTF_1 0.030 x kappa 2.05."},{"id":"24","value":"((1+cv^2)/2)","means":"The M/G/c correction. Batch service is nearly deterministic (cv near 0), which roughly HALVES the M/M/c wait — so size on M/M/c and bank the difference."},{"id":"24","value":"P(W>t) = C(c,A)e^-((c-A)t/T)","means":"The exact M/M/c waiting tail, giving p95 chunk delay = T ln(C/0.05)/(c-A) — it goes non-linear exactly where rho does."},{"id":"24","value":"chunk length + playout lead","means":"Your entire safety margin. Chunk N+1 must arrive before chunk N finishes playing, and no longer."},{"id":"24","value":"tens of seconds","means":"Cold replica startup: weight load plus CUDA graph capture. The queueing knee is seconds wide, so an autoscaler arrives after the calls did."},{"id":"25","value":"192 or 512 dimensions","means":"The whole of 'who is speaking' compressed to a few hundred numbers. Small enough to store per caller, index, and compare with one dot product."},{"id":"25","value":"(T, F) frames -> 2F vector","means":"Statistics pooling: T frames of F features become one vector twice as wide (mean half plus standard-deviation half). This is the mechanism that makes any clip length collapse to a fixed size."},{"id":"25","value":"1/sqrt(T)","means":"How fast averaging cleans up per-clip randomness in theory. In practice frames 10 ms apart are highly correlated, so the effective sample count is far below T and the curve flattens early."},{"id":"25","value":"3 s buys most of what 30 s buys","means":"Why enrolment prompts are short. Asking a caller for thirty seconds of speech gets you almost nothing over three, and annoys them."},{"id":"25","value":"~60 ms of GPU for 3 s of audio (RTF 0.02)","means":"A few million parameters, far smaller than the ASR or TTS models beside it. Run concurrently with ASR and it costs zero in the 800 ms conversational turn budget - as long as you never make the first reply wait on enrolment."},{"id":"25","value":"10 ms hop","means":"The frame rate feeding the pooling layer. It is also why frames are correlated and the duration gains saturate."},{"id":"25","value":"EER","means":"Equal Error Rate: the single operating point where the rate of wrongly rejecting the same person equals the rate of wrongly accepting a stranger. One number for how separable your genuine and impostor score distributions are, on your data and your channel."},{"id":"26","value":"75 frames per second (24000 / 320)","means":"The codec's frame rate. Everything about the latency argument falls out of this one number."},{"id":"26","value":"13.3 ms (1000 / 75)","means":"THE number. One autoregressive decode step must finish in under 13.3 ms including the growing KV-cache read, or generation falls behind playout. This is the whole per-step budget and it does not get bigger."},{"id":"26","value":"step = 12 ms vs step = 15 ms","means":"12 ms sustains, giving roughly 600 ms to first audio with 10% headroom. 15 ms underruns - the agent stops mid-word. A 3 ms difference flips it from working to broken."},{"id":"26","value":"225 x 8 = 1,800 tokens for a 3 s prompt","means":"What a three-second enrolment clip actually is inside the model: a grid of integers, not a waveform or an embedding."},{"id":"26","value":"AR prefix = 225 tokens, NAR = 1,800","means":"The two stages see different prompts. The sequential stage only reads the coarse first codebook; the parallel stage reads the whole grid. Cheaper than it looks."},{"id":"26","value":"300 sequential steps, not 2,400","means":"A 4-second reply costs 300 AR steps plus seven parallel forward passes - because seven of the eight codebooks are filled in parallel."},{"id":"26","value":"800 ms turn budget, ~300 ms already gone","means":"Endpointing and ASR finalisation eat 300 ms before TTS starts. A cloning stack's several-hundred-ms first audio is most of what is left."},{"id":"26","value":"60,000 hours (LibriLight) vs a few hundred (LibriTTS-scale)","means":"Why zero-shot reaches an unseen speaker at all. It is a scale story, not a clever-architecture story."},{"id":"26","value":"~256 numbers (d-vector bottleneck)","means":"What the previous generation squeezed identity through. Trained to be invariant to everything except identity - which throws away exactly the paralinguistic detail that makes someone recognisable."},{"id":"26","value":"3.4 kHz PSTN ceiling; sibilant identity above 4 kHz","means":"A prompt taken from a recorded phone call has literally none of the band where 's' sounds carry a person's identity. The model either clones a band-limited timbre or invents a top end that isn't theirs."},{"id":"26","value":"1 s prompt = 75 frames = 10-12 phonemes","means":"Two or three words, a quarter of the English sound inventory at best. The model has no evidence of how this speaker makes the rest and falls back toward the population average."},{"id":"26","value":"1 s -> 3 s buys far more than 3 s -> 30 s","means":"Diminishing returns arrive fast, which is why enrolment prompts are short."},{"id":"27","value":"10 style tokens","means":"The size of the learned basis in the original work. Small on purpose: the bottleneck is what keeps some of the reference clip's idiosyncrasy out of the style vector."},{"id":"27","value":"w >= 0, sum(w) = 1","means":"Softmax attention weights are non-negative and add to one, so every style embedding the decoder saw during training was a blend of the ten tokens. Your hand-set sliders have no such constraint."},{"id":"27","value":"0.3 -> 1.0 is control; -> 3.0 is extrapolation","means":"Where the knob stops being a knob. Past the blend region the decoder is producing spectrograms it was never trained on."},{"id":"27","value":"cos = 1 / sqrt(1 + ||d||^2)","means":"Converts a speaker-cosine drop into a readable displacement: how far the style change pushed the voice off the target speaker's direction. Lets you set a numeric CI gate instead of arguing about it."},{"id":"27","value":"3.4 kHz","means":"The PSTN ceiling. Spectral tilt, breathiness and fricative energy - most of what a listener hears as 'warm' or 'brisk' - live largely above it and are simply thrown away."},{"id":"27","value":"speaker leak x0.28, style x0.92 (illustrative demo constants)","means":"The shape of the gradient-reversal trade: it crushes the speaker component hard but also shaves off a slice of the legitimate style variance that correlates with the speaker. You buy disentanglement with expressivity."},{"id":"27","value":"microseconds / zero in the 800 ms turn budget","means":"The style embedding itself is free. Only the decision of WHICH style costs anything, and only if it is serial rather than run alongside ASR."},{"id":"28","value":"tens of bits of payload","means":"Enough to identify a model version or a tenant. Not enough to encode who said what - do not promise per-utterance forensics."},{"id":"28","value":"d' = sqrt(2 * gamma * G)","means":"Detector strength. gamma is how much of the mark survived the chain; G is processing gain = window x chip rate / payload bits. Bigger payload directly costs you detectability."},{"id":"28","value":"detection grows as sqrt(window)","means":"Doubling the clip length does not double confidence - it multiplies it by 1.41. Duration is the scarce resource."},{"id":"28","value":"150 ms vs 2 s","means":"A barged-in 150 ms chunk is near-undetectable while two seconds is solid. Barge-in truncation and packet loss attack the detector directly, not incidentally."},{"id":"28","value":"~38 dB mu-law SNR","means":"G.711's roughly constant signal-to-quantisation-noise across its dynamic range. Mu-law is the MILD part of the chain - resynthesising codecs and storage re-encodes are worse than their bitrate suggests."},{"id":"28","value":"300-3400 Hz","means":"What a PSTN leg keeps. Anything the mark puts outside this is deleted by resampling before any adversary shows up."},{"id":"28","value":"a mark at 6 kHz","means":"The tempting place - inaudible, easy to hide. Also exactly where 24 kHz-to-8 kHz resampling erases it outright and no detector recovers it."},{"id":"28","value":"~10 ms per 200 ms chunk (RTF 0.05)","means":"Watermark embedding is NOT free. It lands on time to first audio inside an 800 ms turn budget, so measure it. Detection is the opposite - run it offline."},{"id":"28","value":"FCC Feb 2024 / California B.O.T. Act / EU AI Act Art. 50 from Aug 2026","means":"Three regimes with different triggers but one stable engineering answer: pre-rendered disclosure plus a deterministic bot answer."},{"id":"29","value":"5-point ACR scale (5 excellent to 1 bad)","means":"The standard MOS rating scale from ITU-T P.800. It is ordinal - the gap between 4 and 5 is not the same size as the gap between 1 and 2 - so averaging it is a convention people agree to, not a real measurement."},{"id":"29","value":"-3 to +3 (7-point CCR scale)","means":"The CMOS scale: how much better is B than A, from 'much worse' through 'about the same' to 'much better'. One judgement of the difference instead of two noisy absolute scores."},{"id":"29","value":"sigma = 0.9","means":"The typical spread (standard deviation) of individual ratings on the 5-point scale. It is huge relative to the 0.1 differences people try to detect, which is the whole reason listening tests need so many ratings."},{"id":"29","value":"~1,300 ratings per system","means":"How many INDEPENDENT ratings you need to reliably detect a 0.1 MOS difference (80% power, 5% false-positive rate). Already far more than most papers collect."},{"id":"29","value":"ICC rho = 0.35","means":"Intra-class correlation: 35% of the variation in ratings comes from WHICH LISTENER gave them, not from the audio. Ratings from one person are not independent evidence."},{"id":"29","value":"design effect 4.15","means":"Kish correction 1+(m-1)*rho with 10 clips per listener. Because ratings cluster by person, your confidence interval computed as if they were independent is about 2x too narrow - you are twice as confident as you should be."},{"id":"29","value":"~5,300 ratings = 1,056 listeners","means":"The real requirement for an unpaired 0.1 MOS test once clustering is accounted for. Nobody recruits a thousand listeners, which is exactly why you must pair instead."},{"id":"29","value":"~830 ratings (paired ACR) / ~260 (CMOS)","means":"Same statistical power, achieved by design instead of headcount. This is the single most useful number on the page."},{"id":"29","value":"200 ms added to an 800 ms turn","means":"A voice 0.1 MOS better that costs 200ms of extra delay is WORSE on a phone call. Naturalness and latency are separate gates and MOS is blind to the second one."},{"id":"29","value":"3.4 kHz","means":"The upper limit of a phone line. The 's', 'f' and 'th' cues live above it, so headphone-judged MOS credits the model for sounds the caller literally cannot hear."},{"id":"30","value":"MCD = (10/ln10) * sqrt(2 * sum of squared coefficient differences)","means":"The formula, read out in decibels. The c0 coefficient is dropped because it encodes loudness, not spectral shape - you don't want a volume difference scoring as a quality difference."},{"id":"30","value":"~39% of the mel axis","means":"At 24 kHz the mel scale runs to ~3267 mel but the phone band ends at ~1992 mel, so about 39% of what wideband MCD scores is audio a phone line throws away. Compute on the wire and the ranking of your systems changes."},{"id":"30","value":"200 prompts x ~5 s = 1,000 s of audio","means":"The size of a practical golden set for CI - big enough to be stable, small enough to run per build."},{"id":"30","value":"ASR RTF 0.05 -> ~50 GPU-seconds","means":"Transcribing the whole golden set costs under a minute of GPU. MCD and cosine cost far less, so the full metric sweep is about a minute per build - cheap enough that there is no excuse not to run it."},{"id":"30","value":"m = 2595 * log10(1 + f/700)","means":"The mel warping formula that converts real frequency to perceptual frequency - it is what makes the 39% figure computable."},{"id":"30","value":"EER operating point","means":"The similarity threshold at which false-accept and false-reject rates are equal - the defensible place to set a cloning cutoff, and you must quote both the threshold and the point you chose."},{"id":"31","value":"$0.00026 / audio-minute","means":"The MARGINAL compute cost - what one minute of speech costs in raw GPU time at batch 8. It is the number that misleads everyone, because you never buy compute this way."},{"id":"31","value":"$0.0126 / minute (vendor)","means":"Per-character vendor pricing at $15/million chars and 14 chars/s of speech. Flat - it does not fall with volume, which is both its weakness at scale and its strength at pilot scale."},{"id":"31","value":"~50x","means":"How much cheaper marginal compute looks than the vendor. The page calls this comparison 'close to worthless' - it's the trap, not the answer."},{"id":"31","value":"$0.0048 / minute (GPUs only)","means":"The honest self-hosted figure once you pay for three whole rented cards for 730 hours. 19x the marginal number, and still 2.6x better than the vendor."},{"id":"31","value":"$0.0212 / minute (all-in)","means":"The truly honest figure once the $9,000/month engineering carry is included. This is the number that belongs in the build-vs-buy deck."},{"id":"31","value":"$9,000/month engineering carry","means":"Half an engineer fully loaded: serving stack, voice regression suite, model upgrades, capacity work, 3 a.m. on-call. It is 3.4x the GPU bill at three cards."},{"id":"31","value":"127,000 -> 904,000 calls/month","means":"Where build beats buy, before and after including the carry. A 7x shift decided entirely by the line item that never makes it into the RTF arithmetic. (The curve first dips under the vendor at ~841k, but the fleet's step from 3 to 4 cards pushes it back above, so 904k is where it stays below.)"},{"id":"31","value":"rtf_eff = 0.0128 GPU-s per audio-s","means":"Effective real-time factor at batch 8 given a measured p95 batch-1 RTF of 0.05. This, times the GPU price, is the marginal cost."},{"id":"31","value":"peak : month-mean = 5x","means":"Clinic traffic isn't spread over 730 hours - it lands in ~9 hours a day, 5 days a week. You size for 63 audio-seconds/wall-second, not the 12.5 the monthly average suggests."},{"id":"31","value":"5.4% fleet utilisation","means":"You rent 730 hours a month and the clinic is open about 200. The idle share IS the product - real-time voice cannot defer work to off-peak."},{"id":"31","value":"3 GPUs","means":"ceil(1.15) = 2 at 70% target utilisation, plus an N+1 spare. The integer ceiling is why RTF improvements often buy nothing."},{"id":"31","value":"kappa = 1 + beta(B-1), beta = 0.15","means":"How batching scales cost: a batch of 8 costs 2.05 singles' worth of compute for 8 streams. Batch 8 -> 32 cuts compute 31%."},{"id":"31","value":"~90 ms of batch service time","means":"What batch 32 costs every caller versus batch 8 (141 ms vs 51 ms on 0.5 s chunks), inside an 800 ms turn budget - to save $876/month. Bad trade at 3 cards, obvious win at 300."},{"id":"31","value":"30% phrase-cache hit rate","means":"Disclosures, hold prompts and menu options are identical every call; a Redis lookup replaces a GPU render for nearly a third of speech. 'Unremarkable' to achieve."},{"id":"31","value":"12% barge-in waste","means":"Speech you synthesise and then throw away because the caller interrupted. Real cost, invisible in naive volume math."},{"id":"31","value":"35% agent talk share","means":"The agent is only speaking about a third of a call, so calls are not the same as concurrent synthesis streams."},{"id":"32","value":"8 kHz mu-law, 20 ms packets, 50 packets/s","means":"The exact wire format the carrier delivers. Replaying through anything else means you tested a system you don't ship."},{"id":"32","value":"120 calls x 75 s = 9,000 s of audio","means":"A realistic golden set. At real-time pacing that is 2.5 hours run serially, or ~7.5 minutes at 20 concurrent sessions - and it costs 20 concurrent GPU-backed sessions for those minutes. Real-time pacing has a real bill."},{"id":"32","value":"~800 ms","means":"The point at which a caller reads a pause as dead air. First-audio latency is asserted against this, not against a vibe."},{"id":"32","value":"2^3 = 8 vs 4 replays","means":"Full factorial over three stages at two versions each is 8 whole-set replays; the ladder (A/A/A -> B/A/A -> B/B/A -> B/B/B) gets attribution in 4."},{"id":"32","value":"~3 standard deviations","means":"Where to set a timing gate: measured from K baseline replays of unchanged HEAD, never picked by taste."},{"id":"32","value":"sd 45 ms, tolerance +/-50 ms, N=1 -> ~27% flake rate","means":"A single measurement of a metric that naturally varies by 45 ms will trip a 50 ms gate more than a quarter of the time. That is a suite people will start ignoring."},{"id":"32","value":"N = 9 repeats -> SE 15 ms -> under 0.1% flake","means":"Averaging shrinks the standard error as sqrt(N). Nine repeats turns a 27% flake rate into a non-issue. This is the whole flake budget in one line: tighten the tolerance or raise the repeats, and pay in wall clock either way."},{"id":"32","value":"3% WER","means":"Meaningless as a corpus number - 3% spread over filler words is fine, 3% landing on the digits of a member ID is an incident. Corpus-level WER cannot distinguish them, which is why you assert on entities exactly."},{"id":"32","value":"WER_TOL = 0.010 absolute","means":"The delta-WER tolerance, and only ever as a delta versus the same recogniser's own floor."}],"latency":{"id":"LATENCY-BUDGET","total":"800 ms from the caller's last speech sample to the first agent sample in their ear. This is a design convention, not a measured constant - roughly where callers stop reading the pause as thought and start reading it as a broken line. Laid end to end the eight stages cost 1060 ms (call feels broken); with ASR finalisation and speculative prefill hidden inside the endpoint hangover the same pipeline lands at 760 ms, with 40 ms of headroom. Note ITU-T G.114's 150 ms one-way transmission target covers ONLY the two network legs - the agent's thinking time sits on top of it, not inside it.","rows":[{"stage":"Inbound network leg (packetisation 20 + transit 25 + jitter buffer 30)","budget":"75 ms","plain":"The caller's voice is chopped into 20 ms packets, crosses the network, and is held briefly in a buffer so uneven arrival plays smoothly. This has ALREADY elapsed before your speech recogniser sees a single byte.","ifItBlows":"Nothing you can do - it is physics and it is already spent. But it is inside the caller's silence, so if your dashboard excludes it (most do) your real latency is 75 ms worse than you think.","overlappable":"no - already spent"},{"stage":"Endpoint hangover (silence wait before declaring the turn over)","budget":"320 ms","plain":"You have the caller's audio; you are simply withholding the decision that they finished. Largest single line item in the whole budget, and the only free overlap resource in the pipeline - other work can run inside it.","ifItBlows":"Too long and the caller sits in dead air. Too short and the agent cuts in mid-sentence while they are reading out a member ID, which destroys the turn and all the data in it. A completeness-driven (semantic) endpointer cuts this to ~140 ms on utterances that look finished.","overlappable":"n/a - it IS the overlap window"},{"stage":"ASR finalisation (flush decoder, rescore, punctuate)","budget":"120 ms","plain":"Turning the running provisional transcript into a final, punctuated one. A streaming recogniser can do this INSIDE the hangover window, so it really costs max(0, 120 - 320) = 0 ms.","ifItBlows":"If your ASR is not streaming, this becomes 120 ms of pure serial dead time added straight to the caller's silence.","overlappable":"yes - hides fully inside the hangover"},{"stage":"LLM prefill (read system prompt + conversation history)","budget":"180 ms","plain":"The language model ingesting a couple of thousand tokens of instructions and history before it writes anything. Speculatively startable on the last stable partial transcript during the hangover - different hardware from the ASR, so both can consume the window at once. Costs max(0, 180 - 320) = 0 ms.","ifItBlows":"A long prompt with no prefix cache pushes this to ~620 ms, which overflows the hangover and starts costing real time. A KV-cache hit on a repeated system-prompt prefix is the cheapest 200 ms you will ever find.","overlappable":"yes - speculatively, at the cost of discarded work when the caller resumes"},{"stage":"Decode to the first clause (~10 tokens x 18 ms/token)","budget":"180 ms","plain":"The stage everyone forgets. TTS cannot start speaking on a single token - it needs a whole synthesisable span - so about ten more tokens must be generated AFTER the LLM's advertised time-to-first-token.","ifItBlows":"Budgeting only 'time to first token' hides this entirely and your real budget is 180 ms over from day one. Under batching, ms/token rises (18 -> 26 ms is the loaded-GPU case), pushing this to ~260 ms.","overlappable":"no - cannot start before the turn is committed"},{"stage":"Guardrail / PHI redaction","budget":"40 ms","plain":"The policy filter or patient-data redactor reading the generated text before any of it is spoken. Serial by construction - its entire purpose is to sit between generation and the wire.","ifItBlows":"You cannot hide it and you cannot skip it. This is also the stage a speech-to-speech model deletes, because there is no text between the model and the wire for it to run in.","overlappable":"no - serial by construction"},{"stage":"TTS time-to-first-audio","budget":"60 ms","plain":"The voice model producing its first streamed chunk of audio from that first clause.","ifItBlows":"This is a request-queued GPU stage, so it is one of the two stages that inflate under load - at 80% utilisation the M/M/1 relation W = S/(1-rho) multiplies it by 5. Under-provisioned, chunk N+1 arrives after chunk N finished playing and the caller hears the agent stop mid-word.","overlappable":"no - queued GPU stage, inflates with utilisation"},{"stage":"Outbound network leg (+ far-end jitter buffer)","budget":"85 ms","plain":"Your first audio chunk crossing the network and sitting in the caller's own jitter buffer before it reaches their ear. Elapses AFTER your metrics have already declared the request complete.","ifItBlows":"Physics, and invisible to every request trace you own. It is nonetheless inside the silence the caller is sitting in.","overlappable":"no - physics"},{"stage":"TOTAL - naive serial","budget":"1060 ms","plain":"All eight stages laid end to end with nothing overlapping. This is what an untuned cascade actually costs.","ifItBlows":"The call feels broken. Past ~1.2 s the caller says 'hello?', that speech arrives as a barge-in, cancels the synthesis that was finally starting, restarts the turn, and the next reply is later still - the system oscillates rather than degrading.","overlappable":""},{"stage":"TOTAL - overlapped (ASR + speculative prefill inside the hangover)","budget":"760 ms","plain":"Same pipeline, same models, same hardware. 300 ms disappears because ASR finalisation (120) and LLM prefill (180) both fit inside the 320 ms hangover window.","ifItBlows":"Sits 40 ms under the 800 ms target - no headroom for the p95. The bill for speculation is wasted compute every time the caller resumes talking and the prefill must be discarded, which on a mid-sentence pause is often.","overlappable":""},{"stage":"TAIL RISK - queueing at rho = 0.8","budget":"x5 on the two queued GPU stages (prefill, TTS)","plain":"M/M/1 sojourn time W = S/(1-rho). A GPU stage at 80% utilisation waits five times its own service time. A 180 ms prefill becomes 900 ms with the model not one millisecond slower.","ifItBlows":"Your p50 dashboard stays green and one call in twenty goes dead. Budget the p95, not the p50 - and record rho alongside latency, because on Kubernetes the same regression appears whenever the autoscaler lets replicas saturate.","overlappable":""},{"stage":"ALTERNATIVE - speech-to-speech collapse","budget":"~725 ms (audio-in TTFT ~320 ms replacing four stages)","plain":"A full-duplex model collapses ASR finalisation, prefill, decode-to-clause and TTS into a single audio-in-to-audio-out time-to-first-token, paying one learned commit decision instead of four sequential ones.","ifItBlows":"It does not remove the network legs, and if it does its own turn-taking it moves the hangover inside the model rather than deleting it. What it does remove is the text seam - the guardrail row above has nowhere to run when there is no text between the model and the wire. That trade is live, not settled.","overlappable":""}]},"principles":[{"n":"01","t":"Pin the front end in CI","d":"Mel formula, sample rate, phoneme inventory and normalization all fail SILENTLY. Nothing throws — the caller just hears buzz or hoarseness. Assert them in one place."},{"n":"02","t":"Tune on asymmetric cost","d":"Cutting a caller off mid member-ID destroys the turn and all the data in it. Waiting 200 ms too long costs 200 ms. Tune on E = hangover + p_cut × C_repair, not on accuracy."},{"n":"03","t":"PHI flows through every stage","d":"Normalized text, alignments, pronunciations, F0, mel, codec tokens and cached audio all inherit retention and BAA scope. The waveform stays PHI even with a clean transcript — the answer is transcribe, scrub, drop, not hash."},{"n":"04","t":"Telephony is the constraint","d":"The 3.4 kHz passband drops f/th/s and no model recovers it — handle it in dialogue design. But narrowband KEEPS the melody, so do not widen pitch range for a problem the line did not cause."},{"n":"05","t":"Instrument what cannot throw","d":"OOV rate, alignment score, normalizer confidence, F0 span, gap-length histogram, underrun count, codebook perplexity, fallback rate, RTF and ρ. Alert on confidence, not on exceptions."},{"n":"06","t":"Determinism beats speed","d":"On an 800 ms turn the p95 and the tail matter more than the p50. A GPU stage at ρ = 0.8 waits 5× its own service time while the model gets no slower."},{"n":"07","t":"Goodhart applies to every metric","d":"MCD rewards hedging. ΔWER catches skips. Absolute cross-paper MOS is not evidence. Keep the metric-vs-listener correlation itself under test."},{"n":"08","t":"Budget the padding, not the FLOPs","d":"The vocoder’s ~150 ms of future-mel lookahead beats its arithmetic cost. Batching spends the caller’s time. Latency comes from ordering and waiting far more often than from compute."},{"n":"09","t":"Measure on your own data","d":"Chance cosine, EER, RTF and MOS variance are population statistics. Your fleet, your codec, your caller population set the real operating point. τ is a property of the channel, not the checkpoint."}],"stack":[["Frontend","Silero VAD + WFST (NeMo)","ONNX, in-process on the media node","Deterministic and auditable; cannot hallucinate a number"],["Alignment","MFA (Kaldi GMM-HMM)","OFFLINE dataset job — not on the call path","Produces duration labels; never touches a call’s latency budget"],["Synthesis","VITS, fine-tuned per voice","Clause chunking + cross-fade, narrowband ONNX export","One model, no mel seam, no external aligner; HiFi-GAN is its decoder"],["Fallback","Griffin-Lim on CPU","Zero weights; alarm on fallback rate","The GPU vocoder path otherwise has no fallback at all"],["Transport","G.711 μ-law + 20 ms paced RTP","NetEq adaptive + Opus FEC/DRED","Pacing avoids tail-drop and avoids inflating far-end jitter estimate"],["Turn-taking","Completeness-driven endpointing","Classifier ONNX on the media node; hard cap","Fixed timers cannot separate a 400–800 ms hesitation from a finished turn"],["Barge-in","Two-stage: VAD duck → ASR confirm","Flush playout, truncate history to heard (err short)","Reversible ducking buys time; echo cancel must precede VAD (ERLE > 25 dB)"],["Sizing","Erlang-C on peak, ρ ≈ 0.7","Triton dynamic batching, ~30 ms queue window","Failure is dead air, not a 503; warm headroom beats autoscaling"],["Voice","One consented, fine-tuned agent voice","No zero-shot cloning in production","AR decode must hold 13.3 ms/frame or it stops mid-word; failures are discrete"],["Evaluation","ΔWER gate + MCD/cosine screen + periodic CMOS","DTW-align before MCD; consented scripted corpus on the 8 kHz path","MCD rewards hedging; ΔWER catches skips; all of it blind to latency"],["Regression","Golden-set replay suite","Canary on the real leg; track flake rate","The only thing that catches a silent front-end drift before a caller does"]],"controlPlane":[{"id":"20","title":"End-to-End Latency Budget","stage":0,"oneLiner":"Adding up every source of silence between the caller finishing and hearing you.","problem":"The caller stops speaking and hears nothing for a full second. Past about 800 ms they stop reading the pause as thinking and start reading it as a dead line, so they say 'hello?' — which your system treats as a brand-new interruption, cancels the reply that was finally starting, and answers even later. It does not degrade gently; it oscillates.","how":"Start a stopwatch at the last sound leaving the caller's mouth and stop it at the first sound arriving in their ear — deliberately harsher than what dashboards measure, because it includes the network trip in (which already happened before your system saw a byte) and the network trip out plus the far-end buffer (which happens after your logs say 'done'). Walk the eight things that consume that stopwatch: network in, the silence you wait through to decide the caller finished, the speech recognizer wrapping up, the language model reading its prompt, the language model producing enough words to be worth speaking, the safety filter, the voice generator producing its first chunk, and network out. Laid end to end that is about 1060 ms and the call feels broken. The trick is that the silence-wait (320 ms) is free time — you already have the audio, you are only withholding the decision that the turn ended, so the recognizer can finish inside it and you can speculatively start the language model on the last partial transcript in the same window, on different hardware. That hides 300 ms and the same pipeline lands at 760 ms with no model changed. Then budget the unlucky calls, not the average one: a GPU running at 80% busy multiplies its queued stages by five without the model getting one millisecond slower.","bestChoice":"Tuned cascade with overlap: streaming ASR finalising inside the endpoint hangover + speculative LLM prefill on the last stable partial, instrumented as ONE span from last-speech-frame to first-RTP-write with a call correlation ID, alarmed on p95, with GPU utilisation recorded alongside it.","whyBest":"It removes 300 ms of the budget without touching a model or buying a GPU, because the hangover window is time you were already spending. Measuring one span instead of eight stops the situation where every team's dashboard is green and nobody owns the sum.","gotcha":"Every team measures its own stage's p50, every dashboard is green, and nobody owns the sum — the two network legs and the far-end jitter buffer are inside the caller's silence but outside every request trace, so they are never counted. The second trap is budgeting the LLM's time-to-first-token and forgetting that TTS needs a whole clause: ~180 ms of extra decode hides between 'first token' and 'first speakable span'. The third is that a green p50 on an 80%-utilised GPU is a p95 disaster, with no model regression to blame.","interviewLine":"\"I'd define the clock first, because most people measure the wrong thing: last speech sample out of the caller's mouth to first sample in their ear, which means both network legs and the far-end jitter buffer are inside the budget even though they never show up in our request traces... Laid end to end that's about a second, and roughly 800 ms is where a caller stops hearing thought and starts hearing a broken line. The interesting part is that the biggest line item isn't a model — it's the endpoint hangover, and it's also the only free overlap resource you have... That's three hundred milliseconds for free, at the cost of throwing prefill away when the caller resumes. Then I'd budget the p95, not the p50, because a GPU at 80% utilisation multiplies its queued stages by five — S over one minus rho — without the model getting any slower.\"","numbers":[{"value":"800 ms","means":"The design target for the whole silence. It is a convention, not a measured constant — roughly where a caller stops hearing thought and starts hearing a broken line. The page is explicit that this number is chosen, not proven."},{"value":"150 ms / 400 ms","means":"ITU-T G.114's acceptable one-way mouth-to-ear transmission delay, degrading through 400 ms. Crucially this covers only the two network legs — your agent's thinking time sits on TOP of it, not inside it."},{"value":"~0 ms modal gap","means":"Stivers et al. (PNAS 2009) found the most common gap between human turns across ten languages sits near zero, with language means spread over a few hundred ms. That is the bar you are being judged against."},{"value":"1060 ms","means":"The eight stages laid end to end with no overlap. This is what a naively-built cascade actually costs."},{"value":"760 ms","means":"The same pipeline after hiding ASR finalisation and speculative prefill inside the hangover window. No model changed, no hardware bought."},{"value":"320 ms","means":"The endpoint hangover — the silence you sit through before declaring the turn over. Largest single line item, and the only free overlap resource in the pipeline."},{"value":"180 ms (10 tokens x 18 ms)","means":"Decode to the first CLAUSE. The stage people forget: TTS cannot start on a single token, it needs a synthesisable span, so ~10 more tokens elapse after the LLM's advertised time-to-first-token."},{"value":"5x at rho=0.8","means":"M/M/1 queueing: a stage at 80% utilisation waits S/(1-rho) = 5x its own service time. A 180 ms prefill becomes 900 ms and the whole budget is gone to a model that never slowed down."},{"value":"~1.2 s","means":"Where dead air turns into oscillation — the caller says 'hello?', that speech cancels the in-flight synthesis, the turn restarts, and the next reply is later still."},{"value":"140 ms (semantic endpointing preset)","means":"Dropping the hangover from 320 to 140 via a completeness classifier is the single biggest further cut available."}],"archNote":""},{"id":"21","title":"Barge-In (Letting the Caller Interrupt)","stage":0,"oneLiner":"Noticing the caller talking over you, stopping fast, and remembering only what they heard.","problem":"The caller says 'no, that's the wrong date' while the agent is still reading out the appointment. If the agent doesn't stop, it monologues over a correction. If it stops on the very first voiced frame, it abandons its own sentence every time someone clears their throat. And if it stops but records the whole sentence it INTENDED to say, the transcript now claims the patient was told 'nothing to eat after midnight' when they heard eleven words of it and never got that far.","how":"The core difficulty is that 'now' means two different times: your packets take ~65 ms to reach the caller's ear and their voice takes ~75 ms to reach you, so 140 ms of talk-over is physics before any code runs. So use two triggers at different speeds, like a person: the fast one is acoustic — a voice-activity detector sees three voiced 20 ms frames (60 ms of evidence) and you DUCK, meaning turn your own outbound audio down 9-12 dB while still synthesising, which is exactly what a human does when they think they're being interrupted and is fully reversible if they were only saying 'mhm'. The slow one is lexical — at ~280 ms of sustained speech you read the running transcript, check it against a small list of backchannel words, and only then actually cancel. Cancelling is where nearly every first implementation ships a bug: aborting the language model and the vocoder stops the PRODUCERS, but the already-synthesised audio sitting in your playout buffer keeps draining happily into the caller's ear — pre-buffer 400 ms against jitter, forget to flush it, and that's 400 ms of extra talk-over billed straight back from your streaming design. Finally, repair the conversation state: use the TTS's own word-timing alignment to find the last word that actually reached the wire, truncate the assistant's turn there minus a safety margin, and mark it interrupted — erring SHORT, because an agent that repeats a fasting instruction is annoying and one that believes it already said it is a patient-safety problem.","bestChoice":"Two-stage detect (duck at ~60 ms of voiced frames, commit at ~280 ms against the ASR partial with a backchannel lexicon and a 700 ms override), flush the playout buffer on cancel, truncate history to the words that reached the wire minus a 150 ms safety margin, and run the VAD as ONNX on the media node.","whyBest":"A single threshold cannot be both fast and right. Ducking is cheap and reversible so it is the only decision worth making on 60 ms of evidence; committing is destructive so it waits for a word. Running the VAD locally matters because a 20 ms network hop per frame would consume the entire duck budget.","gotcha":"Two silent killers. First, the flush: you abort the LLM and the vocoder, your logs say 'cancelled', and the caller still hears 400 ms more of the agent because the playout buffer drained. Second, self-barge-in — if echo cancellation is absent or has diverged, your own voice returns one round trip later, the VAD correctly reports speech, and the agent cancels itself a few hundred ms into every sentence, restarts, and cancels again: a stutter that decays into silence. The lexical gate makes echo WORSE, because echo is grammatical speech that sails through a backchannel filter. Do not touch any threshold — check ERLE. Third, opening the ASR at the trigger clips the caller's first syllable.","interviewLine":"\"I'd split it into detect, cancel, and repair... three voiced VAD frames — about 60 ms — and I duck the outbound audio by 10 dB, which is reversible; then around 280 ms of sustained speech I check the ASR partial against a backchannel list and only then commit. Cancel is where people ship the bug: aborting the LLM and the vocoder stops the producers, but the playout buffer keeps draining, so if I pre-buffered 400 ms for jitter I talk over the caller for 400 ms longer than I think... about 420 ms. Then repair, which is the part that matters clinically: truncate the assistant turn to the words whose audio reached the wire, using the TTS alignment, minus a safety margin — err short, because an agent that repeats 'nothing after midnight' is annoying and one that believes it already said it is a patient-safety problem. And if the agent interrupts itself, that's echo, not policy: check ERLE before you touch any threshold.\"","numbers":[{"value":"140 ms","means":"Inbound 75 + outbound 65: the unavoidable floor of talk-over. Any barge-in latency figure that excludes these describes your process, not the call."},{"value":"60 ms (3 x 20 ms frames)","means":"Evidence needed to duck. Three consecutive voiced frames — enough to not fire on a click, cheap enough to be wrong about."},{"value":"9-12 dB","means":"How much to attenuate your own outbound audio when ducking. Audible as yielding, not as stopping."},{"value":"280 ms","means":"Sustained speech before committing to a real cancel. Ducking is what buys you those extra 220 ms of certainty."},{"value":"420 ms","means":"Total agent audio the caller hears after they start talking: 75 IN + 280 commit + 65 OUT. Brisk enough to read as yielding the floor."},{"value":"400 ms","means":"Typical playout buffer depth. Forget to flush it on cancel and this adds directly to talk-over — the jitter insurance from the streaming design charged straight back."},{"value":"700 ms","means":"Override: past this, commit anyway even if the words look like a backchannel, because a long 'yeaaah, but—' is a real turn attempt."},{"value":"300 ms lookback ring","means":"Pre-trigger audio buffer. Open the ASR only at the trigger and you clip the caller's first syllable."},{"value":"150 ms safety margin","means":"Subtracted when truncating history. Always subtract, never add: repetition is the cheap error, omission the expensive one."},{"value":">25 dB ERLE","means":"Echo cancellation quality needed before your own voice (~-20 dBov) stops tripping a VAD floored at -45 dBov. Below that the agent interrupts itself."},{"value":"12.5 Hz / Moshi","means":"The full-duplex reference point — a model with parallel input and output streams handles interruption internally instead of in your scheduler."},{"value":"26 / 18 / 11 words","means":"The worked example: LLM generated 26 words, vocoder rendered 18, caller heard 11. Only the 11 belong in the transcript."}],"archNote":""},{"id":"22","title":"Turn-Taking / Endpointing (Deciding They're Done)","stage":0,"oneLiner":"Judging when the caller has finished speaking, not just when they paused.","problem":"A caller reads a member ID off a card: '4 4 7 ... 2 9 1 ... 8 0'. The gaps while their eye moves to the next chunk are 600-900 ms — longer than your 700 ms silence timer — so the agent barges in halfway through the number. The caller restarts, the recogniser now holds a fragment plus a repeat, and the agent answers half a sentence. Raise the timer to 1200 ms instead and every 'yes' costs an extra half-second of dead air.","how":"First separate two jobs that get conflated: a voice-activity detector answers a per-frame acoustic question ('is there speech in these 20 ms?'), while the endpointer answers a conversational one ('does this run of silence mean the floor is mine?'). Get the VAD wrong and you mislabel a frame; get the endpointer wrong and you talk over a patient. The endpoint wait is pure serial dead time — it starts when the caller stops and NOTHING downstream can begin until it expires — so at 700 ms it is nearly half a 1430 ms response budget, which is exactly why people cut it and exactly how agents start interrupting. The fix is to stop asking 'how long has it been quiet' and start asking 'is what I have so far a complete utterance': score the running partial transcript with a small text classifier and make the wait a function of that score, so 'yes, Tuesday works' (looks finished) yields in ~270 ms while 'my member ID is' (obviously unfinished) gets a generous ~1530 ms of grace. Two guards are mandatory: a hard maximum, because a caller who trails off with 'so...' keeps the completeness score low forever and without the cap the agent never speaks again; and the classifier must run locally, because partial transcripts are patient data and a hosted LLM call would both disclose them off-site and add a network round trip inside the tightest loop you own.","bestChoice":"Completeness-driven adaptive endpointing: wait(p) = clamp(t_min + (t_max - t_min)(1 - p), t_min, t_max) with t_min 200 ms, t_max 1600 ms, driven by a fine-tuned encoder over the ASR partial, exported to ONNX and run on the media node.","whyBest":"Mid-utterance pauses are not shorter than end-of-utterance pauses, so no fixed timeout can separate 'thinking' from 'finished' — only the CONTENT of the partial can. Running the classifier on the media node keeps patient data local and avoids a round trip inside the fastest loop in the system.","gotcha":"Two traps beyond the obvious. First, the phone line: with carrier silence suppression, silence arrives as ABSENT packets rather than quiet ones, so an endpoint timer driven only by decoded frames simply stalls and never fires — you must treat a packet gap as silence, not as loss. Second, the classifier reads text, so ASR errors propagate: one dropped final word makes a finished sentence look unfinished and the agent waits the full 1600 ms cap. And the cost asymmetry is the real tuning rule — dead air costs a beat and a 'Hello?' (which itself then gets endpointed, so the agent answers the hello instead of the request), while a cut-off destroys the turn and all the information in it. Short thresholds only where completeness is high.","interviewLine":"\"Endpointing is the biggest single number in my response budget and the only one I can move without touching a model — a 700 ms silence threshold, plus 120 for ASR finalisation, 320 for time-to-first-token, 150 for first audio and about 140 of network, is 1.4 seconds before the caller hears anything. So the temptation is to cut the 700, and that's where agents start talking over people. The reason a fixed timeout can't win is that mid-utterance pauses aren't shorter than end-of-utterance pauses — someone reading a member ID off a card leaves 800 ms between chunks. So I'd score the running ASR partial for completeness and make the threshold a function of it: about 270 ms when the utterance looks finished, up to about a second and a half when it clearly isn't, with a hard cap so a caller who trails off doesn't stall the agent forever.\"","numbers":[{"value":"700 ms","means":"The common fixed silence timeout. Correct for confirmations, catastrophically wrong for dictated numbers."},{"value":"1430 ms","means":"Full serial path with a 700 ms fixed timeout: 700 endpoint + 120 ASR finalise + 320 LLM first token + 150 TTS first audio + 140 network. The 700 is nearly half of it."},{"value":"600-900 ms","means":"Mid-utterance gaps when a caller reads a member ID off a card — longer than the 700 ms timer, which is why it fires inside the number."},{"value":"t_min 200 / t_max 1600 ms","means":"The clamp bounds of the adaptive policy. t_max is not optional: without it a trailing-off caller stalls the agent forever."},{"value":"270 ms","means":"What the adaptive policy waits on 'yes, Tuesday works' (completeness p = 0.95) — faster than any safe fixed value."},{"value":"1530 ms","means":"What it waits on 'my member ID is' (p = 0.05) — a second and a half of grace exactly where a fixed timer would have cut in."},{"value":"80-200 ms","means":"ASR partial latency. Plus classifier inference, this is a floor the adaptive policy cannot beat — at high completeness, that floor IS your threshold."},{"value":"1080 ms","means":"What you get by naively cutting the fixed timeout 700 -> 350. Cheap, and exactly how agents start interrupting people."},{"value":"60 ms","means":"Jitter buffer depth sitting in front of everything — your silence clock starts 60 ms late, threshold you have already spent."},{"value":"RFC 3389","means":"Comfort noise / silence suppression: the far end stops sending during silence, so silence arrives as ABSENT packets, not quiet ones."}],"archNote":""},{"id":"23","title":"Full-Duplex Speech-to-Speech Models","stage":0,"oneLiner":"One model that hears audio and speaks audio, with no text in the middle.","problem":"A cascade converts the call to text and back, and at that boundary it throws away roughly 99.8% of the information — including the falling pitch, the hesitation before a number, and the sharp inhale that means the caller is about to interrupt. So the endpointer is guessing from silence duration what a human hears in the intonation, and the agent sounds fine sentence by sentence but feels wrong across a turn. It also pays four sequential decision points, which is where the extra half-second lives.","how":"First untangle three things that all get called 'speech-to-speech': a turn-based API that swallows an audio blob and returns an audio blob is just a cascade with the seams hidden — you outsourced the stages, you didn't remove them; a streaming audio-in/audio-out model still gated by your own voice detector is HALF duplex, listening then talking, with the endpointer still yours; full duplex means the model consumes the caller's stream and emits its own on every single frame, so silence, overlap and 'mhm' are all things it saw in training. The latency win is not that the model is faster per token — it's that a cascade pays four sequential commit points (wait for silence, finalise the transcript, produce a first token, produce first audio) and the audio-native model pays one learned decision to start speaking: about 1190 ms versus about 725 ms on the same call. What you give up is the text checkpoint, and that is where your entire control surface lives — contextual biasing that pins drug names, redaction before anything is stored, validation of tool-call arguments before they hit a scheduling API, a policy guardrail that reads the ans
