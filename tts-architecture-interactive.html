as started; rejects coughs and beeps.","maximum utterance length":"Hard time cap that force-ends a turn when silence never arrives.","short-time energy":"How loud one audio slice is, measured as 20*log10 of its RMS level.","dBFS":"Loudness measured against the loudest value the format can hold; always zero or negative.","ZCR (zero-crossing rate)":"How often the waveform flips sign — high for hiss, low for vowels.","voiced / unvoiced":"Voiced sounds use vocal fold vibration (vowels); unvoiced ones are pure turbulence (/s/, /f/).","noise floor":"The ambient loudness of the line when nobody is talking.","hysteresis":"Using a higher threshold to switch on than to switch off, so the decision stops flickering.","GMM VAD":"The classic statistical detector (WebRTC's) that models speech and noise loudness distributions.","Silero VAD":"A small neural speech detector; 16 kHz model, 512-sample (32 ms) chunks.","babble":"Background noise made of other people talking — the hardest case for a detector.","semantic endpointing":"Judging from the words whether the sentence sounds finished.","partial transcript":"The incomplete text the speech recogniser has produced so far, mid-sentence.","asymmetric cost":"The two ways of being wrong cost wildly different amounts, so don't optimise accuracy.","false cut-off rate":"How often the agent declares the turn over while the caller was still talking.","echo cancellation":"Removing the agent's own outgoing audio from the incoming microphone signal.","self-trigger":"The agent's own speech leaks back and fires its own speech detector, so it interrupts itself.","DTX / comfort noise":"Carrier silence suppression: quiet stretches arrive as fake hiss, not as a genuinely quiet signal.","p95 endpoint latency":"The wait time that 95% of turns come in under — the tail, not the average.","ASR finalisation":"The extra time the recogniser takes to commit its final text after audio stops.","TTFT / TTFA":"Time to first token (LLM's first word) / time to first audio (first sound out of TTS).","text normalization":"Rewriting written form into spoken form before anything tries to pronounce it.","non-standard word":"Any token that isn't just a word — numbers, dates, symbols, abbreviations, codes.","semiotic class":"The category of a non-standard token: cardinal, money, date, time, telephone, measure, digits, verbatim.","verbalizer":"The per-category rulebook that turns a token into the actual words.","WFST (weighted finite-state transducer)":"A compiled rewrite-rule machine: auditable, fast, and unable to invent output that isn't derived from input.","Kestrel / Sparrowhawk":"Google's production normalization grammar system and its open-source equivalent.","NeMo":"NVIDIA's speech toolkit; ships ready-made WFST normalization grammars.","homograph":"One spelling with two pronunciations, e.g. read/read, live/live, lead/lead.","POS tagger (part-of-speech)":"A model that labels each word noun/verb/adjective, which is what disambiguates homographs.","CMUdict":"The standard free English pronunciation dictionary, ~134k words, written in ARPAbet.","seq2seq":"A model that reads a sequence and freely writes a new one — powerful and therefore able to hallucinate.","clause boundary":"A natural break in a sentence — the safe place to cut streaming text before verbalizing it.","leading-zero guard":"A safety rule: a number starting with 0 gets read digit by digit, never as a quantity.","identifier lexicon":"A domain word list ('MRN', 'member ID') that flags the next token as digits to read out.","silent plausibility":"The failure sounds perfectly natural and raises no error, so nothing catches it.","TTFA (time to first audio)":"Delay before the caller hears the first sound of the reply.","IVR":"The automated phone menu system — repeats the same fixed phrases constantly, so cache them.","G2P (grapheme-to-phoneme)":"Converting written letters into the sequence of speech sounds to produce.","grapheme":"A written letter or letter group — the spelling side.","phoneme / phone":"One distinct speech sound, the unit the voice model actually conditions on.","orthography":"The spelling system of a language.","lexicon":"A pronunciation dictionary: word in, sound sequence out.","ARPAbet":"An ASCII, English-only sound alphabet — 39 symbols, stress written as a digit on the vowel.","IPA":"The International Phonetic Alphabet — Unicode, covers every language, what eSpeak-NG emits.","eSpeak-NG":"A rule-based open-source phonemizer that many TTS recipes use to produce IPA.","stress digit":"The 0/1/2 glued to an ARPAbet vowel saying how strongly that syllable is stressed.","schwa":"The neutral 'uh' vowel in unstressed syllables, written as an upside-down e in IPA.","OOV (out of vocabulary)":"A word the dictionary doesn't contain, so something has to guess it.","tenant overlay":"A per-customer curated word list that overrides the general dictionary.","POS tag":"The noun/verb label that decides which homograph reading applies; comes from the normalization stage.","PER (phone error rate)":"Edit distance between predicted and correct sound sequences, over reference length.","WER (word error rate, in G2P)":"A word counts wrong if ANY of its sounds is wrong — the strict number that actually matters.","joint-sequence model":"Classical G2P: align letters to sounds into chunks, then run an n-gram over the chunks.","multigram":"One aligned letter-chunk-plus-sound-chunk pair used as a unit by classical G2P.","Sequitur":"The classic joint-sequence G2P trainer.","Phonetisaurus":"Same idea compiled into a finite-state transducer and decoded with OpenFst.","OpenFst":"The standard library for building and searching finite-state transducers.","BiLSTM with attention":"A recurrent encoder-decoder network; the pre-transformer default for small seq2seq tasks.","autoregressive decoding":"Generating output one symbol at a time, each conditioned on the last.","embedding table":"The learned lookup that turns each input symbol into a vector — fixed at training time.","bijection":"A clean one-to-one mapping in both directions. ARPAbet\u003c->IPA is NOT one.","LRU cache":"Keeps the most recently used answers, discards the stalest — so a clinic's vocabulary stays warm.","SSML \u003cphoneme>":"A markup tag that lets you hand-force the pronunciation of one word.","prosody":"Melody, rhythm and loudness — everything about how a sentence is said, not what it says.","F0 / fundamental frequency":"How fast the vocal folds vibrate; heard as pitch.","pitch contour":"The line traced by pitch over the course of an utterance.","voiced / unvoiced frame":"Voiced frames have vocal fold vibration and thus a pitch; unvoiced ones (/s/, silence) have none at all.","log-F0 / semitones":"Pitch expressed logarithmically, because that's how the ear perceives it, not in raw Hz.","per-speaker z-score":"Subtract this speaker's mean pitch and divide by their spread, so the model learns speaker-free intonation.","duration":"How many frames one speech sound occupies — its length in time.","hop":"How far the analysis window advances each step; it sets the frame rate for the whole system.","energy":"Loudness per frame, measured as the size of that frame's frequency content.","variance adaptor":"The block predicting duration, pitch and energy - the explicit prosody controls.","length regulator":"Copies each phoneme's vector d times to build the frame sequence.","quantised embedding":"Bucketing a continuous value and looking the bucket up in a learned vector table.","pitch tracker":"An algorithm that measures F0 from a recording, to make training targets.","RAPT / YIN / pYIN / WORLD DIO+StoneMask":"The standard pitch-tracking algorithms used to extract F0 targets.","ToBI":"A standard notation for writing down English intonation patterns.","pitch accent":"A local pitch movement on one word that marks it as the focus of the sentence.","range compression":"Flattening the pitch after the emphasised word, which is part of how emphasis is heard.","final lengthening":"English stretches the last syllable before a phrase break — a turn-ending cue.","one-to-many":"The same text has several valid readings, so there is no single correct answer to predict.","deterministic regression head":"A layer that outputs one fixed number per input — fine for single answers, wrong for one-to-many.","conditional mean / median":"The average / middle of all valid answers. What L2 loss and L1 loss respectively converge to.","L1 / L2 loss":"Training penalties on absolute error / squared error; they pull predictions to the median / mean.","bimodal":"The truth has two clusters (rise and fall), so the average of them is a third thing that never occurs.","stochastic duration predictor":"Samples a rhythm from a learned distribution instead of predicting the average.","flow":"An invertible network that turns simple noise into a complex distribution you can sample from.","diffusion head":"A denoising generator used as the prosody predictor, so it samples rather than averages.","latent":"An internal learned variable inside the model — real, but not something you can reach and set.","attention matrix":"Grid of time-steps by text symbols showing where the model looked each frame.","missing fundamental":"The ear infers the pitch from the spacing of the harmonics even when the fundamental is filtered out.","alpha (speaking rate)":"A multiplier on all durations - below 1 speeds the voice up.","rho (expressiveness)":"Serve-time scalar scaling the pitch offsets; >1 widens the melody.","forced alignment":"Working out sound timings when you already know the words that were said.","forced":"The transcript is fixed and not searched — which is why it always returns an answer.","Viterbi":"The algorithm that finds the single best path through a chain of states, step by step.","trellis":"The grid of (time frame x state) cells the search fills in.","HMM":"Hidden Markov Model: a chain of hidden states, each emitting observable audio frames.","state":"One stepping stone — a third of a speech sound, in the standard setup.","self-loop":"The move that stays on the current sound for another frame, i.e. makes it longer.","skip arc":"A move that jumps over a state. Deliberately ABSENT here, which is what creates the 30 ms floor.","monotonic":"Only ever moves forward through the text, never backwards.","emission density":"How likely this state is to have produced this particular audio frame.","transition probability":"How likely it is to stay versus advance at each step.","log domain":"Doing the arithmetic on logarithms so multiplying tiny probabilities doesn't underflow to zero.","backpointer / backtrace":"Remembering which move you took in each cell, then walking backwards to recover the path.","lattice":"The branching graph of all word sequences an ordinary recogniser searches — the thing forced alignment avoids.","MFA (Montreal Forced Aligner)":"The standard off-the-shelf forced aligner; the practical default.","Kaldi":"The classical open-source speech recognition toolkit MFA is built on.","GMM-HMM":"The pre-neural acoustic model: Gaussian mixtures scoring frames inside an HMM chain.","triphone":"A sound modelled in the context of its left and right neighbours, since sounds bleed into each other.","speaker-adapted features":"Audio features rescaled per speaker so one model fits many voices.","log-likelihood":"The score of the winning path — how well the model thinks the audio matches the transcript.","mean per-frame log-likelihood":"That score divided by frame count, so utterances of different lengths are comparable. THE QA signal.","CTC":"Connectionist Temporal Classification — a recogniser training method that emits a 'blank' when uncommitted.","blank":"CTC's 'nothing to report this frame' symbol, interleaved around every target label.","peakiness":"CTC puts almost all its confidence on blank and spikes for one or two frames per sound.","posteriors":"The model's per-frame probability distribution over symbols.","torchaudio.functional.forced_align":"The ready-made PyTorch function that runs CTC-based alignment.","MAS (monotonic alignment search)":"Glow-TTS/VITS learning the alignment during training — the same Viterbi, against the model's own likelihood.","short-pause model":"An optional tiny silence unit allowed between words for natural breathing gaps.","flapped /t/":"The very short d-like t in American 'butter' — often under 30 ms, so unrepresentable here.","regridding":"Converting boundaries from the aligner's 10 ms clock to the synthesiser's 11.61 ms clock.","Parquet":"A columnar file format; storing alignments in it makes filtering by score a query, not a re-run.","domain mismatch":"Running a model on audio unlike its training data — e.g. a 16 kHz aligner on upsampled phone audio.","autoregressive (AR)":"Frame t depends on frame t-1, so frames must be computed in order.","encoder":"The half that reads the input text and turns it into context-aware vectors.","decoder":"The half that produces the output, one spectrogram frame per step.","attention":"A learned pointer that decides which part of the text the model is reading right now.","location-sensitive attention":"Attention that also sees where it has already pointed, so it slides forward instead of jumping.","alignment":"The mapping from text symbols to time slices - which phoneme is being spoken when.","alignment matrix":"A picture with time down and text across, showing where attention pointed each frame.","mel spectrogram":"80 loudness values per short time frame — the picture-of-sound the vocoder consumes.","80-bin mel":"The spectrogram is summarised into 80 frequency bands per time slice.","hop (hop size)":"How far the analysis window slides each frame - sets the frame rate, here 12.5 ms.","stop token":"A single yes/no number per frame saying whether the sentence has ended.","pre-net":"Two small layers that process the previous frame before it is fed back in.","post-net":"Five convolution layers that add a correction on top of the finished spectrogram.","residual":"A correction added to an existing prediction rather than replacing it.","receptive field":"How much past audio one output actually depends on.","non-causal":"Depends on future frames as well as past ones, so it cannot run strictly live.","BiLSTM":"A recurrent network that reads the sequence both forwards and backwards.","reduction factor r":"How many audio frames one decoder step emits; r=1 in Tacotron 2.","RTF (real-time factor)":"Compute seconds per audio second; 168x real time means RTF ≈ 0.006.","TTFA (time-to-first-audio)":"Delay from starting synthesis to the caller hearing the first sound.","launch-bound":"Slow because of per-call overhead, not because of arithmetic - so bigger batches are nearly free.","MOS (mean opinion score)":"Average human naturalness rating on a 1-to-5 scale.","diagonality check":"Scoring how close the alignment picture is to a clean diagonal line.","skipping":"Attention jumps forward, so some phonemes are never spoken - a missing word.","repeating":"Attention jumps backward, so phonemes are spoken twice - a stutter.","collapse":"Attention smears across everything, producing an averaged, meaningless drone.","early stopping":"The stop signal fires mid-sentence and the reply truncates mid-word.","focus rate":"Average sharpness of the attention peak per frame; low means collapsed.","coverage":"Per-symbol check that every phoneme got attended to at least once.","argmax regression":"The peak attention position moving backwards - the signature of a stutter.","guided attention loss":"A training penalty that pushes attention toward a clean diagonal.","content-based attention":"Scores each text symbol by similarity alone, with no idea of position.","inference windowing":"Only allow attention inside a sliding window, making backward jumps impossible.","forward attention":"Sums only over paths that move forward through the text (Zhang 2018).","GMM attention":"Position-based attention that advances a Gaussian bump instead of comparing content.","DCA (Dynamic Convolution Attention)":"Adds a fixed prior that nudges the position forward every step; stabilises long text.","MoChA":"Monotonic chunkwise attention - makes the move-on decision a discrete yes/no.","MAS (Monotonic Alignment Search)":"Dynamic programming that picks the best forward-only text-to-frame path.","dynamic programming":"An exact search that builds the best path from best sub-paths, no guessing.","free-running inference":"The model feeds on its own outputs, so one bad frame poisons the next.","off-distribution":"Input unlike anything in training, where learned habits stop holding.","barge-in abort":"Cancel synthesis, flush the audio already queued, play a pre-recorded prompt.","dead air":"Silence on the line when the caller expects a reply.","non-autoregressive (NAR)":"Frame count known in advance, all frames computed simultaneously.","repeat_interleave":"The literal tensor operation that does the copying - one line of PyTorch.","FFT block":"Feed-forward Transformer block: self-attention plus a 1-D convolution.","knowledge distillation":"Training a student on a teacher model's outputs; FastSpeech 2 deliberately dropped this.","teacher / teacher's attention":"A trained AR model whose alignment FastSpeech 1 copied durations from.","ground-truth mel":"The spectrogram of real recorded speech, as opposed to a teacher model's output.","one-to-many mapping":"The same sentence has many valid readings, so averaging them sounds flat.","conditional mean":"What MSE regression returns - the average of all valid answers, not one of them.","MSE":"Mean squared error, the loss that makes a model predict averages.","F0 / pitch contour":"The fundamental frequency over time - how high or low the voice goes.","CWT / iCWT":"Continuous wavelet transform: decomposes the pitch curve into scales; iCWT reassembles it.","p50 / p99":"Median and 99th-percentile latency; p99 is the slow 1% of requests.","tail risk":"Rare requests that take dramatically longer than typical ones.","MAE":"Mean absolute error - here, predicted duration versus the aligner's duration.","causal / non-causal":"Causal depends only on the past; non-causal needs future frames too.","dependency edge":"The arrow in the computation graph forcing one thing to wait for another.","T (frame count)":"How many spectrogram frames the reply needs - known upfront in NAR, not in AR.","total synthesis time":"Time to produce the whole reply - impressive on slides, not what callers feel.","teacher forcing":"In training, feed the model the true previous frame instead of its own guess.","exposure bias":"Trained on true history, run on its own history, so small errors compound.","free-running":"Inference mode where the model consumes its own previous outputs.","runaway":"The stop token never fires and generation runs to the hard step cap.","max_decoder_steps":"Hard cap on generation length; 1000 in NVIDIA's Tacotron 2 config.","p99 / p99.5":"The 99th and 99.5th slowest percent of requests - where rare failures show.","tail latency":"How slow the rare worst requests are, versus the typical ones.","head-of-line blocking":"One slow item in a batch delays everything queued behind it.","dynamic batching":"Serving many requests together in one GPU pass to raise throughput.","queueing theory":"The maths of waiting lines - needed when per-request work is variable.","clause chunking":"Split text at natural phrase boundaries and synthesise each piece separately.","seam":"The audible join where two separately-synthesised chunks are stitched together.","stochastic duration prediction":"VITS deliberately varies timing per render, so output differs each run.","flow / diffusion decoder":"Generative decoders that produce one plausible reading rather than an average.","jitter buffer":"Buffer absorbing uneven packet arrival; adds real, testable delay.","template ID caching":"Cache audio keyed on the phrase template, never on rendered text containing caller data.","end-to-end":"One model trained once, with no intermediate format handed between components.","the seam":"The mel spectrogram interface between acoustic model and vocoder in a cascade.","VAE (variational autoencoder)":"A model that encodes data into a random latent and decodes it back.","conditional VAE":"A VAE where the latent's distribution is steered by an input - here, the text.","latent (z)":"A compact learned representation; in VITS it describes the audio, not the text.","posterior encoder":"Reads the real recording's spectrogram and produces the latent, in training only.","posterior":"What the latent looks like when you HAVE seen the actual audio.","prior":"What the latent should look like given only the text, before seeing any audio.","normalizing flow":"A stack of invertible transforms that reshapes one distribution into another.","affine coupling layer":"The invertible building block: transform half the vector using the other half.","volume-preserving":"The flow does not stretch or shrink space, so its Jacobian determinant is 1.","Jacobian determinant":"How much a transform stretches space; here deliberately made 1 so it drops out.","KL divergence":"A number measuring how far apart two probability distributions are.","ELBO":"Evidence lower bound - the trainable objective that stands in for true likelihood.","surjective map":"Every frame gets a phoneme and every phoneme gets at least one frame.","spline flow":"A flexible invertible transform (monotonic rational-quadratic) used for durations.","dequantization":"Adding tiny noise so a continuous model can handle whole-number durations.","adversarial / GAN":"Two networks compete: one generates audio, one tries to spot fakes.","discriminator":"The critic network judging whether audio is real or generated.","MPD (multi-period discriminator)":"Judges the waveform at several periodicities to catch pitch artefacts cheaply.","LSGAN (least-squares GAN)":"GAN loss using squared error rather than cross-entropy; more stable to train.","feature matching loss":"Also match the critic's internal activations, not just its final verdict.","L1 loss":"Average absolute difference - here between generated and real mel spectrograms.","length regulate":"Expand per-phoneme prior parameters to per-frame by repeating them d times.","speaker embedding":"one fixed-length list of numbers standing for a voice's identity","noise_scale_w (sigma_w)":"How much the sampled rhythm varies between runs of the same text.","noise_scale (tau)":"How much the latent varies - affects timbre rather than timing.","length_scale":"A global multiplier on speaking rate.","cross-fade":"Overlapping the ends of two chunks so the join is not audible.","ONNX / Triton":"A portable model file format, and NVIDIA's model-serving runtime.","narrowband decoder":"A decoder built to output 8 or 16 kHz directly, skipping wasted compute.","waveform":"The raw list of speaker-position numbers, 16,000 or 24,000 per second.","sample":"One number in that list — one instant of speaker position.","sample rate (16 kHz / 24 kHz / 8 kHz)":"How many of those numbers per second. 8 kHz is a phone line.","autoregressive":"Each output depends on the previous output, so they must be produced in order.","product of conditionals / p(x) = ∏ p(x_t | x_\u003ct)":"Formal way of saying: predict each sample from every sample before it.","causal convolution":"A filter allowed to look only backwards in time, never at the future.","dilated convolution":"A filter that skips positions, so it reaches far back with few weights.","dilated causal convolution":"Both together: look only backwards, and skip further with each layer.","kernel size k":"How many positions one filter touches at once (WaveNet uses 2).","mu-law companding (µ=255)":"Squashing loud/quiet audio onto 256 levels; the same law phone lines use.","256-way softmax":"The model picks one of 256 buckets rather than outputting a raw number.","cross-entropy vs MSE":"Multiple-choice loss vs averaging loss; averaging blurs genuinely two-way answers.","multimodal target":"The right answer is one of several distinct values, not their average.","glottal closure":"The instant the vocal folds slam shut — a sharp, two-way-valued moment in the waveform.","gated activation unit":"Two parallel filters where one acts as a volume knob on the other.","residual path":"A shortcut that adds a layer's input to its output so deep stacks still train.","skip path":"Every layer also sends a copy straight to the output, bypassing the rest.","global conditioning":"A fixed vector (e.g. speaker identity) added to every layer.","local conditioning":"A time-varying input (mel frames, pitch) stretched to sample rate and fed in.","Fast WaveNet / FIFO queue caching":"Remember each layer's needed past values so a step is two taps, not a whole re-run.","MAC":"One multiply-and-add — the unit of neural-network arithmetic.","kernel launch latency":"Fixed overhead of starting one GPU operation, regardless of how little math it does.","CUDA graphs / persistent fused kernel":"Collapse many tiny GPU ops into one so you pay launch overhead once.","exposure bias / compounding error":"A bad output is fed back in as input, so mistakes grow across the utterance.","Parallel WaveNet / IAF student":"A distilled copy that produces the whole waveform in one parallel pass.","probability density distillation":"Training the fast student to match the slow teacher's probabilities, not its samples.","membership inference":"Guessing whether a specific recording was in the training set; easier against likelihood models.","PHI-derived":"The weights carry patient audio, so they inherit its consent and retention rules.","spectral flatness":"A noise-vs-tone metric; rising values reveal a creeping crackle before callers complain.","STFT (short-time Fourier transform)":"Chop audio into overlapping slices and measure each slice's frequency content.","ISTFT":"The reverse: turn frequency slices back into audio by overlapping and adding them.","magnitude":"How strong each frequency is — the part a spectrogram keeps.","phase (∠X)":"Where in its cycle each frequency wave sits — the timing offset a spectrogram throws away.","phase retrieval":"Recovering that discarded timing from loudness alone.","n_fft / window / hop":"Slice length, its taper, and how far you advance between slices.","75% overlap":"Each output sample is built from four overlapping slices summed together.","overlap-add / WOLA":"Reconstructing audio by summing the overlapping slices back together.","incoherent overlap-add":"Those four summed slices disagree on timing, so they partly cancel — the actual artefact.","consistency set":"All arrays that really are the analysis of some genuine audio; enforced by ISTFT then STFT.","magnitude set":"All arrays whose loudness matches your target; enforced by stamping magnitudes back on.","alternating projection":"Repeatedly snapping to the nearest point in each of two rule-sets in turn.","convex / non-convex":"Convex sets have a single unambiguous nearest point; the magnitude set does not, so you can get stuck.","critical point":"Where the algorithm stops improving without having found the true answer.","inconsistent spectrogram":"One a network predicted, which no real audio could have produced — so no exact solution exists.","spectral convergence (SC)":"The error metric: how far the current reconstruction's loudness is from the target.","monotone / non-increasing":"The error never goes up. True for plain Griffin-Lim, false once you add momentum.","pre-echo":"A whoosh of a consonant's energy audible before the consonant itself.","plosive":"A burst consonant — p, t, k — where pre-echo is most obvious.","chorusing / hollow / metallic":"The recognisable 2017-demo sound of mis-timed overlapping slices.","mel_to_stft / pseudo-inverse / NNLS":"Undoing that squash — a smeared best guess, never exact.","CBHG post-net":"Tacotron 1's module that predicted full-resolution magnitude to dodge the mel inverse.","Fast Griffin-Lim / momentum α":"Overshoot each step to converge faster, at the cost of the never-worse guarantee.","seams":"Clicks where independently-vocoded chunks join.","waveform SNR":"A signal-to-noise metric that is useless here — a shifted-but-identical-sounding result scores terribly.","ASR WER":"Feeding synthesised audio to a speech recogniser and counting word errors as a quality proxy.","3.4 kHz cutoff":"Phone lines discard everything above this, hiding top-band artefacts but not pre-echo or chorusing.","GAN (generative adversarial network)":"A generator and a critic trained against each other until the critic can't tell fake from real.","generator":"The network that actually produces audio; the only part you ship.","discriminator / critic":"A network used only during training to score audio as real or generated.","hop (256)":"How many audio samples one mel frame stands for.","transposed convolution / upsampling stage":"A learned way to stretch a short sequence into a longer one.","stride":"The stretch factor of one upsampling stage.","fully convolutional":"Only sliding filters, no recurrence — so the whole output computes in parallel.","MRF (multi-receptive-field fusion)":"Three parallel filter stacks of different widths, averaged, so no single time-scale wins.","residual block / ResBlock":"A small filter stack whose output is added back to its input.","dilation":"Filter taps spaced apart so the filter reaches further without more weights.","symmetric vs causal":"Symmetric looks both backwards and forwards in time; causal only backwards.","lookahead / padding":"The future mel you must wait for before a sample can be computed.","MSD (multi-scale discriminator)":"Critic that judges the audio and blurred, slowed copies of it.","average pooling / boxcar":"Averaging neighbouring samples — a blur, which is a low-pass filter.","low-pass":"Removes high frequencies. Why the MSD's coarse branches cannot hear hiss.","null at fs/4":"The 4-tap averaging filter cancels a 5.5 kHz tone outright before that critic ever sees it.","aliasing":"High frequencies masquerading as low ones after you throw samples away.","width-one (k,1) kernels":"Filters that never mix two columns, keeping each sampling phase independent.","prime periods":"2, 3, 5, 7, 11 — chosen so no two critics land on the same sample grid.","ablation":"Removing one component to see how much it mattered; removing MPD hurts most.","least-squares GAN loss":"Score real as 1 and fake as 0 with squared error instead of log-loss; trains more stably.","mel L1 loss":"Re-analyse the generated audio into a mel and match it to the target, absolute-difference style.","conditional median / mean":"What a pointwise loss alone converges to — one muffled average of all valid answers.","over-smoothing":"Model outputs the bland average of many valid readings; sounds flat.","spectral vs weight normalisation":"Two ways of taming critic weight sizes; MSD uses spectral on its first branch.","out-of-domain mel":"Mel the vocoder never saw in training — e.g. an acoustic model's predictions.","buzz":"The metallic, robotic hum on long vowels when the vocoder is off its training manifold.","fine-tuning on predicted mel":"Retrain the vocoder on the acoustic model's own output; the actual fix.","ASR WER gate":"Run a recogniser on the synthesised audio and block promotion if word errors rise.","neural audio codec":"A learned encoder/decoder pair that turns audio into integers and back.","transport codec (G.711, Opus)":"The carrier's audio compression on the actual phone wire — a completely different thing.","latent / latent frame":"The encoder's compressed numeric summary of one short slice of audio.","frame rate / fps":"How many latent frames per second — 75 for EnCodec 24 kHz, 12.5 for Mimi.","vector quantization (VQ)":"Replace a vector with the index of the nearest entry in a lookup table.","codebook":"That lookup table of learned prototype vectors — 1,024 entries typically.","codebook entry / code / centroid":"One prototype vector in the table.","RVQ (residual vector quantization)":"Stacked codebooks where each stage quantises the previous stage's leftover error.","n_q":"How many codebook stages you use; this is the bitrate dial.","coarse-to-fine":"Stage 1 captures most of the energy; later stages add progressively smaller detail.","greedy":"Each stage picks its best match independently, never revisiting earlier choices.","flat quantiser":"One giant codebook at the same bit budget — 2^80 entries, physically impossible.","bitrate (bps / kbps)":"Bits per second of audio. frame rate × stages × bits-per-stage.","acoustic tokens":"The codebook indices themselves, fed to a transformer as vocabulary.","semantic tokens":"Higher-level content tokens from a self-supervised model, used to steer acoustic ones (AudioLM).","token rate":"Tokens per second the downstream LM must generate — the real architectural constraint.","commitment loss":"Penalty pushing the encoder's outputs to stay near the codebook entries it picks.","EMA update":"Codebook entries drift toward the running average of the vectors assigned to them.","dead code":"A codebook entry that never wins any frame — wasted bits.","dead-code restart":"Re-seed an unused entry onto a badly-reconstructed input so it becomes useful again.","codebook collapse":"Most entries go unused, so 10 nominal bits per stage carry far fewer real bits.","perplexity / usage entropy":"How many codebook entries are effectively in use — your TRUE bitrate, not log2(K).","quantizer dropout":"Randomly vary the number of stages during training so one checkpoint serves every bitrate.","nested prefix":"Using the first k stages of the stack is a valid lower-bitrate encoding on its own.","AR (autoregressive) / NAR (non-autoregressive)":"One token at a time in order, vs all tokens produced in one parallel pass.","VALL-E split":"AR over codebook 1 only, then one NAR pass fills codebooks 2 through 8.","delay pattern":"Offset each codebook by one step so a single stream carries all of them.","algorithmic latency":"Delay forced by the design itself — one frame period, regardless of hardware.","STFT discriminator":"GAN critic that judges the decoder's audio in the frequency domain.","MUSHRA":"A listening-test protocol for rating audio quality against references.","off-distribution / watery":"Feed a 24 kHz codec upsampled 8 kHz phone audio and the empty top two-thirds of the band produce smeared, watery output.","streaming TTS":"Emit and play early audio while still generating the rest.","batch / one-shot synthesis":"Generate the whole utterance before playing any of it.","chunk":"One piece of the utterance synthesised and shipped independently.","chunking":"Deciding where to cut the utterance into those pieces.","cut point: mel frames vs text":"Slice already-generated spectrogram, or make separate synthesis calls per clause.","clause-aligned chunking":"Cut at natural phrase boundaries so the pitch reset is least audible.","RTF_eff (effective RTF)":"RTF once you add recomputed context and fixed per-chunk overhead; what actually sizes your fleet.","right-hand / left-hand context":"Extra frames after / before the chunk, fed to the vocoder then discarded.","L (context frames per side)":"How many extra mel frames you hand the vocoder on each edge.","half the receptive field":"The threshold at which carrying context makes the seam vanish rather than merely fade.","zero padding":"Filling missing edge context with silence — input the network never saw in training.","seam / seam artifact":"The tick or short buzz where two independently-generated chunks meet.","prosody reset":"Each text chunk gets its own pitch contour, so the sentence sounds like a list of fragments.","F0 declination":"The natural downward pitch drift across a sentence — it restarts at every text-chunk boundary.","underrun / buffer starvation":"Audio runs out before the next chunk is ready; the agent stutters mid-word.","playout buffer":"The queue of already-generated audio waiting to be played.","per-chunk overhead":"Fixed cost per chunk: kernel launches, host glue, resample, mu-law encode, packetise.","concurrency per worker":"Roughly 1/RTF_eff — how many simultaneous calls one GPU worker can carry.","AR vs NAR streaming":"Autoregressive models emit mel left-to-right so they can stream frames; non-autoregressive ones can only stream text chunks.","encoder self-attention":"Every phoneme attends to every other, so a NAR model needs the full phoneme sequence up front.","polyphase resampler state":"The filter's memory of recent samples; drop it between chunks and you get the same click at the 8 kHz downsample.","RTP packet (20 ms)":"The fixed unit of audio on a phone leg — 160 samples of G.711.","barge-in":"Caller talking over the agent; the agent must cut its audio fast.","endpoint hangover":"How long you wait in silence before deciding the caller has finished talking.","speech-to-speech (S2S)":"Emits audio tokens at a fixed rate with no chunking decision — and no text seam to edit or redact at.","latency budget":"A list of every stage and how many milliseconds it is allowed to spend.","prefill":"the one-off cost of reading the prompt before generation starts","speculative prefill":"Starting the LLM on a partial guess during the silence wait; discard if wrong.","TTFA / time-to-first-audio":"Delay between asking the voice model to speak and the first sound chunk.","TTFT / time-to-first-token":"Delay before the language model emits its first word-piece.","packetisation":"Chopping audio into fixed 20 ms packets before sending; the chopping itself costs 20 ms.","inbound/outbound leg":"The network trip from caller to you, and from you back to caller.","guardrail":"A check that reads the answer before the caller hears it.","cascade":"Speech-to-text, then language model, then text-to-speech, chained.","p50 / p95 / p99":"The median call, the 1-in-20 worst call, the 1-in-100 worst call.","utilisation (rho)":"Fraction of the time your fleet is busy; A divided by GPU count.","M/M/1 sojourn time":"Queue math: total wait = service time divided by (1 minus how busy you are).","adding in quadrature":"Spreads combine as the square root of the sum of squares, so they grow slower than means.","right-skewed distribution":"Most calls are fast but a long tail of slow ones; averages hide the tail.","correlation ID":"One shared identifier stamped on every log line of the same call.","span":"A single timed measurement with a start and an end, in tracing tools.","KV-cache hit":"Reusing the LLM's saved work on a repeated prompt prefix instead of recomputing it.","S2S / speech-to-speech":"Audio in, audio out, one model, no text step in between.","text seam":"The point where text exists between the model and the wire, so filters can run.","HPA":"Kubernetes horizontal pod autoscaler — adds replicas, but far too slowly here.","ducking":"Turning your own outbound audio down instead of stopping it — reversible.","commit":"The irreversible decision to actually cancel the agent's turn.","VAD / voice activity detection":"A per-frame yes/no on whether these 20 ms contain speech.","WebRTC VAD":"The classic lightweight speech detector; takes 10, 20 or 30 ms frames.","flush":"Throwing away everything queued in the buffer so it never plays.","producers":"The LLM and vocoder generating audio — stopping them does not stop the queue.","on the wire":"Measured through the actual 8 kHz phone codec, not on studio audio.","talk-over":"How long the agent keeps being audible after the caller started speaking.","backchannel":"'mhm', 'yeah', 'right' — noises that mean keep going, not stop.","lexical gate":"Checking the actual recognised words before cancelling, not just energy.","ASR partial":"The provisional transcript emitted while the caller is still talking.","self-barge-in":"The agent hearing its own voice come back and interrupting itself.","AEC / acoustic echo cancellation":"Subtracting your own outbound audio from the inbound mic signal.","ERLE":"Echo return loss enhancement — decibels of echo the canceller removes.","dBov":"Loudness relative to the maximum a digital channel can hold; -20 is loud speech.","diverged (AEC)":"The echo canceller has lost its lock and stopped removing echo.","alignment / duration predictor":"The map from each word to the exact audio milliseconds that rendered it.","context truncation / repair":"Rewriting the conversation history to only what the caller actually heard.","full-duplex":"Listening and speaking at the same time, every frame, like a person.","cancel point / seam":"The explicit moment a cascade stops, logs, truncates and runs its filters.","turn-taking":"The rules governing who has the floor in a conversation.","the floor":"Whose turn it is to speak.","VAD vs endpointer":"VAD: is this frame speech? Endpointer: does this silence mean they're finished?","fixed timeout":"Speak after N milliseconds of continuous non-speech, regardless of content.","completeness score (p)":"A 0-to-1 guess at how finished the partial transcript sounds.","clamp":"Force a value to stay between a floor and a ceiling.","hard cap (t_max)":"Absolute maximum wait, so the agent always eventually speaks.","serial dead time":"Delay nothing else can overlap with — pure addition to the budget.","partial latency":"How far behind the caller's mouth the provisional transcript runs.","cut-off":"The agent starting to talk before the caller had actually finished.","dictation":"Caller reading out a long string — IDs, numbers — with pauses inside it.","asymmetric tuning":"Accepting one kind of error more readily because the other costs more.","media node":"The machine already handling the call's audio — no network hop away.","silence suppression":"The phone network stops sending packets during silence to save bandwidth.","comfort noise / SID frames":"Sparse 'it's still quiet' markers sent instead of real silence packets.","policy disagreement":"When the fixed and adaptive endpointers would have fired at different times.","full duplex":"Model listens and speaks simultaneously on every frame, like a person.","half duplex":"Model listens, then talks — an external detector still decides when to switch.","commit point":"A decision the pipeline must finish before the next stage can start at all.","turn commit":"The model's learned decision that now is the moment to start speaking.","codec tokens":"Compressed discrete codes representing audio, far richer than text.","codebook / nq":"One of several parallel code tables per audio frame; 8 is typical.","Moshi (Kyutai)":"The clearest published full-duplex model: parallel user + model audio streams at 12.5 Hz.","Inner Monologue":"Moshi's text stream predicted just ahead of the audio, as a guide.","contextual biasing":"Telling the recogniser to expect specific drug names or member IDs.","shadow ASR":"A second recogniser transcribing the model's output after it already played.","text boundary / checkpoint":"The place where text exists, so you can inspect, redact or validate.","control surface":"All the places you can steer the system without retraining anything.","narrowband / PSTN":"The regular phone network: 8 kHz, band-limited, jittery, lossy.","F0 slope":"How pitch rises or falls — the main cue that a sentence is ending.","in-distribution":"Something the model actually saw during training, so it handles it well.","speaker drift":"The model's voice identity changing partway through a turn.","MTTD / mean time to diagnosis":"How long it takes to work out why the system did something wrong.","biometric identifier":"Data that identifies a person by body characteristics — voice counts.","per-capability deployment":"Choosing the architecture per task, not once for the whole product.","RTF / real-time factor":"GPU seconds spent per second of audio produced; under 1 is faster than real time.","speed-up / x real-time":"The reciprocal of RTF — 33x and 0.03 are the same number.","concurrency vs streams":"Calls in progress versus audio actually being synthesised — very different counts.","duty cycle":"Fraction of wall-clock time a component is actually working.","offered load (A) / Erlang":"How many whole servers' worth of work arrives per second, on average.","barge-in waste":"Audio synthesised then discarded because the caller spoke over it.","batching":"Running several requests through the GPU together to share fixed costs.","beta / batch scaling":"Marginal cost of one more item in a batch; 0 is perfect sharing, 1 is no benefit.","kappa":"How many single-item costs a batch of B actually consumes: 1 + beta(B-1).","formation wait":"Time spent waiting for enough requests to arrive to fill a batch.","max_queue_delay_microseconds":"Triton's cap on formation wait — ship a half-full batch rather than stall.","Erlang B":"Probability an arriving request finds every server busy and is blocked.","Erlang C":"Probability an arriving request has to wait in a queue at all.","M/M/c":"Queue model: random arrivals, random service times, c servers. Pessimistic here.","M/D/c":"Same but with deterministic service time — roughly half the wait.","cv (coefficient of variation)":"How variable service times are; 0 means every job takes exactly as long.","SLO":"The latency/reliability promise you must not trade away for cost.","p95 chunk delay":"The 1-in-20 worst delay for one audio chunk to arrive.","deadline miss":"A chunk arriving after the previous one finished playing — audible as a gap.","playout lead":"How much already-synthesised audio you hold ahead of what's playing.","the knee":"The point on the queueing curve where a small load rise causes a huge latency rise.","warm headroom":"Idle GPUs kept loaded and ready, instead of starting them when load spikes.","phrase cache":"Pre-rendered audio for repeated phrases, keyed and served from Redis.","TensorRT / ONNX export":"Converting a model to a faster serving format — it moves your RTF number.","busy-hour peak":"The worst hour of a normal day; the load you must actually size for.","d-vector":"2014 original: average a speaker classifier's hidden layer over frames","GE2E loss":"trains vector geometry directly: same-speaker clips close, other speakers far","centroid (leave-one-out)":"a speaker's average vector, with the clip being scored excluded from the average","statistics pooling":"collapse time by concatenating the mean and standard deviation of each feature","TDNN":"time-delay neural net: a 1-D convolution over audio frames","ECAPA-TDNN":"the current default speaker encoder; TDNN plus attention, margin loss, multi-scale features","attentive pooling":"weight frames by importance before averaging, instead of treating all frames equally","SE block":"squeeze-and-excite: lets the net re-weight its own feature channels","multi-layer aggregation":"feed several depths of the network into pooling, not just the top one","additive-margin / angular-margin softmax":"training loss that demands an extra angular gap between speakers, not just correct answers","PLDA":"an older statistical scoring backend bolted on top of embeddings; ECAPA makes it optional","LDA":"a linear projection that shrinks nuisance directions before scoring","length normalisation":"rescale every vector to length 1, so all scores are pure angles","cosine similarity":"the angle between two vectors; 1 is identical direction, 0 unrelated","tau (threshold)":"the cosine score above which you declare 'same person'","genuine vs impostor trials":"same-speaker pairs vs different-speaker pairs, the two score distributions you compare","EER":"the score threshold where false-accept rate equals false-reject rate","channel mismatch":"enrolling on one audio path and testing on another, so the path outranks the person","channel offset direction":"one shared shift every clip through the same codec gets pushed in","per-channel mean subtraction":"subtract each channel's average vector before scoring, cancelling that shared shift","off-distribution / interpolation":"blending two speaker vectors lands somewhere no real training speaker sat","HIPAA Safe Harbor":"the US list of 18 identifiers you must strip to call health data de-identified","BIPA":"Illinois-style biometric law: written consent before capturing a voiceprint","RTF":"real-time factor; below 1 means you generate faster than you play","cascade vs speech-to-speech":"separate ASR/LLM/TTS boxes vs one audio-in audio-out model","zero-shot cloning":"copying a voice at inference time from a clip, with no training on that speaker","fine-tuned cloning":"actually training the model on one speaker's recordings, once, ahead of time","prompting / in-context conditioning":"steering the model by what you put in its input, not by changing weights","neural codec":"a learned compressor turning audio into a small grid of integers and back","EnCodec":"Meta's neural audio codec; 24 kHz, 8 quantizers, 75 frames per second","residual quantizer / codebook":"stacked layers of integers: layer 1 is coarse, each later layer corrects the leftover error","KV cache":"stored attention state for the prompt; it grows, so later steps get slower","TTFA":"time to first audio - how long the caller waits before hearing anything","monotonic attention":"a hard rule that the model moves through the text once, forwards, never back","temperature":"randomness dial in sampling; low is flat and repetitive, high is varied and unstable","repetition-aware sampling":"VALL-E 2's fix: penalise repeating a token you just emitted","grouped code modelling":"predict several codec frames per step to shorten the sequential chain","disentanglement":"separating voice from room, mic and codec. Codec tokens do none of it","SV2TTS / YourTTS":"the earlier d-vector-conditioned cloning approach, with a 256-number bottleneck","Voicebox / flow matching":"a non-token alternative that clones by filling in masked audio","synthesiser WER":"run ASR over your own generated audio; word errors reveal repeats and drops","FCC 2024 TCPA ruling":"AI-generated voices in robocalls fall under the artificial-voice restrictions","HIPAA biometric identifier":"a voiceprint is PHI; a stored cloning prompt inherits a retention clock","LibriLight":"a 60,000-hour in-the-wild speech corpus; the scale zero-shot needs","reference encoder":"small net that squashes one reference clip into a single fixed-length vector","GST / global style tokens":"a bank of ~10 learned vectors; a style is a weighted blend of them","token bank":"the ten trainable vectors themselves; a learned palette, not chosen axes","attention query":"the reference vector is used to look up blend weights, not used directly","style embedding":"the weighted sum of the ten tokens; the vector that actually conditions synthesis","broadcast / tile onto encoder states":"the same style vector is glued onto every text position, so it colours the whole line","softmax":"turns raw scores into weights that are all positive and add to one","simplex / convex combination / convex hull":"the region of blends softmax can reach; positive weights summing to one","simplex-constrained inference":"keeping your hand-set sliders inside that region so the decoder stays in-distribution","out-of-distribution mel":"a spectrogram unlike anything in training; the vocoder turns it into buzz","entanglement":"one control secretly moving a second thing - here, style moving speaker identity","gradient reversal layer":"trains the style vector to be actively useless for guessing who is speaking","bottleneck":"deliberately too little capacity, forcing the model to drop detail it does not need","quantised tokens":"snap style to a small discrete set so it cannot smuggle identity through","speaker cosine":"angle between two speaker embeddings; the number that reveals identity drag","independent speaker encoder":"a different model than the one used for conditioning, so the check is honest","spectral tilt":"how fast energy falls off toward high frequencies; heard as bright vs dark","breathiness":"audible airflow in the voice; mostly high-frequency, mostly deleted by phone lines","fricative energy":"the hiss of s, f, sh sounds; lives above the phone passband","F0 contour":"the pitch line over the sentence; one of the few style cues that survives a phone line","AGC":"automatic gain control; the carrier flattening loud and quiet, killing the energy axis","mu-law companding":"8-bit telephone encoding that squashes dynamic range","audio watermark":"an inaudible signal added to output that a matched detector can recover","in-band":"hidden inside the 300-3400 Hz band the phone line actually carries","payload":"the handful of bits the mark encodes; a model or tenant id, nothing more","AudioSeal / SynthID / WavMark":"current learned watermarking systems: generator plus per-frame detector","correlation detector":"slides the known pattern along the audio and accumulates evidence","d' (d-prime)":"how many noise-widths apart the two hypotheses sit; higher is easier to detect","processing gain":"how much accumulating over a window helps: window x chip rate / payload bits","chip rate":"how many watermark symbols per second are spread through the audio","false-positive rate":"how often you claim a mark in unmarked audio; sets the decision threshold","PLC / concealment":"the receiver inventing audio to fill a lost packet - and that filler carries no watermark","resynthesising codec":"a codec that regenerates speech rather than coding the waveform; it destroys the mark","provenance vs detection":"proving your output is yours vs proving arbitrary audio is fake. Only the first works","adapter":"a small add-on module for one speaker, deletable without touching the base model","consent scope / term / revocation":"what the voice may be used for, for how long, and how it is withdrawn","provenance manifest":"per-utterance record of source, consent id, licence and date for training data","disclosure":"telling the caller the voice is synthetic and the call is recorded","pre-rendered":"synthesised at build time and played back, so it costs nothing per turn","deterministic branch":"an if-statement ahead of the LLM; a prompt instruction is not a control","Safe Harbor":"HIPAA's list of identifiers you must remove; voice prints are on it","deletion fan-out":"a delete that also reaches embeddings, ASR caches, prompt logs and backups","append-only event log":"consent and disclosure events written where they cannot be quietly edited","MOS (Mean Opinion Score)":"Average of listeners' 1-to-5 naturalness ratings of individual audio clips.","ACR (Absolute Category Rating)":"Rate one clip alone on 1-5, no comparison clip shown.","CMOS (Comparative MOS)":"Average of paired judgements: how much better is B than A.","CCR (Comparison Category Rating)":"The -3..+3 scale used to produce CMOS scores.","ITU-T P.800":"The international standard that defines the ACR and CCR listening-test procedures.","P.808":"Standard making crowdsourced listening tests defensible via headphone checks and trap questions.","P.805":"Standard for rating whole-conversation quality, not single clips.","MUSHRA (ITU-R BS.1534)":"0-100 rating test with a hidden perfect reference and a deliberately bad anchor.","subjective evaluation":"Humans listen and score; the ground truth for naturalness.","objective evaluation":"A computed number stands in for human judgement; fast but a proxy.","ordinal scale":"Ranked categories where the gaps between numbers are not equal.","anchor / range effect":"Listeners rescale to whatever best and worst clips you show them.","blind test":"Raters don't know which system produced which clip.","paired / within-listener design":"Same person rates both systems, cancelling their personal rating offset.","between-listener design":"Different people rate each system; their offsets never cancel.","power (80%)":"Chance your test detects a real difference of the size you care about.","alpha = 0.05":"Accepted 5% chance of calling a difference real when it isn't.","ICC (intra-class correlation)":"Share of rating variance explained by which listener gave the rating.","design effect (Kish)":"Multiplier saying how much clustering inflates your true sample-size need.","Type M error":"Underpowered test that clears significance reports an exaggerated effect size.","Type S error":"Underpowered significant result points in the wrong direction entirely.","mu-law / 8 kHz leg":"The compressed narrowband audio format phone networks actually carry.","BAA (Business Associate Agreement)":"HIPAA contract letting a vendor legally touch patient data.","consented scripted corpus":"Actors reading approved scripts, safe to send outside the compliance boundary.","objective metric":"A number a machine computes as a stand-in for a human listener's judgement.","MCD (mel-cepstral distortion)":"Decibel distance between synthetic and reference speech spectra.","mel-cepstral coefficients":"A compact numeric summary of the shape of a speech spectrum.","c0":"The first cepstral coefficient - it encodes loudness, so it's dropped.","DTW (dynamic time warping)":"Stretching two recordings onto a shared timeline so frames correspond.","WER (word error rate)":"Share of words a recogniser gets wrong versus the intended text.","delta-WER":"Your WER minus the same recogniser's WER on human reads of the same prompts.","ASR floor":"The recogniser's own irreducible error on human speech; your baseline.","speaker cosine similarity":"Angle between two voiceprint vectors; higher means more like the same speaker.","x-vector / ECAPA-TDNN":"Neural models that turn a voice clip into a fixed voiceprint vector.","enrolment clip":"The reference recording of the real speaker you compare a clone against.","EER (equal error rate)":"Threshold where false accepts and false rejects are equally frequent.","conditional mean / pointwise loss":"Training that pushes output to the average of all correct answers.","hedging":"Model plays it safe near the average, winning MCD while sounding lifeless.","NAR (non-autoregressive)":"Generates all frames in parallel; fast, but prone to over-smoothing.","insertions":"Words the recogniser invents; Whisper does this over silence.","UTMOS / NISQA / DNSMOS":"Neural models that predict a listening score directly from audio.","learned MOS predictor":"Regressor fitted to past listening tests; ranks systems, doesn't certify them.","system-level vs utterance-level agreement":"These predictors rank whole systems well but individual clips poorly.","golden set":"Fixed, version-controlled prompts and reference audio the suite always runs.","Goodhart's Law":"A measure optimised as a target stops being a good measure.","correlation monitoring":"Periodically re-checking that your proxy still tracks real listener scores.","Parquet / MLflow / GitHub Actions":"Versioned data format, experiment tracker, and CI runner used to wire this up.","rtf_eff":"RTF after batching - what a stream actually costs when shared with others.","p95 batch-1 RTF":"The slow-tail single-stream RTF; size on this, not the average.","marginal cost":"Cost of one more unit assuming the hardware is already there and idle.","fully-loaded / all-in cost":"Everything you actually pay: rented hardware plus salaries plus overhead.","engineering carry":"Ongoing human cost of owning a self-hosted stack - the line spreadsheets omit.","crossover volume":"Monthly call volume where self-hosting becomes cheaper than a vendor.","build-versus-buy":"Run it yourself or pay a vendor per character.","peak concurrency":"Most simultaneous synthesis streams at the busiest moment; what sizes the fleet.","peak-to-mean ratio":"How much spikier the busy hour is than the monthly average.","N+1 spare":"One extra card so a single failure doesn't drop calls.","target utilisation (u = 0.70)":"Deliberate headroom cap; above it, queueing eats your latency budget.","integer wall / ceil":"You buy whole GPUs, so efficiency gains only pay when they remove a card.","batching / batch scalin ction":"Summing floats in a different order gives slightly different results.","bit-stable":"Byte-identical output across runs; broken by driver, kernel or batch-size changes.","flake":"A test that fails on noise, not on a real change.","flake budget":"How often you tolerate false failures before people disable the suite.","attribution ladder":"Swapping one stage per rung so each new failure names its cause.","full factorial":"Testing every combination of versions; 8 runs for 3 stages.","common random numbers":"Same seeds and same audio across runs so only the swap differs.","interaction effect":"A bug appearing only for a specific pairing of versions; ladders miss these.","model digest":"A content hash pinning exactly which model weights a run used.","baseline variance":"Natural spread of a metric on unchanged code; the source of your thresholds.","set-level p95":"Gating the 95th percentile across the whole suite instead of every call.","standard error / sqrt(N)":"Uncertainty of an average; shrinks with the square root of repeats.","de-identification":"Stripping identifying details so a recording can be kept as a fixture.","run artifacts":"Transcripts, prompts and tool arguments a test run writes - also PHI.","retention clock":"Enforced deletion deadline on stored sensitive data.","canary / production paging":"Same metrics exported to Prometheus/Grafana so live drift pages you.","VITS":"The end-to-end model this page recommends: phonemes straight to audio, no spectrogram in the middle.","HiFi-GAN":"The vocoder that turns a spectrogram into a sound wave in one parallel pass.","FastSpeech 2":"A non-autoregressive model that predicts duration, pitch and energy explicitly.","WaveNet":"The original neural vocoder — one audio sample at a time, far too slow to serve.","MFA":"Montreal Forced Aligner — an offline job that marks when each sound starts in a recording.","Silero":"A small neural model that decides which audio frames contain speech.","Erlang-C":"Queueing math fo ary","ttl":"TTL","regression suite":"regression suite","golden set / golden call set":"golden set / golden call set","golden call set":"golden set / golden call set","fixture":"fixture","the loop":"the loop","ingress":"ingress","real-time pacing (50 pps)":"real-time pacing (50 pps)","real-time pacing":"real-time pacing (50 pps)","50 pps":"real-time pacing (50 pps)","fast lane / text-in-text-out lane":"fast lane / text-in-text-out lane","fast lane":"fast lane / text-in-text-out lane","text-in-text-out lane":"fast lane / text-in-text-out lane","endpointing hangover":"endpointing hangover","trailing audio":"trailing audio","ttfa / first-audio latency":"TTFA / first-audio latency","first-audio latency":"TTFA / first-audio latency","asr partials vs final":"ASR partials vs final","entity assertion":"entity assertion","tool call":"tool call","byte-diff / waveform equality":"byte-diff / waveform equality","byte-diff":"byte-diff / waveform equality","waveform equality":"byte-diff / waveform equality","non-associative float reduction":"non-associative float reduction","bit-stable":"bit-stable","flake":"flake","flake budget":"flake budget","attribution ladder":"attribution ladder","full factorial":"full factorial","common random numbers":"common random numbers","interaction effect":"interaction effect","model digest":"model digest","baseline variance":"baseline variance","set-level p95":"set-level p95","standard error / sqrt(n)":"standard error / sqrt(N)","standard error":"standard error / sqrt(N)","sqrt(n)":"standard error / sqrt(N)","standard error / sqrt":"standard error / sqrt(N)","de-identification":"de-identification","run artifacts":"run artifacts","retention clock":"retention clock","canary / production paging":"canary / production paging","production paging":"canary / production paging","vits":"VITS","hifi-gan":"HiFi-GAN","fastspeech 2":"FastSpeech 2","wavenet":"WaveNet","silero":"Silero","erlang-c":"Erlang-C","mel":"mel"},"numbers":[{"id":"01","value":"fs/2 (Nyquist)","means":"Half the sample rate is the highest pitch that can be stored. 8 kHz PSTN gives a 4 kHz ceiling, 16 kHz ASR gives 8 kHz, 24 kHz TTS gives 12 kHz. Everything else follows from this one line."},{"id":"01","value":"16 kHz","means":"ASR convention. Vowel-defining formants sit below ~3.5 kHz and fricative energy runs past 8 kHz but is still classifiable from its lower reaches, so an 8 kHz ceiling is enough for a recognizer. The convention hardened because Whisper and wav2vec 2.0 use it."},{"id":"01","value":"24 kHz (or 22.05 kHz)","means":"TTS convention. A 11-12 kHz ceiling, enough for /s/ to actually sound like /s/ to a human listener rather than a lisp."},{"id":"01","value":"6.02N + 1.76 dB","means":"Signal-to-noise you get from N bits of uniform quantisation. 16-bit buys ~98 dB, 8-bit only ~50 dB, and that 50 dB is measured at full volume, so a caller speaking 30 dB down has just 20 dB left and sounds gritty."},{"id":"01","value":"~38 dB","means":"What G.711 mu-law achieves instead (roughly 6.02N - 10 dB) but holds roughly CONSTANT across loud and quiet talkers, which is the right trade for a phone line."},{"id":"01","value":"32,000 B/s = 256 kbit/s","means":"Mono 16 kHz 16-bit PCM. Cheap for one caller, not cheap when shipping 500 concurrent legs to a GPU box."},{"id":"01","value":"160 / 320 / 480 samples","means":"How many samples land in one 20 ms RTP packet at 8 / 16 / 24 kHz. The 8 kHz case being exactly 160 BYTES under G.711's one-byte-per-sample companding is why the standard phone packet is that size."},{"id":"01","value":"fold(10000, 8000) = 2000 Hz","means":"A concrete alias. A 10 kHz component sampled at 8 kHz does not fade, it lands at 2 kHz at full amplitude in the middle of the vowel band."},{"id":"01","value":"~2 ms","means":"Group delay of a 64-tap polyphase FIR resampler at 16 kHz (about half its length, ~32 samples). Three conversions in a cascade cost a few ms of the ~800 ms turn budget, spent before any model runs."},{"id":"01","value":"32768","means":"The divisor that turns 16-bit signed WAV integers into the -1.0..1.0 floats models expect. If two stages both divide, your audio is 90 dB down and reads as silence."},{"id":"01","value":"3 conversions","means":"A cascade voice agent is a rate-conversion pipeline whether you designed it or not: 8 kHz off the PSTN, up to 16 kHz for ASR, down from 24 kHz after TTS. Three chances to fold energy into the wrong band."},{"id":"02","value":"Δf ≈ fs/win_length, Δt ≈ win_length/fs, Δf·Δt ≈ 1","means":"The unavoidable trade. Frequency sharpness and time sharpness multiply to a constant, so you cannot shrink both. This is mathematics, not an implementation limit."},{"id":"02","value":"fs/n_fft (bin spacing) vs fs/win_length (resolution)","means":"Two different things people confuse. Zero-padding to a bigger FFT packs the bins closer and makes the plot look smoother; it INTERPOLATES, it does not resolve. Only a longer window actually separates two nearby tones."},{"id":"02","value":"25 ms window","means":"At a 118 Hz F0 one pitch period is 8.5 ms, so 25 ms spans about three of them; enough to see individual harmonics as horizontal stripes."},{"id":"02","value":"5 ms window","means":"Shorter than one pitch period. Harmonics smear into broad formant bands, but each individual glottal pulse shows as a vertical stripe. Wideband: good for formant tracking."},{"id":"02","value":"20-50 ms","means":"Where ASR and TTS front ends deliberately sit, between the narrowband and wideband extremes."},{"id":"02","value":"10 ms hop = 100 fps","means":"Whisper. fs/hop is the frame rate EVERY downstream tensor inherits: duration predictor units, vocoder upsampling factor, forced-aligner resolution."},{"id":"02","value":"3000 frames","means":"A 30-second Whisper window: 480000 samples / 160 hop. Exact, and a useful sanity check."},{"id":"02","value":"hop 256 at 22.05 kHz = 11.61 ms = 86.13 fps","means":"Tacotron 2 on LJSpeech. A decoder emitting 24 mel frames has produced 279 ms of audio. Get this constant wrong and every duration in the dataset is scaled."},{"id":"02","value":"513 -> 80","means":"A 1024-point FFT gives n_fft/2+1 = 513 non-redundant magnitude bins, 21.5 Hz apart at 22.05 kHz. That is far more resolution than the ear has above 1 kHz and highly correlated, wasting model capacity. 80 mel bins carry the same perceptual content."},{"id":"02","value":"m = 2595·log10(1 + f/700)","means":"The HTK mel formula. librosa gives it with htk=True; the DEFAULT htk=False is the different Slaney form (linear at 200/3 Hz per mel below 1 kHz). They place filter centres differently, so mel computed one way is not the mel another model trained on."},{"id":"02","value":"2/(hi - lo)","means":"Slaney normalisation: scales each triangle so filters have equal AREA rather than equal peak. Changes the numeric range your model sees, so it must match between acoustic model and vocoder."},{"id":"02","value":"log(1e-5) = -11.5","means":"What an EMPTY mel filter emits forever. If a low-frequency triangle is narrower than the FFT bin spacing it contains no bin at all and outputs this constant."},{"id":"02","value":"18 of 80 (plus 2 straddling)","means":"How many mel triangles sit entirely above 4 kHz when a bank built for fmax=8000 is applied to an 8 kHz phone leg. About a fifth of the representation wasted, NOT half: 4-8 kHz is half the linear axis but only 24% of the compressive mel axis."},{"id":"02","value":"25 ms buffering latency","means":"To emit the frame covering the first 25 ms you need all 25 ms, so a streaming front end buffers one window (12.5 ms of lookahead relative to frame centre). Under 4% of an 800 ms budget."},{"id":"02","value":"8x to 28x","means":"How much more expensive endpointing hangover (200-700 ms) is than STFT buffering latency. Roughly an order of magnitude. This is where the latency budget actually goes, so do not optimise the front end."},{"id":"02","value":"32 kB/s","means":"80 mel bins x 100 fps x float32. Bit for bit the SAME rate as 16-bit PCM at 16 kHz, which is why 'we only keep features, not audio' is not a de-identification control."},{"id":"03","value":"300-3400 Hz","means":"The actual PSTN passband (ITU-T G.712), tighter than its own 4 kHz Nyquist. THIS is the number that matters, not 8 kHz."},{"id":"03","value":"64 kbit/s","means":"8 kHz x 8 bits, each direction. The unit the entire phone network is built around."},{"id":"03","value":"~38 dB","means":"mu-law's signal-to-quantisation-noise, held roughly FLAT across a wide range of talker levels. Linear 8-bit PCM collapses on quiet speech; mu-law does not."},{"id":"03","value":"13-14 linear bits","means":"What 8 companded bits are worth in dynamic range. mu-law buys flat SNR, not more bits."},{"id":"03","value":"/s/: 4-10 kHz","means":"Where the s sound puts its energy, higher for female and child talkers. Entirely above the phone passband, so it is simply deleted."},{"id":"03","value":"/sh/: 2-4 kHz","means":"Peaks lower, so it partly survives the passband. This is why sh is still recognisable on a phone but s, f and th are not."},{"id":"03","value":"F0 85-180 Hz (male) / 165-255 Hz (female)","means":"The fundamental is frequently BELOW the 300 Hz passband floor and never transmitted. Intonation survives anyway via harmonic spacing (missing-fundamental effect)."},{"id":"03","value":"|6000 - 8000| = 2000 Hz","means":"Where a 6 kHz sibilant lands if you decimate 24->8 kHz without filtering: straight into vowel space, audible as a metallic whistle on every /s/. Gets WORSE as your vocoder gets better, because a better vocoder puts more real energy up there to fold down."},{"id":"03","value":"160 B payload, 200 B on the wire","means":"One 20 ms G.711 packet is 160 samples = 160 bytes, plus 12 B RTP + 8 B UDP + 20 B IPv4. 50 packets/second = 80 kbit/s of wire for 64 kbit/s of payload."},{"id":"03","value":"Opus 26.5 ms","means":"Opus's default algorithmic delay: a 20 ms frame plus 6.5 ms lookahead, versus roughly ZERO for G.711 which is memoryless. Both pay the same 20 ms packetisation, so the incremental cost of choosing Opus is really just the 6.5 ms lookahead."},{"id":"03","value":"24 kbit/s (Opus)","means":"About 2.7x less payload than G.711, plus wideband if both ends negotiate it. Roughly 7 ms of an 800 ms turn budget to halve bandwidth: usually the right trade."},{"id":"03","value":"\u003c=150 ms one-way","means":"ITU-T G.114's mouth-to-ear target. A tandem chain (Opus on the SIP leg transcoded to G.711 on the PSTN leg) pays BOTH codecs' impairment and BOTH packetisation delays."},{"id":"03","value":"\u003c40% in-band","means":"The page's threshold for calling a phone 'stripped'. For a fricative that means its identifying cue is gone entirely."},{"id":"04","value":"20 ms / 50 packets per second","means":"The RTP metronome. 160 samples of G.711 behind a 12-byte header carrying a sequence number and a media timestamp."},{"id":"04","value":"J += (|D| - J)/16","means":"RFC 3550's interarrival jitter estimator, where D = (Ri-Rj) - (Si-Sj) is the change in relative transit time versus the previous packet. The 1/16 gain is a ~16-packet time constant, so J tracks sustained congestion and ignores one stray packet."},{"id":"04","value":"exp(-B/sigma)","means":"Late-discard rate for a buffer of depth B when excess delay has an exponential tail of mean sigma. Crude model, but the tail SHAPE is right and it gives a closed form."},{"id":"04","value":"2.3 sigma","means":"What it costs to go from 1% late-loss to 0.1% (sigma·ln 10). At sigma = 12 ms that's another 28 ms, and buffers hold whole packets so you round up to a multiple of 20 ms."},{"id":"04","value":"120 ms (2 x 60 ms)","means":"You pay the buffer TWICE: the caller's inbound leg has one and your outbound TTS leg has another. 60 ms each side is 120 ms of an 800 ms turn budget. At sigma=12 ms with a 0.1% target it would be 100 ms per leg = 200 ms, 'usually too expensive; take 1%'."},{"id":"04","value":"\u003c=150 ms one-way","means":"G.114's mouth-to-ear target - what stops you from just buffering the problem away."},{"id":"04","value":"1% uniform loss -> one 40 ms hole every 200 s","means":"The independent-loss arithmetic: 50 pps x (0.01)^2 = 0.005 double-losses per second. This badly UNDER-predicts what a caller hears."},{"id":"04","value":"1% with mean burst 3 -> one 60 ms hole every 6 seconds","means":"The same headline metric under a Gilbert-Elliott burst model. Identical percentage, completely different call. A loss percentage without a burst-length distribution beside it is close to useless."},{"id":"04","value":"~60 ms","means":"Where concealment gives up. G.711 Appendix I repeats the estimated pitch period with progressive attenuation over 10 ms steps and mutes by about 60 ms, because repeating a pitch period longer than that is an obvious buzz. So the concealment budget is one to three packets."},{"id":"04","value":"+20 ms","means":"Cost of Opus in-band FEC: the decoder must wait for packet n+1 before giving up on n, which is one extra packet of buffer."},{"id":"04","value":"75 packets in ~60 ms","means":"What an unpaced 1.5-second TTS chunk looks like on the wire, followed by 1.4 seconds of silence. It tail-drops at the first bottleneck queue into exactly the long correlated gap concealment cannot cover."},{"id":"04","value":"target B ~= 5·J","means":"A reasonable adaptive-buffer sizing rule from the measured RFC 3550 jitter, giving about 0.7% late on an exponential tail."},{"id":"05","value":"600 ms","means":"A typical hangover — how much trailing silence the agent waits through before deciding the caller is finished. It's a default, not a recommendation; the page's whole argument is that you should measure it, not inherit it."},{"id":"05","value":"1280 ms","means":"The full turn budget it adds up to: 600 ms hangover + 100 ms ASR finalisation + 350 ms LLM time-to-first-token + 150 ms TTS time-to-first-audio + ~80 ms for both network legs. This is the number the caller actually experiences."},{"id":"05","value":"47%","means":"Hangover's share of that 1280 ms. It is the single biggest line item in the response budget and by far the cheapest to change — no model retraining, just a constant."},{"id":"05","value":"930 ms","means":"Where the turn lands if you cut hangover from 600 ms to 250 ms. Shows how much latency is sitting in one dial."},{"id":"05","value":"~800 ms","means":"Roughly the pause length at which a caller stops assuming you're thinking and starts assuming the line is broken. This is the target the 1280 ms is being judged against — i.e. the default config is already too slow."},{"id":"05","value":"400-800 ms","means":"How long ordinary mid-sentence hesitations are when a human is reading an ID number off a card. This is the distribution hangover is cutting against, which is why you cannot just set it to 100 ms."},{"id":"05","value":"100-200 ms","means":"Minimum speech duration before the machine accepts that a turn has started — long enough to reject a cough or a DTMF keypad tone, short enough not to clip a real word. Reference code uses 140 ms."},{"id":"05","value":"15 s","means":"Max-utterance escape hatch. If the detector never goes quiet (hold music, clinic noise), the turn is force-committed here — which is also the worst-case dead air the caller suffers."},{"id":"05","value":"32 ms","means":"Silero's fixed chunk size — 512 samples at 16 kHz, 256 samples at 8 kHz. You cannot pick a different granularity; it is the model's input shape."},{"id":"05","value":"52 ms","means":"Real decision lag of the neural detector in the page's simulator, not 32 ms, because production endpointers majority-smooth over three frames to suppress single-frame flickers. Smoothing costs you time."},{"id":"05","value":"-25 dBFS vs -55 dBFS","means":"A vowel's loudness versus a quiet phone line's noise floor — the ~30 dB gap that makes simple loudness thresholding work at all, and that a noisy clinic erases."},{"id":"05","value":"ZCR ~0.35 vs ~0.05","means":"Zero-crossing rate of an unvoiced /s/ versus a vowel. The 7x gap is what lets a cheap detector catch hissy consonants; broadband noise sits in the same range, which is why it breaks."},{"id":"05","value":"10/20/30 ms","means":"The only frame sizes WebRTC's classic GMM VAD accepts, across 8-48 kHz, with four 'aggressiveness' presets. It's the free baseline you should beat, not ship."},{"id":"05","value":"4000 ms","means":"Default assumed cost of one repaired cut-off in the tuning sweep — the caller re-explains, the agent re-asks. It is seconds, not milliseconds, which is the entire reason the optimum hangover sits slow of where a latency dashboard would put it."},{"id":"06","value":"30 ms of a ~150 ms budget","means":"A part-of-speech tagger sitting in front of everything spends a fifth of the entire time-to-first-audio target before a single frame of audio exists. The compute is small; the position in the chain is what costs you."},{"id":"06","value":"2001 (Sproat et al.)","means":"The paper that introduced the classify-then-verbalize framing and the semiotic-class taxonomy still used today."},{"id":"06","value":"2016 (Sproat & Jaitly)","means":"The result that pure neural sequence-to-sequence normalizers make rare but unrecoverable errors — reading one quantity as a different quantity. This single finding is why the recommended design keeps grammars in the write-out path."},{"id":"07","value":"~134,000","means":"Entries in CMUdict. Enough to cover the general-English body of a call at a high hit rate; the tail it misses is precisely the proper nouns that matter."},{"id":"07","value":"39 phones","means":"Size of the ARPAbet sound inventory CMUdict uses — the entire alphabet your acoustic model's input embedding is built over."},{"id":"07","value":"stress digits 0/1/2","means":"Every vowel in CMUdict carries a stress marker: 0 unstressed, 1 primary, 2 secondary. It is not decoration — the digit changes which actual sound the symbol means."},{"id":"07","value":"~1 microsecond","m
