problem the phone line did not cause. Fourth: an F0 track is speaker-characterising. Pitch statistics plus a transcript are a re-identification handle, so contours get the retention and access path of the recorded call, not the metrics store.","interviewLine":"\"Prosody is three tensors on the mel frame grid — log-F0, per-phone duration, per-frame energy — and I want them predicted explicitly, the FastSpeech 2 variance-adaptor way, because that gives me a speaking-rate knob, an expressiveness knob and per-word emphasis at serve time. VITS or Tacotron generate the same prosody inside a latent or an attention matrix, where I can't reach it. The failure mode is collapse to a central reading: text-to-prosody is one-to-many, and a deterministic regression head gives you one statistic of that distribution — the conditional mean under L2, the median under L1 — so a rise/fall target lands in the middle and you ship a speaking clock. On a phone line that's a turn-taking bug: callers key off the terminal fall and final lengthening to know you've finished, so a flat contour gets you barged in on mid-sentence. And intonation actually survives narrowband — a 110 Hz fundamental is below the 300 Hz passband edge, but the harmonics are spaced by F0 and the ear reconstructs the missing fundamental. The fix is stochastic duration prediction, or a flow or diffusion prosody head, so you sample a reading instead of averaging them.\"","numbers":[{"value":"85-180 Hz / 165-255 Hz","means":"Typical adult pitch ranges for men and women. Why models normalise pitch per-speaker: the same 'high note' is a different Hz value for each person."},{"value":"11.61 ms","means":"One frame at 22.05 kHz with a 256-sample hop (1000*256/22050). This is the clock everything downstream ticks on."},{"value":"~10 frames","means":"How many frames a 120 ms vowel occupies on that grid — the granularity the duration predictor is actually working at."},{"value":"alpha = 1.15","means":"The speaking-rate dial: divide predicted durations by alpha to speak 1.15x faster. A single serve-time scalar, no retraining."},{"value":"300-3400 Hz","means":"The phone line's passband. A 110 Hz fundamental is filtered out entirely by it — and yet the melody still survives (see next)."},{"value":"330, 440, 550 Hz","means":"The harmonics of a 110 Hz voice that DO fit inside the passband. They're spaced by exactly F0, so the ear reconstructs the 'missing fundamental'. Telephony costs you fricatives, not intonation."},{"value":"L-L% / H-H%","means":"ToBI notation for the two terminal contours: a statement falls to the bottom of the speaker's range, a yes/no question rises. This is the actual turn-yield cue."},{"value":"256 bins","means":"Pitch and energy are quantised into 256 buckets each and looked up in an embedding table, rather than used as raw continuous values."}],"archNote":""},{"id":"09","title":"Finding Out When Each Sound Was Spoken","stage":2,"oneLiner":"Given a recording and its transcript, marking exactly when each sound starts and ends.","problem":"You cannot train a duration predictor without knowing how long each sound actually took in the training audio, and recordings don't come with that. This is the labelling step that produces those numbers. It's also how you get word-level timestamps on a call recording — without which, redacting a spoken member ID means deleting the whole recording rather than muting six hundred milliseconds of it.","how":"Ordinary speech recognition searches every word sequence the language model allows — a huge branching lattice. Forced alignment searches exactly one: you already have the transcript, so the only unknown is timing. That collapses the search from a lattice to a single left-to-right chain of stepping stones, and the answer is just the best-scoring path along it. Concretely, each speech sound becomes a tiny three-step unit (onset, steady, offset), you string all the transcript's sounds together with silence at both ends and an optional pause between words, and then you walk forward through the audio frame by frame with only two legal moves at each step: stay on the current stone, or advance to the next one. Never go back. That 'never go back' isn't a penalty you tune — it's simply the only arcs that exist, so monotonicity is a property of the shape of the graph. Because each stone has only two possible predecessors, the whole search is cheap and linear. The word 'forced' is the important one: the transcript is not in question, so the aligner will always return an answer, whether or not the transcript matches the audio.","bestChoice":"Montreal Forced Aligner (MFA) — Kaldi underneath, a GMM-HMM triphone model trained on your own corpus with speaker-adapted features — plus a mandatory QA gate: threshold on mean per-frame log-likelihood of the winning path, flag duration outliers and phones pinned at the 30 ms floor, and independently cross-check by decoding the audio freely and scoring edit distance against the transcript you were handed. Anything failing either check goes to a review queue, not into training. Store the aligned corpus as Parquet alongside its score so filtering is a query, not a re-run.","whyBest":"MFA is the battle-tested default and, unlike CTC alignment, it isn't systematically biased late. The gate matters more than the aligner choice, because the aligner never fails loudly — the score is the only signal that a corpus has been poisoned, and it has to be checked before training, not after.","gotcha":"It always succeeds. That's the whole warning. Hand the aligner a transcript that doesn't match the audio and it returns the best path through the WRONG graph — silently, with plausible-looking boundaries and no exception. The specific mechanics matter because they tell you what to look for: if a word the caller actually said is MISSING from the transcript, those frames still have to be explained by something, and Viterbi hands them to whichever reachable state dislikes them least — which is the neighbouring VOICED sounds, not the closing silence, because a silence model emits near-zero energy in every band and is therefore the worst possible explanation for a vowel. So the trailing silence stays roughly its true length while one or two neighbouring vowels inflate to two or three times theirs. If a word that was never spoken is INSERTED, the reverse: its sounds pin at the 30 ms floor and squeeze the real ones. And the damage is not confined to the corrupted span — the path that best absorbs orphaned frames often starts diverging several sounds EARLIER, so boundaries in the correctly-transcribed part move too. Both cases quietly poison a duration predictor. Hence: gate on the score, not on the alignment. Second gotcha: CTC-based alignment (attractive because you already have the model and need no dictionary) is peaky — it spikes on a frame or two per sound with nothing in the objective pushing that spike toward the true onset, so boundaries run systematically LATE. Fine for displaying word timestamps, biased as duration labels. Third: the regridding arithmetic. Durations must be non-negative integers summing exactly to the mel frame count; round each one independently and the sum drifts and the length regulator builds a tensor of the wrong size. Round the cumulative boundaries and difference them — exact by construction. Fourth: align with a model trained on the band you serve; a 16 kHz aligner pointed at upsampled mu-law is a domain mismatch that surfaces only as a lower corpus mean score, not an obvious error.","interviewLine":"\"Forced alignment is decoding with the search space collapsed to one hypothesis. You already know the words, so you build a left-to-right HMM chain from the transcript — three states per phone, self-loop plus advance, no skips — and run Viterbi in the log domain. Monotonicity falls out of the topology rather than a penalty, each state has two predecessors so it's O(T*S), and the whole thing is offline: it's a dataset labelling job, not something in the call's latency budget. The thing I'd flag is that it is forced — it always returns an answer. Hand it a transcript missing a word and those frames get absorbed by the neighbouring voiced phones — a vowel next to the gap stretches to two or three times its real length, because a silence model is the last thing that would explain voiced audio — and the boundaries before the gap drift too. Hand it a word that wasn't spoken and those phones pin at the three-frame floor and squeeze the real ones. No exception, just quietly poisoned duration targets. So I gate on the mean per-frame log-likelihood of the winning path plus duration outliers, and cross-check with a free ASR decode's edit distance against the transcript. If I'm using CTC alignment because the model's already there, I'd also account for the peakiness — CTC boundaries run systematically late, which is fine for timestamps and not fine as duration labels.\"","numbers":[{"value":"3 states per phone","means":"The standard onset/steady/offset breakdown of each sound, with self-loops and no skip arcs."},{"value":"10 ms shift / 25 ms window","means":"The aligner's frame grid — the resolution at which boundaries can be placed."},{"value":"30 ms floor","means":"Three states at 10 ms each means nothing shorter than 30 ms is representable. A flapped /t/ (the fast 'd'-like t in 'butter') is genuinely shorter and simply cannot be expressed."},{"value":"48 states x 127 frames = ~6,100 cells","means":"The entire search for the phrase 'call the clinic back' (14 sounds + 2 silences, 1.27 s). The search grid is free — the acoustic model's forward pass is the whole cost."},{"value":"O(T*S) not O(T*S^2)","means":"Cost is linear in frames times states because each state has at most two predecessors, instead of the quadratic cost of a general HMM. This is what makes it cheap."},{"value":"2L+1","means":"Size of the CTC alignment graph: L target labels with a blank symbol interleaved around each one."},{"value":"10 ms -> 11.61 ms","means":"The aligner's grid versus the mel grid at 22.05 kHz with hop 256. Durations must be integers summing EXACTLY to the mel frame count, so you round cumulative boundaries and difference them — rounding each duration independently lets the sum drift."},{"value":"+/-30 ms","means":"Timestamp precision that's ample for redaction — enough to zero exactly the samples where a member ID was spoken without clipping neighbouring words."},{"value":"3.4 kHz","means":"Where the phone band ends. Fricative boundaries (/s/ vs /f/) are cued above it, so on an 8 kHz leg the aligner is guessing sibilant onsets to within a couple of frames."}],"archNote":""},{"id":"10","title":"Tacotron 2","stage":3,"oneLiner":"The first neural TTS that worked: reads text, paints speech one slice at a time.","problem":"Before it, text-to-speech was built from hand-engineered stages that each needed separate labelling and sounded stitched-together and robotic. Tacotron 2 replaced that with one trainable model that produced near-human quality (MOS 4.53 vs 4.58 for real recordings), but everything fragile about it comes from the fact that it produces speech strictly one frame at a time, in order, and decides for itself when to stop.","how":"Think of it as a reader and a painter joined by a moving finger. The reader (encoder) turns each letter or phoneme into a rich vector that knows its context - three convolution layers then a bidirectional LSTM, giving one 512-number vector per symbol. The painter (decoder) paints one 12.5-millisecond vertical stripe of a spectrogram at a time, and before each stripe it asks the attention mechanism: which part of the text am I on right now? That question is answered by comparing the painter's current state to every symbol AND by looking at a running tally of where the finger has already pointed - this location-sensitive part (the cumulative attention weights convolved with 32 filters of width 31) is what makes the finger slide smoothly left-to-right rather than jumping around. Each stripe is fed back in as input to the next one, through a small pre-net whose dropout is deliberately left switched on at inference so the painter cannot get hypnotised by its own output. Alongside every stripe the model also emits one number - the stop token - saying 'I think the sentence is over now'.","bestChoice":"Not the recommended production choice for telephony - it is the reference architecture you must understand, and its unbounded tail is the reason the page moves on to FastSpeech 2 / VITS.","whyBest":"It is sequential and unbounded: you cannot parallelise the frames, and if the stop token never fires you burn 1.5 s of GPU emitting 12.5 s of babble down the phone. Batching other calls raises throughput but never shortens this caller's utterance.","gotcha":"The whole tail risk sits in one scalar. If attention smears out, the decoder's state never looks like an ending, the stop token never fires, and generation runs to the step cap. What plays is not silence - it is babble, because a blurred attention makes the context an average of the whole sentence, producing a smeared drone that the vocoder renders faithfully as a buzzing hum. Alert on decoder-steps-per-character, not on mean latency, because the mean hides it. And cache fixed prompts on template ID, never on rendered text - audio reading back a caller's appointment time is PHI-derived and inherits its retention rules.","interviewLine":"Tacotron 2 is encoder, attention, autoregressive decoder... The part that actually does the work is location-sensitive attention - the cumulative alignment convolved with 32 width-31 filters is fed into the energy, so the model knows where it has already been. That's what makes the alignment come out diagonal. What I'd flag in production is that it's sequential and it's unbounded... if attention smears, the stop token never fires and you run to max_decoder_steps - 1000 steps is 12.5 seconds of babble down the phone. That unbounded tail is most of the reason people move to FastSpeech 2 for telephony.","numbers":[{"value":"MOS 4.53 vs 4.58","means":"Human listeners rated Tacotron 2 with a WaveNet vocoder 4.53 out of 5, against 4.58 for actual recorded human speech - statistically that is basically parity, which is why this paper mattered."},{"value":"12.5 ms hop","means":"Each spectrogram stripe covers 12.5 ms of audio, so one second of speech needs 80 sequential decoder steps. This single constant drives every latency number on the page."},{"value":"~180 ms for a 1.5 s reply","means":"120 sequential steps at an illustrative 1.5 ms per step. RTF about 0.12 - i.e. it takes about an eighth of real time to generate. This is compute, not wall-clock-to-first-sound."},{"value":"RTF ~0.12","means":"Real-time factor: generating 1 second of audio costs 0.12 seconds of GPU. Below 1.0 means you can keep up with a live call."},{"value":"post-net receptive field 21 frames (non-causal)","means":"The 5-layer smoothing network at the end looks 10 frames forward and 10 back, so frame 0 is not final until frame 10 exists. Ten extra decoder steps = ~15 ms of wall clock even though those frames represent 125 ms of audio - do not confuse audio duration with compute time."},{"value":"~37 ms time-to-first-audio","means":"11 decoder steps (17 ms) plus one vocoder chunk (~20 ms). This fits the ~170 ms the TTS stage actually gets inside an 800 ms turn; the 180 ms full-synthesis figure does not. That gap is the entire argument for streaming."},{"value":"max_decoder_steps = 1000","means":"The safety cap on how many stripes it may paint. At 12.5 ms each that is 12.5 seconds - so hitting the cap means the caller hears 12.5 seconds of drone. This is the default in NVIDIA's reference config."},{"value":"32 filters, width 31","means":"The convolution applied to the running tally of past attention. This is the specific mechanism that gives the model a memory of where it has been and makes alignment come out diagonal."},{"value":"dropout 0.5 kept on at inference","means":"Unusual: normally dropout is disabled at serving time. Here the noise is load-bearing - it stops the decoder from locking onto its own predictions and collapsing."},{"value":"300-3400 Hz PSTN passband","means":"A phone line only carries this frequency band. The mel spectrogram goes up to ~7.6 kHz, so most of the detail this model renders never reaches a phone caller - while its runaway-babble failure reaches them completely intact."}],"archNote":""},{"id":"11","title":"Attention Failure Modes","stage":3,"oneLiner":"Three famous speech bugs - skipped words, stutters, endless buzzing - are one broken picture.","problem":"An autoregressive TTS model can silently drop the word 'not' from 'do not take two tablets', or stutter 'ta-ta-take', or lose the plot entirely and emit twelve and a half seconds of buzzing drone that never terminates. On a healthcare call a dropped 'not' or a dropped digit in a dose readback is a clinical error, not a cosmetic artifact.","how":"Every step, the decoder produces a probability distribution over the text symbols - where am I reading. Stack those rows into a grid with time going down and text going across, and healthy speech draws a narrow line rising steadily from top-left to bottom-right, like a finger tracking a page. Every classic failure is a defect in that line, and you can name the bug from the picture before you ever listen to the audio: the line jumping forward several symbols means those phonemes were never spoken (a skipped word); the line dropping backwards means phonemes get re-spoken (a stutter); and the line dissolving into a uniform grey haze means the model is now attending to the entire sentence at once, so what it produces is the average of everything - a smeared drone. That last one is the dangerous one, because the reading position never reaches the end of the text, so the model never thinks it is finished, so the stop signal never fires and it runs until it hits the hard step cap. The reason all this is possible at all is that nothing in the maths forbids going backwards: moving forward is a habit learned from training data, not a rule, and habits break on inputs unlike anything seen in training - unusually long sentences, repeated words, long digit strings, un-expanded abbreviations.","bestChoice":"Detect online with focus rate plus argmax regressions and abort like a barge-in; fix by construction with Monotonic Alignment Search (VITS/Glow-TTS) or an explicit duration predictor (FastSpeech 2).","whyBest":"Detection costs one max over the text length per frame, which is free against a 12.5 ms frame budget, and lets you cut to a cached prompt before the caller hears twelve seconds of drone. The structural fixes delete the failure rather than making it rarer.","gotcha":"The honest one, which almost every summary gets wrong: forcing monotonicity does not fix alignment, it converts one failure into a cheaper one. A confused model with a monotonic window does not suddenly align correctly - a stutter becomes an over-long drawled phone, skipped phonemes get squeezed in rushed rather than dropped, and a collapse becomes a mumble that at least terminates instead of twelve seconds of buzz. Terminating and wrong beats unbounded and wrong on a call, but it is still wrong. The second trap: collapse produces a BUZZ, not silence, because a good vocoder like HiFi-GAN renders out-of-domain input faithfully. Callers hear a drone and read it as a dead line.","interviewLine":"All three classic failures are the same picture. Plot the attention matrix, decoder frames against encoder symbols: healthy synthesis is a narrow monotone ridge. A forward jump is a skipped word, a backward jump is a stutter, and rows flattening toward uniform are collapse... I'd catch it online rather than offline: focus rate, which is just the mean peak of each attention row, plus argmax regressions... Worth being honest, though: a monotonic window doesn't make a confused model align, it converts twelve seconds of babble into a mumble that terminates.","numbers":[{"value":"focus rate F = mean of the peak of each row","means":"How sharply the model is pointing. Near 1.0 means it is looking at one phoneme; falling toward 1/L means it is smeared across the whole sentence. From the FastSpeech paper."},{"value":"abort at focus \u003c 0.30","means":"A practical trip-wire: once the exponentially-smoothed focus rate drops under 0.3 the output is a drone, so cancel synthesis and play a cached prompt."},{"value":"abort at 3 backward jumps","means":"Three regressions of the reading position is a stutter, not noise. Trip and abort."},{"value":"budget = 1.6 x 7 x n_phonemes frames","means":"An overrun guard. About 7 frames per phoneme is normal, so 60% headroom above that means the stop token has failed. Trip and abort."},{"value":"~7 frames per phoneme, ~87 ms each","means":"At a 12.5 ms hop this is normal speaking rate, so 17 phonemes takes about 120 frames, 1.5 seconds. This is how you sanity-check whether a duration is plausible."},{"value":"guided attention g = 0.2","means":"The width parameter of the training-time penalty that pays the model to stay near the diagonal (DC-TTS, Tachibana 2018). Weight = 1 - exp(-(t/T - s/L)^2 / 2g^2)."},{"value":"1000 steps = 12.5 s of buzz","means":"The cost of a collapse: about ten times the GPU-seconds the utterance was budgeted, and the caller hears all of it."}],"archNote":""},{"id":"12","title":"FastSpeech 2","stage":3,"oneLiner":"Decide how long each sound lasts up front, then paint the whole spectrogram at once.","problem":"Autoregressive TTS is sequential (one forward pass per 12 ms of audio) and its runtime is unbounded, so a single stop-token failure hands the caller ten seconds of babble and stalls every other call sharing the GPU batch. You cannot plan capacity or promise a latency for a system whose per-request work is unknown until it finishes.","how":"Instead of letting the model figure out on the fly when to move to the next sound, you decide the timing before you start. An encoder turns each phoneme into a hidden vector, then a duration predictor says 'this /s/ gets 9 frames, this /a/ gets 14', and a length regulator literally copies each phoneme's vector that many times - a repeat, not a search. Now you know exactly how many spectrogram frames you are producing before you produce any of them, so a decoder can compute all of them simultaneously in one pass instead of one pass per frame. Because the mechanism is copy-and-repeat, skipping and stuttering are not made less likely - they are unrepresentable, since a repeat cannot move backwards and the length is fixed. The catch is that timing is only one part of prosody, so a variance adaptor also predicts pitch and energy - crucially AFTER the copying, so there is one pitch and one loudness control value for every individual frame rather than one per phoneme (that per-frame detail is what separates FastSpeech 2 from FastPitch). Where do the true durations come from at training time? Version 1 read them off a trained autoregressive teacher's attention; version 2 dropped the teacher entirely and takes them from a forced aligner (Montreal Forced Aligner) while training against real spectrograms - which is the single biggest quality change between the two versions, and also means your rhythm is now only as good as your aligner.","bestChoice":"FastSpeech 2 with MFA durations and a variance adaptor (duration + frame-level pitch + energy), durations clamped to a 1-frame minimum.","whyBest":"Synthesis time becomes a deterministic function of text length, so the synthesiser contributes no tail to an 800 ms turn budget and batching is trivial because every item does identical work. You pay for it in flattened prosody.","gotcha":"It does not babble - it gets the rhythm wrong, and it does so quietly. Under-predict a vowel and it clips and sounds rushed; over-predict it and it drawls. The sharp edge is rounding: round(d x alpha) on a short consonant can land on zero, which silently DELETES a phone, so 'sixty' becomes 'sixy' with no error thrown - check your code clamps to one frame before you ship a speaking-rate control. And aligner errors show up the same quiet way: a mis-segmented silence inflates one phone's training target and the model learns to drawl in that context forever. The failure modes did not disappear, they moved upstream into your labels.","interviewLine":"FastSpeech 2 takes the alignment decision out of the decoder... Skipping, stuttering and running to max_decoder_steps aren't mitigated, they're unrepresentable, because a repeat-interleave can't move backwards. What you pay for it is prosody... On a phone line I'd take that trade for the p99 - synthesis time becomes a deterministic function of text length... The two things I'd actually check in code are that durations are clamped to at least one frame, because rounding to zero silently deletes a phone, and that the aligner is good, because its errors are now your rhythm.","numbers":[{"value":"11.61 ms per frame","means":"At 22.05 kHz with a 256-sample hop. One second of audio is 86.1 frames. Note this differs from Tacotron 2's 12.5 ms - do not mix the two constants."},{"value":"1 parallel pass vs T serial passes","means":"The entire architectural argument. An AR decoder pays one forward pass per frame; FastSpeech 2 pays one pass total, regardless of length."},{"value":"~270x faster mel, 38x end-to-end","means":"FastSpeech 1's reported speedup against Transformer TTS - their batch size, their hardware, not a guarantee at yours."},{"value":"256 quantisation bins","means":"Pitch and energy are each bucketed into 256 levels, embedded, and added to the frame. Discretising them makes them learnable as embeddings rather than raw numbers."},{"value":"clamp(d, min=1)","means":"The one-line fix for the sharpest bug in the architecture. round(0.4) is 0, which silently deletes a phone - 'sixty' loses its /t/ and becomes 'sixy'."},{"value":"4 FFT blocks encoder + 4 decoder","means":"Feed-forward Transformer blocks: self-attention with a 1-D convolution in place of the usual position-wise feed-forward layer."},{"value":"MSE in the log domain","means":"Durations are regressed as log d, so the mean-squared-error loss learns the conditional mean of log d - a geometric mean in frames. That pulls the long tail in, and is a specific reason synthetic rhythm sounds tidier than human rhythm."}],"archNote":""},{"id":"13","title":"Autoregressive vs Non-Autoregressive TTS","stage":3,"oneLiner":"One model waits for its own last answer; the other computes everything at once.","problem":"Pick the wrong family for your workload and you either blow the latency budget on every long reply, or you accept a rare failure that hands a caller ten seconds of babble and stalls every other call in the same GPU batch. The mistake people make in interviews is optimising total synthesis time, which is not what the caller experiences.","how":"Both families do the identical job - phonemes in, an 80-band spectrogram out, same vocoder afterwards - and are separated by exactly one dependency edge. Autoregressive means frame t is computed from the frames already produced, so T frames cost T forward passes in strict order, and worse, you do not know what T is until the model decides to stop. Non-autoregressive predicts a duration per phoneme first, so T is known before decoding, and every frame is computed simultaneously in one pass. Now here is the twist that decides real systems: total time favours NAR by a rout (a 5-second reply is 431 frames, about 647 ms of serial decoding versus roughly 26 ms for one parallel pass), but total time is the wrong metric. The caller hears the FIRST sound, and an autoregressive decoder can hand its first 30 frames to the vocoder while it is still working on frame 200 - so its time-to-first-audio is about 47 ms and stays flat no matter how long the reply is. The parallel decoder cannot do that, because its self-attention looks across the whole frame sequence, so nothing is final until the pass ends and its first-audio time GROWS with reply length. Short turn, the single pass wins both numbers; long read-out, the flat autoregressive line crosses under it, unless you chop the text at clause boundaries and stitch the pieces.","bestChoice":"Non-autoregressive for telephony; hybrid (or streamed AR) for long-form read-outs. Chunk at clause boundaries either way.","whyBest":"The naturalness gap has largely closed thanks to stochastic duration predictors and flow/diffusion decoders, while the tail-latency gap is structural and has not narrowed at all. Uniform, known work per item turns capacity planning from queueing theory into arithmetic.","gotcha":"The two traps are symmetric. Optimising total synthesis time makes NAR look like a rout and hides the fact that a streaming AR model reaches the caller's ear faster on long text. And claiming NAR is 'more natural' gets the direction of the trade backwards - it is faster and far more predictable, NOT more natural, because MSE-trained duration and pitch predictors return the conditional mean of many valid readings. Interviewers check exactly this direction. Second trap: 'AR is riskier' is true but must be quantified - a 0.5% failure rate does not move p99, it moves p99.5, and its real damage is that under dynamic batching one runaway stalls every call sharing the batch.","interviewLine":"They differ by one dependency edge... But total time isn't what the caller hears. Autoregressive can stream its first chunk to the vocoder while it's still decoding, so its time-to-first-audio is flat in utterance length - about 50 ms - whereas a non-causal parallel decoder has to finish before anything is final... What actually decides it for me on telephony is the tail: the stop token is a prediction, and when it fails you run to max_decoder_steps and hand the caller ten seconds of babble, and in a batch that one runaway stalls every call sharing it. So I'd say non-autoregressive is faster and far more predictable, not more natural.","numbers":[{"value":"431 frames for a 5 s reply","means":"At 22.05 kHz / 256-sample hop, 86.13 frames per audio second. This is the unit of work both families are measured in."},{"value":"647 ms AR total vs ~26 ms NAR total","means":"431 sequential steps at 1.5 ms each, versus one parallel pass. A rout - and the wrong number to decide on."},{"value":"AR first-audio ~47 ms, FLAT in length","means":"30 frames decoded (45 ms) plus vocoding them (2 ms). Because it streams, this figure does not grow with reply length - the key advantage of AR."},{"value":"NAR first-audio \u003c30 ms at 5 s, 93 ms at 12 s","means":"It grows with T because nothing is final until the whole pass ends. Chunking at clauses flattens this, at the cost of audible seams."},{"value":"~100 ms left for TTS in an 800 ms turn","means":"Endpoint hangover ~250 ms + ASR finalisation ~80 ms + LLM time-to-first-token ~280 ms + egress/jitter ~90 ms = about 700 ms gone before the synthesiser emits a sample."},{"value":"HiFi-GAN V1: 3.7 MHz on V100 = 167.9x real time","means":"0.069 ms per frame. Vocoding is common to both families and effectively free - about 30 ms for a five-second reply either way - so it is never the thing to optimise here."},{"value":"0.5% stop-token failure hits p99.5, not p99","means":"Be precise about percentiles in interviews: a 0.5% failure rate corrupts the worst 0.5% of turns, leaving p99 clean. You need about 1% before p99 moves at all."},{"value":"1000 max_decoder_steps = 1.5 s GPU, 11.6 s babble","means":"The cost of one runaway. Under dynamic batching it is worse than one bad call: the batch keeps stepping until its longest member terminates, so one runaway stalls every call sharing it."},{"value":"reduction factor r","means":"Emitting r frames per AR step divides the step count - Tacotron 1's cheapest speed lever, dropped in Tacotron 2."}],"archNote":""},{"id":"14","title":"VITS (End-to-End TTS)","stage":3,"oneLiner":"One model, phonemes straight to audio - the spectrogram in the middle is gone.","problem":"Every earlier architecture has a seam: text goes in, a mel spectrogram comes out, and a separately-trained vocoder converts that spectrogram to sound. The vocoder was trained on real spectrograms but is served predicted ones, so at inference it meets a distribution it never saw - that mismatch is a leading source of buzz and hoarseness that no amount of tuning either half fixes.","how":"VITS deletes the handoff by making the whole thing one model trained once. At the centre is a latent - a compressed frame-rate description of the AUDIO, not of the text - one vector every 11.61 ms. During training a posterior encoder reads the real recording's linear spectrogram and produces that latent; a text encoder produces a guess at what that latent should look like from the phonemes alone; and training pushes those two together. A plain per-phoneme Gaussian guess is far too crude to match a waveform latent, so a normalizing flow - an invertible, reversible transformation - sits between them and reshapes the latent into something the simple text-side guess can actually match (built deliberately volume-preserving, so the usual awkward Jacobian correction term is exactly zero and the KL divergence collapses to two simple Gaussian log-densities). Alignment is not attention at all: Monotonic Alignment Search runs a dynamic program over the phoneme-by-frame grid and picks the single best forward-only path, re-estimated every training step against the model's own prior - so no external forced aligner is needed, and skipping/stuttering/babble are structurally impossible. Durations get sampled rather than predicted: a second flow models the DISTRIBUTION of plausible timings, so you draw noise, run the flow backwards, and get a different natural rhythm on every call. Finally the decoder that turns the latent into actual samples is literally the HiFi-GAN generator, trained adversarially against a multi-period discriminator on random 32-frame slices, because backpropagating through a whole utterance of waveform will not fit in memory. The mel spectrogram survives only as an L1 loss term - it is never an interface.","bestChoice":"VITS: conditional VAE + volume-preserving normalizing flow + MAS + stochastic duration flow + HiFi-GAN decoder, chunked at clause boundaries with cross-fade, exported narrowband via ONNX to Triton.","whyBest":"One model, one training run, no train/serve mismatch, no external aligner, and human-like rhythm variety instead of an averaged one. The bill is debuggability and GAN training dynamics on the critical path.","gotcha":"You are trading away the debugging seam, and that is a real trade, not a strict improvement. When the output buzzes there is no mel to inspect, no vocoder to swap, and no way to A/B one half - the fix is a retrain, not a component change. The failures split cleanly by half and NEITHER of them babbles: an undertrained adversarial half buzzes and smears in HiFi-GAN's voice (because the decoder IS HiFi-GAN); an undertrained prior or flow gives correct rhythm carrying mushy or wrong phones. Two more silent traps: MAS can latch onto a bad alignment during warm-up when the prior is still meaningless, and settle into a wrong segmentation that no later epoch dislodges; and because durations are sampled, two runs of the same prompt are not byte-comparable, so a golden regression test must assert on the ASR transcript plus the timing distribution, never on waveform bytes. Compliance: the posterior encoder trains directly on caller spectrograms, so PHI ends up distributed across one inseparable set of weights with no intermediate you can scrub.","interviewLine":"VITS collapses the acoustic model and the vocoder into one conditional VAE... The decoder is just HiFi-GAN, trained adversarially on 32-frame slices of the latent. The mel never leaves the model - it only shows up as an L1 reconstruction loss. The bit I'd actually flag is the duration predictor, because it's a flow, not a regressor... And what you're really trading away is the seam: when it buzzes, there's no mel to look at and no vocoder to swap, so debugging is a retrain. On telephony I'd still chunk it at clause boundaries - nothing streams out until the whole latent is decoded, so a four-second answer at RTF 0.05 is 200 ms of time-to-first-audio and that doesn't fit the ~100 ms a TTS stage gets in an 800 ms turn.","numbers":[{"value":"MOS 4.43 vs 4.46 ground truth","means":"On LJSpeech, with the paper's raters and test set. Essentially indistinguishable from real recordings in that setup - but it is their number, not a promise about your data or your voice."},{"value":"11.61 ms per latent frame","means":"22.05 kHz with a 256-sample hop. A 1.6 s utterance is about 139 latent frames."},{"value":"32-frame training slices (~372 ms)","means":"The decoder is trained on random short slices of the latent because a full utterance of waveform will not fit in GPU memory. The generator sees the whole sequence only at inference."},{"value":"log|det J| = 0","means":"The flow is built volume-preserving on purpose, so the change-of-variables correction vanishes and the KL divergence term reduces to two Gaussian log-densities. This is an engineering simplification, not an accident."},{"value":"upsample stack 8 x 8 x 2 x 2 = 256","means":"How the HiFi-GAN decoder blows one 11.61 ms latent frame up into 256 audio samples, giving 22,050 samples per second."},{"value":"2.76x wasted samples on a PSTN leg","means":"A 22.05 kHz decoder feeding an 8 kHz mu-law phone leg builds 2.76 times more samples than the caller can possibly hear. Export a narrowband decoder instead."},{"value":"RTF 0.05 (illustrative)","means":"Generating 1 s of audio takes 50 ms of GPU. At that rate a 4 s answer is 200 ms of time-to-first-audio and blows the ~100 ms TTS slice, while a 0.8 s clause is 40 ms and fits. Measure your own hardware."},{"value":"noise_scale_w = 0.8, noise_scale = 0.667","means":"Repo defaults. The first controls how much the RHYTHM varies between calls; the second controls latent/timbre spread. Turn them up too far and you get the signature artefact: one phone drawled several times too long."},{"value":"five loss terms","means":"L1 mel reconstruction, KL divergence, the duration variational bound, LSGAN adversarial and feature matching. One training loop, not two stages."}],"archNote":""},{"id":"15","title":"WaveNet and Autoregressive Audio","stage":3,"oneLiner":"The first model that drew speech one tiny audio measurement at a time.","problem":"Before WaveNet, turning a picture-of-sound back into actual audio meant hand-written signal-processing tricks that sounded buzzy and robotic. WaveNet proved a neural network could produce the raw pressure-wave numbers directly and sound like a real person — but if you actually serve it, it needs 16,000 strictly-in-order network passes for every single second of speech, so it physically cannot keep up with playback.","how":"Digital audio is just a long list of numbers — 16,000 per second, each one the speaker-cone position at that instant. WaveNet predicts the next number from all the previous ones, like autocomplete for sound. Two design choices make it work. First, instead of guessing a number it picks from 256 buckets, like a multiple-choice question, because at the moment a vocal fold snaps shut the next value is genuinely one of two things and a model forced to output a single average would split the difference and produce a click. Second, to see far enough back in time without a 3,000-layer network, each layer skips further than the last — layer one looks 1 step back, layer two 2 steps, then 4, 8, 16, up to 512 — so 30 layers can see about 190 ms of history, which a naive stack would need 3,000 layers to match. The arithmetic is trivial; what kills it is that step 16,001 cannot start until step 16,000 finishes, so you pay a scheduling delay 480,000 times per second of audio.","bestChoice":"Do not serve WaveNet as a vocoder. Keep it as a teaching model and as a building block: its residual block lives inside VITS (as the posterior encoder) and inside most neural codecs. Ship Parallel WaveNet (a distilled one-pass student) or, in practice today, HiFi-GAN.","whyBest":"The compute is cheap but the ordering is not: about 2.4 seconds of wall clock per second of audio just from launch latency, when you need to be well under 1.0 to keep up with playback. Feed-forward vocoders do the whole waveform in one shot and hit the budget with room to spare.","gotcha":"The naive implementation recomputes the whole dilated tree at every sample, and that cost grows exponentially with depth — you must cache a per-layer queue. Bigger trap: engineers profile GPU utilisation, see it near zero, and conclude the model is 'fast'. The bottleneck is the dependency chain, so exporting to ONNX/Triton or batching more calls will not move per-call latency at all. The audible failure is also sneaky: with weak conditioning the model babbles fluent non-language, and the crackle grows across the utterance rather than sitting at a constant level, so a short smoke test sounds fine.","interviewLine":"\"WaveNet models the waveform directly as a product of per-sample conditionals, with a 256-way softmax over mu-law bins rather than a regression — which matters because the next sample at a glottal closure is bimodal and an L2 head would average it into a click. The reason it isn't a production vocoder is one forward pass per sample — sixteen thousand strictly sequential passes per second of audio. The arithmetic is nothing, about 18 GMAC/s with cached queues; it's the serialisation that kills you.\"","numbers":[{"value":"16,000 forward passes per second of audio","means":"At 16 kHz you must run the whole network once per audio sample, strictly in order. At 24 kHz it is 24,000; on a phone line at 8 kHz it is 8,000 — narrowband halves the work for free."},{"value":"30 layers → 3,070 samples ≈ 192 ms of context","means":"How far back the model can see. A plain non-skipping stack would need 3,069 layers for the same reach — that is the whole point of the doubling trick."},{"value":"~1.1 M MACs per sample, ~18 GMAC/s","means":"The actual multiply-add arithmetic per second of audio. Trivial for any modern GPU — proof that raw math is not the bottleneck."},{"value":"480,000 ordered kernel launches per second of audio","means":"30 layers × 16,000 samples. At about 5 microseconds of launch and memory latency each, that alone is 2.4 s of wall clock per 1 s of audio."},{"value":"RTF 2.4 (naive), 0.32 (fused kernel)","means":"Real-time factor: seconds of compute per second of audio. Above 1.0 the model can never catch playback, no matter how long you wait. Fusing all 30 layers into one persistent kernel gets you under 1.0 but still nowhere near a feed-forward vocoder's ~0.02."},{"value":"4.46 MOS vs 4.55 MOS","means":"Listener quality score for natural speech squeezed into 8-bit mu-law versus full 16-bit. The phone network's quantisation costs roughly a tenth of a quality point on its own — cheap, but not free."}],"archNote":""},{"id":"16","title":"Griffin-Lim and Phase Reconstruction","stage":3,"oneLiner":"Guessing the missing half of a sound recording by bouncing between two rules.","problem":"A mel or magnitude spectrogram records how loud each frequency is at each moment but throws away when each frequency's wave crests — the timing offset. Without that timing, overlapping slices of audio do not line up when you add them back together, and speech comes out hollow, metallic and chorused, with a whoosh of noise arriving before every 't' and 'p'.","how":"Chop audio into overlapping slices and analyse each one, and you get two things per frequency: how strong it is (magnitude) and where in its cycle it is (phase). A spectrogram keeps only the strength. Griffin-Lim recovers the timing by ping-ponging between two facts it knows. Fact one: whatever the answer is, it must be the analysis of some genuine audio signal — you enforce this by converting back to audio and re-analysing it, which forces overlapping slices to agree. Fact two: the loudness values must equal the ones you were given — you enforce this by keeping whatever timing came out of step one but stamping the correct loudness back on top. Alternate those two forever. The 1984 proof says the error never gets worse; it emphatically does not say the error reaches zero, and for a spectrogram that a neural network predicted (rather than measured from real audio) there is usually no exact answer to reach, so it stalls at a compromise that depends on your random starting guess.","bestChoice":"Do not use it as your vocoder. Wire it in as the zero-dependency CPU fallback when the HiFi-GAN checkpoint fails to load, and as the blame-splitting diagnostic. Use Fast Griffin-Lim (momentum α = 0.99, the default in both librosa.griffinlim and torchaudio.transforms.GriffinLim), and alarm on fallback rate in Prometheus.","whyBest":"It needs no weights, no training data, no GPU, and is fully deterministic, so it is the one audio path that cannot break when a model server does. It is also the fastest way to assign blame: run it on the acoustic model's predicted mel and on a real recording's mel — if both sound equally bad, your acoustic model is fine and the problem is elsewhere.","gotcha":"Two traps. First, more iterations will not fix a mel-sourced spectrogram — the mel-to-linear inverse has already blurred each band before iteration one, so the ceiling is set by the filterbank, not the loop; teams keep bumping n_iter and hearing nothing improve. Second, never evaluate it with waveform SNR: a reconstruction that is globally shifted in time sounds absolutely identical and scores terribly, so the metric will tell you a perfect result is a failure. Use spectral convergence plus ASR word error rate instead. Also, Fast Griffin-Lim's momentum silently voids the never-gets-worse guarantee, so a fixed iteration count can leave you on an upward tick — log the error curve.","interviewLine":"\"A spectrogram is a complex STFT with the phase deleted, and at 75% overlap that still leaves about two real numbers per sample — recoverable in principle, just not in closed form. What survives is incoherent overlap-add — four frames summing at each sample with phases that don't agree — so you get the chorused, hollow voice, and pre-echo smeared one window ahead of every plosive. Phase isn't audible; the frames failing to add up is. I'd still keep it wired in: no weights and no GPU, so it's the fallback if the vocoder won't load, and the fastest way to tell whether a bad sample is the acoustic model's fault or the vocoder's.\"","numbers":[{"value":"~2 real numbers per sample (bins/hop = 513/256)","means":"At 75% overlap the magnitudes alone contain twice as much data as the audio they came from. So recovery is possible in principle — the problem is that there is no formula for it, not that information is missing."},{"value":"50 iterations, magnitudes raised to power 1.2","means":"Tacotron 1's actual recipe. The power is a sharpening hack the paper credits with reducing artefacts."},{"value":"~5,500 FFTs per second of audio ≈ 0.28 GFLOP/s (32 iterations)","means":"The arithmetic is essentially free. Compute is never the reason to reject Griffin-Lim."},{"value":"46 ms of pre-echo (1024-point window at 22.05 kHz)","means":"How far ahead of a 'p' or 't' the whoosh arrives — one analysis window's worth of energy smeared backwards in time."},{"value":"80 → 513 bins","means":"Going from mel back to linear frequency is underdetermined; the pseudo-inverse smears each band across its triangle before Griffin-Lim even starts. This is a hard ceiling that more iterations cannot lift."},{"value":"300 ms chunk vs ~150 ms TTS budget","means":"Every iteration needs the whole chunk, so the chunk is pure waiting time. Whole-utterance Griffin-Lim cannot fit an 800 ms conversational turn."}],"archNote":""},{"id":"17","title":"HiFi-GAN","stage":3,"oneLiner":"Turns a picture of sound into real audio in one shot, judged by two critics.","problem":"You need the picture-of-sound-to-audio step to be fast enough for a live phone call and clean enough not to buzz. Autoregressive models are accurate but 2.4x too slow; Griffin-Lim is fast but sounds hollow and chorused. Without a good feed-forward vocoder you get either dead air or the metallic 2017 robot voice.","how":"The generator is the simple half: take the mel (80 loudness values per 11.6 ms frame), then blow it up in four stages — 8x, 8x, 2x, 2x, which multiply to exactly 256, the number of audio samples each mel frame represents. After each blow-up, three filters of different widths (3, 7 and 11 positions wide) look at the signal in parallel and their answers are averaged, so the model never has to commit to one time-scale: the narrow one handles sample-to-sample shape, the wide one spans a whole pitch period. The clever half is the training critics. One critic ('multi-scale') listens to the audio, then to blurred half-speed and quarter-speed copies of it — blurring is a low-pass filter, so this critic judges overall shape and continuity but is literally deaf to high-frequency hiss. The other critic ('multi-period') folds the audio into a grid: for period 5 it stacks every 5th sample into its own column and never mixes columns, so it is checking 'is this still buzzing at the right rate three syllables later'. Because it samples rather than blurs, noise survives into it. The periods are primes 2, 3, 5, 7 and 11 so no two critics look at the same grid. Neither critic can see what the other sees, which is exactly the point.","bestChoice":"HiFi-GAN V1 (13.92 M parameters) for quality, or a smaller V-variant for speed; export to ONNX and serve on Triton; and — critically — fine-tune the vocoder on the acoustic model's OWN predicted mel, not on ground-truth mel. Train natively at 16 kHz for a phone deployment.","whyBest":"One forward pass means deterministic, predictable latency with no tail risk, and the two complementary critics get GAN-quality audio without a density model. Fine-tuning on predicted mel is the only fix for the buzz that appears when you train on real mel and serve model-generated mel.","gotcha":"The silent failure is buzz from train/serve mel mismatch: train the vocoder on ground-truth mel from real recordings, then serve it mel that your acoustic model predicted, and voiced segments go metallic while long vowels pick up a robotic hum — because the input is off the manifold the generator learned. The instinct is to add discriminators or scale up. The actual fix is to fine-tune on that specific acoustic model's own predicted mel, which means the vocoder checkpoint is coupled to the acoustic model checkpoint and must be re-tuned whenever the acoustic model changes. The second trap is treating the vocoder as latency-free because it is 168x real time — the ~150 ms of future mel it needs is a far bigger latency line item than its 1.4 ms of compute. Third: on a phone leg, low-pass BEFORE decimating to 8 kHz, or the vocoder's own high-frequency artefacts alias down into the audible passband.","interviewLine":"\"The interesting half is two discriminators with complementary blind spots. The multi-scale one average-pools, and pooling is a low-pass, so its coarse branches cannot see the top of the band at all. The multi-period one reshapes into a T/p-by-p matrix with width-one kernels, so each column is the waveform decimated by p — decimation aliases rather than smooths, and the stack down a column reaches about 320 ms at p=11 for very little compute. Serving-wise it's fast — about 168x real time on a V100 — but padding is the real cost: a receptive field of roughly 27 mel frames means about 150 ms of future mel. And the failure I watch for is buzz on out-of-domain mel; you fix it by fine-tuning the vocoder on the acoustic model's own predictions, not by adding discriminators.\"","numbers":[{"value":"~168x real time on a V100","means":"SOURCE ATTRIBUTES THIS TO V1, NOT V2. One second of audio takes about 6 ms of GPU. A 232 ms streaming chunk costs about 1.4 ms — the vocoder is never why a turn feels slow. On CPU it is 'barely above real time'."},{"value":"strides 8 × 8 × 2 × 2 = 256","means":"Exactly the mel hop, so the upsampling stack lands on the right number of audio samples with no fudge factor. If you change the hop you must change the strides."},{"value":"13.92 M parameters (V1)","means":"Small enough that the vocoder checkpoint sits beside the acoustic model on one Triton instance."},{"value":"~27 mel frames of receptive field ≈ 314 ms, ~150 ms of it future","means":"THE REAL LATENCY COST. The generator is symmetric, not causal, so each output sample depends on mel roughly 150 ms ahead of it. You either budget that lookahead or you chunk with overlap and pay in seams."},{"value":"λ_mel = 45, λ_feature-matching = 2","means":"The mel-matching loss dominates by more than 20:1 early in training and does the work of putting the right sounds in the right places; the adversarial terms only supply texture."},{"value":"MPD periods 2, 3, 5, 7, 11 → 647 rows reach","means":"Prime periods guarantee no two critics share a sampling grid. The stack reaches 59 ms at period 2 and 323 ms at period 11 — long-range periodicity policed for almost no compute."},{"value":"kernels 3 / 7 / 11, dilations 1 / 3 / 5","means":"The parallel filter widths averaged after each upsample stage. Kernel 11 spans ~120 positions — a whole pitch period at coarse stages."},{"value":"27% fewer samples at 16 kHz","means":"Training natively at 16 kHz instead of 22.05 kHz for a phone deployment: fewer samples to emit and Nyquist at 8 kHz instead of 11.025 kHz, both pure savings on a 3.4 kHz phone leg."}],"archNote":""},{"id":"18","title":"Neural Audio Codecs and RVQ","stage":3,"oneLiner":"Turning sound into a small vocabulary of integers a language model can predict.","problem":"A transformer predicts tokens from a fixed vocabulary; it cannot consume a mel spectrogram, which is continuous numbers. Without a way to convert audio into a manageable stream of integers and back, you simply cannot build an LLM-style speech model at all.","how":"First squeeze time: a convolutional encoder strides the 24,000-samples-per-second waveform down to 75 frames per second — one frame every 13.3 ms — each frame a 128-number summary. Then squeeze each frame into integers using a codebook: a lookup table of 1,024 pre-learned prototype vectors, where you just record the index of the closest match. One table alone is far too crude, so you stack them and each one fixes the previous one's mistake: table 1 picks the closest prototype, you subtract it and keep the leftover error, table 2 picks the closest prototype to that leftover, subtract again, and so on eight times. That is 'residual' vector quantisation — coarse first, then progressively finer corrections. Why not one giant table? Eight tables of 1,024 entries is 80 bits per frame, and a single flat table at 80 bits would need 2^80 ≈ 10^24 entries — unstorable and unsearchable — whereas the stack needs only 8,192 vectors and 8,192 distance comparisons. Decoding is just adding the eight looked-up vectors together, no searching at all.","bestChoice":"EnCodec/SoundStream-style RVQ trained with EMA codebook updates, a commitment loss, dead-code restart and quantizer dropout; serve encoder and decoder as separate Triton models via ONNX; alarm on per-stage code perplexity in Prometheus. For anything conversational, prefer a low-frame-rate codec like Mimi (12.5 Hz, ~1.1 kbps, 8 codebooks → 100 tokens/s).","whyBest":"Dead-code restart and quantizer dropout keep the codebooks actually used, so one checkpoint serves every bitrate on a nested prefix of stages, and the effective bitrate does not silently collapse. Low frame rate is what makes a full-duplex speech model tractable at all — 100 tokens/s instead of 600.","gotcha":"Two hard traps. First, stage 1 is unrecoverable: later codebooks encode the residual RELATIVE to the coarse code already chosen, so a wrong first token is not corrected downstream, it is decorated. In a generative model that surfaces as a wrong phoneme or a lurch in speaker identity — not as noise, which means it does not look like an audio bug at all. Second, codebook collapse: quality plateaus while you keep raising n_q and paying 750 bps per stage for a stage that removes almost no residual. Log2(K) is NOT your bitrate; usage entropy is. Watch per-stage code perplexity during training, not just the loss. Third and separately: these tokens reconstruct an identifiable speaker, so a token cache in Redis or a prompt log is legally a recording — same consent, retention and disclosure obligations as the WAV file.","interviewLine":"\"For a voice agent the number I actually care about isn't the bitrate, it's the token rate: 75 times 8 is 600 tokens a second, which is 1.67 ms per token if you decode them serially. So you don't — VALL-E runs autoregressive over the first codebook only, 13.3 ms a token, and fills the rest non-autoregressively. That's also where the failure mode lives: stage one is unrecoverable, because later codebooks only encode the residual around the coarse code you already picked. A wrong first token doesn't sound like noise, it sounds like the wrong phoneme. And I'd watch code-usage entropy in training — collapsed codebooks mean you're paying ten bits a stage to carry four.\"","numbers":[{"value":"strides 2 × 4 × 5 × 8 = 320","means":"EnCodec's 24 kHz downsampling factor. 24,000 / 320 = 75 latent frames per second."},{"value":"75 Hz, one frame every 13.3 ms","means":"The frame rate, and simultaneously the streaming model's floor on algorithmic latency — you cannot emit faster than one frame per 13.3 ms."},{"value":"1,024 entries = 10 bits → 750 bps per codebook","means":"Each codebook costs 75 frames/s × 10 bits = 750 bits per second. Multiply by the number of stages for the bitrate."},{"value":"n_q = 2, 4, 8, 16, 32 → 1.5, 3, 6, 12, 24 kbps","means":"The bitrate dial. 6 kbps against 384 kbps raw 24 kHz 16-bit PCM is 64:1 compression."},{"value":"600 acoustic tokens per second (75 × 8)","means":"THE NUMBER THAT SIZES YOUR ARCHITECTURE. Decoding all of them serially means one token every 1.67 ms to hold real time — impossible, which is why nobody does it flat."},{"value":"VALL-E: 75 tokens/s AR + NAR for the rest","means":"Autoregressive over codebook 1 only gives a forgiving 13.3 ms per token; codebooks 2-8 are filled in one non-autoregressive pass conditioned on it."},{"value":"Mimi: 12.5 Hz, ~1.1 kbps, 8 codebooks → 100 tokens/s","means":"The codec inside Moshi. A sixth of EnCodec's token rate — that reduction is why full-duplex speech-to-speech becomes feasible."},{"value":"2^80 ≈ 1.2 × 10^24 vs 8 × 1024 = 8,192","means":"Flat quantisation at the same bit budget vs residual. The entire justification for RVQ in one comparison."},{"value":"MusicGen delay pattern: codebook k offset by k steps","means":"Flatten the stack into one stream at the cost of n_q − 1 frames of latency, buying a single AR pass."}],"archNote":""},{"id":"19","title":"Streaming TTS","stage":3,"oneLiner":"Speak the first few words while still generating the rest of the sentence.","problem":"A seven-second agent reply takes about 357 ms of GPU to synthesise in one shot, and by the time TTS even starts, endpointing, ASR and the LLM have already consumed roughly 650 ms of the 800 ms a caller will tolerate. Synthesise the whole thing before speaking and the caller hears an obvious, uncomfortable pause every single turn.","how":"Streaming is a scheduling change, not a model change: synthesise the first small piece, start playing it, and generate the rest while the caller is listening to it. The caller only ever waits on chunk one, so time-to-first-audio collapses from 357 ms to about 16 ms for a 320 ms first chunk while total compute barely moves. The cost is joins. HiFi-GAN looks at mel frames on BOTH sides of each output sample, so a chunk generated in isolation has both its edges computed against zeros — context the network never saw in training — which produces an audible tick or short buzz at every boundary, three per second at 320 ms chunks, sounding like a bad tape edit. The fix is to synthesise wider than you keep: hand the vocoder some extra mel frames on each side, then throw away the audio belonging to those extra frames and keep the middle. Waiting for the right-hand (future) frames is far cheaper than it sounds, because the model runs about 20x faster than real time — you pay frame-time times RTF, not frame-time. But you can't shrink chunks forever: the extra context is recomputed every chunk and there is a fixed per-chunk overhead, both of which get proportionally worse as chunks shrink, so at some point you have traded away most of your server capacity for a few milliseconds of first-audio.","bestChoice":"Cut mel frames rather than text when the model allows it; carry L mel frames of context per side where L covers at least half the vocoder's receptive field; discard the context frames' samples; cross-fade a few milliseconds over the join; keep the first chunk short and let later chunks grow; snap every chunk to a multiple of 20 ms (one RTP packet). When you must cut text (because the LLM is still generating), cut at clause boundaries, never at a fixed word count.","whyBest":"Cutting mel frames preserves prosody, because the mel was generated as one utterance, and gives you context on both sides so seams genuinely disappear. Clause-aligned text cuts are the only option while the LLM is still producing tokens, and clause boundaries are where a pitch reset is least audible.","gotcha":"Three failure modes, and the third is the one that bites teams who tune hard for first-audio. Seam click from too little context (fades rather than disappearing below half the receptive field). Prosody reset, where each text chunk gets its own pitch declination and the sentence is delivered as disconnected fragments — this is why you cut at clauses, not word counts. And underrun stutter: push chunks small enough that RTF_eff crosses 1.0 and each chunk takes longer to compute than to play, so the buffer starves and the agent stumbles mid-word — which is strictly worse than a slightly later start because it recurs. Two extra silent click sources people forget: the polyphase resampler's filter history when going 24 kHz → 8 kHz, and the decoder's hidden state if you restart it per chunk. Both must be carried across chunks. And on compliance: audio already on the wire has been heard, so a barge-in cannot recall it — the LLM context must be truncated to what was PLAYED, and it is the played audio, not the generated audio, that is the retained record.","interviewLine":"\"Streaming is a scheduling change, not a model change. A seven-second agent turn at RTF 0.05 costs about 350 ms of compute before the first sample exists if you synthesise it in one shot — and by the time TTS starts, endpointing, ASR and the LLM have already spent 600-odd of the 800 ms the caller will tolerate. The two costs are seams and overhead. HiFi-GAN's receptive field spans tens of mel frames, so a chunk synthesised in isolation has both edges computed against zero padding — that's the click. You fix it by synthesising wider than you keep. And the overhead is the reason you don't go smaller: recomputed context plus a fixed per-chunk cost are both order one-over-n, so at a 53 ms chunk your effective RTF is roughly 0.36 instead of 0.08, and you've lost three quarters of your concurrency.\"","numbers":[{"value":"357 ms batched vs ~16 ms streamed","means":"7.14 s of speech at RTF 0.05, all at once versus a 320 ms first chunk. Same model, same total compute, order-of-magnitude difference in what the caller experiences."},{"value":"800 ms turn budget, ~650 ms already spent","means":"Endpoint hangover 200-300 ms, ASR finalisation 50-150, LLM time-to-first-token 200-400, transit + far-end jitter buffer 40-80. TTS gets what is left, often under 150 ms."},{"value":"RTF_eff = RTF·(n+2L)/n + overhead/(n·frame_ms)","means":"Effective real-time factor including recomputed context and fixed per-chunk cost. Both correction terms scale as 1/n, so they explode as chunks shrink."},{"value":"RTF_eff 0.081 at 533 ms vs 0.36 at 53 ms","means":"With RTF 0.05, L=8, 8 ms overhead, 10.67 ms frames. Shrinking the chunk tenfold buys ~25 ms of first-audio and costs three quarters of your concurrency (capacity ≈ 1/RTF_eff)."},{"value":"RTF_eff crossing 1.0","means":"A chunk takes longer to compute than to play. The playout buffer starves and the caller hears the agent stutter mid-word — worse than a later start, because it recurs."},{"value":"10.67 ms per mel frame (24 kHz, hop 256)","means":"The atomic unit of mel-frame streaming."},{"value":"20 ms RTP packets = 160 samples of G.711 at 8 kHz","means":"Snap chunk sizes to multiples of 20 ms, or you buffer a partial packet and hand the far-end jitter buffer a ragged arrival pattern."},{"value":"1.66 s first phrase → 83 ms; 320 ms → 16 ms","means":"The three cut points on the same sentence. Shorter first chunk, faster first word — with diminishing returns and rising per-chunk cost."}],"archNote":""},{"id":"20","title":"End-to-End Latency Budget","stage":0,"oneLiner":"Adding up every source of silence between the caller finishing and hearing you.","problem":"The caller stops speaking and hears nothing for a full second. Past about 800 ms they stop reading the pause as thinking and start reading it as a dead line, so they say 'hello?' — which your system treats as a brand-new interruption, cancels the reply that was finally starting, and answers even later. It does not degrade gently; it oscillates.","how":"Start a stopwatch at the last sound leaving the caller's mouth and stop it at the first sound arriving in their ear — deliberately harsher than what dashboards measure, because it includes the network trip in (which already happened before your system saw a byte) and the network trip out plus the far-end buffer (which happens after your logs say 'done'). Walk the eight things that consume that stopwatch: network in, the silence you wait through to decide the caller finished, the speech recognizer wrapping up, the language model reading its prompt, the language model producing enough words to be worth speaking, the safety filter, the voice generator producing its first chunk, and network out. Laid end to end that is about 1060 ms and the call feels broken. The trick is that the silence-wait (320 ms) is free time — you already have the audio, you are only withholding the decision that the turn ended, so the recognizer can finish inside it and you can speculatively start the language model on the last partial transcript in the same window, on different hardware. That hides 300 ms and the same pipeline lands at 760 ms with no model changed. Then budget the unlucky calls, not the average one: a GPU running at 80% busy multiplies its queued stages by five without the model getting one millisecond slower.","bestChoice":"Tuned cascade with overlap: streaming ASR finalising inside the endpoint hangover + speculative LLM prefill on the last stable partial, instrumented as ONE span from last-speech-frame to first-RTP-write with a call correlation ID, alarmed on p95, with GPU utilisation recorded alongside it.","whyBest":"It removes 300 ms of the budget without touching a model or buying a GPU, because the hangover window is time you were already spending. Measuring one span instead of eight stops the situation where every team's dashboard is green and nobody owns the sum.","gotcha":"Every team measures its own stage's p50, every dashboard is green, and nobody owns the sum — the two network legs and the far-end jitter buffer are inside the caller's silence but outside every request trace, so they are never counted. The second trap is budgeting the LLM's time-to-first-token and forgetting that TTS needs a whole clause: ~180 ms of extra decode hides between 'first token' and 'first speakable span'. The third is that a green p50 on an 80%-utilised GPU is a p95 disaster, with no model regression to blame.","interviewLine":"\"I'd define the clock first, because most people measure the wrong thing: last speech sample out of the caller's mouth to first sample in their ear, which means both network legs and the far-end jitter buffer are inside the budget even though they never show up in our request traces... Laid end to end that's about a second, and roughly 800 ms is where a caller stops hearing thought and starts hearing a broken line. The interesting part is that the biggest line item isn't a model — it's the endpoint hangover, and it's also the only free overlap resource you have... That's three hundred milliseconds for free, at the cost of throwing prefill away when the caller resumes. Then I'd budget the p95, not the p50, because a GPU at 80% utilisation multiplies its queued stages by five — S over one minus rho — without the model getting any slower.\"","numbers":[{"value":"800 ms","means":"The design target for the whole silence. It is a convention, not a measured constant — roughly where a caller stops hearing thought and starts hearing a broken line. The page is explicit that this number is chosen, not proven."},{"value":"150 ms / 400 ms","means":"ITU-T G.114's acceptable one-way mouth-to-ear transmission delay, degrading through 400 ms. Crucially this covers only the two network legs — your agent's thinking time sits on TOP of it, not inside it."},{"value":"~0 ms modal gap","means":"Stivers et al. (PNAS 2009) found the most common gap between human turns across ten languages sits near zero, with language means spread over a few hundred ms. That is the bar you are being judged against."},{"value":"1060 ms","means":"The eight stages laid end to end with no overlap. This is what a naively-built cascade actually costs."},{"value":"760 ms","means":"The same pipeline after hiding ASR finalisation and speculative prefill inside the hangover window. No model changed, no hardware bought."},{"value":"320 ms","means":"The endpoint hangover — the silence you sit through before declaring the turn over. Largest single line item, and the only free overlap resource in the pipeline."},{"value":"180 ms (10 tokens x 18 ms)","means":"Decode to the first CLAUSE. The stage people forget: TTS cannot start on a single token, it needs a synthesisable span, so ~10 more tokens elapse after the LLM's advertised time-to-first-token."},{"value":"5x at rho=0.8","means":"M/M/1 queueing: a stage at 80% utilisation waits S/(1-rho) = 5x its own service time. A 180 ms prefill becomes 900 ms and the whole budget is gone to a model that never slowed down."},{"value":"~1.2 s","means":"Where dead air turns into oscillation — the caller says 'hello?', that speech cancels the in-flight synthesis, the turn restarts, and the next reply is later still."},{"value":"140 ms (semantic endpointing preset)","means":"Dropping the hangover from 320 to 140 via a completeness classifier is the single biggest further cut available."}],"archNote":""},{"id":"21","title":"Barge-In (Letting the Caller Interrupt)","stage":0,"oneLiner":"Noticing the caller talking over you, stopping fast, and remembering only what they heard.","problem":"The caller says 'no, that's the wrong date' while the agent is still reading out the appointment. If the agent doesn't stop, it monologues over a correction. If it stops on the very first voiced frame, it abandons its own sentence every time someone clears their throat. And if it stops but records the whole sentence it INTENDED to say, the transcript now claims the patient was told 'nothing to eat after midnight' when they heard eleven words of it and never got that far.","how":"The core difficulty is that 'now' means two different times: your packets take ~65 ms to reach the caller's ear and their voice takes ~75 ms to reach you, so 140 ms of talk-over is physics before any code runs. So use two triggers at different speeds, like a person: the fast one is acoustic — a voice-activity detector sees three voiced 20 ms frames (60 ms of evidence) and you DUCK, meaning turn your own outbound audio down 9-12 dB while still synthesising, which is exactly what a human does when they think they're being interrupted and is fully reversible if they were only saying 'mhm'. The slow one is lexical — at ~280 ms of sustained speech you read the running transcript, check it against a small list of backchannel words, and only then actually cancel. Cancelling is where nearly every first implementation ships a bug: aborting the language model and the vocoder stops the PRODUCERS, but the already-synthesised audio sitting in your playout buffer keeps draining happily into the caller's ear — pre-buffer 400 ms against jitter, forget to flush it, and that's 400 ms of extra talk-over billed straight back from your streaming design. Finally, repair the conversation state: use the TTS's own word-timing alignment to find the last word that actually reached the wire, truncate the assistant's turn there minus a safety margin, and mark it interrupted — erring SHORT, because an agent that repeats a fasting instruction is annoying and one that believes it already said it is a patient-safety problem.","bestChoice":"Two-stage detect (duck at ~60 ms of voiced frames, commit at ~280 ms against the ASR partial with a backchannel lexicon and a 700 ms override), flush the playout buffer on cancel, truncate history to the words that reached the wire minus a 150 ms safety margin, and run the VAD as ONNX on the media node.","whyBest":"A single threshold cannot be both fast and right. Ducking is cheap and reversible so it is the only decision worth making on 60 ms of evidence; committing is destructive so it waits for a word. Running the VAD locally matters because a 20 ms network hop per frame would consume the entire duck budget.","gotcha":"Two silent killers. First, the flush: you abort the LLM and the vocoder, your logs say 'cancelled', and the caller still hears 400 ms more of the agent because the playout buffer drained. Second, self-barge-in — if echo cancellation is absent or has diverged, your own voice returns one round trip later, the VAD correctly reports speech, and the agent cancels itself a few hundred ms into every sentence, restarts, and cancels again: a stutter that decays into silence. The lexical gate makes echo WORSE, because echo is grammatical speech that sails through a backchannel filter. Do not touch any threshold — check ERLE. Third, opening the ASR at the trigger clips the caller's first syllable.","interviewLine":"\"I'd split it into detect, cancel, and repair... three voiced VAD frames — about 60 ms — and I duck the outbound audio by 10 dB, which is reversible; then around 280 ms of sustained speech I check the ASR partial against a backchannel list and only then commit. Cancel is where people ship the bug: aborting the LLM and the vocoder stops the producers, but the playout buffer keeps draining, so if I pre-buffered 400 ms for jitter I talk over the caller for 400 ms longer than I think... about 420 ms. Then repair, which is the part that matters clinically: truncate the assistant turn to the words whose audio reached the wire, using the TTS alignment, minus a safety margin — err short, because an agent that repeats 'nothing after midnight' is annoying and one that believes it already said it is a patient-safety problem. And if the agent interrupts itself, that's echo, not policy: check ERLE before you touch any threshold.\"","numbers":[{"value":"140 ms","means":"Inbound 75 + outbound 65: the unavoidable floor of talk-over. Any barge-in latency figure that excludes these describes your process, not the call."},{"value":"60 ms (3 x 20 ms frames)","means":"Evidence needed to duck. Three consecutive voiced frames — enough to not fire on a click, cheap enough to be wrong about."},{"value":"9-12 dB","means":"How much to attenuate your own outbound audio when ducking. Audible as yielding, not as stopping."},{"value":"280 ms","means":"Sustained speech before committing to a real cancel. Ducking is what buys you those extra 220 ms of certainty."},{"value":"420 ms","means":"Total agent audio the caller hears after they start talking: 75 IN + 280 commit + 65 OUT. Brisk enough to read as yielding the floor."},{"value":"400 ms","means":"Typical playout buffer depth. Forget to flush it on cancel and this adds directly to talk-over — the jitter insurance from the streaming design charged straight back."},{"value":"700 ms","means":"Override: past this, commit anyway even if the words look like a backchannel, because a long 'yeaaah, but—' is a real turn attempt."},{"value":"300 ms lookback ring","means":"Pre-trigger audio buffer. Open the ASR only at the trigger and you clip the caller's first syllable."},{"value":"150 ms safety margin","means":"Subtracted when truncating history. Always subtract, never add: repetition is the cheap error, omission the expensive one."},{"value":">25 dB ERLE","means":"Echo cancellation quality needed before your own voice (~-20 dBov) stops tripping a VAD floored at -45 dBov. Below that the agent interrupts itself."},{"value":"12.5 Hz / Moshi","means":"The full-duplex reference point — a model with parallel input and output streams handles interruption internally instead of in your scheduler."},{"value":"26 / 18 / 11 words","means":"The worked example: LLM generated 26 words, vocoder rendered 18, caller heard 11. Only the 11 belong in the transcript."}],"archNote":""},{"id":"22","title":"Turn-Taking / Endpointing (Deciding They're Done)","stage":0,"oneLiner":"Judging when the caller has finished speaking, not just when they paused.","problem":"A caller reads a member ID off a card: '4 4 7 ... 2 9 1 ... 8 0'. The gaps while their eye moves to the next chunk are 600-900 ms — longer than your 700 ms silence timer — so the agent barges in halfway through the number. The caller restarts, the recogniser now holds a fragment plus a repeat, and the agent answers half a sentence. Raise the timer to 1200 ms instead and every 'yes' costs an extra half-second of dead air.","how":"First separate two jobs that get conflated: a voice-activity detector answers a per-frame acoustic question ('is there speech in these 20 ms?'), while the endpointer answers a conversational one ('does this run of silence mean the floor is mine?'). Get the VAD wrong and you mislabel a frame; get the endpointer wrong and you talk over a patient. The endpoint wait is pure serial dead time — it starts when the caller stops and NOTHING downstream can begin until it expires — so at 700 ms it is nearly half a 1430 ms response budget, which is exactly why people cut it and exactly how agents start interrupting. The fix is to stop asking 'how long has it been quiet' and start asking 'is what I have so far a complete utterance': score the running partial transcript with a small text classifier and make the wait a function of that score, so 'yes, Tuesday works' (looks finished) yields in ~270 ms while 'my member ID is' (obviously unfinished) gets a generous ~1530 ms of grace. Two guards are mandatory: a hard maximum, because a caller who trails off with 'so...' keeps the completeness score low forever and without the cap the agent never speaks again; and the classifier must run locally, because partial transcripts are patient data and a hosted LLM call would both disclose them off-site and add a network round trip inside the tightest loop you own.","bestChoice":"Completeness-driven adaptive endpointing: wait(p) = clamp(t_min + (t_max - t_min)(1 - p), t_min, t_max) with t_min 200 ms, t_max 1600 ms, driven by a fine-tuned encoder over the ASR partial, exported
