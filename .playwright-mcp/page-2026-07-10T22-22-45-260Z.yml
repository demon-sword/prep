- generic [active] [ref=f13e1]:
  - banner [ref=f13e2]:
    - generic [ref=f13e3]: Inference
    - heading "Flash Attention" [level=1] [ref=f13e4]
    - paragraph [ref=f13e5]: How tiled attention keeps computation in SRAM to avoid materializing the full N×N attention matrix in HBM — 2–4× speedup, O(N) memory, mathematically identical output to standard attention. Dao et al., 2022.
  - main [ref=f13e6]:
    - generic [ref=f13e7]:
      - heading "Theory" [level=2] [ref=f13e8]
      - 'heading "The Problem: HBM Is Slow" [level=3] [ref=f13e9]'
      - paragraph [ref=f13e10]:
        - text: Modern GPUs are compute monsters with a critical weakness. An NVIDIA A100 delivers
        - strong [ref=f13e11]: 312 TFLOPS
        - text: (FP16 tensor core) but only
        - strong [ref=f13e12]: 2 TB/s
        - text: of HBM bandwidth. That's an arithmetic-intensity threshold of roughly 156 FLOPs per byte — if an operation does less compute per byte than this, the GPU stalls waiting for memory.
      - paragraph [ref=f13e13]:
        - text: Standard scaled dot-product attention is brutally memory-bound. For sequence length N, computing
        - code [ref=f13e14]: S = QK^T
        - text: "produces an N×N matrix. With N=8192 and fp16: that's 67 million elements ="
        - strong [ref=f13e15]: 134 MB per head per layer
        - text: . With 32 heads across 80 transformer layers, the raw attention matrix materialization would consume hundreds of gigabytes of HBM traffic — per forward pass. The GPU spends most of its time moving data between HBM and compute, not actually computing.
      - generic [ref=f13e16]:
        - generic [ref=f13e17]:
          - heading "A100 HBM (High Bandwidth Memory)" [level=4] [ref=f13e18]
          - paragraph [ref=f13e19]: 80 GB capacity | 2 TB/s bandwidth | Off-chip, far from compute cores
        - generic [ref=f13e20]:
          - heading "A100 SRAM (On-Chip)" [level=4] [ref=f13e21]
          - paragraph [ref=f13e22]: 192 KB per SM | 19 TB/s bandwidth | 9.5× faster than HBM, but only ~20 MB total across 108 SMs
        - generic [ref=f13e23]:
          - heading "The Arithmetic-Intensity Gap" [level=4] [ref=f13e24]
          - paragraph [ref=f13e25]: "Attention: ~3 FLOPs/byte — far below the 156 needed to saturate A100. Standard attention is memory-bound by design."
      - 'heading "The Key Insight: SRAM Is Tiny But Blazing Fast" [level=3] [ref=f13e26]'
      - paragraph [ref=f13e27]:
        - text: GPU on-chip SRAM runs at 19 TB/s — roughly
        - strong [ref=f13e28]: 9.5× faster
        - text: "than HBM. The problem is size: each SM on an A100 has just 192 KB of SRAM (total on-chip SRAM across 108 SMs is ~20 MB). For an N=8192 attention matrix (134 MB), the full N×N matrix cannot fit in SRAM even if you dedicated"
        - emphasis [ref=f13e29]: all
        - text: of it to a single attention head.
      - paragraph [ref=f13e30]:
        - text: "The critical question that Flash Attention (Dao et al., 2022) answers:"
        - strong [ref=f13e31]: can we compute softmax(QK^T/sqrt(d)) × V without ever writing the full N×N intermediate matrix to HBM?
        - text: The answer is yes — through tiling and online softmax.
      - heading "The Tiling Algorithm" [level=3] [ref=f13e32]
      - paragraph [ref=f13e33]: "Flash Attention breaks the Q, K, V matrices into blocks that fit in SRAM. Instead of materializing the entire S = QK^T matrix at once:"
      - list [ref=f13e34]:
        - listitem [ref=f13e35]:
          - strong [ref=f13e36]: "Outer loop over Q blocks:"
          - text: Load one block of Q (size B_r × d) from HBM into SRAM.
        - listitem [ref=f13e37]:
          - strong [ref=f13e38]: "Inner loop over K/V blocks:"
          - text: For each K/V block (size B_c × d), load it into SRAM, compute the local attention scores S_ij = Q_i K_j^T, apply softmax numerically stably using
          - strong [ref=f13e39]: online softmax
          - text: ", multiply by V_j, and accumulate into the output O_i."
        - listitem [ref=f13e40]:
          - strong [ref=f13e41]: "Write output only:"
          - text: After processing all K/V blocks for a given Q block, write the final O_i block to HBM. The full N×N attention matrix is
          - emphasis [ref=f13e42]: never materialized anywhere
          - text: — not in HBM, not in SRAM.
      - 'heading "Online Softmax: The Numerical Trick" [level=3] [ref=f13e43]'
      - paragraph [ref=f13e44]:
        - text: "Standard softmax requires two passes over the data: one to find the maximum (for numerical stability via"
        - code [ref=f13e45]: exp(x_i - max)
        - text: ) and one to compute the sum. In a tiled setting, you don't have all scores at once — you see them block by block. Online softmax maintains a running maximum
        - code [ref=f13e46]: m
        - text: and a running sum
        - code [ref=f13e47]: l
        - text: ":"
      - generic [ref=f13e48]: "For each new block with scores s: m_new = max(m_old, max(s)) l_new = exp(m_old - m_new) * l_old + sum(exp(s - m_new)) O_new = exp(m_old - m_new) * O_old + exp(s - m_new) * V_block Final output: O = O_final / l_final"
      - paragraph [ref=f13e49]:
        - text: This produces
        - strong [ref=f13e50]: mathematically identical output
        - text: to standard two-pass softmax. Flash Attention is not an approximation — unlike quantization or pruning, there is zero quality tradeoff. The output tensor is bit-identical to the naive implementation (or within floating-point rounding).
      - heading "Recomputation for the Backward Pass" [level=3] [ref=f13e51]
      - paragraph [ref=f13e52]:
        - text: During training, the backward pass needs the attention weights (or equivalent information) to compute gradients. Storing all attention weights for all heads and layers would be memory-prohibitive. Flash Attention solves this by
        - strong [ref=f13e53]: recomputing
        - text: the attention scores during the backward pass, rather than caching them from the forward pass. Since the forward pass was SRAM-optimized and the backward pass can reuse the same tiling pattern with recomputation, the total memory for both passes remains O(N).
      - 'heading "FlashAttention-2 (2023): Better Work Partitioning" [level=3] [ref=f13e54]'
      - paragraph [ref=f13e55]: "FA2 improved the real-world efficiency of FA1 by ~2× through better CUDA-level engineering:"
      - list [ref=f13e56]:
        - listitem [ref=f13e57]:
          - strong [ref=f13e58]: "Reduced non-matmul FLOPs:"
          - text: The softmax and rescaling operations (which don't use tensor cores) were better parallelized across thread blocks.
        - listitem [ref=f13e59]:
          - strong [ref=f13e60]: "Forward pass parallelism:"
          - text: Switched from parallelizing over Q blocks to parallelizing over both batch and head dimensions simultaneously, reducing the sequential inner loop and improving occupancy.
        - listitem [ref=f13e61]:
          - strong [ref=f13e62]: "Better warp scheduling:"
          - text: Tighter pipelining of HBM loads and SRAM computations — overlapping data transfer with compute.
      - 'heading "FlashAttention-3 (2024): Hopper-Native" [level=3] [ref=f13e63]'
      - paragraph [ref=f13e64]: "FA3 exploits NVIDIA Hopper (H100) architecture features that FA1/FA2 couldn't use:"
      - list [ref=f13e65]:
        - listitem [ref=f13e66]:
          - strong [ref=f13e67]: "WGMMA (Warp-Group Matrix Multiply-Accumulate):"
          - text: Asynchronous tensor core instructions that let different warp groups compute matmuls while others handle data movement — true async compute.
        - listitem [ref=f13e68]:
          - strong [ref=f13e69]: "TMA (Tensor Memory Accelerator):"
          - text: Hardware unit for async data movement between HBM and SMEM. Frees up CUDA cores that would otherwise wait on data loads.
        - listitem [ref=f13e70]:
          - strong [ref=f13e71]: "Results:"
          - text: 740 TFLOPS on H100 —
          - strong [ref=f13e72]: 75% of theoretical peak
          - text: ". FA2 on H100 hit ~35% utilization. This is a systems engineering masterclass: squeezing more from hardware by restructuring how work is dispatched, not by changing the math."
      - heading "When Flash Attention Helps (And When It Doesn't)" [level=3] [ref=f13e73]
      - paragraph [ref=f13e74]:
        - text: Flash Attention delivers 2–4× speedup on
        - strong [ref=f13e75]: prefill
        - text: — the phase where the model processes a long prompt in one parallel forward pass. The N×N matrix is materialized in standard attention, and FA eliminates that HBM traffic. Below N=512, the SRAM tiling overhead dominates and the benefit is negligible. For
        - strong [ref=f13e76]: single-token decode
        - text: (autoregressive generation), the attention matrix is 1×N (current token attending to all previous keys) — not N×N — so the memory savings are minimal. Flash Attention does not significantly accelerate token-by-token decoding.
      - paragraph [ref=f13e77]:
        - text: Flash Attention is also heavily beneficial during
        - strong [ref=f13e78]: training
        - text: ", where the backward pass's recomputation strategy (avoiding storing attention weights) dramatically reduces peak memory. This enabled training on longer sequences that were previously impossible."
      - heading "Adoption and Ecosystem" [level=3] [ref=f13e79]
      - paragraph [ref=f13e80]:
        - text: PyTorch 2.0 integrated Flash Attention as the default backend for
        - code [ref=f13e81]: torch.nn.functional.scaled_dot_product_attention
        - text: "— meaning millions of PyTorch programs got FA automatically with no code changes. Every major framework supports it: HuggingFace Transformers, vLLM, TGI (Text Generation Inference), TensorRT-LLM, SGLang, and llama.cpp. On the A100, you get FA2; on the H100, FA3 is the optimal choice. The"
        - code [ref=f13e82]: flash_attn
        - text: Python package from Dao-AILab provides the canonical implementation.
