    - generic [ref=f13e132]:
      - heading "Key Takeaways" [level=2] [ref=f13e133]
      - list [ref=f13e134]:
        - listitem [ref=f13e135]:
          - text: →
          - strong [ref=f13e136]: "Mathematically identical output — zero quality tradeoff:"
          - text: Flash Attention is a pure systems optimization. Unlike quantization, pruning, or speculative decoding, it produces the exact same attention output. Online softmax is numerically stable and equivalent to the two-pass naive softmax. You can adopt it with zero model quality risk.
        - listitem [ref=f13e137]:
          - text: →
          - strong [ref=f13e138]: "Prefill speeds up 2–4×; decode sees almost nothing:"
          - text: The N×N attention matrix only appears during prefill (parallel processing of the input prompt). During autoregressive decode, attention is 1×N — the matrix is a single row, so the memory savings are negligible. Flash Attention is a prefill + training optimization, not a decode accelerator.
        - listitem [ref=f13e139]:
          - text: →
          - strong [ref=f13e140]: "Below N=512, the tiling overhead dominates:"
          - text: Flash Attention's SRAM block management has fixed overhead. For very short sequences (< 512 tokens), standard attention with fused kernels often wins. Production serving systems like vLLM dynamically select the backend based on sequence length — FA for prefill, standard for very short prompts.
        - listitem [ref=f13e141]:
          - text: →
          - strong [ref=f13e142]: "PyTorch 2.0 made it a default:"
          - code [ref=f13e143]: scaled_dot_product_attention
          - text: in PyTorch 2.0+ auto-selects Flash Attention when the input shapes and hardware support it. Every HuggingFace model using this function gets FA automatically. The
          - code [ref=f13e144]: flash_attn
          - text: package from Dao-AILab gives you the standalone implementation for custom attention patterns.
        - listitem [ref=f13e145]:
          - text: →
          - strong [ref=f13e146]: "FA3 on H100 is a different beast:"
          - text: FlashAttention-3 exploits Hopper-specific features (WGMMA, TMA) that don't exist on A100. It achieves 740 TFLOPS — 75% of H100's theoretical peak — by overlapping async tensor core operations with data movement. On A100s, FA2 is the ceiling. If you're running on H100 GPUs, benchmark FA3 explicitly — the gap vs FA2 is significant at long context.
        - listitem [ref=f13e147]:
          - text: →
          - strong [ref=f13e148]: "Training benefits are arguably larger than inference:"
          - text: Recomputation in the backward pass means Flash Attention avoids storing the N×N attention matrix for gradient computation. For a 65B model training on 2048-token sequences, this saves ~40 GB of activation memory per GPU — enabling larger batch sizes and longer context windows that were previously impossible. Long-context training (32k, 128k tokens) is practical because of Flash Attention.
