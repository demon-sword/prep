    - heading "Production LLM Serving" [level=1] [ref=f7e4]
    - paragraph [ref=f7e5]: The decode bottleneck and the three pillars that solve it — PagedAttention, continuous batching, and Flash Attention — converging in vLLM, TGI, and TensorRT-LLM into a unified serving stack.
  - main [ref=f7e6]:
    - generic [ref=f7e7]:
      - heading "Theory" [level=2] [ref=f7e8]
      - 'heading "The Decode Bottleneck: Memory-Bandwidth-Bound at Batch=1" [level=3] [ref=f7e9]'
      - paragraph [ref=f7e10]:
        - text: Autoregressive decoding is fundamentally serial. To generate token
        - emphasis [ref=f7e11]: t+1
        - text: ", the model must first produce token"
        - emphasis [ref=f7e12]: t
        - text: . For a single request, each token requires loading all model weights from HBM (High Bandwidth Memory) into the GPU's compute cores. A 70B model in FP16 occupies ~140 GB — every single token generated streams this full weight matrix through the memory bus. With an A100 delivering ~2 TB/s of HBM bandwidth, each token takes roughly
        - strong [ref=f7e13]: 70 ms
        - text: to generate. The GPU's compute units sit idle while waiting for memory — this is the
        - strong [ref=f7e14]: memory-bandwidth-bound
        - text: regime, where throughput is determined by how fast you can move data, not how fast you can compute.
      - paragraph [ref=f7e15]: "The naive approach to serving multiple users is embarrassingly wasteful: run each request sequentially, or spin up multiple model replicas each serving one request. A single A100 can only produce ~14 tokens/second at batch size 1 — costing thousands of dollars in idle compute per month. The solution requires three innovations that work together: making batching dynamic (continuous batching), eliminating memory fragmentation (PagedAttention), and speeding up the attention computation itself (Flash Attention)."
      - 'heading "Continuous Batching: Iteration-Level Scheduling" [level=3] [ref=f7e16]'
      - paragraph [ref=f7e17]: "Static batching — where all requests in a batch must start and finish together — wastes enormous GPU time. In a batch of 32 requests, if Request #3 finishes at step 50 while Request #27 keeps generating until step 2048, the GPU slot for Request #3 sits empty for 1,998 useless decode steps. Multiply this across thousands of requests, and you lose over 50% of GPU capacity to padding."
      - generic [ref=f7e18]:
        - strong [ref=f7e19]: "The core insight of continuous batching:"
        - text: At every decode iteration, eject any requests that have finished (EOS token or max_tokens reached) and immediately insert new pending requests. Scheduling decision happens
        - emphasis [ref=f7e20]: per iteration
        - text: ", not per batch lifetime. The batch composition evolves continuously as requests complete and new ones arrive."
      - paragraph [ref=f7e21]: Continuous batching transforms LLM serving from a batch-size scheduler into an iteration-level scheduler. This single change increases GPU utilization from 45-55% to 85-95%+ for high-volume production workloads. Orca (OSDI 2022) first introduced the idea; vLLM, TGI, and TensorRT-LLM all implement it today.
      - paragraph [ref=f7e22]: "The math: with static batching, throughput T ≈ B / max(L_i / t), where B is batch size and L_i are individual decode lengths. The longest request dominates. With continuous batching, T ≈ B_avg / (L_avg / t), where B_avg stays near the max batch size because slots are refilled instantly. The throughput gain is roughly max(L_i) / avg(L_i) — often 3-5× in practice."
      - 'heading "PagedAttention: Virtual Memory for the KV Cache" [level=3] [ref=f7e23]'
      - paragraph [ref=f7e24]: The KV cache is the single largest memory consumer during inference. For a 70B model with 2048 context serving 32 concurrent requests, the KV cache alone requires ~280 GB of memory — double the model weights. In a naive contiguous allocation scheme, each request reserves a KV cache block sized for its maximum possible context length (16K or 32K tokens), even if the actual context is only 1K tokens. This fragmentation wastes 60-80% of KV cache memory.
      - paragraph [ref=f7e25]:
        - text: PagedAttention (Kwon et al., SOSP 2023) applies the OS virtual memory principle to the KV cache. Instead of allocating one huge contiguous block per request, the KV cache is divided into fixed-size
        - strong [ref=f7e26]: pages
        - text: (typically 16 tokens each). A request only allocates pages as it generates tokens, and different requests can share read-only pages when they share a common prefix (e.g., a long system prompt).
      - generic [ref=f7e27]: "KV cache waste without PagedAttention: waste = sum_over_requests( max_len - actual_len ) * bytes_per_token With PagedAttention: near-zero internal fragmentation. Each request gets exactly the pages it needs — no pre-allocation. Shared prefix pages are stored once and mapped into multiple requests' page tables."
      - paragraph [ref=f7e28]: "The practical impact is dramatic: PagedAttention reduces KV cache memory waste from 60-80% to under 5%. This lets you serve 2-3× more concurrent requests on the same GPU, or serve longer context lengths without OOM. It is the single biggest differentiator between vLLM's 10-20× throughput advantage over naive HuggingFace inference and competitors. Both TGI and TensorRT-LLM have adopted similar paged KV cache architectures."
      - 'heading "Flash Attention: Never Materialize the N×N Matrix" [level=3] [ref=f7e29]'
      - paragraph [ref=f7e30]: Standard attention computes QK^T to produce an N×N attention matrix, applies softmax, then multiplies by V. This materializes an O(N²) matrix in HBM. For 32K context with 40 attention heads and batch=32, this single matrix is ~5 GB — per layer. A 70B model with 80 layers would generate 400 GB of intermediate attention matrices.
      - paragraph [ref=f7e31]: Flash Attention (Dao et al., 2022; Flash Attention 2, 2023; Flash Attention 3, 2024) eliminates this by tiling the computation. It loads small blocks of Q, K, and V into SRAM (on-chip memory, ~20 TB/s bandwidth vs ~2 TB/s for HBM), computes the attention for that tile entirely on-chip, and writes only the final output to HBM. The N×N attention matrix is never materialized.
      - generic [ref=f7e32]: "Standard attention memory: O(N²) per attention head Flash Attention memory: O(N) per attention head Speedup: 2-4× for prefill (long sequences) Modest for decode (N=1 in autoregressive step) Quality: Mathematically identical output to standard attention. Not an approximation — same softmax, same output."
      - paragraph [ref=f7e33]:
        - text: Flash Attention is now the default in PyTorch's
        - code [ref=f7e34]: torch.nn.functional.scaled_dot_product_attention
        - text: (SDPA) since PyTorch 2.0, and is used internally by vLLM, TGI, and TensorRT-LLM. It is particularly impactful during the prefill phase, where sequences are long — cutting prefill latency by 2-4× for 8K+ prompts.
      - generic [ref=f7e35]:
        - strong [ref=f7e36]: "How the three pillars compose:"
        - text: Continuous batching maximizes GPU utilization by keeping all slots full. PagedAttention maximizes memory efficiency so you can fit more slots. Flash Attention minimizes per-iteration compute time. Together they create the modern serving stack that makes LLM APIs economically viable at scale.
