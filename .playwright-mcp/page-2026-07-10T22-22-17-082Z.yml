    - generic [ref=f7e155]:
      - heading "Key Takeaways" [level=2] [ref=f7e156]
      - list [ref=f7e157]:
        - listitem [ref=f7e158]:
          - text: →
          - strong [ref=f7e159]: Continuous batching is the single highest-leverage optimization for LLM serving.
          - text: Moving from static batching to iteration-level scheduling increases GPU utilization from 45-55% to 85-95%+ — a 3-5× throughput improvement without any model changes. If you deploy exactly one optimization, make it continuous batching. Both vLLM and TGI implement this out of the box as their default scheduling strategy, so there is no excuse for static batching in 2025.
        - listitem [ref=f7e160]:
          - text: →
          - strong [ref=f7e161]: PagedAttention eliminates the KV cache fragmentation problem.
          - text: Before PagedAttention, KV cache memory waste of 60-80% was normal because each request pre-allocated for worst-case context length. vLLM's page-based allocation (16-token pages, shared prefix pages via copy-on-write) brings waste under 5%, letting you serve 2-3× more concurrent requests. This is not a marginal improvement — it is architectural. Any serving framework without paged KV cache allocation is unsuitable for production workloads above ~100 concurrent requests.
        - listitem [ref=f7e162]:
          - text: →
          - strong [ref=f7e163]: Choose your serving framework based on your deployment profile, not raw benchmarks.
          - text: vLLM is the best general-purpose choice for most teams — easy deployment, excellent community, solid performance. TensorRT-LLM wins on raw throughput (5-15% faster on H100) but requires significant engineering investment (C++ build system, NVIDIA-specific kernels, complex model conversion). TGI is the right choice if you are deeply integrated with HuggingFace (custom tokenizers, constrained generation). SGLang is emerging as the best choice for prefix-heavy workloads via RadixAttention. If you are on a budget or deploying to consumer hardware, llama.cpp with GGUF quantization is unbeatable.
        - listitem [ref=f7e164]:
          - text: →
          - strong [ref=f7e165]: Prefill-decode disaggregation is the next frontier.
          - text: Splitting prefill and decode across separate GPU pools is not just an optimization — it reflects their fundamentally different hardware requirements. Prefill wants high-FLOPs GPUs (H100, B200) for parallel prompt processing; decode wants high-memory-bandwidth GPUs (even A100-80GB works well). This pattern reduces time-to-first-token latency by 2-5× and is being adopted by every major LLM API provider (Anthropic, Together AI, Fireworks). Expect this to become the default deployment architecture for large-scale serving by 2026.
        - listitem [ref=f7e166]:
          - text: →
          - strong [ref=f7e167]: Prefix caching delivers massive savings for chatbot and multi-turn workloads.
          - text: When 80%+ of your requests share a 500-token system prompt or a large few-shot example block, automatic prefix caching (vLLM's
          - code [ref=f7e168]: enable_prefix_caching=True
          - text: ", SGLang's RadixAttention) eliminates redundant KV cache computation for every shared prefix. In high-volume chatbot deployments (100K+ requests/day), this saves 15-30% of total GPU compute. The savings compound with continuous batching because your decode slots stay filled with non-redundant work."
        - listitem [ref=f7e169]:
          - text: →
          - strong [ref=f7e170]: Production serving is not just about throughput — latency, fairness, and robustness matter equally.
          - text: A 10× throughput server that delivers p99 latency of 15 seconds is worse than a 5× server with p99 of 2 seconds for an interactive chatbot. Implement request-level timeouts, max-token limits, priority classes (interactive vs batch), and queue-depth-based autoscaling. vLLM's
          - code [ref=f7e171]: "--max-num-seqs"
          - text: and request scheduling priorities, combined with Kubernetes HPA on request queue depth, form the minimum viable production setup. Monitor GPU memory fragmentation over multi-day runs and plan for periodic restarts.
