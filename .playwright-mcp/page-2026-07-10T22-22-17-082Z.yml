      - heading "Production Deployment Patterns" [level=3] [ref=f7e88]
      - paragraph [ref=f7e89]:
        - strong [ref=f7e90]: "Prefill-decode disaggregation:"
        - text: "The prefill phase (processing the prompt) and decode phase (generating tokens) have opposite hardware requirements. Prefill is compute-bound (parallel across sequence), demanding high FLOPs — H100's Transformer Engine excels here. Decode is memory-bandwidth-bound, where memory throughput matters more than raw FLOPs. Prefill-decode disaggregation splits these across separate GPU pools: a prefill pool of H100s handles all incoming prompts with maximum parallelism, then ships KV caches to a larger decode pool of A100s that churns through token generation. This reduces time-to-first-token by 2-5× and improves overall throughput by not letting decode requests block prefill."
      - paragraph [ref=f7e91]:
        - strong [ref=f7e92]: "Autoscaling on request backlog:"
        - text: Production serving systems should scale based on queue depth, not CPU/GPU utilization. When the pending request queue exceeds a threshold (e.g., 50 requests), spin up additional replicas. vLLM's API server supports this natively with
        - code [ref=f7e93]: "--max-num-seqs"
        - text: and Kubernetes HPA integration via custom metrics. Scale-down should be slower than scale-up to avoid thrashing — a 5-minute cooldown is typical.
      - paragraph [ref=f7e94]:
        - strong [ref=f7e95]: "Request prioritization and queuing:"
        - text: "Not all requests are equal. Implement priority classes: interactive users get high priority (target <500ms latency), batch processing gets low priority. vLLM supports priority-based scheduling via the"
        - code [ref=f7e96]: priority
        - text: field in the OpenAI-compatible API. Combine with request timeouts and max-token limits to prevent any single request from starving the queue.
      - paragraph [ref=f7e97]:
        - strong [ref=f7e98]: "Prefix caching in production:"
        - text: When many users share a common system prompt or few-shot examples, PagedAttention's prefix sharing eliminates redundant KV cache computation. vLLM's automatic prefix caching detects matching prefix hashes and reuses cached KV pages. For chatbot APIs where every request shares a 500-token system prompt, this saves ~500 tokens of prefill compute per request — roughly 30-50% prefill latency reduction at scale.
      - paragraph [ref=f7e99]:
        - strong [ref=f7e100]: "GPU memory fragmentation prevention:"
        - text: "Even with PagedAttention, long-running serving instances can suffer from GPU memory fragmentation as allocations and deallocations interleave. Techniques: pre-allocate a fixed number of KV cache blocks at startup; use"
        - code [ref=f7e101]: gpu_memory_utilization
        - text: parameter (vLLM default 0.90) to reserve headroom; restart instances periodically (e.g., every 24h) as a safety measure; monitor with
        - code [ref=f7e102]: nvidia-smi
        - text: for unexpected memory growth patterns.
