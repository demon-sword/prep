    - generic [ref=e185]:
      - heading "Key Takeaways" [level=2] [ref=e186]
      - list [ref=e187]:
        - listitem [ref=e188]:
          - strong [ref=e189]: Soft labels carry exponentially more gradient signal than hard labels.
          - text: At T=3, the KL divergence loss sees structure across the entire vocabulary; hard labels provide signal only for the correct token. This is why distilled students converge faster and generalize better than direct fine-tuning on the same data.
        - listitem [ref=e190]:
          - strong [ref=e191]: Temperature matters enormously.
          - text: Too low (T≈1) and the distribution is too peaked — soft labels collapse to hard labels and distillation provides no benefit. Too high (T>10) and all tokens look equally likely — the gradient signal becomes noisy. Typical sweet spot is T=3–5 for LLMs.
        - listitem [ref=e192]:
          - strong [ref=e193]: Data distillation ≠ Hinton distillation.
          - text: Most production "distillation" is really behavioral cloning on teacher-generated synthetic data — no soft labels, just hard targets from teacher completions. This is simpler but transfers less fine-grained calibration. It also creates ToS risk when using commercial API teachers (OpenAI, Anthropic, etc.).
        - listitem [ref=e194]:
          - strong [ref=e195]: Student architecture is the primary decision.
          - text: Before distillation begins, choose your student size based on latency/cost SLAs. A 7B model on one A100 targets ~50ms/token; 1.3B fits on a T4 at <10ms. Distillation closes ~70–80% of the quality gap between random-init and teacher, but can't exceed teacher quality.
        - listitem [ref=e196]:
          - strong [ref=e197]: Feature distillation (TinyBERT, MobileBERT) > logit distillation for understanding tasks.
          - text: Matching intermediate attention maps and hidden states adds 2–4% accuracy on NLU benchmarks compared to logit-only distillation, but requires 3–5× more implementation complexity and a layer-mapping strategy.
        - listitem [ref=e198]:
          - strong [ref=e199]: Combine distillation with LoRA fine-tuning for production.
          - text: "Distill a small student from the large teacher, then apply domain-specific LoRA fine-tuning to the student. This often outperforms fine-tuning the large model with LoRA alone, at 5–10× lower serving cost. Tools: Hugging Face"
          - code [ref=e200]: trl
          - text: (data distillation),
          - code [ref=e201]: transformers.Trainer
          - text: with custom KD loss.
