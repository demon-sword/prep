- generic [active] [ref=e1]:
  - banner [ref=e2]:
    - generic [ref=e3]: finetuning
    - heading "Model Distillation" [level=1] [ref=e4]
    - paragraph [ref=e5]: Training a small student model to mimic a large teacher model using soft labels and intermediate representations — achieving near-teacher quality at a fraction of the compute cost.
  - main [ref=e6]:
    - generic [ref=e7]:
      - heading "Theory" [level=2] [ref=e8]
      - 'heading "The Core Problem: Quality vs. Cost" [level=3] [ref=e9]'
      - paragraph [ref=e10]:
        - text: Large language models achieve state-of-the-art quality, but deploying a 70B or 405B parameter model in production is expensive — it requires multiple GPUs per inference call, adds latency, and inflates cloud costs. Model distillation is a training technique that extracts the
        - emphasis [ref=e11]: knowledge
        - text: of a large "teacher" model into a much smaller "student" model, without the student ever seeing the original training data. Introduced by Hinton, Vinyals, and Dean (2015), distillation has become a cornerstone of production AI deployment.
      - paragraph [ref=e12]:
        - text: The key insight is that a trained model's
        - strong [ref=e13]: output probability distribution
        - text: over the vocabulary carries far more information than a one-hot label. When a teacher model reads "The cat sat on the ___", it might assign 40% to "mat", 20% to "floor", 15% to "sofa", 10% to "roof", and the remaining 15% spread across thousands of other tokens. This soft distribution tells the student not just the answer, but the
        - emphasis [ref=e14]: structure of uncertainty
        - text: — which alternatives are plausible, which are similar, and which are nonsensical. A one-hot label ("mat = 1, everything else = 0") discards all of that.
      - heading "The Temperature Trick and Soft Labels" [level=3] [ref=e15]
      - paragraph [ref=e16]:
        - text: Before distillation, the teacher runs inference with a temperature T > 1 applied to its logits before softmax. This
        - strong [ref=e17]: softens the distribution
        - text: — probabilities become less peaked and the "dark knowledge" in low-probability tokens becomes visible. At T=1 (default), the model might assign 99.9% to one token. At T=4, it redistributes to reveal that several tokens are nearly equally plausible in context.
      - generic [ref=e18]: softmax(zᵢ/T) → as T↑, distribution flattens; as T→0, distribution sharpens to argmax
      - paragraph [ref=e19]:
        - text: The student is then trained to match these softened teacher distributions using
        - strong [ref=e20]: KL divergence
        - text: "as the distillation loss:"
      - generic [ref=e21]: L_distill = KL(p_teacher(T) ‖ p_student(T)) = Σᵢ p_teacher(xᵢ|T) · log(p_teacher(xᵢ|T) / p_student(xᵢ|T))
      - paragraph [ref=e22]: "In practice, the total student loss combines both distillation loss and standard cross-entropy on the ground-truth labels:"
      - generic [ref=e23]: L_total = α · L_hard_label + (1 - α) · T² · L_distill
      - paragraph [ref=e24]: The T² factor re-scales the gradient magnitudes, which shrink when temperature is applied. α is typically 0.1–0.5 — higher weight on distillation (lower α) when teacher quality is high.
      - 'heading "Beyond Output Logits: Feature Distillation" [level=3] [ref=e25]'
      - paragraph [ref=e26]:
        - text: Logit-level distillation transfers the teacher's final output. More aggressive methods also transfer
        - strong [ref=e27]: intermediate representations
        - text: ":"
      - list [ref=e28]:
        - listitem [ref=e29]:
          - strong [ref=e30]: "Attention transfer:"
          - text: Student learns to reproduce the teacher's attention maps layer-by-layer (TinyBERT). This forces the student to "look at" the same tokens the teacher focuses on.
        - listitem [ref=e31]:
          - strong [ref=e32]: "Hidden state matching:"
          - text: Student's hidden states at each layer are aligned to teacher hidden states via MSE loss, often through a linear projection since student and teacher have different dimensions.
        - listitem [ref=e33]:
          - strong [ref=e34]: "Intermediate logit distillation:"
          - text: Distill from intermediate transformer blocks, not just the final output.
      - paragraph [ref=e35]: Feature distillation is more complex to implement (requires layer mapping, projection layers) but often yields better results for small students, particularly for tasks that require structured understanding (NLI, NER, QA) rather than generation.
      - heading "Data Distillation and Synthetic Data Pipelines" [level=3] [ref=e36]
      - paragraph [ref=e37]:
        - text: "Modern LLM distillation differs from the original Hinton formulation in one important way: you often don't have teacher logits at training time. Instead, you generate a"
        - strong [ref=e38]: synthetic dataset
        - text: by prompting the teacher to produce outputs, then train the student on those outputs as hard targets (a process called "data distillation" or "imitation fine-tuning").
      - paragraph [ref=e39]: This is how models like Alpaca (distilling GPT-4-class models into LLaMA-7B), Vicuna, and most open-weight chat models work. GPT-4 generates thousands of (instruction, response) pairs; the student trains via standard cross-entropy on those responses. This is technically not Hinton-style distillation (no soft labels) — but it transfers teacher knowledge via behavioral cloning on teacher-generated data.
      - generic [ref=e40]:
        - strong [ref=e41]: "OpenAI's Terms of Service note:"
        - text: Using GPT-4 outputs to train competing models is a ToS violation. In practice, many open-source models have done this anyway. Checking data provenance matters for commercial deployment.
      - heading "Distillation vs. Fine-Tuning vs. Quantization" [level=3] [ref=e42]
      - paragraph [ref=e43]: "These are complementary, not competing techniques:"
      - list [ref=e44]:
        - listitem [ref=e45]:
          - strong [ref=e46]: Quantization
          - text: (INT8, INT4) reduces the bit-width of an existing model's weights. No training required; fast to apply. Reduces memory 2–4×, modest quality loss, no architecture change.
        - listitem [ref=e47]:
          - strong [ref=e48]: Pruning
          - text: removes low-magnitude weights or attention heads. Also no training required. Difficult to achieve hardware speedups without structured sparsity.
        - listitem [ref=e49]:
          - strong [ref=e50]: Distillation
          - text: trains a brand-new smaller architecture. Requires significant compute (training the student), but achieves 5–10× size reduction with much smaller quality loss than the other methods.
        - listitem [ref=e51]:
          - strong [ref=e52]: Fine-tuning
          - text: adapts a model to a domain but doesn't reduce size. Often applied to the student after distillation to further improve task performance.
      - heading "Production Reality" [level=3] [ref=e53]
      - paragraph [ref=e54]: "Real-world distillation numbers: DistilBERT (2019) achieved 97% of BERT-base performance at 40% of the size and 60% faster. DistilGPT2 is ~50% the size of GPT-2 small. TinyLLaMA (1.1B) was trained to distill LLaMA-2 on 3T tokens. Mistral-7B models distilled from much larger Mixtral-8x22B (141B MoE) models — phi-2 distilled from GPT-4."
      - paragraph [ref=e55]: "In practice, the student architecture is usually chosen first (based on serving cost constraints), then you distill to meet the budget. If latency target is 50ms on a single A10G GPU, work backwards: that constrains you to roughly 7B dense parameters at FP16, which sets the student size, which sets the quality bar you can hope to hit. Distillation closes the gap from \"random init at 7B\" to \"7B with near-70B quality.\""
      - paragraph [ref=e56]:
        - text: Distillation also helps with
        - strong [ref=e57]: task-specific compression
        - text: ": a 70B general-purpose model distilled into a 7B model fine-tuned on customer support can outperform a generic 7B model fine-tuned on the same data, because the student learns from the teacher's richer uncertainty estimates across the domain."
