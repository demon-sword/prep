  - main [ref=e6]:
    - generic [ref=e7]:
      - generic [ref=e8]: Theory
      - heading "The Transformer Stack" [level=2] [ref=e9]
      - paragraph [ref=e10]:
        - text: The Transformer, introduced in
        - strong [ref=e11]: "\"Attention Is All You Need\" (Vaswani et al., 2017)"
        - text: ", replaced the sequential processing of RNNs with fully parallel, attention-based computation. Every modern LLM — GPT, Llama, Mistral, Gemini — is built on this foundation or a close descendant. Understanding it deeply is table stakes for AI engineering."
      - heading "1. Token Embedding" [level=3] [ref=e12]
      - paragraph [ref=e13]:
        - text: The model's input is a sequence of integer token IDs. Each ID is looked up in a learned embedding table of shape
        - code [ref=e14]: "[vocab_size × d_model]"
        - text: . For GPT-3,
        - code [ref=e15]: vocab_size = 50,257
        - text: (BPE),
        - code [ref=e16]: d_model = 12,288
        - text: . The embedding layer alone is ~600M parameters — a substantial fraction of smaller models. Crucially, embedding weights are often
        - strong [ref=e17]: tied
        - text: with the output projection at the end, halving parameter count without quality loss.
      - heading "2. Positional Encoding" [level=3] [ref=e18]
      - paragraph [ref=e19]:
        - text: Self-attention is
        - strong [ref=e20]: permutation-invariant by design
        - text: — without explicit position information, the model cannot distinguish "dog bites man" from "man bites dog." Positional encodings (PEs) inject sequence order.
      - list [ref=e21]:
        - listitem [ref=e22]:
          - strong [ref=e23]: "Sinusoidal (original paper):"
          - text: Fixed, not learned.
          - code [ref=e24]: PE(pos,2i) = sin(pos / 10000^(2i/d_model))
          - text: . Generalizes to longer sequences than seen during training.
        - listitem [ref=e25]:
          - strong [ref=e26]: "Learned Absolute (BERT, GPT-2):"
          - text: A trainable embedding table indexed by position. Simpler but fails to extrapolate beyond the training context length.
        - listitem [ref=e27]:
          - strong [ref=e28]: "Rotary (RoPE — Llama, Mistral, GPT-NeoX):"
          - text: Encodes position by rotating Q and K vectors before dot product. Encodes
          - emphasis [ref=e29]: relative
          - text: position implicitly. Superior length generalization with YaRN or rope scaling.
        - listitem [ref=e30]:
          - strong [ref=e31]: "ALiBi:"
          - text: Adds a linear attention bias based on distance. No position embeddings at all; inference-time extrapolation built-in.
      - heading "3. Multi-Head Self-Attention (MHSA)" [level=3] [ref=e32]
      - paragraph [ref=e33]:
        - text: This is the heart of the transformer. For each layer, every token produces three projections —
        - strong [ref=e34]: Query (Q)
        - text: ","
        - strong [ref=e35]: Key (K)
        - text: ", and"
        - strong [ref=e36]: Value (V)
        - text: — from learned weight matrices
        - code [ref=e37]: W_Q, W_K, W_V ∈ ℝ^(d_model × d_head)
        - text: ". The attention score between position i and j is:"
      - generic [ref=e38]: Attention(Q, K, V) = softmax( Q·Kᵀ / √d_k ) · V
      - paragraph [ref=e39]:
        - text: The
        - code [ref=e40]: √d_k
        - text: scaling prevents dot products from growing too large (which would push softmax into saturation). Multi-head attention splits
        - code [ref=e41]: d_model
        - text: across
        - code [ref=e42]: h
        - text: heads (typically
        - code [ref=e43]: d_head = d_model / h = 64
        - text: ), letting each head attend to different relational patterns. GPT-3 uses
        - code [ref=e44]: h = 96
        - text: heads across
        - code [ref=e45]: d_model = 12,288
        - text: .
      - paragraph [ref=e46]:
        - strong [ref=e47]: Causal masking
        - text: sets all upper-triangular attention scores to
        - code [ref=e48]: "-∞"
        - text: before softmax, ensuring token i can only attend to positions ≤ i. This is what makes decoder-only models (GPT family) work — they never see future tokens during training.
      - paragraph [ref=e49]:
        - strong [ref=e50]: Grouped-Query Attention (GQA)
        - text: — used in Llama 3, Mistral — groups multiple Q heads to share a single K/V head. Reduces KV cache memory by 4–8× without meaningfully hurting quality. At the extreme,
        - strong [ref=e51]: Multi-Query Attention (MQA)
        - text: has a single shared K/V pair for all Q heads.
      - heading "4. Feed-Forward Network (FFN)" [level=3] [ref=e52]
      - paragraph [ref=e53]: "After attention, each token is processed independently through a 2-layer MLP. The standard formulation:"
      - generic [ref=e54]: FFN(x) = max(0, xW₁ + b₁)W₂ + b₂
      - paragraph [ref=e55]:
        - text: The hidden dimension is typically
        - strong [ref=e56]: 4× d_model
        - text: (so 16,384 for d_model=4,096). Modern LLMs use
        - strong [ref=e57]: SwiGLU
        - text: "instead of ReLU:"
      - generic [ref=e58]: FFN_SwiGLU(x) = (SiLU(xW₁) ⊙ xW₃) · W₂
      - paragraph [ref=e59]:
        - text: SwiGLU was found to outperform ReLU and GeLU empirically (PaLM, Llama). It uses 3 projection matrices instead of 2, but the inner dimension is typically scaled to
        - code [ref=e60]: 2/3 × 4d
        - text: to keep parameter count equivalent.
      - heading "5. Residual Connections & Layer Normalization" [level=3] [ref=e61]
      - paragraph [ref=e62]:
        - text: "Each sub-layer (attention, FFN) is wrapped in a residual connection:"
        - code [ref=e63]: output = LayerNorm(x + sublayer(x))
        - text: . Residuals enable stable training of deep networks by providing gradient highways that bypass sub-layers.
      - paragraph [ref=e64]:
        - text: The original paper uses
        - strong [ref=e65]: Post-LN
        - text: (norm after residual addition). Most modern LLMs use
        - strong [ref=e66]: Pre-LN
        - text: (norm before each sub-layer), which trains more stably without requiring careful learning rate warmup. Llama uses
        - strong [ref=e67]: RMSNorm
        - text: instead of LayerNorm — it omits the mean-centering step, saving ~40% of the norm computation with no quality regression.
      - heading "6. Stacking N Layers" [level=3] [ref=e68]
      - paragraph [ref=e69]:
        - text: "A complete transformer decoder is N identical blocks, each containing: Pre-LN → MHSA → residual → Pre-LN → FFN → residual. Depth (N) and width (d_model) are the primary scaling dimensions. GPT-2 Small has"
        - strong [ref=e70]: 12 layers / d=768
        - text: ; GPT-3 has
        - strong [ref=e71]: 96 layers / d=12,288
        - text: ; Llama 3 70B has
        - strong [ref=e72]: 80 layers / d=8,192
        - text: .
      - heading "7. Output Projection (LM Head)" [level=3] [ref=e73]
      - paragraph [ref=e74]:
        - text: The final hidden state of each position is projected back to
        - code [ref=e75]: vocab_size
        - text: logits via a linear layer (often weight-tied with the embedding table). A
        - code [ref=e76]: softmax
        - text: converts logits to probabilities for sampling or loss computation.
      - 'heading "Production Reality: Parameter Counts & Compute" [level=3] [ref=e77]'
      - paragraph [ref=e78]:
        - text: "For a decoder-only transformer: total parameters ≈"
        - code [ref=e79]: 12 × N × d² + vocab × d
        - text: . This scales quadratically with width. Compute for one forward pass ≈
        - code [ref=e80]: 2P
        - text: FLOPs (where P is parameter count). A 70B model requires ~140B FLOPs per forward pass token — at A100 peak (312 TFLOPS), one token takes ~0.45ms on a single GPU, requiring 4× A100 to hit 140B/s sustained throughput at a practical batch size.
      - paragraph [ref=e81]:
        - text: The
        - strong [ref=e82]: attention complexity
        - text: is O(n²·d) per layer for sequence length n. For context windows beyond 32K, this becomes the limiting factor. Flash Attention (Dao et al., 2022) fuses operations in SRAM to reduce memory I/O from O(n²) to O(n), making 128K+ context practical.
