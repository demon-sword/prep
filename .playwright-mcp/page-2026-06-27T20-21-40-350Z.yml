          - list [ref=e153]:
            - listitem [ref=e154]:
              - strong [ref=e155]: "Weight tying:"
              - text: Sharing embedding and output projection matrices reduces parameters by ~600M for GPT-3 scale while adding a regularization benefit.
            - listitem [ref=e156]:
              - strong [ref=e157]: "Subword vocabulary:"
              - text: BPE/SentencePiece tokenization means embeddings represent subwords, not whole words — "running" might be one token or two.
            - listitem [ref=e158]:
              - strong [ref=e159]: "Scaling:"
              - text: Embedding size is the bottleneck — all later layers must process d_model-dim vectors, so this sets the memory pressure per-token throughout the stack.
    - generic [ref=e162]:
      - generic [ref=e163]: Key Takeaways
      - heading "What Senior Engineers Know" [level=2] [ref=e164]
      - list [ref=e165]:
        - listitem [ref=e166]:
          - strong [ref=e167]: "Pre-LN vs Post-LN matters at scale:"
          - text: Post-LN (original paper) causes gradient explosion in very deep networks without careful warmup. Modern LLMs universally use Pre-LN or RMSNorm + Pre-LN, making training stable from the first step.
        - listitem [ref=e168]:
          - strong [ref=e169]: "The FFN dominates parameter count:"
          - text: In a standard 4× FFN, two-thirds of all non-embedding parameters live in the FFN layers. Reducing FFN width (e.g., from 4d to 2.67d with SwiGLU) cuts parameters significantly while maintaining quality — which is why Llama does it.
        - listitem [ref=e170]:
          - strong [ref=e171]: "Attention is O(n²) but Flash Attention hides the constant:"
          - text: Flash Attention 2 achieves ~50% of A100 peak FLOPs by keeping tiles in SRAM. This is why 128K context windows are now practical; without it, the memory writes to HBM would dominate.
        - listitem [ref=e172]:
          - strong [ref=e173]: "GQA is the free lunch for inference:"
          - text: Grouped-Query Attention (used in Llama 3, Mistral) reduces KV cache from O(N·h·n·d) to O(N·(h/g)·n·d) where g is the group size. For 8B models at batch=1 with 8K context, this saves ~2 GB of KV cache — often the difference between fitting on one GPU or two.
        - listitem [ref=e174]:
          - strong [ref=e175]: "Weight tying is non-obvious but universal:"
          - text: Tying embedding and LM head weights (vocab × d_model) saves 0.3–1.5B parameters for large-vocab models and slightly regularizes training by enforcing semantic alignment between input and output spaces.
        - listitem [ref=e176]:
          - strong [ref=e177]: "RoPE's real advantage is YaRN-style context extension:"
          - text: Learned absolute PEs hard-cap the context window. RoPE + YaRN (or linear scaling) lets you extend a 4K-context model to 128K post-hoc with minimal fine-tuning — the key technique behind Llama's context extension from 4K to 128K in Llama 3.
