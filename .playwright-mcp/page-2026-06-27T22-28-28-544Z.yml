  - banner [ref=e2]:
    - generic [ref=e3]: RAG
    - 'heading "RAG: Retrieval-Augmented Generation" [level=1] [ref=e4]'
    - paragraph [ref=e5]: "Full RAG pipeline: indexing → querying → retrieval → generation. Term-based vs embedding-based vs hybrid retrieval, chunking, query rewriting, and reranking."
  - main [ref=e6]:
    - generic [ref=e7]:
      - heading "Theory" [level=2] [ref=e8]
      - paragraph [ref=e9]:
        - text: "Retrieval-Augmented Generation (RAG) was formalized in the Lewis et al. 2020 paper from Facebook AI, but the core intuition predates it: instead of forcing a language model to memorize all facts in its weights during training, let it"
        - emphasis [ref=e10]: look things up
        - text: at inference time. This separates parametric memory (weights) from non-parametric memory (a retrieval corpus), enabling knowledge updates without retraining.
      - heading "Why LLMs Need Retrieval" [level=3] [ref=e11]
      - paragraph [ref=e12]: "A standard LLM has three fundamental limitations that RAG addresses:"
      - list [ref=e13]:
        - listitem [ref=e14]:
          - strong [ref=e15]: "Knowledge cutoff:"
          - text: GPT-4's training data ends in early 2024. A RAG system can answer questions about events from this morning.
        - listitem [ref=e16]:
          - strong [ref=e17]: "Hallucination on long-tail facts:"
          - text: Models interpolate from training distributions. For niche domain data (your company's internal docs, a specific legal corpus), the model never saw enough signal. RAG grounds the generation in retrieved source material.
        - listitem [ref=e18]:
          - strong [ref=e19]: "Context window limits for large knowledge bases:"
          - text: You cannot fit 100,000 documents in a 128K context. RAG retrieves the ~5–20 most relevant chunks — typically 2,000–8,000 tokens — and fits them precisely.
      - heading "The Full RAG Pipeline" [level=3] [ref=e20]
      - paragraph [ref=e21]: "A production RAG system has two distinct phases:"
      - paragraph [ref=e22]:
        - strong [ref=e23]: Offline Indexing Phase
        - text: "— runs once (or incrementally on updates):"
      - list [ref=e24]:
        - listitem [ref=e25]:
          - strong [ref=e26]: "Document ingestion:"
          - text: "Load PDFs, HTML, markdown, databases. Tools: LlamaIndex, LangChain document loaders, Unstructured.io."
        - listitem [ref=e27]:
          - strong [ref=e28]: "Chunking:"
          - text: "Split documents into chunks. Typical sizes: 256–1024 tokens. Strategy matters enormously (fixed-size, recursive, semantic, document-structure-aware). Chunk overlap (10–15%) prevents boundary artifacts."
        - listitem [ref=e29]:
          - strong [ref=e30]: "Embedding:"
          - text: Encode each chunk using a dense retrieval model (e.g.,
          - code [ref=e31]: text-embedding-3-large
          - text: at 3072 dims, or
          - code [ref=e32]: bge-large-en-v1.5
          - text: "at 1024 dims). Cost: ~$0.13 per 1M tokens with OpenAI."
        - listitem [ref=e33]:
          - strong [ref=e34]: "Vector store indexing:"
          - text: Store embeddings + metadata in FAISS, Pinecone, Weaviate, Qdrant, or pgvector. HNSW index gives sub-millisecond ANN retrieval even at 100M vectors.
      - paragraph [ref=e35]:
        - strong [ref=e36]: Online Query Phase
        - text: "— runs per request:"
      - list [ref=e37]:
        - listitem [ref=e38]:
          - strong [ref=e39]: "Query understanding:"
          - text: Optionally rewrite the query (HyDE, multi-query expansion) to improve recall.
        - listitem [ref=e40]:
          - strong [ref=e41]: "Retrieval:"
          - text: Fetch top-K candidates using term-based (BM25), semantic (vector ANN), or hybrid search.
        - listitem [ref=e42]:
          - strong [ref=e43]: "Reranking:"
          - text: Apply a cross-encoder reranker (Cohere Rerank, BGE reranker) on the top-K to re-score and cut to top-N (K=100 → N=5).
        - listitem [ref=e44]:
          - strong [ref=e45]: "Context assembly:"
          - text: Format retrieved chunks into the prompt. Include source metadata for citations.
        - listitem [ref=e46]:
          - strong [ref=e47]: "Generation:"
          - text: LLM generates grounded answer. The prompt instructs the model to cite sources and refuse if context is insufficient.
