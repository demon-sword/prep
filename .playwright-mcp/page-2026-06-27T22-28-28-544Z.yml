      - 'heading "Chunking: The Most Underrated Hyperparameter" [level=3] [ref=e86]'
      - paragraph [ref=e87]: "Chunking strategy has an outsized impact on RAG quality — often more than the choice of LLM. Key considerations:"
      - list [ref=e88]:
        - listitem [ref=e89]:
          - strong [ref=e90]: Fixed-size chunking
          - text: (e.g., 512 tokens, 10% overlap) is the default but breaks mid-sentence and loses context. Fast to implement.
        - listitem [ref=e91]:
          - strong [ref=e92]: Recursive character splitter
          - text: "(LangChain default): splits on paragraph → sentence → word boundaries in priority order. Much better than fixed-size."
        - listitem [ref=e93]:
          - strong [ref=e94]: Semantic chunking
          - text: ": embed sentences, split where cosine similarity drops sharply. Better boundaries, higher compute."
        - listitem [ref=e95]:
          - strong [ref=e96]: Document-structure-aware
          - text: ": respect markdown headers, HTML structure, PDF sections. Produces the most coherent chunks for structured docs."
        - listitem [ref=e97]:
          - strong [ref=e98]: Small-to-large retrieval
          - text: ": index small chunks for precision, but retrieve parent sections for context. Used in LlamaIndex's SentenceWindowNodeParser."
      - heading "Advanced RAG Patterns" [level=3] [ref=e99]
      - paragraph [ref=e100]:
        - strong [ref=e101]: "HyDE (Hypothetical Document Embeddings):"
        - text: Generate a hypothetical answer using the LLM, embed that answer, retrieve documents similar to the hypothetical answer rather than the query. Improves recall when queries are short/ambiguous (Gao et al., 2022).
      - paragraph [ref=e102]:
        - strong [ref=e103]: "Self-RAG:"
        - text: The LLM learns when to retrieve (via a retrieval token), critiques retrieved passages (relevant? supported? useful?), and decides whether to use them. Trained with special tokens; achieves better faithfulness than vanilla RAG.
      - paragraph [ref=e104]:
        - strong [ref=e105]: "RAPTOR:"
        - text: Build a hierarchical tree of chunk summaries; retrieve at multiple levels of abstraction simultaneously. Better for multi-hop questions requiring synthesis across many documents.
      - paragraph [ref=e106]:
        - strong [ref=e107]: "GraphRAG (Microsoft, 2024):"
        - text: Build a knowledge graph over the corpus; retrieve entity neighborhoods and community summaries rather than raw chunks. 2–3× better on global questions ("What are the main themes in this corpus?").
      - 'heading "RAG Evaluation: RAGAS and Beyond" [level=3] [ref=e108]'
      - paragraph [ref=e109]: "RAG introduces its own failure modes that standard LLM metrics miss. The RAGAS framework (Es et al., 2023) decomposes evaluation into:"
      - list [ref=e110]:
        - listitem [ref=e111]:
          - strong [ref=e112]: "Faithfulness:"
          - text: Does the answer only contain claims supported by the retrieved context? (Measures hallucination on top of retrieval)
        - listitem [ref=e113]:
          - strong [ref=e114]: "Answer Relevance:"
          - text: Does the answer address the question? (LLM-as-judge)
        - listitem [ref=e115]:
          - strong [ref=e116]: "Context Precision:"
          - text: Of the retrieved chunks, what fraction were actually useful?
        - listitem [ref=e117]:
          - strong [ref=e118]: "Context Recall:"
          - text: What fraction of the ground-truth answer is supported by the retrieved context? (Requires ground truth)
      - paragraph [ref=e120]:
        - text: "Production rule of thumb:"
        - strong [ref=e121]: Context Precision
        - text: is more important than K. Retrieving 5 highly relevant chunks beats retrieving 20 chunks where 15 are noise — noise chunks confuse the LLM and inflate latency. Use a reranker to achieve high precision at reasonable recall.
