    - generic [ref=e156]:
      - heading "Key Takeaways" [level=2] [ref=e157]
      - list [ref=e158]:
        - listitem [ref=e159]:
          - strong [ref=e160]: Chunking strategy often matters more than model choice.
          - text: A poorly chunked corpus with GPT-4 will underperform a well-chunked corpus with a smaller model. Invest in document-structure-aware splitting, test with RAGAS Context Precision, and use small-to-large retrieval for length-sensitive documents.
        - listitem [ref=e161]:
          - strong [ref=e162]: Hybrid retrieval (BM25 + dense) wins on most benchmarks.
          - text: BM25 catches exact keyword matches that dense retrieval misses (product codes, names, acronyms); dense retrieval catches paraphrase and semantic intent. Reciprocal Rank Fusion fusion at K=60 is simple and effective — use Elasticsearch or Weaviate's built-in hybrid mode in production.
        - listitem [ref=e163]:
          - strong [ref=e164]: A reranker is the highest ROI retrieval improvement.
          - text: Retrieve K=100 with ANN (cheap), rerank to N=5 with a cross-encoder (Cohere Rerank API at ~$1/1000 requests, or BGE-reranker-large self-hosted). This dramatically improves Context Precision without rebuilding the index.
        - listitem [ref=e165]:
          - strong [ref=e166]: RAG ≠ no hallucination.
          - text: LLMs still hallucinate
          - emphasis [ref=e167]: on top of
          - text: retrieved context — they misread chunks, confabulate details not in the context, or ignore retrieved content entirely. Measure Faithfulness (RAGAS) in addition to answer quality. System prompts like "Only answer based on the provided context; say I don't know if uncertain" reduce but do not eliminate this.
        - listitem [ref=e168]:
          - strong [ref=e169]: Knowledge graph RAG (GraphRAG) for analytical queries; chunk RAG for lookup queries.
          - text: Flat chunk RAG fails on cross-document synthesis ("What themes appear across all company memos?"). GraphRAG or RAPTOR hierarchical retrieval handle these at the cost of a more complex offline pipeline. Pick based on your query distribution.
        - listitem [ref=e170]:
          - strong [ref=e171]: Embedding model choice has a hard floor.
          - text: If your domain uses specialized vocabulary (medical, legal, code), a general-purpose embedding model degrades precision significantly. Fine-tune an embedding model on domain pairs (Matryoshka embeddings, MTEB-optimized) or use domain-specific models (MedCPT for biomedical, CodeBERT for code retrieval).
