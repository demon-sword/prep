    - generic [ref=e95]:
      - generic [ref=e96]: Key Takeaways
      - list [ref=e97]:
        - listitem [ref=e98]:
          - text: ▸
          - strong [ref=e99]: Data depletion is measurable now.
          - text: High-quality English internet text is estimated at 5–15T tokens. Frontier models training on 10–15T tokens are each consuming a significant fraction of the total stock — repetition and synthetic augmentation are already operational necessities, not future concerns.
        - listitem [ref=e100]:
          - text: ▸
          - strong [ref=e101]: Synthetic data solves tokens, not quality.
          - text: Phi-1 and Llama 3 proved synthetic data works — but model collapse (Shumailov 2024) is a real failure mode when synthetic examples loop back without grounding. Verifiable domains (code, math) are safer; open-ended prose is not.
        - listitem [ref=e102]:
          - text: ▸
          - strong [ref=e103]: Energy cost is the first-class budget line.
          - text: At $0.05–0.08/kWh and 50–100 GWh per frontier run, electricity alone is $2.5M–$8M. At inference scale (100B+ requests/day), energy dwarfs all other opex. GPU power efficiency (flops/watt) is now a primary chip selection criterion.
        - listitem [ref=e104]:
          - text: ▸
          - strong [ref=e105]: The binding constraint is the substation, not the GPU.
          - text: New data center power comes from utility grid upgrades — 2–5 year queues. You cannot buy your way out faster than the grid can deliver. This makes geography (cheap hydro in PNW, Iceland, Norway) and regulatory permitting a strategic advantage.
        - listitem [ref=e106]:
          - text: ▸
          - strong [ref=e107]: Inference-time compute is the current escape hatch.
          - text: "o1/o3 and DeepSeek-R1 shift the tradeoff: spend thinking tokens at inference rather than training tokens. This trades one bottleneck (data) for another (latency tolerance and inference cost), which is currently more manageable at frontier capability levels."
        - listitem [ref=e108]:
          - text: ▸
          - strong [ref=e109]: Export controls reshape the capability landscape.
          - text: BIS restrictions on A100/H100 exports create a bifurcated global compute market. Engineers working on international deployments must model chip availability as a supply-chain risk, not a commodity assumption.
