- generic [ref=e1]:
  - banner [ref=e2]:
    - generic [ref=e3]: Foundations
    - heading "LLM Development Bottlenecks" [level=1] [ref=e4]
    - paragraph [ref=e5]: "The two macro constraints shaping the frontier: training data (quantity, quality, and approaching depletion) and electricity/compute (energy cost, data center capacity, chip availability)."
  - main [ref=e6]:
    - generic [ref=e7]:
      - generic [ref=e8]: Theory
      - paragraph [ref=e9]: "Scaling laws (Kaplan et al. 2020, Chinchilla 2022) give us the recipe for better LLMs: more parameters, more tokens, more compute. But two hard physical limits constrain how far and how fast that recipe can be followed. Understanding them is essential for any engineer planning training runs or forecasting capability jumps."
      - 'heading "Bottleneck 1: Training Data" [level=2] [ref=e10]'
      - heading "Quantity and the Depletion Horizon" [level=3] [ref=e11]
      - paragraph [ref=e12]:
        - text: GPT-3 was trained on ~300 billion tokens. Chinchilla-optimal for a 70B model is roughly
        - strong [ref=e13]: 1.4 trillion tokens
        - text: . Llama 3 (70B) trained on
        - strong [ref=e14]: 15 trillion tokens
        - text: —well beyond Chinchilla-optimal— because inference cost dominates at deployment scale, so over-training on data pays off. The problem is that high-quality English internet text is finite. Epoch AI estimated that the stock of public high-quality text on the internet could be exhausted for training purposes somewhere between
        - strong [ref=e15]: 2026 and 2032
        - text: depending on demand growth.
      - paragraph [ref=e16]:
        - text: "To put numbers on it: Common Crawl, Wikipedia, Books, ArXiv, GitHub combined yield roughly"
        - strong [ref=e17]: 5–15 trillion quality-filtered tokens
        - text: of English text. If each frontier model trains on 10–15T tokens, the top labs are competing for the same fixed resource.
      - heading "Quality Is the Harder Problem" [level=3] [ref=e18]
      - paragraph [ref=e19]: "Raw token count is deceiving. The FineWeb and DCLM papers (2024) showed that careful deduplication, quality filtering, and domain reweighting can improve benchmark performance more than simply adding raw tokens. The filtering pipeline typically:"
      - list [ref=e20]:
        - listitem [ref=e21]: Removes near-duplicates with MinHash LSH (dedup removes 10–60% of typical crawls)
        - listitem [ref=e22]: Applies language-ID filtering (fastText or similar)
        - listitem [ref=e23]: Quality-scores with a reference classifier (C4 heuristics, perplexity on a seed corpus, or a trained scorer)
        - listitem [ref=e24]: Reweights domain mixing ratios (code, math, web, books) using ablation runs
      - paragraph [ref=e25]: The engineering effort on data quality now rivals model architecture work at frontier labs. Poor data quality manifests as hallucinations, biases, and brittle reasoning—not just lower benchmark numbers.
      - heading "Synthetic Data as the Escape Valve" [level=3] [ref=e26]
      - paragraph [ref=e27]:
        - text: The industry response to near-depletion is
        - strong [ref=e28]: synthetic data generation
        - text: ": use a frontier model to produce new training examples, filtered for quality. Phi-1 (1.3B) trained only on synthetic \"textbook quality\" code data and matched much larger models. Meta's Llama 3 used synthetic data extensively for post-training. The risks are:"
      - list [ref=e29]:
        - listitem [ref=e30]:
          - strong [ref=e31]: Model collapse
          - text: ": recursively training on model outputs degrades distribution diversity (Shumailov et al. 2024)"
        - listitem [ref=e32]:
          - strong [ref=e33]: Bias amplification
          - text: ": the generator's biases bake into the student"
        - listitem [ref=e34]:
          - strong [ref=e35]: Verification cost
          - text: ": synthetic math/code can be verified (unit tests, symbolic solvers) but open-ended text cannot be cheaply verified at scale"
      - 'heading "Bottleneck 2: Electricity & Compute" [level=2] [ref=e36]'
      - heading "Energy Cost of Training" [level=3] [ref=e37]
      - paragraph [ref=e38]:
        - text: Training GPT-3 consumed an estimated
        - strong [ref=e39]: 1.3 GWh
        - text: of electricity. GPT-4 class training runs are estimated at
        - strong [ref=e40]: 50–100+ GWh
        - text: . A 500MW data center running 10,000 H100s at full utilization for 90 days draws roughly
        - strong [ref=e41]: 3.2 TWh
        - text: —enough to power ~300,000 US homes for a year. Electricity cost alone (at $0.05–$0.08/kWh data-center rates) is $50–$250M per frontier training run.
      - heading "Data Center Capacity" [level=3] [ref=e42]
      - paragraph [ref=e43]:
        - text: Building a hyperscale AI data center takes
        - strong [ref=e44]: 2–4 years
        - text: "from land acquisition to commissioning. Power grid interconnects are the binding constraint: utilities have 5–10 year queues for large industrial power requests in many US markets. Microsoft, Google, and Meta announced combined >$100B in data center capex for 2024–2025. The bottleneck is not money—it is transformer substations and transmission lines."
      - heading "Chip Availability and Export Controls" [level=3] [ref=e45]
      - paragraph [ref=e46]: NVIDIA H100 GPUs were constrained throughout 2023–2024, with lead times exceeding 6–9 months. US export controls (BIS Entity List, October 2023 and subsequent) restrict A100/H100 exports to China and parts of the Middle East, reshaping global AI capability geography. Each H100 costs ~$25,000–$40,000; a 10,000-GPU cluster represents $250M–$400M in hardware before networking, cooling, or facilities.
      - paragraph [ref=e48]:
        - strong [ref=e49]: "The compounding constraint:"
        - text: Larger models need exponentially more compute, which needs more chips, more power, more cooling, and more facilities—all on timelines of years, not months. The data depletion and energy walls arrive simultaneously with the capability frontier's appetite.
      - heading "Second-Order Effects" [level=2] [ref=e50]
      - heading "The Quality-Compute Substitution" [level=3] [ref=e51]
      - paragraph [ref=e52]: "When raw data and raw compute are constrained, labs substitute quality: better data curation (FineWeb), better architectures (MoE to reduce active params), better training algorithms (muP, Lion optimizer), and better post-training (RLHF, DPO). This is why capability gains continue despite constraints—the efficiency frontier is moving."
      - heading "Inference-Time Compute as an Escape Hatch" [level=3] [ref=e53]
      - paragraph [ref=e54]:
        - text: OpenAI's o1/o3 series and DeepSeek-R1 demonstrated that spending more compute at
        - emphasis [ref=e55]: inference
        - text: time (chain-of-thought, search, verification) can substitute for training compute. A model that "thinks longer" on hard problems may outperform a larger model trained on more data. This shifts the bottleneck from training-time data/energy to inference-time compute and latency tolerance.
      - heading "Geopolitical and Environmental Dimensions" [level=3] [ref=e56]
      - paragraph [ref=e57]: "Energy constraints interact with sustainability commitments: Google's net-zero pledge was challenged by AI's power demands. Water usage for cooling is another hidden cost (~1.5 liters per kWh for evaporative cooling). Regulators in EU and US are beginning to require AI energy disclosure. For engineers, these are not abstract concerns—they determine where you can build, how fast you can scale, and what your marginal cost of a training run actually is."
