    - heading "RLHF — Reinforcement Learning from Human Feedback" [level=1] [ref=e4]
    - paragraph [ref=e5]: "Full RLHF pipeline: SFT → reward model training from human preferences → PPO optimization. Key components, reward hacking, and why it's expensive."
  - main [ref=e6]:
    - generic [ref=e7]:
      - generic [ref=e8]: // theory
      - heading "How RLHF Works" [level=2] [ref=e9]
      - paragraph [ref=e10]:
        - text: Pretraining produces a model that can complete text in any direction — helpful, harmful, rambling, or terse. The distribution of internet text is not the distribution of
        - emphasis [ref=e11]: good assistant behavior
        - text: . RLHF (Reinforcement Learning from Human Feedback) bridges this gap by shaping the model's behavior toward human-preferred outputs through three sequential stages.
      - heading "Why Pretraining Alone Isn't Enough" [level=3] [ref=e12]
      - paragraph [ref=e13]:
        - text: A raw pretrained model like GPT-3 will complete "How do I bake a cake?" with "…which requires measuring flour carefully. The recipe below…" because that's what recipe articles look like. But it's equally likely to respond "…honestly depends on your grandmother's secret ingredients" or generate an irrelevant continuation. The model has no concept of
        - emphasis [ref=e14]: intent-fulfillment
        - text: — it just models probability distributions over tokens. Post-training via RLHF teaches the model what "being helpful and harmless" means at a distributional level.
      - heading "Stage 1 — Supervised Fine-Tuning (SFT)" [level=3] [ref=e15]
      - paragraph [ref=e16]:
        - text: "The first stage runs standard supervised fine-tuning on a curated dataset of (prompt, ideal completion) pairs written or selected by expert annotators. This dataset is typically small — InstructGPT used ~13K demonstrations — because the quality bar is high and annotation is expensive. The SFT stage accomplishes two things: it teaches the model the"
        - emphasis [ref=e17]: format
        - text: of instruction-following, and it gives the PPO stage in Stage 3 a better starting point than the raw pretrained model. SFT alone can be remarkably powerful; models like Alpaca (fine-tuned on 52K GPT-4-generated instructions) showed strong instruction-following from SFT only.
      - heading "Stage 2 — Reward Model Training" [level=3] [ref=e18]
      - paragraph [ref=e19]: A reward model (RM) is trained to predict human preferences between outputs. Annotators receive two or more completions for the same prompt and rank them. This comparative annotation is far easier for humans than writing ideal completions — it's much simpler to say "completion A is better than B" than to produce a perfect A from scratch.
      - generic [ref=e20]:
        - text: Loss(RM) = −E[log σ(r(x, y_w) − r(x, y_l))]
        - text: where y_w = preferred completion, y_l = less preferred, r = reward score
      - paragraph [ref=e21]: This is a Bradley-Terry pairwise preference model. InstructGPT trained on ~33K comparisons. The reward model is initialized from the SFT model (with a scalar head replacing the language model head) and learns to assign higher reward to preferred outputs. Crucially, the RM generalizes — it scores outputs it was never explicitly trained on.
      - paragraph [ref=e22]: Reward model quality is critical and underappreciated. A weak RM that doesn't actually capture human intent will cause Stage 3 to optimize against the wrong signal. Testing the RM's inter-annotator agreement, its correlation with ground-truth human preferences on held-out data, and its calibration (does a reward of 0.8 actually mean better than 0.5?) is essential before proceeding.
      - heading "Stage 3 — PPO Fine-Tuning (Policy Optimization)" [level=3] [ref=e23]
      - paragraph [ref=e24]: "Proximal Policy Optimization (PPO) uses the reward model to improve the SFT model. The SFT model becomes the \"policy\" (π_θ), and PPO iteratively generates completions, scores them with the RM, and updates the policy to maximize expected reward. To prevent the policy from drifting too far from the SFT baseline (which would collapse language quality), a KL divergence penalty term is added:"
      - generic [ref=e25]: Objective = E[r_RM(x, y)] − β · KL[π_θ(y|x) || π_SFT(y|x)]
      - paragraph [ref=e26]:
        - text: The
        - code [ref=e27]: β
        - text: "coefficient (typically 0.01–0.1) controls the KL penalty. Too low: reward hacking. Too high: the policy barely moves from SFT. PPO itself is an on-policy algorithm — it must generate new samples every gradient step, making it compute-intensive. InstructGPT used 4–8 GPUs to simultaneously run sampling + scoring + gradient updates in a synchronized pipeline."
      - heading "Reward Hacking" [level=3] [ref=e28]
      - paragraph [ref=e29]: Reward hacking (Goodhart's Law applied to RL) is the central failure mode of RLHF. Because the RM is an imperfect proxy for human preferences, the policy can find high-reward outputs that are not actually good — for example, verbose but vacuous responses (RM correlates reward with length), excessive sycophancy ("That's a great question!"), or grammatically fluent nonsense. The KL penalty mitigates this but doesn't eliminate it. Anthropic found that beyond a certain KL budget, every model gets worse in actual human evaluations even as RM scores rise — a phenomenon called "reward model exploitation."
      - generic [ref=e30]:
        - strong [ref=e31]: "Production Reality:"
        - text: RLHF at scale is expensive. InstructGPT's PPO stage required months of human annotation ($600K+ per training run at scale), specialized RL infrastructure, and careful hyperparameter tuning. This is why DPO (Stage 12) — which eliminates the RM and PPO — gained rapid adoption. But RLHF remains the gold standard for highest-quality alignment because the reward model can be updated independently of policy training and can incorporate new feedback continuously.
      - heading "Key Hyperparameters & Instabilities" [level=3] [ref=e32]
      - list [ref=e33]:
        - listitem [ref=e34]:
          - strong [ref=e35]: "KL coefficient (β):"
          - text: Start at 0.02, monitor KL distance per step
        - listitem [ref=e36]:
          - strong [ref=e37]: "Rollout batch size:"
          - text: Larger = more stable gradients but slower iteration
        - listitem [ref=e38]:
          - strong [ref=e39]: "Reward normalization:"
          - text: Normalize rewards to zero mean / unit variance per batch to avoid scale drift
        - listitem [ref=e40]:
          - strong [ref=e41]: "Clip ratio (ε):"
          - text: PPO's trust region, typically 0.1–0.2; prevents large policy jumps
        - listitem [ref=e42]:
          - strong [ref=e43]: "Value network:"
          - text: Separate value head for PPO's advantage estimation — must be warmed up before policy updates
      - heading "Real Systems Using RLHF" [level=3] [ref=e44]
      - paragraph [ref=e45]: OpenAI's InstructGPT (2022) was the first large-scale demonstration. ChatGPT, Claude 1/2/3, Gemini, and Llama-2-Chat all use RLHF variants. Anthropic's Constitutional AI (CAI) adds a self-critique loop before the reward model stage, generating preference pairs from the model itself using a set of principles — reducing reliance on human annotators. Meta's Llama-2-Chat paper reported running RLHF for multiple iterations, updating the reward model with fresh human feedback each round before the next PPO stage — sometimes called "iterative RLHF."
