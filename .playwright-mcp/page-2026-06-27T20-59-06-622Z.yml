    - generic [ref=e109]:
      - generic [ref=e110]: // key takeaways
      - heading "Senior-Level Insights" [level=2] [ref=e111]
      - list [ref=e112]:
        - listitem [ref=e113]:
          - text: →
          - strong [ref=e114]: The RM is the weakest link.
          - text: Reward hacking is guaranteed if the reward model is imperfect — and it always is. Monitor RM scores alongside actual human evaluation; they diverge with just 2–3 rounds of PPO at scale. Keep a frozen "gold" human eval set and run it every checkpoint.
        - listitem [ref=e115]:
          - text: →
          - strong [ref=e116]: KL penalty β is not a hyperparameter you tune once.
          - text: The right β depends on how far you want to move the policy from SFT and how much reward hacking your RM exhibits. Start at 0.02, watch KL per PPO step — if it's climbing past 4–5 nats, increase β. Anthropic's CAI paper reports needing per-iteration β tuning across their iterative RLHF rounds.
        - listitem [ref=e117]:
          - text: →
          - strong [ref=e118]: PPO is on-policy and expensive.
          - text: Every gradient step requires fresh rollouts from the current policy, which means the full inference stack must be running in parallel with the training stack. At 70B parameter scale, this means 8+ A100 nodes just for the rollout buffer — before you factor in the reward model (itself a large LM) scoring each completion.
        - listitem [ref=e119]:
          - text: →
          - strong [ref=e120]: Annotation quality matters more than quantity.
          - text: InstructGPT showed that 13K SFT examples from expert contractors outperformed 100K crowdsourced examples. For reward model training, inter-annotator agreement below 70% produces RM noise that propagates through PPO. Budget for annotation QA, not just raw throughput.
        - listitem [ref=e121]:
          - text: →
          - strong [ref=e122]: Iterative RLHF beats single-pass.
          - text: "Meta's Llama-2-Chat ran 5 rounds of RLHF: each round gathered fresh human preference data on outputs from the previous round's policy, retrained the RM, and ran PPO again. Each iteration's model generates harder-to-rank outputs, which trains a stronger RM. This compounding is why Llama-2-70B-Chat significantly outperforms single-round RLHF baselines."
        - listitem [ref=e123]:
          - text: →
          - strong [ref=e124]: DPO is faster but RLHF gives more control.
          - text: DPO (Direct Preference Optimization) eliminates the RM and PPO loop by treating preferences as a classification problem over policy outputs — 3–5× cheaper to train. But RLHF's separate RM can be updated with new feedback without retraining the policy, and the explicit reward signal enables techniques like reward model ensembling and uncertainty estimation that DPO cannot easily replicate.
