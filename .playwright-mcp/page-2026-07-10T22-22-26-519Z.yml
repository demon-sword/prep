    - generic [ref=f10e171]:
      - heading "Key Takeaways" [level=2] [ref=f10e172]
      - list [ref=f10e173]:
        - listitem [ref=f10e174]:
          - text: →
          - strong [ref=f10e175]: Quantization is a memory-bandwidth optimization first, compute optimization second.
          - text: The decode phase is memory-bandwidth-bound at real-world batch sizes. Quantization reduces the bytes-per-weight that must be streamed from HBM each token. The throughput ceiling scales linearly with compression ratio — int4 gives you ~4× the theoretical tok/s of fp16 on the same GPU, even ignoring compute savings from int4 matmuls.
        - listitem [ref=f10e176]:
          - text: →
          - strong [ref=f10e177]: AWQ outperforms uniform int4 because it protects salient channels.
          - text: "Not all weight channels are equal: channels with high activation magnitudes contribute disproportionately to layer output. AWQ keeps ~1% of weights at fp16 (salient channels) and int4-quantizes the rest. GPTQ minimizes L2 error but ignores activation salience. In practice, AWQ-int4 and GPTQ-int4 are within 0.5–1% on MMLU for 70B models, but AWQ tends to handle outlier-heavy models (Mixtral, Llama 3) better."
        - listitem [ref=f10e178]:
          - text: →
          - strong [ref=f10e179]: Uniform quantization hurts — outlier channels are the enemy.
          - text: In transformer models, ~0.1% of hidden dimensions have activation magnitudes 10–100× larger than average. Uniform int8 quantization of these channels causes catastrophic errors. LLM.int8() solves this by keeping outlier columns in fp16; SmoothQuant solves it by migrating the outlier magnitude to adjacent weight channels. Either way, you must address outliers — they are not a corner case.
        - listitem [ref=f10e180]:
          - text: →
          - strong [ref=f10e181]: int4 on 70B+ models is production-safe.
          - text: Llama 3 70B int4 (AWQ) scores ~81.5% on MMLU vs ~83.5% at fp16 — a ~2% absolute drop. For most production applications (chat, summarization, RAG, code generation), this is imperceptible. The VRAM savings (140 GB → 35 GB, running on a single 48GB GPU instead of 2×A100s) are transformative. Below 8B parameters, int4 degrades more noticeably — stick with int8 for small models.
        - listitem [ref=f10e182]:
          - text: →
          - strong [ref=f10e183]: The GGUF ecosystem makes consumer-hardware LLM deployment practical.
          - text: "llama.cpp's per-layer mixed precision (Q4_K_M: Q6 for attention, Q5 for FFN gates, Q4 for FFN downs) squeezes the most quality out of 4-bit budgets. It's not just for hobbyists — Mac Studios running llama.cpp serve production workloads at small-to-medium scale. The key numbers: 70B Q4_K_M at ~12 tok/s on Mac Studio 192GB; 8B Q4_K_M at ~40 tok/s on M2 Max. Offloading layers to GPU while keeping others on CPU RAM enables running larger models than VRAM alone would allow."
        - listitem [ref=f10e184]:
          - text: →
          - strong [ref=f10e185]: NF4 + double quantization is the information-theoretic ideal for normally distributed weights.
          - text: QLoRA's NormalFloat data type allocates quantization levels proportional to the probability mass of a standard normal distribution — it is provably optimal for Gaussian-distributed data. Combined with 8-bit double quantization of scaling factors, NF4 achieves ~4.5 effective bits/parameter (beating uniform int4's 4.0). For QLoRA finetuning, this means the base model fits in ~33 GB instead of ~35 GB for Llama 3 70B — small gap, but enough to matter on a 48GB GPU.
