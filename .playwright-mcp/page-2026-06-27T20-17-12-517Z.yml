    - generic [ref=e120]:
      - heading "Key Takeaways" [level=2] [ref=e121]
      - list [ref=e122]:
        - listitem [ref=e123]:
          - strong [ref=e124]: Vanishing gradients are architectural, not incidental.
          - text: In vanilla RNNs, the gradient signal multiplies through
          - code [ref=e125]: W_h
          - text: "'s spectral norm at every timestep — at norm 0.9, after 50 steps the gradient is 0.9⁵⁰ ≈ 0.005. LSTMs' additive cell update provides a direct gradient highway, but they still degrade past ~500 tokens."
        - listitem [ref=e126]:
          - strong [ref=e127]: Sequential computation is a GPU killer.
          - text: An RNN on a sequence of length T uses only 1/T of GPU parallelism compared to a transformer. For T=512 tokens, that's 0.2% GPU utilization during sequence processing — the single biggest reason RNNs lost the race.
        - listitem [ref=e128]:
          - strong [ref=e129]: GRU ≈ LSTM in most benchmarks, ~25% cheaper.
          - text: For production sequence tasks where you're still using RNNs (on-device speech, lightweight time-series), GRU is usually the right default. LSTM is worth trying only when the task requires selective forgetting that GRU's merged gate can't express.
        - listitem [ref=e130]:
          - strong [ref=e131]: The hidden state bottleneck never goes away.
          - text: A 512-dim LSTM hidden state must compress everything relevant from an arbitrary-length past into 512 floats. At ~1K+ tokens, this bottleneck dominates quality. Attention sidesteps this by making the "memory" grow with sequence length — at the cost of O(n²) compute.
        - listitem [ref=e132]:
          - strong [ref=e133]: BPTT through time is memory-intensive.
          - text: Full backpropagation through T timesteps requires storing all intermediate activations — O(T) memory. For long sequences, truncated BPTT (e.g., backprop only 100 steps back) is standard but trades gradient quality for memory. This is a hidden training cost that transformer training (gradient checkpointing) handles more elegantly.
        - listitem [ref=e134]:
          - strong [ref=e135]: RNNs live on in hybrids.
          - text: Mamba (2023) and RWKV (2023) revive the linear-recurrence idea with modern gating to achieve O(n) inference — transformer-quality results without the quadratic attention cost. They matter for very long contexts (100K+ tokens) where attention becomes prohibitively expensive.
