    - generic [ref=e92]:
      - heading "Key Takeaways" [level=2] [ref=e93]
      - list [ref=e94]:
        - listitem [ref=e95]:
          - strong [ref=e96]: "Dual-mode architecture:"
          - text: RWKV trains as a transformer (parallel across time) but infers as an RNN (O(1) per token). This is not a compromise — it's a deliberate design that gets the best of both worlds for most practical workloads.
        - listitem [ref=e97]:
          - strong [ref=e98]: "KV cache elimination is the killer feature:"
          - text: At 128K context, a 7B transformer needs ~80 GB of KV cache; RWKV needs a fixed ~few MB of state. This changes the economics of long-context inference fundamentally.
        - listitem [ref=e99]:
          - strong [ref=e100]: "The information bottleneck is real:"
          - text: Exponential decay means RWKV can "forget" distant tokens — needle-in-haystack tasks and exact retrieval over very long ranges degrade more than with transformers. RWKV-6's data-dependent W mitigates but doesn't eliminate this.
        - listitem [ref=e101]:
          - strong [ref=e102]: "Production readiness:"
          - text: RWKV-6 at 7B/14B is genuinely competitive on standard NLP benchmarks (MMLU, HellaSwag, ARC). The
          - code [ref=e103]: rwkv.cpp
          - text: and Hugging Face integrations are mature enough for production edge deployment today.
        - listitem [ref=e104]:
          - strong [ref=e105]: "State serialization unlocks new UX:"
          - text: You can serialize the RWKV hidden state to disk after processing a long prompt, then restore it later — giving "free" conversation memory without re-processing history. Transformers can't do this without storing the full KV cache.
        - listitem [ref=e106]:
          - strong [ref=e107]: "Hybrid future:"
          - text: The trend is toward hybrid architectures (Mamba, Griffin, Jamba) that interleave linear-recurrence layers with occasional full attention layers — giving O(n) cost for most positions while retaining perfect recall at sparse checkpoints.
