    - generic [ref=e155]:
      - heading "Key Takeaways" [level=2] [ref=e156]
      - list [ref=e157]:
        - listitem [ref=e158]:
          - text: →
          - strong [ref=e159]: trace_id is the first thing you implement — not the last.
          - text: Assign a UUID per run, attach it to every log line, span, and error message. Without it, correlating a user complaint ("the agent gave me a wrong answer at 3pm") with internal logs is a manual grep through thousands of lines. This is table stakes, not a nice-to-have.
        - listitem [ref=e160]:
          - text: →
          - strong [ref=e161]: Tool success rate is your leading health indicator.
          - text: LLM output quality is hard to measure in real-time. Tool success rate is not — it's a simple count of errors vs. successes. A sudden drop from 98% to 92% on a specific tool is the earliest signal that something changed upstream (API deprecation, rate limiting, schema change) and it alerts you before users notice degraded quality.
        - listitem [ref=e162]:
          - text: →
          - strong [ref=e163]: Context window saturation silently degrades agent behavior.
          - text: When an LLM call uses 85%+ of the context window, older messages are truncated, and the agent loses access to early instructions and observations. This produces subtle failures — not crashes, but wrong answers — that are extremely hard to diagnose without instrumentation. Monitor context utilization on every LLM call span.
        - listitem [ref=e164]:
          - text: →
          - strong [ref=e165]: Sampling full traces is essential at scale — trace everything at the session level, sample at the span level.
          - text: Storing every token of every LLM call for 100K+ runs/day can cost more than running the agent. Log session-level aggregates (steps, cost, status) for 100% of runs; capture full span traces for 100% of errors and 5–10% of successful runs. Use adaptive sampling based on anomaly score if you have the infra for it.
        - listitem [ref=e166]:
          - text: →
          - strong [ref=e167]: Replay debugging is the only reliable way to fix long-horizon agent failures.
          - text: A 20-step agent failure where the root cause is at step 9 is unsolvable from aggregate metrics alone. Store the exact prompt and response of every LLM call in a run, build a replayer that substitutes stored responses, and step through the agent like a debugger. Teams that skip this spend 10× longer debugging production incidents.
        - listitem [ref=e168]:
          - text: →
          - strong [ref=e169]: Cost instrumentation must be per-step, not per-run.
          - text: A prompt change that adds a single extra reasoning step per run increases cost by 10–20%. If you only monitor total cost per run, you won't know which step became more expensive — and you won't know which prompt to fix. Attribute input tokens, output tokens, and model used to every individual LLM call span.
