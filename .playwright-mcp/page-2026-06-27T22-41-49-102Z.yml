    - heading "Agent Memory Systems" [level=1] [ref=e4]
    - paragraph [ref=e5]: Short-term (in-context) vs long-term (external storage) memory, why memory matters beyond context window, cross-session persistence, and consistency benefits.
  - main [ref=e6]:
    - generic [ref=e7]:
      - heading "Theory" [level=2] [ref=e8]
      - paragraph [ref=e9]:
        - text: AI agents are only as capable as the information they can recall and reason over. Unlike a stateless LLM call that begins fresh each time, a
        - strong [ref=e10]: memory system
        - text: allows an agent to maintain continuity — tracking what it has done, what the user has told it, and what knowledge it has acquired — across turns, sessions, and even deployments. Understanding memory architectures is essential for building agents that are reliable, personalized, and cost-efficient at scale.
      - heading "Why Context Window Alone Is Not Enough" [level=3] [ref=e11]
      - paragraph [ref=e12]: "Every LLM operates on a fixed-length context window — typically 4K–200K tokens. Early GPT-3 was 4,096 tokens; Claude 3's context extends to 200K; Gemini 1.5 Pro supports 1M tokens experimentally. But even a 200K context window has fundamental limits:"
      - list [ref=e13]:
        - listitem [ref=e14]:
          - strong [ref=e15]: "Cost:"
          - text: Prefilling a full 200K context on every turn costs ~$0.30–$1.00 per request at current API pricing, making it economically prohibitive for persistent agents.
        - listitem [ref=e16]:
          - strong [ref=e17]: "Latency:"
          - text: Long prompts have longer time-to-first-token. A 100K token prefill can take 3–15 seconds even on fast hardware.
        - listitem [ref=e18]:
          - strong [ref=e19]: "Lost-in-the-middle problem:"
          - text: Empirically (Liu et al., 2023), LLM accuracy degrades significantly for information positioned in the middle of a long context — models attend most reliably to the start and end.
        - listitem [ref=e20]:
          - strong [ref=e21]: "Cross-session persistence:"
          - text: Context evaporates when the session ends. A user returning next week appears as a complete stranger without external memory.
      - paragraph [ref=e22]: External memory systems solve these problems by selectively retrieving only the relevant memories into the context window — maintaining the illusion of perfect recall without burning the full window.
