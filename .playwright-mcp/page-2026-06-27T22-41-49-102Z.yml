    - generic [ref=e156]:
      - heading "Key Takeaways" [level=2] [ref=e157]
      - list [ref=e158]:
        - listitem [ref=e159]:
          - text: →
          - strong [ref=e160]: Context window ≠ memory.
          - text: Even 200K tokens is too expensive to fill every turn. At $5/M input tokens, a 100K-token prefill costs $0.50 per request — a 1M DAU agent burns $500K/day just on memory. Selective retrieval is not optional; it's economic necessity.
        - listitem [ref=e161]:
          - text: →
          - strong [ref=e162]: The "lost-in-the-middle" problem is real and measured.
          - text: Liu et al. (2023) showed accuracy drops 20–30% for retrieval tasks when relevant content is in the middle of a 128K context vs. at the start. Prioritize injecting memories at the beginning or end of context, never the middle.
        - listitem [ref=e163]:
          - text: →
          - strong [ref=e164]: Memory write policy determines system quality.
          - text: Implicit "always-store" policies bloat vector DBs with noise, degrading retrieval precision. Explicit or scheduled consolidation (session-end summaries) keeps the store clean — but requires careful design to avoid lossy compression of critical facts.
        - listitem [ref=e165]:
          - text: →
          - strong [ref=e166]: Conflict resolution is the hardest problem.
          - text: Unlike databases with atomic updates, LLM memory stores can accumulate contradictory facts silently. Production systems need an explicit conflict detection pass — either an LLM-as-judge at write time, or metadata versioning with timestamp-based precedence.
        - listitem [ref=e167]:
          - text: →
          - strong [ref=e168]: Privacy isolation must be enforced at the infrastructure level.
          - text: Memory namespace bugs — where one user's agent recalls another user's facts — are catastrophic security failures. Use tenant-namespaced collection IDs in your vector DB, not just soft filtering. Chroma and Qdrant support collection-level isolation; pgvector needs RLS policies.
        - listitem [ref=e169]:
          - text: →
          - strong [ref=e170]: MemGPT-style self-managed memory trades tool-call overhead for flexibility.
          - text: Every turn that requires memory operations adds 1–3 extra LLM calls. At scale, this can double per-turn cost. Evaluate whether this cost is justified vs. a simpler sliding-window + async summarization approach for your specific workload.
