      - heading "In-Context (Working) Memory" [level=3] [ref=e66]
      - paragraph [ref=e67]:
        - text: "The simplest form: everything in the current prompt. The agent sees all prior conversation turns, tool results, and system instructions. This is the"
        - emphasis [ref=e68]: highest fidelity
        - text: form of memory — the model has full attention over every token. But it's also the most expensive. A naive full-history agent doubles context length with every few turns, leading to quadratic cost growth and eventual truncation.
      - generic [ref=e69]:
        - strong [ref=e70]: "Gotcha:"
        - text: When context overflows, most frameworks silently truncate the oldest messages. This can cause the agent to "forget" critical setup instructions or user preferences that appeared early in the conversation. Always implement explicit memory management — don't rely on framework defaults.
      - 'heading "Episodic Memory: Conversation History Retrieval" [level=3] [ref=e71]'
      - paragraph [ref=e72]: Episodic memory stores individual turns or chunks of past conversations in a fast database (Redis, DynamoDB, PostgreSQL). On each new turn, the agent retrieves the N most relevant prior exchanges — by recency, or by semantic similarity to the current query — and injects them into context. This is the approach used by systems like MemGPT (Packer et al., 2023) and LangChain's conversation memory modules.
      - paragraph [ref=e73]: "The retrieval can be:"
      - list [ref=e74]:
        - listitem [ref=e75]:
          - strong [ref=e76]: "Recency-based:"
          - text: "Always inject the last K turns. Simple, effective for conversational continuity. Risk: irrelevant old turns consume context."
        - listitem [ref=e77]:
          - strong [ref=e78]: "Semantic retrieval:"
          - text: Embed each turn, retrieve top-K by cosine similarity to the current query. More precise for factual recall across long histories.
        - listitem [ref=e79]:
          - strong [ref=e80]: "Summary-based:"
          - text: Periodically compress older turns into a rolling summary (using the LLM itself), then store the summary. Reduces token cost but introduces lossy compression.
      - 'heading "Semantic Memory: Knowledge Stores" [level=3] [ref=e81]'
      - paragraph [ref=e82]: Semantic memory holds facts, documents, user preferences, and domain knowledge as embeddings in a vector database. This is architecturally identical to the retrieval side of RAG (Retrieval-Augmented Generation), but scoped to the agent's personal or task-specific knowledge base.
      - paragraph [ref=e83]: "Production setups commonly use:"
      - list [ref=e84]:
        - listitem [ref=e85]:
          - strong [ref=e86]: "Pinecone / Weaviate / Qdrant:"
          - text: Managed vector databases for high-scale deployments. Weaviate supports native hybrid (BM25 + vector) search.
        - listitem [ref=e87]:
          - strong [ref=e88]: "pgvector:"
          - text: Vector similarity search inside PostgreSQL — ideal when you already run Postgres and want to avoid a separate vector DB. Supports HNSW and IVF indexing.
        - listitem [ref=e89]:
          - strong [ref=e90]: "Chroma / LanceDB:"
          - text: Lightweight local options for development and small-scale deployments.
      - paragraph [ref=e91]:
        - text: A key design decision is the
        - strong [ref=e92]: memory write policy
        - text: ": when does the agent commit a fact to long-term memory? Options include:"
      - list [ref=e93]:
        - listitem [ref=e94]:
          - emphasis [ref=e95]: "Explicit:"
          - text: Only on user instruction ("remember this"). Low write volume, high relevance.
        - listitem [ref=e96]:
          - emphasis [ref=e97]: "Implicit:"
          - text: The agent automatically decides what's worth storing (using an LLM judge). Higher quality but adds latency and cost per turn.
        - listitem [ref=e98]:
          - emphasis [ref=e99]: "Scheduled:"
          - text: Batch summarization and compression at session end — compress the full session into a few key facts before storing.
      - 'heading "Procedural Memory: What the Model Already Knows" [level=3] [ref=e100]'
      - paragraph [ref=e101]: Procedural memory is implicit — it's the knowledge baked into the model's weights through pretraining and fine-tuning. An agent fine-tuned on a company's internal procedures "knows" those procedures without needing to retrieve them. This is the cheapest form of retrieval (zero latency, zero tokens) but is the hardest to update — changing it requires re-training or LoRA adaptation.
      - heading "Memory Management Mechanics" [level=3] [ref=e102]
      - paragraph [ref=e103]: "Production agent frameworks implement memory management as an explicit policy layer, not as an afterthought. Key operations:"
      - list [ref=e104]:
        - listitem [ref=e105]:
          - strong [ref=e106]: "Consolidation:"
          - text: Merging near-duplicate memories. Two facts about a user's preference ("prefers Python" and "dislikes JavaScript") should be merged, not stored as 50 separate entries.
        - listitem [ref=e107]:
          - strong [ref=e108]: "Decay / eviction:"
          - text: Memories not accessed in N days get demoted or deleted. Prevents unbounded growth and keeps retrieval precision high.
        - listitem [ref=e109]:
          - strong [ref=e110]: "Conflict resolution:"
          - text: If a new memory contradicts an old one ("user moved to Berlin" vs. earlier "user lives in NYC"), the agent must update or retire the stale fact — not accumulate contradictions.
        - listitem [ref=e111]:
          - strong [ref=e112]: "Privacy scoping:"
          - text: Different users must have isolated memory namespaces. Memory cross-contamination (agent recalling facts from another user's session) is a critical security failure.
      - 'heading "Cross-Session Continuity: Why It Matters" [level=3] [ref=e113]'
      - paragraph [ref=e114]:
        - text: The most valuable property of long-term memory is
        - strong [ref=e115]: cross-session continuity
        - text: "— the user doesn't have to re-explain context every session. Research from Anthropic's internal deployments and published work on personal AI assistants consistently shows that cross-session memory is the single highest-rated feature for user satisfaction. Practically, this means:"
      - list [ref=e116]:
        - listitem [ref=e117]: User preferences stored once, recalled automatically.
        - listitem [ref=e118]: Task progress persisted — a coding agent remembers what you were building last week.
        - listitem [ref=e119]: Relationship history — the agent recalls past decisions and their outcomes, enabling better advice over time.
      - generic [ref=e120]:
        - strong [ref=e121]: "Production pattern:"
        - text: The OpenAI Assistants API implements a built-in thread model where each thread persists its message history. Memory retrieval is handled by the platform (sliding window). For more control, frameworks like LangGraph expose explicit memory nodes in the agent graph — you write the read/write/consolidation logic yourself, which is more work but gives full control over cost and retrieval strategy.
      - 'heading "MemGPT: Self-Managed Memory" [level=3] [ref=e122]'
      - paragraph [ref=e123]:
        - text: "MemGPT (Packer et al., 2023) proposed treating an LLM's context window as a CPU register file, with external storage analogous to disk. The LLM itself is given tools to read/write its own memory:"
        - code [ref=e124]: core_memory_append
        - text: ","
        - code [ref=e125]: archival_memory_search
        - text: ","
        - code [ref=e126]: conversation_search
        - text: . The model decides what to remember, what to evict, and what to retrieve. This is compelling architecturally because it keeps memory management within the LLM's reasoning loop — but it also adds tool call overhead on every turn and depends heavily on the model's ability to make good memory decisions.
      - heading "Consistency and Grounding Benefits" [level=3] [ref=e127]
      - paragraph [ref=e128]:
        - text: Memory doesn't just help with recall — it improves
        - emphasis [ref=e129]: consistency
        - text: ". An agent with no memory can give contradictory advice in two different sessions. An agent with long-term memory can check its prior recommendations and maintain a coherent stance over time. This is especially important for professional use cases: a legal research agent should not contradict its own prior analysis without explicitly reasoning through the contradiction."
