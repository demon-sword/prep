    - generic [ref=e124]:
      - heading "Key Takeaways" [level=2] [ref=e125]
      - list [ref=e126]:
        - listitem [ref=e127]:
          - text: →
          - strong [ref=e128]: CLM provides n−1 training signals per forward pass
          - text: — every token in a sequence is simultaneously a context element for future tokens and a prediction target for past positions. This data efficiency is why pretraining can scale to trillions of tokens without running out of labels.
        - listitem [ref=e129]:
          - text: →
          - strong [ref=e130]: Causal masking (not model size) is what makes CLM autoregressive
          - text: — the triangular attention mask prevents position i from attending to i+1…n, enforcing the left-to-right generative factorization. Remove the mask and you get bidirectional context (like BERT), which is great for understanding but cannot generate.
        - listitem [ref=e131]:
          - text: →
          - strong [ref=e132]: Pretraining domain determines what the model "knows"
          - text: — models trained on code+text outperform text-only models on coding tasks, not due to fine-tuning but because self-supervised next-token prediction over code teaches the model Python syntax, library APIs, and algorithmic reasoning. Domain-adaptive pretraining (DAP) on domain-specific corpora before SFT is a well-validated recipe.
        - listitem [ref=e133]:
          - text: →
          - strong [ref=e134]: Inference-optimal ≠ Chinchilla-optimal
          - text: — Chinchilla (2022) says to scale parameters and tokens proportionally. But LLaMA showed training a
          - emphasis [ref=e135]: smaller
          - text: model on
          - emphasis [ref=e136]: more
          - text: tokens yields the same quality at a fraction of the inference cost. For production deployments where you serve millions of requests, inference cost dwarfs training cost.
        - listitem [ref=e137]:
          - text: →
          - strong [ref=e138]: Data quality filters matter more than raw token count
          - text: — FineWeb's ablations showed that quality filtering (removing near-duplicates, boilerplate, low-quality web text) with MinHash + perplexity filtering improved benchmark performance by 2–4% even at the same token count. At scale, garbage data doesn't just add noise — it actively degrades capability.
        - listitem [ref=e139]:
          - text: →
          - strong [ref=e140]: Self-supervision gives capability; post-training gives alignment
          - text: — the pretrained model is a next-token predictor, not an assistant. It will complete prompts in character voices, continue harmful text, and hallucinate freely. RLHF/DPO and SFT are required to steer behavior — but they work only because the pretrained model already has the underlying capability. Post-training cannot install capability that wasn't learned during pretraining.
