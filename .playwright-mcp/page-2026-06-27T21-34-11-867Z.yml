    - generic [ref=e116]:
      - heading "Key Takeaways" [level=2] [ref=e117]
      - list [ref=e118]:
        - listitem [ref=e119]:
          - strong [ref=e120]: Catastrophic forgetting scales with task distance.
          - text: A code model fine-tuned on summarization loses ~5–10% on coding benchmarks. The same model fine-tuned on a foreign language can lose 30–50%. Measure forgetting on a held-out eval set from the original task before committing to sequential fine-tuning.
        - listitem [ref=e121]:
          - strong [ref=e122]: Joint fine-tuning is almost always better than sequential for production multi-task models
          - text: — but it requires building a mixed dataset with explicit sampling ratios. T≈2 temperature sampling is a strong baseline. Proportional sampling (T=1) consistently under-trains smaller tasks.
        - listitem [ref=e123]:
          - strong [ref=e124]: Model merging via mergekit is a near-zero-cost post-hoc solution.
          - text: If you already have two specialist models from the same base, weight averaging or task arithmetic takes minutes on CPU and often outperforms either specialist on a held-out mixture benchmark. TIES outperforms naive averaging when merging 4+ specialists with sign conflicts.
        - listitem [ref=e125]:
          - strong [ref=e126]: DARE's drop rate 90–99% sounds extreme but works.
          - text: LLM task vectors are extremely sparse in practice — most fine-tuned weight deltas are noise. Dropping 90% and rescaling the survivors reduces inter-task interference dramatically and improves merge quality for 5+ model combinations.
        - listitem [ref=e127]:
          - strong [ref=e128]: All merging methods require identical architecture and ideally the same pretrained base.
          - text: Merging Llama-3-8B-instruct with Mistral-7B-instruct will degrade both — they have different positional embeddings, vocabulary sizes, and weight initialization regimes. Even the same model from different training stages (e.g., v1 and v2) can produce poor merges.
        - listitem [ref=e129]:
          - strong [ref=e130]: Layer stacking (Frankenstein merges) can create models that exceed the sum of their parts
          - text: on reasoning tasks — Goliath-120B (two 70B models interleaved) beat GPT-4 on some benchmarks when released. But this doubles GPU memory cost and adds inference latency proportionally — validate that you can serve it.
