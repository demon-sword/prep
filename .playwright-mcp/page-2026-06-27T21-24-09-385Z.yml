    - generic [ref=e144]:
      - heading "Key Takeaways" [level=2] [ref=e145]
      - list [ref=e146]:
        - listitem [ref=e147]:
          - strong [ref=e148]: "Parameter efficiency is extreme but task-sensitive:"
          - text: LoRA at r=8 trains ~0.1–0.5% of parameters yet captures most of the fine-tuning signal. However, for complex domain adaptation (e.g., fine-tuning for medicine or law), r=16–64 is often needed. Start low, validate on eval set, increase rank only if you hit a quality ceiling.
        - listitem [ref=e149]:
          - strong [ref=e150]: "QLoRA is the production standard for resource-constrained training:"
          - text: "NF4 quantization of the base model + bf16 LoRA adapters enables fine-tuning 7B models on 16 GB VRAM. The key cost: ~15–30% slower training vs fp16 due to dequantization overhead in the forward pass. Worth it for the memory savings."
        - listitem [ref=e151]:
          - strong [ref=e152]: "Merge before serving, always:"
          - text: Keeping adapters unmerged costs 2 matrix multiplications per adapted layer per token. At 32 layers with 4 adapted matrices each, that's 256 extra matmuls per forward pass. Merge into base weights before deployment unless you need hot-swap multi-tenant adapter serving (where vLLM LoRA mode is designed for exactly this).
        - listitem [ref=e153]:
          - strong [ref=e154]: "LoRA doesn't eliminate forgetting — it mitigates memory cost:"
          - text: A LoRA-fine-tuned model still forgets base capabilities if your fine-tuning data is too narrow or the rank too high. Including ~5–10% general-purpose data in the training mix significantly reduces catastrophic forgetting without meaningfully degrading task-specific performance.
        - listitem [ref=e155]:
          - strong [ref=e156]: "Alpha/rank ratio governs effective learning rate:"
          - text: The
          - code [ref=e157]: α/r
          - text: scaling factor is a hidden learning rate multiplier on the LoRA delta. Common practice is
          - code [ref=e158]: α = r
          - text: (ratio = 1.0), but some recipes use
          - code [ref=e159]: α = 2r
          - text: to amplify the adapter contribution. If training is unstable, check this ratio before blaming other hyperparameters.
        - listitem [ref=e160]:
          - strong [ref=e161]: "LoRA composability is powerful:"
          - text: Multiple LoRA adapters can be linearly interpolated or summed (e.g., task adapter + style adapter). This enables model merging without retraining, a technique used to create Frankenstein-models on HuggingFace that combine specialized capabilities. However, interference between adapters trained on dissimilar tasks can degrade performance — validate merged adapters empirically.
