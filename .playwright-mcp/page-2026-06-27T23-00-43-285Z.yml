    - generic [ref=e132]:
      - heading "Key Takeaways" [level=2] [ref=e133]
      - list [ref=e134]:
        - listitem [ref=e135]:
          - strong [ref=e136]: TP degree is bounded by NVLink bandwidth.
          - text: TP=8 is the practical ceiling on a single DGX H100 node (all-reduce over NVLink at 900 GB/s bidirectional). Going TP=16 across nodes kills throughput — every transformer block pays two cross-node all-reduces.
        - listitem [ref=e137]:
          - strong [ref=e138]: Pipeline bubble tax is real and scales with stages.
          - text: With PP=16 and only 1 micro-batch, 15/16 ≈ 94% of each stage is idle. Use micro-batch counts ≥ 4×PP to keep bubble below 20%. Megatron's 1F1B schedule halves peak activation memory vs GPipe at the same throughput.
        - listitem [ref=e139]:
          - strong [ref=e140]: ZeRO-3 effectively shards the model like TP but with data-parallel semantics.
          - text: "No code changes to the model graph are required. The trade-off: ZeRO-3 doubles all-gather communication vs ZeRO-1. In practice, ZeRO-2 is the sweet spot — it shards optimizer states + gradients (the 12-byte-per-param overhead) but keeps parameters replicated, avoiding the all-gather on every forward pass."
        - listitem [ref=e141]:
          - strong [ref=e142]: For inference, TP dominates; PP adds latency proportional to pipeline depth × inter-stage bandwidth.
          - text: At 200 Gb/s InfiniBand (25 GB/s), transferring a 4096-token × 8192-hidden activation tensor (≈256 MB at fp16) takes ~10 ms per stage boundary — a 16-stage pipeline adds 160 ms to TTFT. vLLM uses TP=4 for 70B models instead.
        - listitem [ref=e143]:
          - strong [ref=e144]: Ring Attention + context parallelism enables 1M+ token contexts
          - text: at the cost of O(n) all-to-all communication across the ring. Used in Llama 3's training (up to 128K context), Gemini 1.5 (1M context claims to use a similar approach). Bandwidth-efficient but requires custom CUDA kernels to pipeline communication with computation.
        - listitem [ref=e145]:
          - strong [ref=e146]: The 3D parallelism grid
          - text: "(TP × PP × DP) must divide evenly into total GPU count. Misconfigurations waste GPUs or cause OOM. Always verify:"
          - code [ref=e147]: assert total_gpus == tp * pp * dp
          - text: . Megatron-LM enforces this at launch; DeepSpeed does not, leading to silent under-utilisation bugs in naive configs.
