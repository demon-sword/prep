      - heading "Practical Selection Guide" [level=3] [ref=e97]
      - list [ref=e98]:
        - listitem [ref=e99]:
          - strong [ref=e100]: "Single node, fits after TP=8:"
          - text: use TP=8, no PP needed.
        - listitem [ref=e101]:
          - strong [ref=e102]: "Multi-node training:"
          - text: TP within node, PP across nodes, DP × ZeRO-3 on top.
        - listitem [ref=e103]:
          - strong [ref=e104]: "Long contexts (>32K):"
          - text: add sequence or context parallelism.
        - listitem [ref=e105]:
          - strong [ref=e106]: "Low-latency inference (batch=1):"
          - text: prefer TP over PP; PP adds latency proportional to pipeline depth × activation transfer time.
        - listitem [ref=e107]:
          - strong [ref=e108]: "High-throughput inference:"
          - text: PP can be beneficial if stages are well-balanced; vLLM's continuous batching helps keep all stages full.
