    - generic [ref=e149]:
      - heading "Key Takeaways" [level=2] [ref=e150]
      - list [ref=e151]:
        - listitem [ref=e152]:
          - strong [ref=e153]: Evaluate the evaluator first.
          - text: A bad automated judge gives false confidence and masks regressions. Before trusting any metric, measure its Spearman correlation with human judgment — target ≥ 0.7. Log disagreement rates between multiple judges; high variance = low signal.
        - listitem [ref=e154]:
          - strong [ref=e155]: LLM-as-judge has a 5–15% flip rate on re-evaluation.
          - text: This noise floor means you cannot reliably distinguish two models that differ by less than ~2 points on a 10-point scale. Use at least 200+ examples to have statistical power to detect meaningful differences.
        - listitem [ref=e156]:
          - strong [ref=e157]: Design for runnable eval, not ideal eval.
          - text: "An eval that costs $1,000/run and takes 3 hours won't get used before every deployment. Tiered pipelines: 50 canary examples (2 min, free) on every PR; 500-example automated benchmark on release candidates; full human eval on major versions only."
        - listitem [ref=e158]:
          - strong [ref=e159]: Task-based > turn-based for real decisions.
          - text: A model can score better on BLEU/ROUGE while being worse on actual task completion. Always have at least one end-to-end task-based eval tied to a production-relevant outcome before making a deployment decision.
        - listitem [ref=e160]:
          - strong [ref=e161]: Position and verbosity bias corrupt A/B evals.
          - text: Randomize presentation order. Run symmetrized comparisons (A vs B and B vs A). Explicitly penalize verbosity in judge prompts. Blind the judge to model provenance. These mitigations reduce bias by 60–80% in practice.
        - listitem [ref=e162]:
          - strong [ref=e163]: Production monitoring closes the loop.
          - text: Offline eval is a snapshot. User thumb-down rates, abandonment after model turn, retry rates — these surface failure modes your eval set never imagined. RAGAS and LangSmith can pipeline production traces directly back into the eval harness as new golden examples.
