- generic [active] [ref=e1]:
  - banner [ref=e2]:
    - generic [ref=e3]: Evaluation
    - heading "Evaluation Pipeline Design" [level=1] [ref=e4]
    - paragraph [ref=e5]: Turn-based vs task-based evaluation, evaluating the evaluator, and designing a full harness that produces reliable, cost-effective signal about your model's behavior.
  - main [ref=e6]:
    - generic [ref=e7]:
      - heading "Theory" [level=2] [ref=e8]
      - paragraph [ref=e9]: Evaluation is the highest-leverage activity in an LLM system. A bad model with good eval catches and fixes regressions. A great model with bad eval ships silent bugs to production. The difference between teams that move fast and teams that thrash is almost always eval pipeline quality — not model capability.
      - heading "Why evaluation is hard for LLMs" [level=3] [ref=e10]
      - paragraph [ref=e11]: "Traditional ML evaluation is straightforward: run held-out test set, compute accuracy or F1, done. LLMs break this for several reasons. First, the output space is vast — there are thousands of valid phrasings of a correct answer, and thousands of invalid-but-plausible phrasings of a wrong one. Second, the objective is often subjective — \"helpful, harmless, and honest\" cannot be reduced to a single number. Third, evaluation must generalize across tasks that weren't anticipated at training time."
      - paragraph [ref=e12]:
        - text: This forces us to think carefully about
        - emphasis [ref=e13]: what we're actually measuring
        - text: and whether our measurement correlates with the real outcome we care about.
      - heading "Turn-based vs Task-based Evaluation" [level=3] [ref=e14]
      - paragraph [ref=e15]: "There are two fundamental scopes for LLM evaluation:"
      - generic [ref=e16]:
        - generic [ref=e17]:
          - heading "Turn-based" [level=4] [ref=e18]
          - paragraph [ref=e19]: Evaluate a single model turn in isolation. Metrics like BLEU, ROUGE, cosine similarity, or LLM-as-judge score applied to one (input, output) pair. Fast and cheap — can cover thousands of examples in minutes. Good for regression testing and format adherence. Poor signal for multi-step reasoning, coherence over a conversation, or tool-use accuracy.
        - generic [ref=e20]:
          - heading "Task-based" [level=4] [ref=e21]
          - paragraph [ref=e22]: "Evaluate the outcome of a full task: did the agent book the right flight? Did the code pass the unit tests? Did the summarized document preserve all key facts? Requires a concrete, binary-or-ranked success criterion that can be checked programmatically or via human review. Expensive but high-signal — it directly measures what the user actually cares about."
      - paragraph [ref=e23]: "In practice, you need both: turn-based evals for cheap, fast regression coverage (CI/CD), and task-based evals for high-stakes decisions (which model to promote to production)."
      - heading "The 5-Stage Evaluation Workflow" [level=3] [ref=e24]
      - paragraph [ref=e25]: "Evaluation isn't a single metric — it's a pipeline with distinct stages, each with different cost-quality tradeoffs:"
      - list [ref=e26]:
        - listitem [ref=e27]:
          - text: ▸
          - strong [ref=e28]: "Stage 1 — Filter:"
          - text: Safety checks, format validation, rule-based refusals. Cheap, deterministic. Run on 100% of outputs.
        - listitem [ref=e29]:
          - text: ▸
          - strong [ref=e30]: "Stage 2 — Benchmark:"
          - text: Automated metrics (exact match, code execution, ROUGE) across a curated eval set. 1,000–10,000 examples. Runs in minutes with a scoring function.
        - listitem [ref=e31]:
          - text: ▸
          - strong [ref=e32]: "Stage 3 — Experiment:"
          - text: A/B comparisons, LLM-as-judge scoring, preference tournaments between model versions. Run on representative subsets when you're considering deploying a new checkpoint.
        - listitem [ref=e33]:
          - text: ▸
          - strong [ref=e34]: "Stage 4 — Human:"
          - text: Expert annotation on the hardest cases your automated eval flagged or failed on. Expensive ($50–$500/hour for domain experts), but necessary for calibration and for rare-but-important failure modes.
        - listitem [ref=e35]:
          - text: ▸
          - strong [ref=e36]: "Stage 5 — Monitor:"
          - text: Production feedback loops. Log outputs, sample for quality review, track user thumb-down rates, implicit signals like conversation abandonment. Closes the loop from deployment back to the eval set.
      - heading "Evaluating the Evaluator" [level=3] [ref=e37]
      - paragraph [ref=e38]: "This is the most important and most overlooked part of evaluation design. Your eval pipeline is itself a system that can fail — and a bad evaluator gives you false confidence. There are four properties to verify in your evaluator:"
      - list [ref=e39]:
        - listitem [ref=e40]:
          - text: ▸
          - strong [ref=e41]: "Signal quality:"
          - text: Does the evaluator's score correlate with human judgment on the same examples? Compute Spearman/Kendall correlation between evaluator scores and expert human labels on a validation set. A good automated eval should have correlation ≥ 0.7 with human judgment.
        - listitem [ref=e42]:
          - text: ▸
          - strong [ref=e43]: "Metric-outcome correlation:"
          - text: Does scoring better on this metric actually lead to better user outcomes? This requires you to track downstream metrics (retention, task completion, user satisfaction) and see if your eval scores predict them. Many BLEU/ROUGE improvements fail this test.
        - listitem [ref=e44]:
          - text: ▸
          - strong [ref=e45]: "Consistency:"
          - text: Does the evaluator give the same score when the same example is evaluated twice? LLM-as-judge evaluators have 5–15% flip rate on re-evaluation — this noise floor caps how much you can distinguish between close models.
        - listitem [ref=e46]:
          - text: ▸
          - strong [ref=e47]: "Cost:"
          - text: What is the total cost (latency × price × human hours) to run the full eval pipeline? An eval that costs $500/run won't get run before every deployment. Design for runnable eval — cheap enough that teams use it on every PR, not just on model launch days.
      - generic [ref=e48]:
        - strong [ref=e49]: "The Meta-Evaluation Principle:"
        - text: Every evaluator you deploy should have its own "meta-eval" — a fixed set of human-labeled examples where you know the ground truth, so you can measure evaluator accuracy. Without this, you're flying blind about your blind spots.
      - 'heading "LLM-as-Judge: Biases and Mitigations" [level=3] [ref=e50]'
      - paragraph [ref=e51]: "Using a larger model (GPT-4, Claude Opus) to judge smaller model outputs is now standard practice, but introduces well-documented biases:"
      - list [ref=e52]:
        - listitem [ref=e53]:
          - text: ▸
          - strong [ref=e54]: "Self-enhancement bias:"
          - text: GPT-4 rates GPT-4 outputs ~10% higher than equivalent outputs from other models. Always use a different judge than the candidate model.
        - listitem [ref=e55]:
          - text: ▸
          - strong [ref=e56]: "Position bias:"
          - text: In A/B evaluation, the first option shown gets consistently higher ratings regardless of quality. Mitigate with randomized presentation order and symmetrized scoring (score both orderings, average).
        - listitem [ref=e57]:
          - text: ▸
          - strong [ref=e58]: "Verbosity bias:"
          - text: Longer answers are rated higher even when they contain no additional useful information. Use length-normalized scoring or explicitly instruct the judge to penalize padding.
        - listitem [ref=e59]:
          - text: ▸
          - strong [ref=e60]: "Sycophancy:"
          - text: If the judge is given hints about expected answer, it aligns with those hints. Keep the judge blind to which model produced which output.
      - generic [ref=e61]:
        - strong [ref=e62]: "Practical setup:"
        - text: Use 3–5 judge models and average scores. Log judge disagreements (high variance = uncertain example). On examples where judges disagree by >2 points (on a 1–5 scale), route to human annotation.
      - heading "Production Reality" [level=3] [ref=e63]
      - paragraph [ref=e64]: "At scale, evaluation looks like this: GPT-4 class models cost ~$0.01–0.03 per judgment. A 10,000-example eval set with LLM-as-judge costs $100–300 per run. For teams deploying weekly, that's $5K–15K/year just for eval compute — before human labeler costs. This is why teams invest heavily in:"
      - list [ref=e65]:
        - listitem [ref=e66]:
          - text: ▸
          - strong [ref=e67]: "Representative sampling:"
          - text: 500 well-chosen examples beat 10,000 randomly selected ones. Use stratified sampling across task types, difficulty levels, and known failure modes.
        - listitem [ref=e68]:
          - text: ▸
          - strong [ref=e69]: "Automated canaries:"
          - text: 50–100 golden examples with deterministic expected outputs that run on every PR in under 2 minutes. These catch regressions without requiring expensive LLM judges.
        - listitem [ref=e70]:
          - text: ▸
          - strong [ref=e71]: "Tiered evaluation:"
          - text: Run cheap evals on all changes, medium evals on release candidates, expensive evals only on major version changes.
      - generic [ref=e72]:
        - strong [ref=e73]: "Tools in production:"
        - text: RAGAS (RAG-specific eval), EleutherAI lm-evaluation-harness (benchmark suites), LangSmith / Braintrust (eval tracking), Weights & Biases (experiment logging), Prometheus-Eval (open-weight judge model), MT-Bench and AlpacaEval (conversation quality benchmarks).
