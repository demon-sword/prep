            - text: 🤖 Model Inference
            - generic [ref=e172]: Medium Risk
          - paragraph [ref=e173]: "Running the model with the eval inputs: sampling parameters, batching, determinism."
          - generic [ref=e174]:
            - generic [ref=e175]:
              - heading "🔴 Failure Modes" [level=4] [ref=e176]
              - list [ref=e177]:
                - listitem [ref=e178]:
                  - text: ✗
                  - strong [ref=e179]: Sampling non-determinism
                  - text: Temperature > 0 means different runs give different answers. A model can "improve" by 2% just from a lucky random seed. Always eval at temperature=0 or average over ≥5 samples.
                - listitem [ref=e180]:
                  - text: ✗
                  - strong [ref=e181]: Context window truncation
                  - text: Long eval examples silently truncate — the model answers an easier truncated version. Always log actual input token counts and flag truncations.
                - listitem [ref=e182]:
                  - text: ✗
                  - strong [ref=e183]: Batching artifacts
                  - text: Padding and attention masking bugs in batched inference can produce different results than single-example inference. Validate batch vs single-example output parity.
            - generic [ref=e184]:
              - heading "🟢 Detection Strategies" [level=4] [ref=e185]
              - list [ref=e186]:
                - listitem [ref=e187]:
                  - text: ✓
                  - strong [ref=e188]: Greedy decoding for benchmarks
                  - text: Use temperature=0 (greedy) for benchmark evals. Only use sampling if you're specifically measuring diversity or creativity.
                - listitem [ref=e189]:
                  - text: ✓
                  - strong [ref=e190]: Log token counts
                  - text: Track input/output token lengths. Alert when any example exceeds model context window × 0.9.
