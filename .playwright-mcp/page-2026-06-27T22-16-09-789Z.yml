- generic [ref=e1]:
  - banner [ref=e2]:
    - generic [ref=e3]: Foundations
    - heading "Open Weight vs Open Source Models" [level=1] [ref=e4]
    - paragraph [ref=e5]: The distinction between open-weight (weights released, license restrictions) and truly open-source (training data, code, weights all public) — and why it matters for production use.
  - main [ref=e6]:
    - generic [ref=e7]:
      - heading "Theory" [level=2] [ref=e8]
      - heading "The Naming Problem" [level=3] [ref=e9]
      - paragraph [ref=e10]: "The AI industry has a semantic crisis: the word \"open\" is attached to models that are anything but. When Meta releases Llama, they call it \"open source.\" When Mistral releases Mistral 7B, they call it \"open source.\" But neither satisfies the Open Source Initiative's (OSI) definition, nor the classic four freedoms of free software — and the distinction has profound engineering and legal consequences."
      - paragraph [ref=e11]:
        - text: "There are two fundamentally different categories being conflated under the word \"open\":"
        - strong [ref=e12]: open-weight
        - text: (only the inference weights are released) and
        - strong [ref=e13]: open-source
        - text: (weights, training code, training data, and architecture details are all publicly available and freely usable). Understanding which category you're dealing with determines what you can legally deploy, modify, and commercialize.
      - heading "What \"Open Source\" Actually Means" [level=3] [ref=e14]
      - paragraph [ref=e15]: "The OSI's Open Source Definition requires: free redistribution, availability of source code, right to create derivative works, and no discrimination against persons, groups, or fields of endeavor. A software project where you can run the binary but not see or modify the source — or where you can see the source but can't redistribute derivatives commercially — does not qualify."
      - paragraph [ref=e16]:
        - text: "Applied to LLMs, a truly open-source model would require: (1) the model weights, (2) the training code, (3) the training data (or detailed description of how to reproduce it), (4) the evaluation suite, and (5) licenses permitting commercial use and derivative works without restrictions. Very few models meet this standard."
        - strong [ref=e17]: EleutherAI's Pythia
        - text: series and
        - strong [ref=e18]: BLOOM
        - text: (BigScience) come closest — they released not just weights but training data recipes, full training code, and permissive licenses.
      - 'heading "Open-Weight: The Reality for Most \"Open\" Models" [level=3] [ref=e19]'
      - paragraph [ref=e20]: "Open-weight means the trained model parameters are publicly downloadable. But the training data is proprietary (or vaguely described), the training code may not be released, and — critically — the license typically contains restrictions that make OSI non-compliance explicit:"
      - list [ref=e21]:
        - listitem [ref=e22]:
          - strong [ref=e23]: "Llama 2/3 (Meta):"
          - text: Requires a separate Meta commercial license for deployments serving >700M monthly active users. Prohibits use to improve competing LLM products. Prohibits training other models using Llama outputs at scale (anti-distillation clause). Training data and pipeline not released.
        - listitem [ref=e24]:
          - strong [ref=e25]: "Mistral 7B / Mixtral:"
          - text: Apache 2.0 — one of the most permissive licenses in this space. But still no training data released. Training code not fully open.
        - listitem [ref=e26]:
          - strong [ref=e27]: "Gemma (Google):"
          - text: Gemma Terms of Service restricts training other general-purpose models. Requires attributing Google in deployed products. No training data released.
        - listitem [ref=e28]:
          - strong [ref=e29]: "Falcon (TII UAE):"
          - text: Early Falcon used a custom license with commercial restrictions. Falcon 180B uses a more permissive license. Training data (RefinedWeb) was partially described but not fully released.
        - listitem [ref=e30]:
          - strong [ref=e31]: "Qwen (Alibaba):"
          - text: Community License — permissive for low-traffic use, restricts at >100M MAU (similar to Llama's threshold).
      - heading "The Legal and Production Implications" [level=3] [ref=e32]
      - paragraph [ref=e33]: "For a senior engineer deploying a model at scale, the license determines:"
      - list [ref=e34]:
        - listitem [ref=e35]:
          - strong [ref=e36]: Can you fine-tune and redistribute derivatives?
          - text: Apache 2.0 (Mistral) says yes. Llama's license says only if you apply for and receive Meta's commercial license and don't use it to train competing models.
        - listitem [ref=e37]:
          - strong [ref=e38]: Can you use model outputs to distill a smaller model?
          - text: Llama's anti-distillation clause explicitly prohibits using Llama outputs to train "a language model with similar or greater capabilities." GPT-4's ToS has similar restrictions. If you build a dataset from Claude or GPT-4 outputs to train your model, you're in legal grey territory.
        - listitem [ref=e39]:
          - strong [ref=e40]: What happens at scale?
          - text: MAU thresholds (Meta's 700M, Alibaba's 100M) seem high but matter for consumer products. YouTube, Instagram-class products would trip these. You need a separate enterprise agreement.
        - listitem [ref=e41]:
          - strong [ref=e42]: IP indemnification?
          - text: Training data provenance matters for copyright. If the training data contains copyrighted works without license, the outputs could be considered derivative works. Open-source models with documented, licensed training data (C4, The Pile, RedPajama) give you at least a paper trail. Proprietary data is a black box.
      - 'heading "Training Data: The Hidden Component" [level=3] [ref=e43]'
      - paragraph [ref=e44]: "The most consequential thing missing from \"open\" models is the training data. A model's behavior — its biases, its knowledge cutoff, its factual errors, its handling of edge cases — is almost entirely determined by what it was trained on. Without seeing the training data:"
      - list [ref=e45]:
        - listitem [ref=e46]: You cannot fully audit the model for harmful content or memorized PII.
        - listitem [ref=e47]: You cannot reproduce or improve the pretraining from scratch.
        - listitem [ref=e48]: You cannot understand why the model fails on specific distributions.
        - listitem [ref=e49]: You cannot assess copyright liability for outputs.
      - paragraph [ref=e50]:
        - strong [ref=e51]: "Truly reproducible models:"
        - text: Pythia (EleutherAI, trained on The Pile — fully documented), OLMo (Allen Institute, released training data + all code + checkpoints at every step). These are genuinely useful for research because you can ablate and reproduce. For production, they're often not state-of-the-art in capability.
      - heading "Production Decision Framework" [level=3] [ref=e52]
      - paragraph [ref=e53]: "The choice between open-weight, proprietary API, and truly open-source models involves five factors:"
      - list [ref=e54]:
        - listitem [ref=e55]:
          - strong [ref=e56]: "Data residency:"
          - text: Open-weight models run on your infrastructure — no data leaves your environment. Critical for HIPAA, GDPR, financial services.
        - listitem [ref=e57]:
          - strong [ref=e58]: "Latency and cost at scale:"
          - text: Self-hosted open-weight eliminates per-token API costs. At >10M tokens/day, hosting Llama 3 on your own GPU cluster often beats GPT-4 API costs despite infrastructure overhead.
        - listitem [ref=e59]:
          - strong [ref=e60]: "Customizability:"
          - text: Open-weight allows fine-tuning on proprietary data. API models (GPT-4, Claude) offer limited fine-tuning, no ability to modify training signal directly.
        - listitem [ref=e61]:
          - strong [ref=e62]: "Capability ceiling:"
          - text: As of 2024-2025, the capability gap between top proprietary (GPT-4o, Claude 3.5 Sonnet) and best open-weight (Llama 3.1 405B, Qwen2.5 72B) is meaningful but narrowing fast. For many production tasks, 70B-class models are sufficient.
        - listitem [ref=e63]:
          - strong [ref=e64]: "Compliance and auditability:"
          - text: Regulated industries often need to demonstrate control over the model supply chain. Open-weight with known license + in-house inference > black-box API.
      - generic [ref=e65]:
        - generic [ref=e66]: Production Reality
        - text: Running Llama 3 70B on 2× A100 80GB GPUs achieves roughly 30–50 tokens/second throughput with 8-bit quantization (AWQ). At $3/hr per A100, that's about $0.004 per 1K tokens at 100% utilization — competitive with GPT-3.5 Turbo API pricing, without the data-exfiltration concerns. The break-even vs API typically hits at ~5M tokens/day of sustained load.
      - heading "The OSI's 2024 AI Open Source Definition" [level=3] [ref=e67]
      - paragraph [ref=e68]: "In late 2024, the OSI released the first formal \"Open Source AI Definition.\" It requires: availability of data information sufficient to allow a skilled person to recreate the training dataset (not necessarily the dataset itself), complete model parameters, training code, and permissive licenses. This effectively means most current \"open\" models — including Llama — do not qualify as Open Source AI under the formal definition."
