    - generic [ref=e266]:
      - heading "Key Takeaways" [level=2] [ref=e267]
      - list [ref=e268]:
        - listitem [ref=e269]:
          - strong [ref=e270]: "Open-weight ≠ open source:"
          - text: Most "open" LLMs only release weights. The training data, training code, and full pipeline are proprietary. OSI's 2024 AI Open Source Definition makes this explicit — Llama, Gemma, Falcon, and most major "open" models don't qualify.
        - listitem [ref=e271]:
          - strong [ref=e272]: "Licenses have teeth at scale:"
          - text: Meta's MAU threshold (700M), Alibaba's (100M), and anti-distillation clauses kick in exactly when a product goes viral. Baking Llama into a high-growth consumer product without reviewing the license is a liability. Mistral 7B on Apache 2.0 is genuinely permissive.
        - listitem [ref=e273]:
          - strong [ref=e274]: "Training data absence is the biggest gap:"
          - text: Without training data lineage, you can't audit for memorized PII, can't reproduce to fix issues, can't assess copyright exposure. OLMo and Pythia release full checkpoints + data; they're the standard for reproducible research — at a capability cost.
        - listitem [ref=e275]:
          - strong [ref=e276]: "Anti-distillation clauses affect your data pipeline:"
          - text: If you generate synthetic training data using GPT-4, Claude, or Llama outputs to train your own model, you may violate ToS. This affects labs using teacher-distillation pipelines. Check each API's ToS before building synthetic datasets.
        - listitem [ref=e277]:
          - strong [ref=e278]: "Self-hosting break-even is ~5M tokens/day:"
          - text: At that scale, a self-hosted 70B model on 2×A100s often costs less per token than GPT-3.5 API — while also satisfying data residency requirements for HIPAA/GDPR-regulated workloads. vLLM + Llama 3 is the standard stack.
        - listitem [ref=e279]:
          - strong [ref=e280]: "The gap is closing:"
          - text: Llama 3.1 405B matched GPT-4-class performance on many benchmarks. Qwen2.5 72B and DeepSeek V3 outperform earlier GPT-4 on coding benchmarks. By 2025, "open-weight but best in class" is a realistic product strategy — check licenses before committing the architecture.
