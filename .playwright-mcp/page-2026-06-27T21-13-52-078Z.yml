      - heading "Theory" [level=2] [ref=e8]
      - heading "What Is Fine-Tuning?" [level=3] [ref=e9]
      - paragraph [ref=e10]: "Fine-tuning is the process of continuing to train a pretrained base model on a curated, task-specific dataset using supervised learning. The base model already \"knows\" language — its weights encode world knowledge, reasoning patterns, and grammar from trillions of tokens. Fine-tuning adjusts those weights (or a subset of them) so the model behaves differently: following specific instructions, adopting a domain vocabulary, producing a particular output format, or avoiding certain response patterns."
      - paragraph [ref=e11]:
        - text: Critically, fine-tuning does
        - emphasis [ref=e12]: not
        - text: give the model new knowledge from documents the way RAG does. It changes how the model responds — its style, format adherence, instruction-following, and learned behavioral patterns — rather than expanding what facts it can retrieve at query time.
      - heading "The Two Capabilities Fine-Tuning Improves" [level=3] [ref=e13]
      - paragraph [ref=e14]: "Fine-tuning affects two distinct dimensions:"
      - list [ref=e15]:
        - listitem [ref=e16]:
          - strong [ref=e17]: "Domain knowledge & vocabulary:"
          - text: Adapting to specialized jargon, proprietary ontologies, or rare patterns not well-represented in pretraining (e.g., medical ICD codes, legal clause structures, internal API schema names). The model learns to "think" in your domain's language.
        - listitem [ref=e18]:
          - strong [ref=e19]: "Instruction following & behavior:"
          - text: Reliable adherence to output formats (strict JSON, specific XML schemas), consistent tone, persona maintenance, refusal patterns, or multi-step task completion. A base model prompted to output JSON will drift; a fine-tuned model won't.
      - paragraph [ref=e20]: Most production fine-tuning targets one of these. Trying to solve both simultaneously with a single fine-tuning run often requires more data and risks catastrophic forgetting of general capabilities.
      - heading "Fine-Tuning vs the Alternatives" [level=3] [ref=e21]
      - paragraph [ref=e22]: "Before committing to fine-tuning, engineers should exhaust cheaper options. The decision is not binary — it's a spectrum ordered by cost and complexity:"
