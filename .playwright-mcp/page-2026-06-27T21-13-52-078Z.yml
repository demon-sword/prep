      - heading "The Case for Prompt Engineering First" [level=3] [ref=e60]
      - paragraph [ref=e61]: "Modern LLMs (GPT-4, Claude 3.x, Llama 3) respond dramatically better to well-crafted prompts than their predecessors. A carefully structured system prompt with 5–10 high-quality few-shot examples can often achieve 80–90% of what a fine-tuned model would deliver. The cost difference is stark: iterating on a system prompt takes minutes; preparing a fine-tuning dataset takes days to weeks."
      - paragraph [ref=e62]:
        - text: "The key threshold:"
        - strong [ref=e63]: if the base model can't demonstrate the target behavior at all given examples in-context, fine-tuning won't magically teach it
        - text: . If it can do it sometimes with prompts, fine-tuning makes it reliable. This is the "capability gap" test.
      - heading "The Case for RAG First" [level=3] [ref=e64]
      - paragraph [ref=e65]: "If your problem is \"the model doesn't know our internal documents / product catalog / recent events\", RAG is almost always the right first step. RAG decouples knowledge freshness from model training. You can update the document store without retraining. Fine-tuning on private facts rarely works well because:"
      - list [ref=e66]:
        - listitem [ref=e67]: The model memorizes patterns but hallucinates variations it wasn't trained on
        - listitem [ref=e68]: You can't update facts without rerunning fine-tuning
        - listitem [ref=e69]: RAGAS-measurable retrieval precision typically outperforms fact memorization
      - heading "The Case for Fine-Tuning" [level=3] [ref=e70]
      - paragraph [ref=e71]: "Fine-tuning is the right choice when:"
      - list [ref=e72]:
        - listitem [ref=e73]:
          - strong [ref=e74]: "Format reliability is mission-critical:"
          - text: You need 99.9% valid JSON, not 95%. Every failure is a parsing error in production.
        - listitem [ref=e75]:
          - strong [ref=e76]: "Prompt cost is unsustainable:"
          - text: Long system prompts with many few-shot examples can add 500–2000 tokens per call. At 10M calls/day, that's millions in extra token costs.
        - listitem [ref=e77]:
          - strong [ref=e78]: "Latency from context length is a constraint:"
          - text: Shorter prompts → lower TTFT and per-token latency. A fine-tuned model needs no few-shot examples in the prompt.
        - listitem [ref=e79]:
          - strong [ref=e80]: "The behavior can't be expressed in a prompt:"
          - text: Nuanced domain-specific judgment (e.g., "flag claims where the attribution is ambiguous per our editorial standards") is hard to specify exhaustively.
        - listitem [ref=e81]:
          - strong [ref=e82]: "Serving cost reduction:"
          - text: Fine-tuning a 7B model on a task where you'd otherwise use GPT-4 can cut inference cost by 50–100x.
      - heading "Cost Realities" [level=3] [ref=e83]
      - paragraph [ref=e84]: "Fine-tuning is expensive — not just in compute, but in data preparation, iteration cycles, and evaluation. A realistic breakdown for a production LoRA fine-tune on 7–13B model:"
      - list [ref=e85]:
        - listitem [ref=e86]:
          - strong [ref=e87]: "Data:"
          - text: 500–10,000 high-quality examples minimum. At $2–5 per example with expert annotation, that's $1,000–$50,000 before touching a GPU.
        - listitem [ref=e88]:
          - strong [ref=e89]: "Compute:"
          - text: "LoRA on a 7B model for 1–3 epochs: $30–200 on 1x A100 via cloud. Full fine-tune on 13B: $500–2,000. Fine-tuning a 70B model: $5,000–20,000+."
        - listitem [ref=e90]:
          - strong [ref=e91]: "Evaluation:"
          - text: Building a proper eval harness (not vibes-based) takes 1–2 weeks of engineering.
        - listitem [ref=e92]:
          - strong [ref=e93]: "Maintenance:"
          - text: Every major base model version requires re-fine-tuning. Plan for quarterly cycles.
      - paragraph [ref=e94]: OpenAI's fine-tuning API prices GPT-3.5 at $0.008/1K tokens for training. Fine-tuning 100K examples of average length ~200 tokens = ~$160 — but this doesn't include the data pipeline cost which typically dominates.
      - generic [ref=e95]:
        - strong [ref=e96]: "The 80/20 trap:"
        - text: Teams often invest weeks fine-tuning to go from 80% to 85% accuracy on a task that 3 days of prompt engineering already brings to 78%. The marginal cost per percentage point rises sharply in the fine-tuning regime.
      - heading "When Fine-Tuning Fails" [level=3] [ref=e97]
      - paragraph [ref=e98]: "Fine-tuning will not save you if:"
      - list [ref=e99]:
        - listitem [ref=e100]: The base model fundamentally lacks the reasoning capability (e.g., fine-tuning a 7B model for PhD-level theorem proving)
        - listitem [ref=e101]: Your dataset has label noise or inconsistency (the model learns the noise)
        - listitem [ref=e102]: You're trying to inject facts that may change (use RAG instead)
        - listitem [ref=e103]: You only have <100 examples (overfitting is near-certain; use few-shot prompting)
      - heading "The Decision Framework" [level=3] [ref=e104]
      - paragraph [ref=e105]: "A systematic decision process: start with the simplest approach, measure against your quality bar, and escalate only when the simpler approach demonstrably fails. The interactive tree below walks through this decision process step by step."
