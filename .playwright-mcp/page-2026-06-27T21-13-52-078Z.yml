    - generic [ref=e125]:
      - heading "Key Takeaways" [level=2] [ref=e126]
      - list [ref=e127]:
        - listitem [ref=e128]:
          - strong [ref=e129]: Exhaust prompting before fine-tuning.
          - text: GPT-4-class models with 5–10 curated few-shot examples in-context often reach 80–90% of fine-tuned quality. The iteration speed of prompting (minutes) vs fine-tuning (days) makes this the right first move every time.
        - listitem [ref=e130]:
          - strong [ref=e131]: Fine-tuning changes behavior, not knowledge.
          - text: Use RAG for "the model needs to know X" and fine-tuning for "the model needs to reliably do X." Mixing them up wastes GPU hours and builds hallucination-prone pipelines.
        - listitem [ref=e132]:
          - strong [ref=e133]: Data cost dominates compute cost.
          - text: 1,000 high-quality expert-labeled examples at $5/example = $5,000. The A100 hour costs are often 10–20% of that. Invest in data quality, not just quantity — 500 clean examples outperform 5,000 noisy ones.
        - listitem [ref=e134]:
          - strong [ref=e135]: Prompt cost is the hidden fine-tuning ROI driver.
          - text: If your system prompt + few-shot examples add 800 tokens per call at 50M calls/month, that's 40B extra tokens — worth tens of thousands of dollars. Fine-tuning the few-shot examples away pays for itself in weeks at scale.
        - listitem [ref=e136]:
          - strong [ref=e137]: "The capability gap test:"
          - text: If the model cannot demonstrate the target behavior even with examples in context, fine-tuning won't fix it. Fine-tuning amplifies latent capabilities; it doesn't create new ones. Test with in-context examples first.
        - listitem [ref=e138]:
          - strong [ref=e139]: Maintenance debt is real.
          - text: Every base model update potentially breaks your fine-tune. Teams running fine-tuned models in production budget 1–2 weeks per quarter for re-evaluation and potential re-training as providers ship new base model versions (Llama 3.1 → 3.2 → 3.3, GPT-3.5 → 4o-mini, etc.).
