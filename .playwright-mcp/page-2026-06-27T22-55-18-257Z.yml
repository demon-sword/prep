    - generic [ref=e135]:
      - heading "Key Takeaways" [level=2] [ref=e136]
      - list [ref=e137]:
        - listitem [ref=e138]:
          - text: →
          - strong [ref=e139]: "Lossless speedup:"
          - text: Unlike quantization or pruning, speculative decoding provides mathematically provable output-distribution equivalence to the target model — verified by rejection sampling math, not empirical approximation.
        - listitem [ref=e140]:
          - text: →
          - strong [ref=e141]: "Batch-size cliff:"
          - text: Speedup degrades sharply above batch size ~8. Large batches already saturate GPU compute, making the target forward pass cheap and eliminating the memory-bandwidth bottleneck that speculative decoding exploits. It's primarily a latency optimization, not a throughput optimization.
        - listitem [ref=e142]:
          - text: →
          - strong [ref=e143]: EAGLE > Medusa > vanilla spec decoding
          - text: "in practice: EAGLE achieves 3–4× speedup by feeding the draft model target-model feature vectors (not token embeddings), dramatically increasing acceptance rate α. If you're implementing spec decoding in 2024+, start with EAGLE architecture."
        - listitem [ref=e144]:
          - text: →
          - strong [ref=e145]: "Draft-target alignment is the key variable:"
          - text: A draft model from the same family (Llama-7B → Llama-70B) reaches α ≈ 0.7–0.85 on typical tasks. Mismatched families or heavily fine-tuned targets drop α to 0.4–0.5, making speedup marginal. Always measure α on your actual workload before committing.
        - listitem [ref=e146]:
          - text: →
          - strong [ref=e147]: "Two models in memory = dual RAM overhead:"
          - text: For a 70B + 7B setup, you're paying ~140 GB + ~14 GB = ~154 GB VRAM. On an 8×A100 node (640 GB), this is manageable. On tighter deployments, self-speculation (Medusa heads, EAGLE with shared weights) avoids the extra memory cost.
        - listitem [ref=e148]:
          - text: →
          - strong [ref=e149]: "vLLM, TGI, and SGLang all support it natively:"
          - text: vLLM v0.3+ has
          - code [ref=e150]: "--speculative-model"
          - text: ; SGLang has built-in EAGLE support. In production, combine speculative decoding with continuous batching carefully — the async accept/reject logic complicates request scheduling.
