    - generic [ref=e144]:
      - heading "Key Takeaways" [level=2] [ref=e145]
      - list [ref=e146]:
        - listitem [ref=e147]:
          - strong [ref=e148]: Optimizer states dwarf weights.
          - text: "Adam's m and v tensors (both FP32) add 8 bytes per parameter on top of the 4-byte FP32 weight — meaning optimizer states alone are 2× the weight memory. For 7B params: weights ~14 GB, optimizer states ~56 GB."
        - listitem [ref=e149]:
          - strong [ref=e150]: Mixed precision doesn't eliminate FP32 copies.
          - text: BF16 training still requires a full FP32 master weight copy for optimizer updates. The GPU memory savings from mixed precision come from reduced bandwidth during forward/backward, not smaller optimizer state footprint.
        - listitem [ref=e151]:
          - strong [ref=e152]: Activation memory is the sneaky killer.
          - text: With batch_size=8 and 4K seq_len, activations can exceed 60 GB for a 7B model — dwarfing weight memory. Enable
          - code [ref=e153]: gradient_checkpointing
          - text: in HuggingFace Transformers by default for any non-trivial training run; the 33% compute overhead is always worth the 10-20× memory reduction.
        - listitem [ref=e154]:
          - strong [ref=e155]: QLoRA is the practical baseline.
          - text: 4-bit NF4 quantization (bitsandbytes) + LoRA enables 7B fine-tuning on a single 24 GB GPU and 70B fine-tuning on 2×A100. The quality gap vs. full BF16 is minimal for most fine-tuning tasks (Dettmers et al., 2023 showed within 1-2% of full fine-tuning).
        - listitem [ref=e156]:
          - strong [ref=e157]: 8-bit Adam (bitsandbytes) is a free lunch.
          - text: Quantizing optimizer states to INT8 cuts Adam's optimizer overhead by ~4× with negligible training quality impact. For full fine-tuning where you can't use LoRA, this is the first optimization to reach for.
        - listitem [ref=e158]:
          - strong [ref=e159]: Batch size and gradient accumulation decouple compute from memory.
          - text: Effective batch size = per-GPU batch × gradient accumulation steps. Training with batch=1 and accumulation=8 matches the gradient statistics of batch=8 while using 8× less activation memory per step.
