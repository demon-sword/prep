    - generic [ref=e123]:
      - heading "Key Takeaways" [level=2] [ref=e124]
      - list [ref=e125]:
        - listitem [ref=e126]: → The √d_k scaling is not cosmetic — without it, dot products grow proportional to √d_k, saturating softmax and killing gradients in large heads. In GPT-3 (d_k=128), unscaled std ≈ 11, causing near-zero gradients in all but the max-scoring pair.
        - listitem [ref=e127]: "→ KV cache is why long-context inference is memory-bound: a 70B model serving 32K tokens with B=8 needs ~70GB for the KV cache alone. GQA (Llama-2-70B uses 8 KV heads for 64 query heads) reduces this 8× with minimal quality loss — now the standard pattern in production-grade models."
        - listitem [ref=e128]: → FlashAttention-2 does not reduce FLOPs — it reduces HBM memory bandwidth usage by tiling to SRAM. The speedup (2–4×) is entirely from avoiding the O(n²) memory write of the attention matrix, making long-context training 4–8× more memory-efficient.
        - listitem [ref=e129]: "→ Different attention heads provably specialize: syntactic heads track subject-verb dependencies, positional heads handle local context, semantic heads do long-range coreference. Head pruning experiments (Michel et al. 2019) show 50–70% of heads can be removed from BERT with <1% task degradation — but which heads matter depends on the task."
        - listitem [ref=e130]: → RoPE (used in Llama, Mistral, Falcon) encodes relative position via rotation, making attention scores decay naturally with distance and enabling better length extrapolation vs. learned absolute embeddings. Combining RoPE with YaRN or dynamic NTK scaling lets models generalize from 4K→128K tokens without full retraining.
        - listitem [ref=e131]: "→ Causal masking is what enables teacher-forcing: the entire sequence is processed in one forward pass with O(n) parallelism during training. At inference, this collapses to sequential token-by-token generation, which is why prefill (parallel) is compute-bound and decode (sequential) is memory-bound."
