      - heading "Positional Encoding and Attention" [level=3] [ref=e80]
      - paragraph [ref=e81]:
        - text: "Attention itself is permutation-invariant — it has no sense of token order. Position must be injected separately. In the original transformer: absolute sinusoidal PE added to embeddings before attention. Modern LLMs use"
        - strong [ref=e82]: RoPE
        - text: "(Rotary Position Embedding, Su et al. 2021): rotation matrices applied to Q and K at each attention head so that inner products naturally encode relative distance. RoPE generalizes better to sequence lengths beyond training — RoPE + YaRN / ALiBi extensions allow extrapolation to 128K+ token contexts. Llama-2, Mistral, and GPT-NeoX all use RoPE."
