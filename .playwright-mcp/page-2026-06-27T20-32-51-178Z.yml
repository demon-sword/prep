      - 'heading "The Core Insight: Differentiable Lookup" [level=3] [ref=e9]'
      - paragraph [ref=e10]:
        - text: Attention is best understood as a
        - emphasis [ref=e11]: soft, differentiable key-value store lookup
        - text: . Imagine a database of key-value pairs. To retrieve a value, you supply a query and compare it to every key; the similarity scores determine how much of each value you blend together. The transformer makes this entire process end-to-end differentiable by parameterizing Q, K, and V as learned linear projections of the same input sequence.
      - paragraph [ref=e12]:
        - text: Formally, given an input matrix
        - code [ref=e13]: "X ∈ ℝ^{n×d_model}"
        - text: ", three learned weight matrices project it into queries, keys, and values:"
      - generic [ref=e14]:
        - text: Q = X·W_Q | K = X·W_K | V = X·W_V
        - text: "W_Q, W_K ∈ ℝ^{d_model × d_k} | W_V ∈ ℝ^{d_model × d_v}"
      - paragraph [ref=e15]:
        - text: The dot product
        - code [ref=e16]: Q·Kᵀ
        - text: computes a raw similarity between every query-key pair, producing an
        - code [ref=e17]: n×n
        - text: score matrix. This is scaled by
        - code [ref=e18]: √d_k
        - text: to prevent the softmax from saturating (at large
        - code [ref=e19]: d_k
        - text: ", dot products grow in magnitude, pushing gradients to near-zero), then normalized via softmax to get attention weights, then applied to values:"
      - generic [ref=e20]: Attention(Q, K, V) = softmax( Q·Kᵀ / √d_k ) · V
      - heading "Why the √d_k Scaling Matters" [level=3] [ref=e21]
      - paragraph [ref=e22]:
        - text: If Q and K are initialized with unit variance, their dot product has variance
        - code [ref=e23]: d_k
        - text: . Without scaling, for
        - code [ref=e24]: d_k = 64
        - text: (typical in GPT-2), dot products have std ≈ 8, pushing softmax into regions where gradients vanish. Dividing by √64 = 8 restores unit variance. This is not just a stability trick — without it, training is qualitatively harder, especially in the first few layers.
      - heading "Multi-Head Attention" [level=3] [ref=e25]
      - paragraph [ref=e26]:
        - text: "Single-head attention computes one set of attention patterns. But language requires attending to different relationships simultaneously: subject-verb agreement, coreference, positional adjacency, semantic similarity. Multi-head attention runs"
        - code [ref=e27]: h
        - text: "independent attention heads in parallel, each with its own projection matrices:"
      - generic [ref=e28]:
        - text: head_i = Attention(X·W_Qᵢ, X·W_Kᵢ, X·W_Vᵢ)
        - text: MultiHead(X) = Concat(head₁, ..., headₕ) · W_O
        - text: "where W_Qᵢ, W_Kᵢ ∈ ℝ^{d_model × (d_model/h)}"
      - paragraph [ref=e29]:
        - text: In GPT-style models,
        - code [ref=e30]: d_model
        - text: "is split evenly across heads: GPT-2 (1.5B) uses"
        - code [ref=e31]: h=25
        - text: heads with
        - code [ref=e32]: d_k=64
        - text: . GPT-3 uses
        - code [ref=e33]: h=96
        - text: heads with
        - code [ref=e34]: d_k=128
        - text: . The output projection
        - code [ref=e35]: "W_O ∈ ℝ^{d_model × d_model}"
        - text: "mixes information across heads. Empirically, different heads specialize: some attend to local context, others to distant syntactic dependencies. This is verified via probing experiments — ablating individual heads shows measurable degradation on specific linguistic tasks."
      - heading "Causal Masking for Autoregressive Models" [level=3] [ref=e36]
      - paragraph [ref=e37]:
        - text: Decoder-only models (GPT, Llama, etc.) must not allow token
        - code [ref=e38]: i
        - text: to attend to token
        - code [ref=e39]: j > i
        - text: during training — that would let the model cheat by peeking at future tokens. Causal masking sets the upper triangle of the attention score matrix to
        - code [ref=e40]: "-∞"
        - text: before softmax, making those positions contribute zero weight after exponentiation. The result is a lower-triangular attention pattern.
      - paragraph [ref=e41]: "This masking is the reason decoder-only models can be trained with a simple next-token prediction objective: every position predicts its next token in parallel using only its causal context. Encoder models (BERT) use full bidirectional attention (no mask) and are trained with masked language modeling (MLM) instead."
      - 'heading "KV Cache: The Inference-Critical Optimization" [level=3] [ref=e42]'
      - paragraph [ref=e43]:
        - text: During autoregressive decoding, each new token needs to attend to all prior tokens. Without caching, this requires recomputing K and V for all previous positions at every step — O(n²) work total for a sequence of length n. The
        - strong [ref=e44]: KV cache
        - text: stores K and V matrices for all past tokens; each step only computes Q/K/V for the new token and appends to the cache.
      - paragraph [ref=e45]:
        - text: "KV cache memory cost: for a model with"
        - code [ref=e46]: L
        - text: layers,
        - code [ref=e47]: h
        - text: heads,
        - code [ref=e48]: d_k
        - text: per head, sequence length
        - code [ref=e49]: "n"
        - text: ", and batch size"
        - code [ref=e50]: B
        - text: ", in FP16:"
        - code [ref=e51]: 2 × L × B × n × h × d_k × 2 bytes
        - text: ". For Llama-2-70B with n=4096 and B=1: ~≈17 GB just for the cache. This is why long-context inference is memory-bound, not compute-bound."
      - heading "Grouped-Query Attention (GQA) and Multi-Query Attention (MQA)" [level=3] [ref=e52]
      - paragraph [ref=e53]:
        - text: To reduce KV cache size,
        - strong [ref=e54]: Multi-Query Attention
        - text: (Shazeer 2019) shares a single K and V across all query heads — slashing cache by factor
        - code [ref=e55]: h
        - text: at the cost of some expressivity.
        - strong [ref=e56]: Grouped-Query Attention
        - text: (Ainslie et al. 2023, used in Llama-2-70B) groups
        - code [ref=e57]: h
        - text: query heads into
        - code [ref=e58]: g
        - text: groups, each sharing one K/V pair. GQA reduces cache by
        - code [ref=e59]: h/g
        - text: while maintaining most quality — Llama-2-70B uses 8 KV heads for 64 query heads (8× reduction). This is now the dominant pattern in production models.
      - 'heading "Flash Attention: Memory-Efficient Exact Attention" [level=3] [ref=e60]'
      - paragraph [ref=e61]:
        - text: Naive attention materializes the full
        - code [ref=e62]: n×n
        - text: score matrix in HBM (GPU memory), which costs O(n²) memory and creates expensive memory I/O. FlashAttention (Dao et al. 2022) tiles the computation to stay within SRAM (L2 cache), computing attention in blocks without ever materializing the full matrix. This reduces HBM reads/writes from O(n²) to O(n), achieving 2–4× wall-clock speedup for sequence lengths ≥ 1K. FlashAttention-2 adds better parallelism across sequence positions; FlashAttention-3 exploits H100 TMA hardware. All major frameworks (PyTorch, JAX) use Flash variants by default.
