    - generic [ref=e128]:
      - heading "Key Takeaways" [level=2] [ref=e129]
      - list [ref=e130]:
        - listitem [ref=e131]:
          - text: ▸
          - strong [ref=e132]: DPO is algebraically equivalent to RLHF at optimality
          - text: "— it's not an approximation. The derivation proves that the same optimal policy solves both objectives. The difference is purely in how you get there: RL optimization vs supervised loss."
        - listitem [ref=e133]:
          - text: ▸
          - strong [ref=e134]: The offline nature is DPO's biggest practical limitation.
          - text: For tasks where ground-truth feedback can be automated (code execution, math verifier, unit tests), online RL (RLVR) consistently beats DPO. DeepSeek-R1, Qwen, and OpenAI o-series all use online RL with verifiable rewards — not DPO — for reasoning capability.
        - listitem [ref=e135]:
          - text: ▸
          - strong [ref=e136]: β ≈ 0.1–0.3 is the empirical sweet spot
          - text: for chat and instruction following. Lower β risks mode collapse and length degeneration. Higher β leaves too much RLHF performance on the table. Monitor KL from reference (should stay under ~3–5 nats) and chosen/rejected reward gap throughout training.
        - listitem [ref=e137]:
          - text: ▸
          - strong [ref=e138]: SFT quality dominates DPO quality.
          - text: "DPO can't fix a bad SFT checkpoint — it can only move relative probabilities. If the SFT model can't produce the desired behavior at all, DPO won't surface it. The 80/20 rule: invest heavily in SFT data quality before running DPO."
        - listitem [ref=e139]:
          - text: ▸
          - strong [ref=e140]: The "chosen degradation" failure mode is real.
          - text: DPO can decrease the absolute log-probability of chosen responses while increasing the relative ratio over rejected — the model gets worse at both, just less bad at chosen. DPOP adds a constraint preventing chosen probability from falling below π_ref. Monitor absolute NLL on chosen responses, not just the loss.
        - listitem [ref=e141]:
          - text: ▸
          - strong [ref=e142]: KTO and SimPO are viable alternatives when paired data is scarce.
          - text: KTO works on unpaired (response, label) data; SimPO removes the reference model entirely. Both appear in production at organizations that can't afford the annotator cost of pairwise preference collection (200–500 pairs/hour at human annotation rates).
