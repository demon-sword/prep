    - generic [ref=e129]:
      - heading "Key Takeaways" [level=2] [ref=e130]
      - list [ref=e131]:
        - listitem [ref=e132]:
          - strong [ref=e133]: No single defense is sufficient.
          - text: "Production systems require defense-in-depth: input guardrails, prompt hardening, output classifiers, and architectural privilege separation. Relying on model alignment alone is naive — even RLHF-trained models can be jailbroken with sufficient effort."
        - listitem [ref=e134]:
          - strong [ref=e135]: VR vs. FRR is the key operating tradeoff.
          - text: Targeting VR <1% at FRR <2% is realistic for well-engineered systems. Pushing VR to near-0 typically blows FRR past 10%, breaking the product. Always plot and report both metrics — a "99% attack detection rate" headline without FRR is meaningless.
        - listitem [ref=e136]:
          - strong [ref=e137]: Indirect injection in agentic systems is the critical frontier.
          - text: A browsing agent fetching a malicious webpage, an email agent reading a poisoned message — these are injection vectors that traditional perimeter defenses can't easily block. Privilege separation and human-in-the-loop for write actions are necessary architectural patterns, not optional hardening.
        - listitem [ref=e138]:
          - strong [ref=e139]: Many-shot jailbreaking scales with context length.
          - text: Anthropic's 2024 research showed that as context windows grew to 100K+ tokens, filling them with compliant examples dramatically increased attack success rates. Longer contexts are a security attack surface, not just a capability gain.
        - listitem [ref=e140]:
          - strong [ref=e141]: Automated red-teaming is table stakes.
          - text: Tools like Garak (open-source), PyRIT (Microsoft), and PromptBench provide structured adversarial probing. Relying on human red teams alone doesn't scale — you need continuous automated evaluation as your system and the attack landscape both evolve.
        - listitem [ref=e142]:
          - strong [ref=e143]: Token-level attacks (GCG suffixes) transfer across models.
          - text: Adversarial suffixes found via gradient search on open-weight models transfer to black-box models at non-trivial rates, meaning defending only your proprietary model's alignment isn't sufficient if the attack was discovered via a public model.
