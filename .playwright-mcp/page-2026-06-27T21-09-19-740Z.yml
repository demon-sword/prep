    - generic [ref=e92]:
      - heading "Key Takeaways" [level=2] [ref=e93]
      - list [ref=e94]:
        - listitem [ref=e95]:
          - text: "→ BoN quality scales logarithmically with N: doubling N costs 2× compute but gains only"
          - code [ref=e96]: ~√(2 ln 2)
          - text: reward standard deviations. Going from N=64 to N=128 rarely justifies the cost.
        - listitem [ref=e97]: → Beam search maximizes log-probability under the model, which diverges from human preference on open-ended tasks — outputs become generic and repetitive. Use it only where model probability aligns with task quality (translation, constrained extraction).
        - listitem [ref=e98]: → BoN is parallelizable; beam search is serial. In a multi-GPU serving setup, BoN maps naturally to concurrent inference workers — beam search requires synchronized decoding steps, adding coordination overhead.
        - listitem [ref=e99]: → The reward model is the limiting factor in BoN. A miscalibrated scorer (e.g., preferring longer responses) leads to reward hacking at inference time — same failure mode as RLHF but without gradient updates to amortize it.
        - listitem [ref=e100]: → Self-consistency (majority-vote BoN) gained 18+ percentage points on GSM8K math reasoning without any model change. It's one of the highest-ROI inference-time techniques for structured output tasks.
        - listitem [ref=e101]: "→ Production BoN at scale: cost = N × (1 inference call + 1 reward model call). At N=32 for a 70B model, this is 32 inference calls — feasible only with efficient batching (vLLM, TensorRT-LLM) and a cheap reward model (often a small 7B classifier)."
