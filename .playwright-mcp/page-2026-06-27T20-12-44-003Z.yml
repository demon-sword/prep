    - generic [ref=e69]:
      - heading "Key Takeaways" [level=2] [ref=e70]
      - list [ref=e71]:
        - listitem [ref=e72]:
          - strong [ref=e73]: Context vector is the original bottleneck.
          - text: A single fixed-size vector encoding an entire sequence caused catastrophic forgetting on sentences longer than ~20 tokens. Attention solved this by giving the decoder a dynamic, content-based view into
          - emphasis [ref=e74]: all
          - text: encoder states — not just the final one.
        - listitem [ref=e75]:
          - strong [ref=e76]: Teacher forcing creates exposure bias.
          - text: Training with ground-truth previous tokens but decoding with model-predicted tokens causes distribution mismatch. In production, scheduled sampling (gradually replacing ground-truth with model outputs during training) or minimum-risk training mitigates this — but it's still a gap Transformers don't fully escape either.
        - listitem [ref=e77]:
          - strong [ref=e78]: Seq2Seq → Transformer is architectural, not conceptual.
          - text: T5, BART, and mBART still use encoder-decoder design — they replaced RNN cells with self-attention layers. Tasks needing full-input comprehension before generation (e.g., translation, summarization with extractive step) still benefit from the encoder-decoder split vs decoder-only GPT-style.
        - listitem [ref=e79]:
          - strong [ref=e80]: Attention weights ≠ interpretability.
          - text: Visualizing attention matrices became popular for interpretability, but Jain & Wallace (2019) showed attention weights often don't correlate with feature importance. They are alignment scores, not causal explanations. Don't over-index on them as ground truth.
        - listitem [ref=e81]:
          - strong [ref=e82]: GNMT showed the compounding power of engineering tricks.
          - text: Google's production Seq2Seq (2016) used 8 LSTM layers, residual connections between layers, attention, and aggressive quantization (INT8 weights). The tricks together — not any single one — produced the 55–85% error reduction. System-level thinking beats algorithmic purity.
        - listitem [ref=e83]:
          - strong [ref=e84]: Beam search is the default Seq2Seq decoder.
          - text: Greedy decoding is fast but suboptimal. Beam search (width 4–10) improves output quality at the cost of latency proportional to beam size. Modern LLMs mostly use sampling (top-p, temperature) instead — beam search often produces repetitive, safe outputs.
