    - generic [ref=e141]:
      - heading "Key Takeaways" [level=2] [ref=e142]
      - list [ref=e143]:
        - listitem [ref=e144]:
          - strong [ref=e145]: The 20-tokens-per-parameter rule
          - text: — The Chinchilla compute-optimal ratio D_opt ≈ 20·N holds surprisingly well across scales from 70M to 70B parameters. GPT-3's actual ratio was ~1.7 tokens/param — roughly 12× undertrained. This single finding made "large model" strategy obsolete.
        - listitem [ref=e146]:
          - strong [ref=e147]: Inference-optimal ≠ compute-optimal
          - text: — Production models like LLaMA-2, Mistral, and Falcon deliberately over-train (use more tokens than Chinchilla says is compute-optimal) to make smaller, cheaper-to-serve models. A 7B model trained on 2T tokens is cheaper to run than a 70B model trained on 200B tokens at similar quality — even though the latter is "more compute-efficient" to train.
        - listitem [ref=e148]:
          - strong [ref=e149]: "Training FLOPs formula:"
          - text: C ≈ 6·N·D is a critical identity. Forward pass ≈ 2·N·D FLOPs, backward pass ≈ 4·N·D FLOPs. This means you can estimate any training run cost from model size + token count — a routine sanity check before committing GPU clusters.
        - listitem [ref=e150]:
          - strong [ref=e151]: Data quality is now the binding constraint
          - text: — At 20 tokens/param, a 70B model needs 1.4T quality tokens. The entire Wikipedia is ~3.5B tokens. Deduplicated CommonCrawl snapshots reach ~15-20T, but raw quality is poor. Data curation (quality scoring, dedup, domain mixing) is now as important as model architecture.
        - listitem [ref=e152]:
          - strong [ref=e153]: Chinchilla's law breaks for MoE models
          - text: — For Mixture-of-Experts, C ≈ 6·N_active·D where N_active is the active parameter count per token (not total). Mixtral 8x7B activates ~13B/token despite having 47B total params, so its compute requirements are much lower than naive parameter count suggests.
        - listitem [ref=e154]:
          - strong [ref=e155]: Scaling laws may overfit to architecture choices
          - text: — The Chinchilla law was fit on dense decoder-only transformers of 2021-2022 vintage. Different architectures (SSMs like Mamba, RWKV, hybrid models) have different compute-to-loss relationships. Applying Chinchilla blindly to non-transformer architectures can be misleading.
