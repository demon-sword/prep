      - 'heading "The \"Over-Training\" Correction: Inference-Optimal Models" [level=3] [ref=e74]'
      - paragraph [ref=e75]:
        - text: "Chinchilla optimizes for training loss at a fixed compute budget. But there's a crucial nuance:"
        - emphasis [ref=e76]: the objective is often inference efficiency, not just training loss
        - text: ". If you're going to deploy a model and run billions of inference calls, using a smaller model trained on more tokens is better in two ways:"
      - list [ref=e77]:
        - listitem [ref=e78]:
          - strong [ref=e79]: "Inference cost:"
          - text: A 70B model is cheaper to serve than a 175B model, even if they achieve similar quality.
        - listitem [ref=e80]:
          - strong [ref=e81]: "Quality retention:"
          - text: More tokens means the model has seen more diverse patterns, making it more robust.
      - paragraph [ref=e82]: "This is why Meta's LLaMA and LLaMA-2 models deliberately \"over-train\" relative to the Chinchilla compute-optimal point — they use far more tokens than strict compute-optimality requires, accepting higher training cost in exchange for smaller, faster inference models. LLaMA-2 70B uses 2T tokens (29 tokens/param) while Chinchilla says 20/param is compute-optimal. The reasoning: training runs once, but inference runs millions of times."
      - heading "Implications for Modern LLM Design" [level=3] [ref=e83]
      - paragraph [ref=e84]: "The Chinchilla paper triggered a fundamental rethink of LLM scaling strategy:"
      - list [ref=e85]:
        - listitem [ref=e86]:
          - strong [ref=e87]: "Data quality becomes paramount:"
          - text: If you need 20× more tokens than params, and you're training a 7B model, that's 140B high-quality tokens — enough to exhaust curated sources like books and Wikipedia. Data curation, deduplication, and quality filtering became critical infrastructure.
        - listitem [ref=e88]:
          - strong [ref=e89]: "The compute frontier shifted:"
          - text: The most performant model for a given FLOP budget is much smaller than previously assumed. You don't need to be Google-scale to train a competitive model — you need a well-curated dataset.
        - listitem [ref=e90]:
          - strong [ref=e91]: "Mixture of Experts (MoE) changes the equation:"
          - text: MoE models (like Mixtral 8x7B, GPT-4) have more total parameters but activate fewer per token, so the C ≈ 6ND formula changes — active parameters, not total parameters, determine training FLOPs per token.
        - listitem [ref=e92]:
          - strong [ref=e93]: "Data depletion is now a real concern:"
          - text: If scaling laws require 20 tokens/param and you want a 100T parameter model, you'd need 2 quadrillion tokens. At current internet scale (~15T tokens), this is physically impossible without synthetic data generation.
