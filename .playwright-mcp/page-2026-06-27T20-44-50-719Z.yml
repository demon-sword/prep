    - generic [ref=e3]: foundations
    - heading "Chinchilla Scaling Law" [level=1] [ref=e4]
    - paragraph [ref=e5]: "Hoffmann et al. (2022) optimal compute allocation: equal scaling of model size and tokens — and why GPT-3 was massively undertrained."
  - main [ref=e6]:
    - generic [ref=e7]:
      - 'heading "Theory: The Compute-Optimal Scaling Law" [level=2] [ref=e8]'
      - heading "The Pre-Chinchilla World" [level=3] [ref=e9]
      - paragraph [ref=e10]: "Before 2022, the prevailing wisdom came from Kaplan et al.'s 2020 scaling laws paper from OpenAI. Their key finding was that as you increase compute budget, you should primarily increase model size — training tokens mattered less. This led to a generation of ever-larger models: GPT-3 at 175B parameters (300B tokens), Gopher at 280B parameters (300B tokens), and Megatron-Turing NLG at 530B parameters (~270B tokens)."
      - paragraph [ref=e11]:
        - text: "The intuition seemed sound: bigger models learn more per token, so throw tokens at a big model and stop when compute runs out. But this reasoning was subtly flawed. It confused \"more efficient per token\" with \"better use of compute.\" The actual question is:"
        - emphasis [ref=e12]: for a fixed compute budget, how should you split that compute between model size and data?
      - 'heading "The Chinchilla Insight: Equal Scaling" [level=3] [ref=e13]'
      - paragraph [ref=e14]: "DeepMind's \"Training Compute-Optimal Large Language Models\" (Hoffmann et al., 2022) — nicknamed \"Chinchilla\" after the 70B model they trained to validate their laws — answered this question definitively. Their central finding:"
      - generic [ref=e15]:
        - generic [ref=e16]: Chinchilla Optimal Allocation Rule
        - text: N_opt ∝ C
        - superscript [ref=e17]: "0.5"
        - text: and D_opt ∝ C
        - superscript [ref=e18]: "0.5"
        - text: "⟹ For a fixed compute budget C (FLOPs):"
        - text: • Model size and training tokens should scale equally
        - text: • Approximately 20 tokens per parameter is optimal
        - text: • C ≈ 6 · N · D (FLOPs to train ≈ 6× params × tokens)
      - paragraph [ref=e19]: Concretely, if you have a compute budget that could train GPT-3 (175B params, 300B tokens), the Chinchilla-optimal model would use ~3.5T tokens on a ~8-9B parameter model — or some intermediate point like 70B parameters trained on 1.4T tokens, which is exactly what Chinchilla itself is. Chinchilla (70B) outperformed Gopher (280B) on almost every benchmark, using the same compute budget.
      - heading "The Mathematical Foundation" [level=3] [ref=e20]
      - paragraph [ref=e21]: "The paper models language model loss as a function of parameters N and training tokens D:"
      - generic [ref=e22]:
        - generic [ref=e23]: Loss Model (Hoffmann et al. 2022, Eq. 4)
        - text: L(N, D) = E + A / N
        - superscript [ref=e24]: α
        - text: + B / D
        - superscript [ref=e25]: β
        - text: "Where:"
        - text: E = irreducible entropy of natural language (~1.69 nats)
        - text: A, B = fitted constants (A ≈ 406.4, B ≈ 410.7)
        - text: α ≈ 0.34 (diminishing returns to model size)
        - text: β ≈ 0.28 (diminishing returns to more data)
      - paragraph [ref=e26]: "Given the compute constraint C ≈ 6ND, you substitute D = C/(6N) and minimize L over N. Using calculus (Lagrange multipliers / differentiation), the optimal allocation satisfies:"
      - generic [ref=e27]:
        - generic [ref=e28]: Optimal allocation (Approach 3 from the paper)
        - text: N_opt(C) ≈ G · C
        - superscript [ref=e29]: a
        - text: D_opt(C) ≈ C / (6 · N_opt) = C
        - superscript [ref=e30]: 1-a
        - text: / (6G)
        - text: Where a ≈ 0.46, G ≈ 0.0083
        - text: "Simplified rule of thumb:"
        - text: N_opt ≈ (C / 120)
        - superscript [ref=e31]: "0.5"
        - text: "[parameters]"
        - text: D_opt ≈ 20 · N_opt [tokens]
      - paragraph [ref=e32]: The paper uses three independent methodologies (IsoFLOP profiles, minimum loss over fixed N, parametric fitting) and all three converge on the same finding, giving strong confidence in the 20 tokens/param rule.
