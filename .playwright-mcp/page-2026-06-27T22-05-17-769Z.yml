    - generic [ref=e107]:
      - generic [ref=e108]: Key Takeaways
      - list [ref=e109]:
        - listitem [ref=e110]:
          - strong [ref=e111]: Perplexity comparisons must use the same tokenizer and test set.
          - text: A model with 10B parameters reporting PPL=5 on its own test split is not comparable to another model reporting PPL=8 on a different split or with a different BPE vocabulary. Always benchmark on a standardized, held-out eval set like HellaSwag or a fixed WikiText-103 slice.
        - listitem [ref=e112]:
          - strong [ref=e113]: Always mask prompt tokens from loss in instruction fine-tuning.
          - text: Including the system prompt in loss computation typically wastes 50–90% of gradient signal on tokens the model already knows perfectly. Response-only loss (DataCollatorForCompletionOnlyLM in TRL) consistently improves instruction-following on the same compute budget.
        - listitem [ref=e114]:
          - strong [ref=e115]: Forward vs reverse KL determines mode-seeking vs mode-covering.
          - text: RLHF uses reverse KL (KL(π‖π_ref)) to prevent reward hacking while allowing the policy to be sharper than the reference. VAEs use forward KL which encourages broader posterior coverage. Getting this direction wrong causes pathological training behavior.
        - listitem [ref=e116]:
          - strong [ref=e117]: A 1-nat reduction in cross-entropy loss gets exponentially harder at low loss.
          - text: Going from loss=3.0 → 2.0 (PPL 20→7.4) is achieved with 10× compute scaling. Going from loss=2.0 → 1.0 (PPL 7.4→2.7) requires roughly 100× more compute. This is why scaling returns diminish and data quality becomes the binding constraint.
        - listitem [ref=e118]:
          - strong [ref=e119]: The KL penalty in PPO has a practical sweet spot of 0.1–2.0.
          - text: "Too small: reward hacking dominates. Too large: the policy can't move from the reference and reward never improves. AnthropicKL annealing schedules or adaptive β (as in KTO/DPO) avoid this hyperparameter sensitivity."
        - listitem [ref=e120]:
          - strong [ref=e121]: Per-token loss variance is a signal for data quality and memorization.
          - text: Spikes in loss (high-loss tokens) often correspond to rare names, numbers, or code identifiers. Very low loss on entire passages is a memorization signal — the model has seen that exact text in training. Log per-token loss during eval to detect both failure modes.
