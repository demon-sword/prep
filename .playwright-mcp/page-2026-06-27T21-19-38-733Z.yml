    - generic [ref=e102]:
      - heading "Key Takeaways" [level=2] [ref=e103]
      - list [ref=e104]:
        - listitem [ref=e105]:
          - strong [ref=e106]: LoRA is mergeable, adapters aren't.
          - text: LoRA's A·B update can be folded into W₀ at inference time, giving zero latency overhead. Adapter bottleneck modules sit in the forward path and add ~3–8% latency per adapter — a real cost at scale.
        - listitem [ref=e107]:
          - strong [ref=e108]: QLoRA enables single-GPU fine-tuning of 65B+ models
          - text: by quantizing frozen weights to 4-bit NF4. The accuracy loss (~1–2% on benchmarks) is acceptable for most domain adaptation tasks, making previously cloud-only workloads accessible on a single 48GB GPU.
        - listitem [ref=e109]:
          - strong [ref=e110]: LoRA rank is not a free hyperparameter.
          - text: "Rank controls the intrinsic dimension of adaptation. Too low (r=1–2): underfits complex tasks. Too high (r=256+): wastes parameters without gain, can overfit. r=16–64 is the sweet spot for most tasks. Run a quick ablation on your eval set."
        - listitem [ref=e111]:
          - strong [ref=e112]: S-LoRA (vLLM) can serve 1000+ adapters from one base model
          - text: using unified paging. This means you can fine-tune a different adapter per customer and serve all of them from a single GPU cluster — a transformative serving architecture for multi-tenant AI products.
        - listitem [ref=e113]:
          - strong [ref=e114]: Full fine-tuning's memory cost is 4× the model size for Adam in fp32
          - text: (weights + gradients + 2 Adam moments). A 7B model needs ~112 GB; a 70B model needs ~1.1 TB. Gradient checkpointing trades compute for activation memory (up to 10× reduction) but doesn't help with optimizer states.
        - listitem [ref=e115]:
          - strong [ref=e116]: Partial fine-tuning's frozen layers still consume forward-pass memory
          - text: — activations accumulate through the full network. "Freezing" only saves gradient and optimizer state memory, not activation memory, unless paired with gradient checkpointing and layer-wise memory release tricks.
