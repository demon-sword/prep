      - heading "3. Volume Estimation" [level=3] [ref=e62]
      - paragraph [ref=e63]: "How much data do you need? The answer varies by objective:"
      - list [ref=e64]:
        - listitem [ref=e65]:
          - strong [ref=e66]: "Pretraining:"
          - text: Chinchilla-optimal is ~20 tokens per parameter. A 7B model needs ~140B tokens; a 70B model needs ~1.4T. Modern practice overtrains on compute-to-tokens ratio (LLaMA 3 used ~15T tokens for 8B params) for better inference-time efficiency.
        - listitem [ref=e67]:
          - strong [ref=e68]: "SFT:"
          - text: As few as 1,000–10,000 high-quality examples can shift behavior substantially. LIMA showed 1,000 curated examples beat 52K noisy ones. More isn't better if quality is low.
        - listitem [ref=e69]:
          - strong [ref=e70]: "DPO/preference:"
          - text: Typically 10K–100K preference pairs. UltraFeedback used 64K; Anthropic's HH used ~160K. The chosen/rejected gap matters more than count — hard negatives drive better learning than easy pairs.
        - listitem [ref=e71]:
          - strong [ref=e72]: "Reward model:"
          - text: 50K–500K scalar-scored pairs. Reward model quality is the limiting factor of the entire RLHF pipeline; underinvesting here breaks everything downstream.
      - 'heading "4. Data Sourcing: Collection, Annotation, Augmentation, Synthesis" [level=3] [ref=e73]'
      - paragraph [ref=e74]: "Real-world dataset engineering uses four sourcing strategies:"
      - paragraph [ref=e75]:
        - strong [ref=e76]: "Human Annotation:"
        - text: The gold standard for quality but expensive — $0.50–$5.00 per annotated sample for complex tasks. Crowdsourcing (MTurk, Scale AI, Surge AI) is common. Requires annotator guidelines, calibration runs, gold sets to catch cheating, and IAA monitoring. Expert annotation (lawyers, doctors, coders) costs 5–20× more but is essential for specialized tasks.
      - paragraph [ref=e77]:
        - strong [ref=e78]: "Web Scraping & Filtering:"
        - text: "Common Crawl provides ~70PB of raw web data, processed into C4, The Pile, DCLM. Processing steps include: language identification (fastText langdetect), quality filtering (perplexity-based, C4 heuristics), deduplication (MinHash LSH for near-dups, exact SHA hashing for exact dups), and PII removal. The DCLM benchmark showed that filtering strategy matters enormously — carefully filtered 3B tokens outperformed noisier 300B tokens datasets on downstream benchmarks."
      - paragraph [ref=e79]:
        - strong [ref=e80]: "Augmentation:"
        - text: "For low-resource tasks, augment existing data: paraphrase via back-translation or stronger LLMs, swap entity names, introduce noise (typos, casing), or generate counterfactuals. The risk is introducing distribution artifacts the model learns instead of the underlying task."
      - paragraph [ref=e81]:
        - strong [ref=e82]: "Synthetic Data Generation:"
        - text: "Use a large model to generate training data for a smaller model. Alpaca used GPT-3.5 to generate 52K instruction-following examples from 175 seed examples. This is now standard practice for SFT at scale. Critical caveats: (1) synthetic data amplifies teacher model biases, (2) training on synthetic outputs from the same model family risks capability collapse (model collapse problem), (3) \"teacher ceiling\" — student cannot exceed teacher quality without ground-truth grounding."
      - heading "5. Data Processing Pipeline" [level=3] [ref=e83]
      - generic [ref=e84]:
        - generic [ref=e85]:
          - generic [ref=e86]: Collect
          - generic [ref=e87]: Web scrape, annotation, synthetic gen, existing datasets
          - text: →
        - generic [ref=e88]:
