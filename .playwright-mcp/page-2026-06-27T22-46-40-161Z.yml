      - heading "6. Deduplication — The Most Underrated Step" [level=3] [ref=e103]
      - paragraph [ref=e104]:
        - text: Duplicate data causes memorization, not generalization. A document repeated 100 times gets memorized verbatim — the model will regurgitate it at inference rather than synthesize new outputs. Lee et al. (2022) showed that deduplication with MinHash LSH reduced the training set of C4 by 30% while
        - emphasis [ref=e105]: improving
        - text: downstream quality across all benchmarks tested. Semantic deduplication (embedding-based) is more expensive but catches paraphrase-level duplicates that MinHash misses.
      - heading "7. Chat Templates and Prompt Loss Masking" [level=3] [ref=e106]
      - paragraph [ref=e107]:
        - text: "For instruction tuning, format matters mechanically. Every model family has a specific chat template that the tokenizer uses to delimit system, user, and assistant turns. Using the wrong template during SFT will train the model to produce incorrect delimiters at inference. Common templates:"
        - code [ref=e108]: "[INST] ... [/INST]"
        - text: (Llama 2),
        - code [ref=e109]: <|im_start|>user\n...<|im_end|>
        - text: (ChatML / Llama 3+).
      - paragraph [ref=e110]:
        - strong [ref=e111]: Prompt loss masking
        - text: "is equally critical: during SFT, mask the loss on the instruction/system tokens and only backpropagate on the completion tokens. Training the model to \"predict\" its own system prompt is waste and can cause mode collapse on instruction tokens."
      - heading "Production Reality" [level=3] [ref=e112]
      - paragraph [ref=e113]: "Tools: Hugging Face datasets for hosting and streaming, DataTrove and dolma for large-scale processing pipelines, Argilla for annotation UI, Label Studio for multi-modal annotation, Cleanlab for automated data quality auditing, RAGAS for RAG-specific dataset evaluation."
      - paragraph [ref=e114]: "At production scale, dataset engineering is a continuous pipeline, not a one-time task. You monitor data drift, track annotator performance degradation over time, and run data ablations before each model update. The 80/20 rule applies inversely: 80% of engineering effort goes into data, 20% into model code — but most teams staff it the other way around."
