    - generic [ref=e3]: Training
    - heading "Dataset Engineering for LLMs" [level=1] [ref=e4]
    - paragraph [ref=e5]: Data formats per task type, quality dimensions, volume estimation, annotation pipelines, augmentation, synthesis, and the full data processing workflow.
  - main [ref=e6]:
    - generic [ref=e7]:
      - heading "Theory" [level=2] [ref=e8]
      - paragraph [ref=e9]: "Data is the actual substrate of intelligence in LLMs. Model architecture is largely commoditized — GPT-4, Claude, and Gemini share the transformer skeleton. What differentiates them at the margin is data: its quantity, quality, composition, and the engineering discipline applied to assembling it. A senior AI engineer spends far more time on data pipelines than on model architecture decisions."
      - heading "1. Data Formats Per Training Objective" [level=3] [ref=e10]
      - paragraph [ref=e11]: "Every training objective has a canonical data format. Getting the format wrong — even with the right content — produces silent degradation in the model's ability to generalize. There are four primary formats:"
      - generic [ref=e12]:
        - generic [ref=e13]:
          - generic [ref=e14]: Self-Supervised
          - generic [ref=e15]: "{ \"text\": \"raw document...\" }"
          - paragraph [ref=e16]: Pure next-token prediction on unlabeled text. Used for pretraining. No annotation required — the label is the next token in the sequence. WebText, The Pile, C4, RedPajama, DCLM are standard corpora.
        - generic [ref=e17]:
          - generic [ref=e18]: Instruction
          - generic [ref=e19]: "{ \"instruction\": \"...\", \"input\": \"...\", \"output\": \"...\" }"
          - paragraph [ref=e20]: SFT format. The model learns to follow instructions. Alpaca, FLAN, Dolly, OpenAssistant, and ShareGPT are canonical sources. Quality beats quantity — 1K high-quality examples often beat 100K noisy ones.
        - generic [ref=e21]:
          - generic [ref=e22]: Preference
          - generic [ref=e23]: "{ \"prompt\": \"...\", \"chosen\": \"...\", \"rejected\": \"...\" }"
          - paragraph [ref=e24]: Used for DPO/RLHF. A prompt paired with two responses — a preferred and a rejected one. The model learns to produce chosen-like outputs. Anthropic's HH dataset and UltraFeedback are widely used.
        - generic [ref=e25]:
          - generic [ref=e26]: Reward / Scalar
          - generic [ref=e27]: "{ \"prompt\": \"...\", \"response\": \"...\", \"score\": 4.2 }"
          - paragraph [ref=e28]: Used to train reward models in the RLHF pipeline. A scalar score per (prompt, response) pair, usually 1–5 or 1–10. Requires careful calibration across annotators to prevent reward model miscalibration.
      - heading "2. The Six Quality Dimensions" [level=3] [ref=e29]
      - paragraph [ref=e30]: "Quantity scaling has diminishing returns without quality control. The Chinchilla paper showed that data quality matters as much as scale. There are six key dimensions to assess:"
