    - generic [ref=e164]:
      - heading "Key Takeaways" [level=2] [ref=e165]
      - list [ref=e166]:
        - listitem [ref=e167]:
          - strong [ref=e168]: "Quality beats quantity for SFT:"
          - text: LIMA (2023) showed 1,000 curated instruction examples outperform 52K noisy ones. Invest in data quality pipelines (Cleanlab, Argilla) before scaling annotation budget.
        - listitem [ref=e169]:
          - strong [ref=e170]: "Deduplication is non-optional:"
          - text: Duplicate data causes verbatim memorization, not generalization. MinHash LSH dedup on C4 reduced dataset size by 30% while
          - emphasis [ref=e171]: improving
          - text: all benchmark scores (Lee et al., 2022). Run exact + near-duplicate removal before any training run.
        - listitem [ref=e172]:
          - strong [ref=e173]: "Synthetic data has a teacher ceiling:"
          - text: LLM-generated SFT data (à la Alpaca) cannot exceed teacher model quality without ground truth grounding. Repeated distillation from the same model family leads to capability collapse — always mix with human-curated or real-world data.
        - listitem [ref=e174]:
          - strong [ref=e175]: "Prompt loss masking is a hard requirement for SFT:"
          - text: Backpropagating through instruction tokens (not just completions) wastes gradient signal and causes models to overfit to system prompt structure. Use per-token loss masking in your training harness (supported natively in TRL/Axolotl).
        - listitem [ref=e176]:
          - strong [ref=e177]: "The weakest quality dimension sets the ceiling:"
          - text: A dataset with 9/10 on five dimensions and 2/10 on compliance (e.g., PII in training data) will fail production — regulators and model audits will find it. Treat all six dimensions as blockers, not averages.
        - listitem [ref=e178]:
          - strong [ref=e179]: "Chat template mismatch silently breaks models:"
          - text: A Llama-3-format SFT dataset applied to a Mistral tokenizer produces token-level misalignment that the loss function cannot distinguish from real signal. Always validate chat template application with a decoded sample before training.
