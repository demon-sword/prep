    - generic [ref=f2e149]:
      - heading "Key Takeaways" [level=2] [ref=f2e150]
      - list [ref=f2e151]:
        - listitem [ref=f2e152]:
          - strong [ref=f2e153]: "KV cache is the memory budget killer at long context:"
          - text: "A single 128K-context request on Llama 3 70B uses ~40 GB of KV cache alone — more than the model weights (70 GB). Without GQA (standard MHA), that same request would demand ~320 GB of KV cache, completely infeasible on any single GPU. Every decision about context length flows from this formula:"
          - code [ref=f2e154]: 2 x L x Hkv x d x n x bytes
          - text: .
        - listitem [ref=f2e155]:
          - strong [ref=f2e156]: "PagedAttention is the virtual-memory solution applied to LLMs:"
          - text: vLLM's key insight is that KV cache management is isomorphic to OS virtual memory — fixed-size pages, on-demand allocation, page tables for logical-to-physical mapping, and copy-on-write prefix sharing. This eliminates fragmentation and enables 10-20x higher concurrent throughput. It is not an incremental optimization; it is a category-defining architectural change.
        - listitem [ref=f2e157]:
          - strong [ref=f2e158]: "GQA is an architecture-level optimization that pays for itself 8x:"
          - text: Grouped Query Attention reduces KV cache by the ratio of query heads to KV heads (typically 8x) with less than 0.5% quality degradation on standard benchmarks. Every modern production model uses GQA — standard MHA is effectively obsolete for large-scale serving.
        - listitem [ref=f2e159]:
          - strong [ref=f2e160]: "Prefix caching makes system prompts free (or nearly free):"
          - text: When 100 requests share a 10K-token system prompt, PagedAttention stores it once and serves all 100 from the same physical pages. Anthropic charges 1% for cache hits. This changes the economics of prompt design — you can afford elaborate system prompts, extensive few-shot examples, or long document contexts when they're cached.
        - listitem [ref=f2e161]:
          - strong [ref=f2e162]: "Quantize the KV cache, not just the weights:"
          - text: Storing K and V in int8 (vs fp16) halves KV cache memory with negligible quality impact (<1% on most evals). KIVI (per-channel int4 K + int8 V) pushes this to 2-4x reduction. FP8 on H100 offers hardware-accelerated quantized KV cache. This is the cheapest way to double your effective context window without changing the model architecture.
        - listitem [ref=f2e163]:
          - strong [ref=f2e164]: "In the long-context serving stack, GQA + PagedAttention + KV cache quantization + prefix caching compound multiplicatively:"
          - text: GQA gives you 8x baseline reduction. PagedAttention eliminates waste from fragmentation (~2-5x effective). Prefix caching amortizes shared prefixes (up to Nx for N concurrent requests with the same preamble). KV cache quantization gives 2x. Taken together, a workload that would require 320 GB of KV cache per request (MHA, naive allocation) can be served in ~2 GB (GQA, paged, shared, quantized).
