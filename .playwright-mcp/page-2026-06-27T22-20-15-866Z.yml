- generic [active] [ref=e1]:
  - banner [ref=e2]:
    - generic [ref=e3]: "Inference · #27"
    - heading "Prompt Engineering Strategies" [level=1] [ref=e4]
    - paragraph [ref=e5]: Zero/few/one-shot prompting, chain-of-thought, system vs user prompts, persona, output format, self-critique — and how to compose them for reliable outputs.
  - main [ref=e6]:
    - generic [ref=e7]:
      - heading "Theory" [level=2] [ref=e8]
      - paragraph [ref=e9]: "Prompt engineering is the practice of structuring the text input to an LLM so that it reliably produces the desired output. While it can look like \"trying different phrasings,\" the best engineers treat it as a systems design problem: what information does the model need, in what format, and in what order to minimise the probability mass on unwanted completions?"
      - heading "Why Prompts Matter so Profoundly" [level=3] [ref=e10]
      - paragraph [ref=e11]: LLMs are next-token predictors. The model's behavior at inference time is determined entirely by the input token sequence — there is no other lever except sampling parameters. A 7B-parameter model can outperform GPT-4 on a specific task when given a well-designed prompt, or GPT-4 can fail spectacularly on a trivial task when the prompt is ambiguous. The prompt is the sole interface between your intent and the model's learned distribution.
      - paragraph [ref=e12]: "The mechanism: every token in the context shifts the attention-weighted representation of downstream tokens. A poorly placed instruction gets \"washed out\" by subsequent tokens; a precisely placed system instruction sets the prior over the entire distribution that follows. Anthropic's research shows that models like Claude pay heavily disproportionate attention to early tokens in the context — front-loading your task definition matters."
      - 'heading "Shot-Based Prompting: Zero, One, Few" [level=3] [ref=e13]'
      - paragraph [ref=e14]:
        - strong [ref=e15]: Zero-shot
        - text: prompting relies entirely on the model's pretrained priors. You describe the task and expect the model to generalise. Works well for tasks the model has seen in abundance during pretraining (summarisation, translation, QA). Fails on tasks with ambiguous output schema, unfamiliar domains, or required formats the model has no strong prior for.
      - paragraph [ref=e16]:
        - strong [ref=e17]: One-shot
        - text: provides a single input/output example that demonstrates the desired format. The model conditions its completion on that one example. Useful when format matters but you can't afford many tokens.
      - paragraph [ref=e18]:
        - strong [ref=e19]: Few-shot
        - text: "provides N examples (typically 3–10). Each example acts as an in-context gradient update — not a real gradient, but an extremely strong conditioning signal. GPT-3's original paper (Brown et al., 2020) demonstrated that few-shot prompting can match fine-tuned models on many benchmarks with zero weight updates. The order of examples matters: models exhibit"
        - emphasis [ref=e20]: recency bias
        - text: ", weighting the last example most heavily. Randomly shuffling examples before each call can reduce this effect."
      - generic [ref=e21]:
        - generic [ref=e22]:
          - generic [ref=e23]: Zero-Shot
          - generic [ref=e24]: Relies on pretrained priors. No examples. Maximum generality, least control.
        - generic [ref=e25]:
          - generic [ref=e26]: One-Shot
          - generic [ref=e27]: One input/output pair. Anchors format and style with minimal token cost.
        - generic [ref=e28]:
          - generic [ref=e29]: Few-Shot
          - generic [ref=e30]: 3–10 examples. Strong conditioning. Order matters due to recency bias.
      - heading "Chain-of-Thought (CoT) Prompting" [level=3] [ref=e31]
      - paragraph [ref=e32]:
        - text: Wei et al. (2022) showed that appending "Let's think step by step" to a prompt (or demonstrating reasoning in few-shot examples) causes the model to emit a reasoning trace before its final answer. This is not a cognitive trick — it works because the intermediate tokens
        - strong [ref=e33]: become part of the input context for subsequent tokens
        - text: . The model is literally reading its own intermediate reasoning when producing the final answer, which gives it more "compute" to solve the problem.
      - paragraph [ref=e34]: "CoT primarily helps on tasks that decompose: multi-step arithmetic, symbolic reasoning, causal inference. It adds latency and token cost (output tokens at inference are expensive). For classification tasks with single-token outputs, CoT often hurts — it forces the model down a reasoning path that can veer from the answer. Zero-shot CoT (\"think step by step\") is often as good as few-shot CoT in practice, especially for models above ~100B parameters."
      - heading "System vs User Prompt Architecture" [level=3] [ref=e35]
      - paragraph [ref=e36]:
        - text: Modern models (GPT-4, Claude, Llama 3 instruction) expose separate system and user message slots. The
        - strong [ref=e37]: system prompt
        - text: "is processed with a different positional encoding and typically receives higher implicit weight in the model's attention. It should contain: task definition, persona, output format requirements, constraints, and safety rules. The user message is the per-request variable content."
      - paragraph [ref=e38]:
        - text: In production, the system prompt is where you encode your company's brand voice, output schema, and negative examples. Because it's reused across calls, it also benefits from
        - strong [ref=e39]: prompt caching
        - text: (Anthropic, OpenAI both offer this) — the KV cache for system prompt tokens is precomputed and reused, reducing prefill cost by 80–90% on repeated calls. A 4096-token system prompt amortised over thousands of user calls becomes nearly free.
      - heading "Persona and Role Assignment" [level=3] [ref=e40]
      - paragraph [ref=e41]: "Instructing the model to \"act as an expert X\" works because the model's training data contains an enormous volume of text written by subject matter experts, and role assignment biases the sampling distribution toward that subspace. It is not a trick — it changes which probability mass the model draws from. Effective personas are: specific rather than generic (\"senior infrastructure engineer at a Series B SaaS company\" vs \"expert engineer\"), domain-appropriate, and consistent with the task."
      - heading "Output Format Control" [level=3] [ref=e42]
      - paragraph [ref=e43]:
        - text: Specifying the exact output format (JSON schema, markdown table, numbered list, specific headers) is one of the highest-ROI prompt changes. Without explicit format instruction, the model samples from a distribution over all formats it has seen — high entropy. With a schema example or explicit format instruction, that entropy collapses. For structured output, providing a JSON schema via the API's
        - code [ref=e44]: response_format
        - text: parameter (OpenAI, Anthropic) is preferable to asking for JSON in the prompt — it adds a grammar constraint at the decoding layer, guaranteeing valid JSON.
      - heading "Self-Critique and Iterative Refinement" [level=3] [ref=e45]
      - paragraph [ref=e46]: "Self-critique prompts ask the model to evaluate its own output and then improve it. The implementation: generate a draft → prompt the model to identify weaknesses → prompt again to produce a revised version incorporating the critique. This pattern exploits the model's capability gap between generation and evaluation — models are generally better critics than generators. Studies show self-consistency (sampling multiple outputs and taking a majority vote) improves accuracy on reasoning tasks by 5–15% without any fine-tuning."
      - heading "Production Reality" [level=3] [ref=e47]
      - paragraph [ref=e48]:
        - text: "In production, prompt engineering is never \"set and forget.\" Model providers update models (silent version updates are common — GPT-4-turbo in Jan 2024 behaved differently from Nov 2023). What works for one model generation may regress on the next. Best practice: maintain a prompt test suite with expected outputs, run it against every model update, and pin to a specific model version (e.g."
        - code [ref=e49]: gpt-4-0125-preview
        - text: ) in production until you have validated the successor. Token cost is real — a 2000-token system prompt at GPT-4 pricing costs ~$0.04 per 100 calls when not cached, which adds up at scale.
      - heading "Prompting Anti-Patterns to Avoid" [level=3] [ref=e51]
      - list [ref=e52]:
        - listitem [ref=e53]:
          - strong [ref=e54]: Vague task description
          - text: — "Improve this text" vs "Rewrite this product description to emphasize the speed benefit, in 2 sentences, in a friendly tone"
        - listitem [ref=e55]:
          - strong [ref=e56]: Contradictory instructions
          - text: "— System: \"Be concise.\" User: \"Provide a detailed analysis.\" Model must guess the priority."
        - listitem [ref=e57]:
          - strong [ref=e58]: No negative examples
          - text: — Models learn from examples of what NOT to do as much as what to do. Include 1–2 bad-output examples labeled as such in few-shot sets.
        - listitem [ref=e59]:
          - strong [ref=e60]: CoT on classification
          - text: — Adding CoT reasoning before a binary classification answer can cause the model to "argue itself" into the wrong answer.
        - listitem [ref=e61]:
          - strong [ref=e62]: Instruction at the end
          - text: — Models have a recency bias; the task instruction gets maximum weight when placed after examples, not before them. But the system prompt instruction should still come first — the sandwich structure (instruction → examples → instruction restatement) is a known pattern that helps.
