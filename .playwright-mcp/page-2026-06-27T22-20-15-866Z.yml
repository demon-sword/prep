    - generic [ref=e145]:
      - heading "Key Takeaways" [level=2] [ref=e146]
      - list [ref=e147]:
        - listitem [ref=e148]:
          - text: "▸ Few-shot ordering is a silent accuracy killer: recency bias means placing your best/most representative example"
          - strong [ref=e149]: last
          - text: in the list. Shuffling examples before each API call reduces positional dependence and variance across calls by 10–20%.
        - listitem [ref=e150]: ▸ Chain-of-Thought is not universally better — it helps on multi-step decomposable tasks (math, logic) but hurts on single-token classification tasks where the reasoning trace can "argue" the model to a wrong answer. Gate CoT behind task type in production.
        - listitem [ref=e151]: "▸ System prompt caching is a major cost lever at scale: a 4000-token cached system prompt costs 90% less per call on Anthropic (cache read vs full prefill pricing). Structure your prompts to maximise the stable prefix and put variable content at the end."
        - listitem [ref=e152]: "▸ Self-consistency (sample K outputs, majority vote) is often cheaper than a larger model: 3× GPT-3.5 calls with majority voting often matches or beats a single GPT-4 call on reasoning tasks, at a fraction of the cost. Use it before upgrading model tier."
        - listitem [ref=e153]: ▸ Maintain a regression test suite for your prompts — silent model version updates (common on OpenAI and Anthropic hosted endpoints) can shift output distribution significantly. Pin model versions in production and validate before migrating.
        - listitem [ref=e154]:
          - text: "▸ Prompt injection is a real attack surface: user-controlled inputs placed inside a system prompt can override instructions. Defense: clearly delimit user content with XML tags or sentinel strings ("
          - code [ref=e155]: <user_input>...</user_input>
          - text: ) and run a secondary classifier on the assembled prompt before execution.
