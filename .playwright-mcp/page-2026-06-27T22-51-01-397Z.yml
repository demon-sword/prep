    - generic [ref=e139]:
      - heading "Key Takeaways" [level=2] [ref=e140]
      - list [ref=e141]:
        - listitem [ref=e142]:
          - strong [ref=e143]: "Diagnose before optimizing:"
          - text: Profiling is non-negotiable. Decode is almost always memory-bandwidth-bound at batch=1; prefill is almost always compute-bound for long prompts. The interventions are different — apply the wrong fix and you gain nothing.
        - listitem [ref=e144]:
          - strong [ref=e145]: "Continuous batching is the highest-leverage systems win:"
          - text: vLLM's PagedAttention + continuous batching typically yields 10–20x throughput improvement over naïve HuggingFace
          - code [ref=e146]: generate()
          - text: with zero model changes. Do this first.
        - listitem [ref=e147]:
          - strong [ref=e148]: "int4 quantization on 70B+ models is production-safe:"
          - text: AWQ / GPTQ int4 on Llama 3 70B loses <2% quality on most evals while fitting in 40 GB VRAM instead of 140 GB. The tradeoff is worthwhile for most applications.
        - listitem [ref=e149]:
          - strong [ref=e150]: "Speculative decoding's speedup is acceptance-rate dependent:"
          - text: If draft and target models are misaligned (different tokenizer, different domain), acceptance rate collapses and you spend more compute than you save. Test empirically. 2.5–3x is realistic for well-matched pairs.
        - listitem [ref=e151]:
          - strong [ref=e152]: "KV cache is the memory budget killer at long context:"
          - text: A 128K-context request on Llama 3 70B occupies ~40 GB of KV cache alone. GQA reduces this by 8x vs MHA; prefix caching amortizes it across requests with shared system prompts.
        - listitem [ref=e153]:
          - strong [ref=e154]: "FlashAttention is free quality:"
          - text: It produces mathematically identical outputs to standard attention — it's a pure systems optimization. If you're not using it (via
          - code [ref=e155]: torch.nn.functional.scaled_dot_product_attention
          - text: in PyTorch 2.0+), you're leaving 2–4x prefill speed on the table.
