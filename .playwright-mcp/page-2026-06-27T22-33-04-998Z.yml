    - generic [ref=e178]:
      - heading "Key Takeaways" [level=2] [ref=e179]
      - list [ref=e180]:
        - listitem [ref=e181]:
          - strong [ref=e182]: HNSW dominates for low-latency in-memory retrieval.
          - text: At <50M vectors with >8GB RAM headroom, HNSW +
          - code [ref=e183]: ef=50
          - text: delivers <5ms P99 at >98% recall@10 — the default choice for Qdrant, Weaviate, and pgvector. For billion-scale, IVF+PQ is unavoidable.
        - listitem [ref=e184]:
          - strong [ref=e185]: Two-stage retrieval is non-negotiable at production scale.
          - text: Bi-encoder ANN retrieval finds candidates cheap and fast; cross-encoder reranking adds 30–60% nDCG lift at the cost of 200–500ms. Always budget latency for reranking in your SLA.
        - listitem [ref=e186]:
          - strong [ref=e187]: Embedding model choice locks your index.
          - text: Switching from
          - code [ref=e188]: text-embedding-ada-002
          - text: to
          - code [ref=e189]: text-embedding-3-large
          - text: requires full re-embedding and re-indexing. Plan for version-tagged indices and parallel rollout pipelines from day one.
        - listitem [ref=e190]:
          - strong [ref=e191]: Hybrid retrieval (dense + BM25) beats pure dense on most BEIR benchmarks.
          - text: Dense search misses exact keyword matches (product IDs, version numbers, rare proper nouns). RRF fusion is free and adds 5–15% recall on heterogeneous corpora. Always enable it unless your corpus is purely conceptual.
        - listitem [ref=e192]:
          - strong [ref=e193]: Quantization is the lever for memory cost, not recall.
          - text: IVF+PQ compresses 4GB → 128MB (32×) with ~5% recall penalty. Scalar quantization (INT8) halves memory with <1% recall penalty. In RAM-constrained deployments, quantize first before adding more nodes.
        - listitem [ref=e194]:
          - strong [ref=e195]: Chunking strategy is upstream of everything.
          - text: A poorly chunked corpus defeats good indexing. 256-token chunks with 32-token overlap and sentence-boundary splitting outperform naive fixed-size splits by 10–20% in downstream RAG answer quality (measured with RAGAS). Late chunking is state-of-the-art for long-document corpora.
