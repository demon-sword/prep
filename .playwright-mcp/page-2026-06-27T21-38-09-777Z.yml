    - generic [ref=e153]:
      - heading "Key Takeaways" [level=2] [ref=e154]
      - list [ref=e155]:
        - listitem [ref=e156]:
          - strong [ref=e157]: Learning rate is the most consequential knob.
          - text: Full fine-tuning on 7B+ models at LR > 1e-4 often causes catastrophic forgetting within the first epoch. Start at 2e-5 and double only if convergence is too slow after watching 1–2 epoch curves.
        - listitem [ref=e158]:
          - strong [ref=e159]: Gradient accumulation is a mandatory trick.
          - text: With 40 GB GPUs and a 13B fp16 model, you can fit micro-batch = 1–2. Use gradient accumulation × 32 to reach an effective batch of 64 without buying more hardware. TRL, Axolotl, and LLaMA-Factory all handle this transparently.
        - listitem [ref=e160]:
          - strong [ref=e161]: Overfitting happens fast on small datasets.
          - text: A fine-tune on 1k examples with 10 epochs will typically see val loss diverge by epoch 3–4. Always reserve 5–10% of data for a validation split and monitor it. Don't optimize train loss alone.
        - listitem [ref=e162]:
          - strong [ref=e163]: Prompt loss weight = 0 is almost always better for instruction tuning.
          - text: Including loss on system prompt tokens causes the model to waste capacity memorizing template phrasing. OpenAI's supervised fine-tune guide and most production practitioners (Axolotl default) mask prompt tokens.
        - listitem [ref=e164]:
          - strong [ref=e165]: Warmup steps matter more than people realize.
          - text: "At LR 2e-5 with no warmup, early gradient estimates (when weights are still \"wrong\" for the new distribution) can cause destructive updates. Standard practice: warmup over 5% of total steps. Cosine decay vs linear decay rarely changes final quality by >0.5 loss points."
        - listitem [ref=e166]:
          - strong [ref=e167]: For LoRA, tune rank before LR.
          - text: Rank 8–64 covers 95% of use cases. A higher rank (128+) with high LR on a tiny dataset will overfit the LoRA matrices — you get a model that perfectly copies training examples and generalizes poorly. Validate with a task-specific metric, not just loss.
