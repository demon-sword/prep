    - generic [ref=e122]:
      - heading "Key Takeaways" [level=2] [ref=e123]
      - list [ref=e124]:
        - listitem [ref=e125]:
          - text: ▸
          - strong [ref=e126]: Temperature is a multiplier on uncertainty, not quality.
          - text: T < 1 makes the model sycophantic toward its own priors — great for factual retrieval, terrible for diversity. T > 1 doesn't add knowledge; it just spreads mass to tokens the model weakly considered, which often produces hallucinations in factual domains.
        - listitem [ref=e127]:
          - text: ▸
          - strong [ref=e128]: Top-P is almost always better than Top-K for open-ended generation.
          - text: Top-K's fixed cutoff doesn't adapt to distribution shape — at high-confidence steps it still wastes budget on near-zero tokens. Top-P (nucleus) contracts naturally. The original "The Curious Case of Neural Text Degeneration" (Holtzman 2020) empirically shows nucleus sampling produces more human-like text.
        - listitem [ref=e129]:
          - text: ▸
          - strong [ref=e130]: For evals, always use T = 0 or run multiple samples.
          - text: Any T > 0 makes results non-deterministic. A 1-point benchmark difference might vanish across seeds. Major leaderboards (MMLU, HumanEval) typically eval at T = 0.
        - listitem [ref=e131]:
          - text: ▸
          - strong [ref=e132]: vLLM, TGI, and llama.cpp implement sampling in CUDA — it's essentially free latency.
          - text: The bottleneck in decode phase is always memory bandwidth for KV cache, not the softmax+sample step. Don't optimize sampling for speed; optimize it for output quality.
        - listitem [ref=e133]:
          - text: ▸
          - strong [ref=e134]: Repetition penalty is underrated.
          - text: Even with nucleus sampling, models can degenerate in long generations. llama.cpp's
          - code [ref=e135]: "--repeat-penalty 1.1"
          - text: with a context window of 64 past tokens is a practical default that prevents most looping without hurting output quality measurably.
        - listitem [ref=e136]:
          - text: ▸
          - strong [ref=e137]: Don't combine temperature and top-P simultaneously unless you understand the interaction.
          - text: "Most API providers document this warning. Use one primary lever: either tune temperature (with top-P = 1.0) or tune top-P (with temperature = 1.0). Mixing both creates non-obvious distribution shapes that are hard to reason about."
