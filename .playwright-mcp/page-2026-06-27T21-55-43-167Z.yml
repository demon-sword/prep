  - banner [ref=e2]:
    - generic [ref=e3]: evaluation
    - heading "LLM Evaluation Metrics" [level=1] [ref=e4]
    - paragraph [ref=e5]: Exact match, lexical similarity (ROUGE, BLEU, edit distance), semantic similarity (cosine), and LLM-as-judge — with their biases and when to trust each.
  - main [ref=e6]:
    - generic [ref=e7]:
      - heading "Theory" [level=2] [ref=e8]
      - heading "Why Evaluation is Hard for LLMs" [level=3] [ref=e9]
      - paragraph [ref=e10]: Evaluating LLMs is fundamentally different from evaluating classical ML classifiers. A classifier has a ground-truth label — correct or not. An LLM answering "Summarize this article" can produce dozens of valid, high-quality responses. The question is not whether the output matches a stored string but whether it conveys the right information, maintains the right tone, avoids hallucinations, and follows instructions.
      - paragraph [ref=e11]:
        - text: This multiplicity of valid outputs forces us to use approximate proxies. Every metric we use is a proxy — some coarser, some finer — and each captures a different facet of quality. Understanding
        - emphasis [ref=e12]: what each metric actually measures
        - text: and where it breaks down is essential before trusting any evaluation signal in production.
      - heading "1. Exact Match (EM)" [level=3] [ref=e13]
      - paragraph [ref=e14]:
        - text: "The simplest metric:"
        - code [ref=e15]: score = 1 if prediction == reference else 0
        - text: . Used in extractive QA benchmarks like SQuAD (after normalizing punctuation and casing). Extremely fast to compute, zero ambiguity.
      - generic [ref=e16]:
        - generic [ref=e17]: Exact Match
        - text: EM = (# predictions that exactly equal reference) / (# total predictions)
      - paragraph [ref=e18]: "EM is appropriate only when answers are short, unambiguous facts — named entities, dates, numbers. It completely fails for free-form generation: \"Paris is the capital of France.\" vs \"The French capital is Paris.\" are semantically identical but score 0 with EM."
      - heading "2. Edit Distance (Levenshtein)" [level=3] [ref=e19]
      - paragraph [ref=e20]: The minimum number of single-character insertions, deletions, or substitutions needed to transform one string into another. A normalized variant divides by the length of the longer string to produce a [0,1] similarity score.
      - generic [ref=e21]:
        - generic [ref=e22]: Normalized Edit Distance
        - text: NED(a,b) = 1 − levenshtein(a, b) / max(len(a), len(b))
      - paragraph [ref=e23]: Edit distance is character-level — it's sensitive to surface changes but can't detect semantic equivalence. It's still useful as a cheap spell-check signal or to catch near-identical outputs.
      - heading "3. ROUGE (Recall-Oriented Understudy for Gisting Evaluation)" [level=3] [ref=e24]
      - paragraph [ref=e25]: "Developed at USC ISI (Lin, 2004) for summarization. ROUGE computes n-gram overlap between a candidate and one or more reference summaries. Three common variants:"
      - list [ref=e26]:
        - listitem [ref=e27]:
          - strong [ref=e28]: ROUGE-1
          - text: ": Unigram (word-level) overlap. Recall-oriented — penalizes missing content words."
        - listitem [ref=e29]:
          - strong [ref=e30]: ROUGE-2
          - text: ": Bigram overlap. More sensitive to fluency and phrase ordering than ROUGE-1."
        - listitem [ref=e31]:
          - strong [ref=e32]: ROUGE-L
          - text: ": Longest common subsequence (LCS). Captures in-sequence matches, more flexible than n-gram methods."
      - generic [ref=e33]:
        - generic [ref=e34]: ROUGE-N F1
        - text: Precision = matched n-grams / candidate n-grams Recall = matched n-grams / reference n-grams F1 = 2 × P × R / (P + R)
      - paragraph [ref=e35]: ROUGE correlates reasonably well with human judgments on summarization tasks (~0.7 Pearson on DUC datasets) but breaks down for longer, more abstractive summaries, paraphrases, and multilingual settings. It rewards token overlap without understanding meaning. A model that copies verbatim gets high ROUGE; one that rewrites creatively gets penalized.
      - heading "4. BLEU (Bilingual Evaluation Understudy)" [level=3] [ref=e36]
      - paragraph [ref=e37]: Originally designed for machine translation (Papineni et al., 2002). BLEU computes precision of n-gram matches (1–4 grams) between hypothesis and reference, with a brevity penalty (BP) to punish short outputs.
      - generic [ref=e38]:
        - generic [ref=e39]: BLEU
        - text: BLEU = BP × exp(Σ wₙ × log pₙ) BP = min(1, exp(1 − r/c)) where r=ref length, c=candidate length wₙ = 1/N (uniform weights, typically N=4)
      - paragraph [ref=e40]: "BLEU correlates with human translation quality at the corpus level but poorly at the sentence level. It assumes translators and summarizers reuse source vocabulary heavily — an assumption that breaks down for LLMs that paraphrase. A well-known BLEU failure mode: two equally correct translations of the same sentence can have BLEU = 0 if they happen to use different valid word choices. BLEU scores below 10 are essentially random noise for single-sentence evaluations."
      - heading "5. Semantic Similarity (Cosine)" [level=3] [ref=e41]
      - paragraph [ref=e42]:
        - text: Encode both candidate and reference with a sentence embedding model (e.g.,
        - code [ref=e43]: all-MiniLM-L6-v2
        - text: ","
        - code [ref=e44]: text-embedding-3-small
        - text: ", or"
        - code [ref=e45]: bge-large-en-v1.5
        - text: "), then compute cosine similarity of the embedding vectors:"
      - generic [ref=e46]:
        - generic [ref=e47]: Cosine Similarity
        - text: cos(a, b) = (a · b) / (‖a‖ × ‖b‖) ∈ [−1, 1] In practice, sentence embeddings cluster in [0.3, 1.0] for English text
      - paragraph [ref=e48]: "Semantic similarity captures paraphrase equivalence that lexical metrics miss entirely. It's model-dependent — the quality of the signal is only as good as your embedding model. Risks: embedding models can be insensitive to negation (\"the drug is safe\" vs \"the drug is not safe\" can score ~0.95 semantic similarity on some models) and can miss factual errors that sound plausible."
      - heading "6. LLM-as-Judge" [level=3] [ref=e49]
      - paragraph [ref=e50]: Use a capable LLM (GPT-4o, Claude 3.5 Sonnet, or a fine-tuned evaluator) to score outputs on rubrics — accuracy, helpfulness, groundedness, fluency, safety. This approach dramatically reduces the need for expensive human annotation and captures nuances that lexical/embedding metrics miss. RAGAS uses LLM-as-judge for RAG pipeline evaluation (faithfulness, answer relevancy, context precision/recall).
      - paragraph [ref=e51]: "LLM judges are powerful but carry three critical biases:"
      - list [ref=e52]:
        - listitem [ref=e53]:
          - strong [ref=e54]: Self-bias
          - text: ": A model tends to prefer outputs that match its own style. GPT-4 rates GPT-4 outputs higher; Claude rates Claude outputs higher. Use cross-model judging to mitigate."
        - listitem [ref=e55]:
          - strong [ref=e56]: Position bias
          - text: ": When comparing two answers (A vs B), the judge often prefers whichever comes first. Always swap order and average to cancel this out."
        - listitem [ref=e57]:
          - strong [ref=e58]: Verbosity bias
          - text: ": Longer, more verbose answers get rated higher even when the shorter answer is more accurate. Empirically, GPT-4 shows ~15–20% preference for verbose answers on factual tasks."
      - generic [ref=e59]:
        - strong [ref=e60]: "Critical gotcha:"
        - text: LLM judges can be systematically fooled. A model fine-tuned to get high judge scores without being actually better ("reward hacking" via judge proxies) is a real failure mode. Always cross-validate judge scores against human labels on a held-out set before fully trusting them.
      - heading "7. Metric Selection Framework" [level=3] [ref=e61]
      - paragraph [ref=e62]: "No single metric is sufficient. A production evaluation harness typically uses 2–3 metrics at different granularities:"
      - generic [ref=e63]:
        - generic [ref=e64]:
          - generic [ref=e65]: Exact Match
          - generic [ref=e66]: "Range: {0, 1}"
          - paragraph [ref=e67]: "Use for structured extraction: dates, entity spans, classification labels. Fails for any free-form generation."
        - generic [ref=e68]:
          - generic [ref=e69]: ROUGE-L / ROUGE-2
          - generic [ref=e70]: "Range: [0, 1]"
          - paragraph [ref=e71]: Use for summarization with fixed references. Reasonable human correlation for extractive tasks. Fails for abstractive / paraphrase-heavy outputs.
        - generic [ref=e72]:
          - generic [ref=e73]: BLEU
          - generic [ref=e74]: "Range: [0, 100]"
          - paragraph [ref=e75]: Use for translation with multiple references. Corpus-level only — single-sentence BLEU is noisy. Penalizes valid paraphrases.
        - generic [ref=e76]:
          - generic [ref=e77]: Semantic Similarity
          - generic [ref=e78]: "Range: [0, 1] (practical)"
          - paragraph [ref=e79]: Use when surface form varies but meaning should be preserved. Model-dependent. Poor at detecting factual errors that sound plausible.
        - generic [ref=e80]:
          - generic [ref=e81]: LLM-as-Judge
          - generic [ref=e82]: "Range: [1, 5] or [0, 1]"
          - paragraph [ref=e83]: Best for complex, multi-dimensional quality (instruction following, groundedness, coherence). Expensive. Requires bias mitigation and human calibration.
      - generic [ref=e84]:
        - strong [ref=e85]: "Production stack:"
        - text: Start with cheap lexical metrics for CI regression detection. Add semantic similarity for paraphrase tolerance. Add LLM-as-judge for nuanced quality signals. Budget $0.01–$0.10 per LLM judge evaluation — compare to human annotation at $0.50–$5.00 per sample.
