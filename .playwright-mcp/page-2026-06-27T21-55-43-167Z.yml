    - generic [ref=e200]:
      - heading "Key Takeaways" [level=2] [ref=e201]
      - list [ref=e202]:
        - listitem [ref=e203]:
          - generic [ref=e204]: ⚠️
          - generic [ref=e205]:
            - strong [ref=e206]: No single metric is sufficient.
            - text: Lexical metrics (ROUGE, BLEU) punish valid paraphrases; semantic metrics miss factual errors; LLM judges carry systematic biases. Production harnesses stack 2–3 metrics at different granularities and calibrate against human labels.
        - listitem [ref=e207]:
          - generic [ref=e208]: 📉
          - generic [ref=e209]:
            - strong [ref=e210]: BLEU below 10 is noise at sentence level.
            - text: BLEU was designed for corpus-level MT evaluation with multiple human references. Using single-sentence BLEU on LLM outputs often produces misleading signals — two correct paraphrases can both score 0.
        - listitem [ref=e211]:
          - generic [ref=e212]: 🤖
          - generic [ref=e213]:
            - strong [ref=e214]: LLM-as-judge requires bias controls.
            - text: "Always: (1) swap A/B order and average, (2) use cross-model judging not same-model, (3) validate judge–human correlation on a 200+ sample holdout before deploying. RAGAS provides a ready framework for RAG evaluation using these principles."
        - listitem [ref=e215]:
          - generic [ref=e216]: 🧲
          - generic [ref=e217]:
            - strong [ref=e218]: Semantic similarity is blind to negation.
            - text: Embedding models like MiniLM can assign cosine similarity >0.9 to "the treatment is effective" vs "the treatment is not effective". Never use semantic similarity alone for factual or medical/legal correctness checks.
        - listitem [ref=e219]:
          - generic [ref=e220]: 💰
          - generic [ref=e221]:
            - strong [ref=e222]: Cost hierarchy matters.
            - text: Exact match and ROUGE cost ~$0/1k evals. Semantic similarity via API costs ~$0.001/eval. LLM-as-judge via GPT-4o costs ~$0.01–$0.05/eval. Human annotation costs $0.50–$5.00/eval. Design your evaluation pipeline as a funnel — cheap filters first, expensive judges on hard cases only.
        - listitem [ref=e223]:
          - generic [ref=e224]: 🎯
          - generic [ref=e225]:
            - strong [ref=e226]: ROUGE-L outperforms ROUGE-1/2 for abstractive summaries.
            - text: LCS-based matching is more robust to paraphrase than n-gram counting. For multi-document summarization, use multi-reference ROUGE to reduce variance — single-reference ROUGE has very high variance on creative tasks.
