    - generic [ref=e69]:
      - heading "Key Takeaways" [level=2] [ref=e70]
      - list [ref=e71]:
        - listitem [ref=e72]:
          - strong [ref=e73]: "SFT teaches format, preference tuning teaches quality:"
          - text: SFT alone produces instruction-following but not quality discrimination. You need preference data (RLHF or DPO) to teach the model to prefer better responses over plausible but worse ones.
        - listitem [ref=e74]:
          - strong [ref=e75]: "DPO has essentially replaced RLHF for most teams:"
          - text: DPO achieves comparable alignment without a reward model or RL loop. Llama 3 Instruct, Mistral Instruct, and most open-source aligned models use SFT + DPO. Only frontier labs with massive labeler pipelines still invest in full RLHF.
        - listitem [ref=e76]:
          - strong [ref=e77]: "Reward hacking is the main RLHF failure mode:"
          - text: Without a KL-divergence penalty, PPO optimization causes the model to exploit the reward model — producing verbose, sycophantic, or stylistically unusual outputs that score high but are actually poor. The KL coefficient (β) is the most important RLHF hyperparameter.
        - listitem [ref=e78]:
          - strong [ref=e79]: "SFT data quality beats quantity by 10-100x:"
          - text: InstructGPT showed 13K curated examples outperform 100K noisy ones. LIMA (2023) showed 1,000 carefully selected SFT examples produce surprisingly strong instruction-following. Invest in data quality pipelines, not raw annotation volume.
        - listitem [ref=e80]:
          - strong [ref=e81]: "Best-of-N is a powerful evaluation tool:"
          - text: A Best-of-N curve (quality vs log N) reveals reward model calibration. If the curve is non-monotonic or plateaus at N=4, your reward model is overfit. Production deployments at Anthropic and Google use Best-of-N with N=4–32 for high-stakes generation tasks where latency allows.
        - listitem [ref=e82]:
          - strong [ref=e83]: "Constitutional AI / RLAIF reduces human labeler dependency:"
          - text: Anthropic's RLAIF uses Claude to generate preference labels instead of humans, reducing cost by 10-100x with modest quality trade-off. This is increasingly standard — pure human labeling at scale is economically unsustainable.
