        - heading "Key Takeaways" [level=2] [ref=e132]
      - list [ref=e133]:
        - listitem [ref=e134]:
          - strong [ref=e135]: Write tools need approval gates, not just logging.
          - text: A read-tool failure is retryable; a write-tool failure (email sent, row deleted, payment initiated) is often irreversible. Design confirmation steps and dry-run modes into all write-category tools from day one — retrofitting them after an incident is painful.
        - listitem [ref=e136]:
          - strong [ref=e137]: Cost per agent run compounds rapidly.
          - text: At 10+ LLM calls per task at GPT-4 prices, a single run costs $1–5. At scale, tiered model routing — frontier model for planning, smaller model for execution — cuts costs by 5–20× with minimal quality degradation. Always instrument cost per step before going to production.
        - listitem [ref=e138]:
          - strong [ref=e139]: Task completion rates on realistic benchmarks hover at 30–60%.
          - text: Even frontier models on SWE-bench, WebArena, and Tau-bench fall well short of human performance. Agents fail most on error recovery, not on initial reasoning — they don't retry correctly after unexpected tool output. Build retry logic and error normalization at the harness level, not inside prompts.
        - listitem [ref=e140]:
          - strong [ref=e141]: Observability is not optional.
          - text: You cannot debug a 20-step agent failure without structured traces. Assign trace IDs, log every tool invocation with args/results/latency, and use purpose-built tools like LangSmith or Langfuse. Console.log-based debugging at scale is untenable.
        - listitem [ref=e142]:
          - strong [ref=e143]: Context overflow is the silent killer of long-horizon agents.
          - text: "As the history grows past the context window, early observations silently drop. The agent starts reasoning over an incomplete view without knowing it. Fix: proactively summarize history every N steps, offload to external memory, or use a model with larger context — but don't assume 128K context means you can ignore the problem (it's expensive too)."
        - listitem [ref=e144]:
          - strong [ref=e145]: Prompt injection via tool results is a real attack surface.
          - text: When an agent reads from external sources (web, DB, user-uploaded files), adversarial content can hijack the agent's goal. This is especially dangerous for write-capable agents. Mitigate with goal re-anchoring in the system prompt, output sandboxing, and monitoring for unexpected action patterns.
