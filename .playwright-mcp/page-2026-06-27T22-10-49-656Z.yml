    - heading "25. Model Evaluation Workflow" [level=1] [ref=e4]
    - paragraph [ref=e5]: "Hard vs soft attributes, pointwise vs comparative evaluation, the 5-stage workflow: filter → benchmark → experiment → monitor, and cost-performance frontier mapping."
  - main [ref=e6]:
    - generic [ref=e7]:
      - heading "Theory" [level=2] [ref=e8]
      - paragraph [ref=e9]:
        - text: Choosing a model is not a benchmarking exercise — it is an
        - strong [ref=e10]: engineering decision
        - text: "under constraints. A model that scores highest on MMLU may be too expensive to serve, too slow for your latency SLA, or simply unable to follow your output schema reliably. A principled evaluation workflow treats model selection like system design: define requirements first, measure against them systematically, and track the frontier over time."
      - heading "Hard vs Soft Attributes" [level=3] [ref=e11]
      - paragraph [ref=e12]:
        - text: The first cut in any model selection process is separating
        - emphasis [ref=e13]: hard
        - text: constraints from
        - emphasis [ref=e14]: soft
        - text: "preferences. A hard attribute is a binary pass/fail: the model either satisfies it or it is eliminated regardless of quality. Soft attributes live on a continuous scale and contribute to a cost-quality tradeoff."
