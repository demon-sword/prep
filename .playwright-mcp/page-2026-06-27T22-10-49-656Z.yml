    - generic [ref=e204]:
      - heading "Key Takeaways" [level=2] [ref=e205]
      - list [ref=e206]:
        - listitem [ref=e207]:
          - strong [ref=e208]: "Filter before you benchmark:"
          - text: Eliminating on hard attributes (cost, latency, license, context window) before running any inference saves days of engineering time. Most real shortlists go from 20+ candidates to 4–6 in 30 minutes of documentation review.
        - listitem [ref=e209]:
          - strong [ref=e210]: "Public benchmarks have contamination risk:"
          - text: MMLU and HumanEval scores for frontier models are unreliable — training data frequently includes test sets. A model ranking 1st on HumanEval can rank 3rd on your internal coding eval. Always build a domain-specific golden set.
        - listitem [ref=e211]:
          - strong [ref=e212]: "The Pareto frontier changes weekly:"
          - text: A model that dominates in Q1 may be off the frontier by Q3. Chatbot Arena's ELO leaderboard updates continuously — build monitoring into your pipeline so you re-evaluate quarterly without heroic effort.
        - listitem [ref=e213]:
          - strong [ref=e214]: "LLM judges have systematic biases:"
          - text: Verbosity bias (longer = rated better), self-evaluation bias (GPT-4 rates GPT-4 outputs highest), and position bias (first response in pairwise comparison gets a small boost). Use swap-test (A vs B and B vs A) and average to mitigate position bias. Use length normalization to reduce verbosity bias.
        - listitem [ref=e215]:
          - strong [ref=e216]: "Shadow mode A/B is mandatory before full rollout:"
          - text: Your golden set cannot capture tail distribution of real traffic. 5% shadow routing for 24–72 hours before full promotion catches regressions that only appear on uncommon input patterns.
        - listitem [ref=e217]:
          - strong [ref=e218]: "Silent model updates break production:"
          - text: OpenAI, Anthropic, and Google update models behind aliases without announcements. Pin specific model versions (e.g.
          - code [ref=e219]: claude-3-5-sonnet-20241022
          - text: ", not"
          - code [ref=e220]: claude-3-5-sonnet-latest
          - text: ) and run your golden set nightly to detect drift before users do.
