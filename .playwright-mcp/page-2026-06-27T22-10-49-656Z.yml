      - paragraph [ref=e47]: Soft attributes include task quality (accuracy, ROUGE, human preference score), output consistency, instruction-following fidelity, multilingual coverage, and structured output reliability. These form the axes of the cost-performance Pareto frontier.
      - heading "Pointwise vs Comparative Evaluation" [level=3] [ref=e48]
      - paragraph [ref=e49]: "There are two fundamental evaluation modes, each with different noise profiles:"
      - generic [ref=e50]:
        - paragraph [ref=e51]:
          - strong [ref=e52]: "Pointwise (absolute scoring):"
          - text: Evaluate each model output independently against a rubric, reference answer, or LLM judge. Outputs a scalar score per sample.
          - emphasis [ref=e53]: "Advantage:"
          - text: easy to aggregate, compare to a fixed baseline, and track over time.
          - emphasis [ref=e54]: "Disadvantage:"
          - text: LLM judges exhibit position bias and verbosity bias — long outputs consistently score higher even when they are worse.
        - paragraph [ref=e55]:
          - strong [ref=e56]: "Comparative (head-to-head):"
          - text: Present model A vs model B outputs to a judge (human or LLM) and ask which is better.
          - emphasis [ref=e57]: "Advantage:"
          - text: higher signal-to-noise — humans are better at relative judgment than absolute.
          - emphasis [ref=e58]: "Disadvantage:"
          - text: O(n²) comparisons for n models; hard to establish a global ranking without an ELO-style system. Chatbot Arena uses this pattern at scale.
      - paragraph [ref=e59]: "In production pipelines, a common hybrid is: run pointwise evaluation across all candidate models cheaply using an LLM judge, then run comparative evaluation on the top-3 finalists using human raters for the final decision."
      - heading "The 5-Stage Evaluation Workflow" [level=3] [ref=e60]
      - generic [ref=e61]:
        - generic [ref=e62]: ① Filter
        - generic [ref=e63]: →
        - generic [ref=e64]: ② Benchmark
        - generic [ref=e65]: →
        - generic [ref=e66]: ③ Experiment
        - generic [ref=e67]: →
        - generic [ref=e68]: ④ A/B Test
        - generic [ref=e69]: →
        - generic [ref=e70]: ⑤ Monitor
      - paragraph [ref=e71]:
        - strong [ref=e72]: ① Filter by hard attributes.
        - text: Before running a single inference, eliminate models that fail any hard constraint. This is free — it only requires reading documentation, pricing pages, and license terms. A model that costs $15/1M output tokens might be 30% better than a $1/1M option but fails a cost constraint and should never reach the benchmark stage.
      - paragraph [ref=e73]:
        - strong [ref=e74]: ② Benchmark on public datasets.
        - text: "Run surviving models against established benchmarks relevant to your task domain. For reasoning tasks: MMLU, HellaSwag, ARC. For coding: HumanEval, SWE-bench. For instruction-following: MT-Bench, IFEval. For multilingual: FLORES-200. Public benchmarks have known contamination risks — large models have often seen test sets during pretraining. Treat them as coarse signal, not ground truth."
      - paragraph [ref=e75]:
        - strong [ref=e76]: ③ Experiment on your task distribution.
        - text: This is the highest-signal stage. Construct a golden evaluation set of 100–500 examples representative of your actual traffic (not public benchmarks). Include failure-mode examples, edge cases, and adversarial prompts. Run all surviving models. Use automated metrics (ROUGE, exact match, semantic similarity) plus LLM-as-judge for qualitative dimensions. This stage often reverses benchmark rankings — a model that scores 78% on MMLU may be worse than a 74% model on your medical note summarization task.
      - paragraph [ref=e77]:
        - strong [ref=e78]: ④ A/B Test in production shadow mode.
        - text: "Route a percentage of real traffic through the challenger model, log both outputs, and compare offline using your quality metrics. This catches distribution shift between your golden set and real traffic. A 1–5% canary is typical before full rollout. Tool integrations matter here: LangSmith, Braintrust, and Weights & Biases Prompts all support shadow evaluation."
      - paragraph [ref=e79]:
        - strong [ref=e80]: ⑤ Monitor ongoing quality.
        - text: Model providers silently update models. GPT-4-turbo in November 2023 is not the same model as GPT-4-turbo in March 2024. Set up continuous evaluation with a scheduled golden set run (nightly or weekly) and alert on quality degradation > X%. Track response length, refusal rate, and structured output failure rate as proxy signals. OpenAI's model version pinning (e.g.
        - code [ref=e81]: gpt-4-0125-preview
        - text: ) partially mitigates drift but not indefinitely.
      - heading "The Pareto Frontier" [level=3] [ref=e82]
      - paragraph [ref=e83]:
        - text: Most real model selections involve a cost-performance tradeoff. The
        - strong [ref=e84]: Pareto frontier
        - text: is the set of models where no other model dominates on both cost and quality simultaneously. A model on the frontier is "efficient" — you cannot get better quality without paying more, and you cannot pay less without losing quality.
      - generic [ref=e85]: "Dominated: model A dominates B if: quality(A) ≥ quality(B) AND cost(A) ≤ cost(B) (with at least one strict inequality) Pareto-optimal: no model dominates you"
      - paragraph [ref=e86]: In practice, the frontier changes weekly as new models arrive. The decision is which point on the frontier fits your quality floor and cost ceiling. A team running millions of inferences/day may prefer a frontier model with 2% lower quality but 5× lower cost. A high-stakes medical pipeline may pay the premium for the top-quality frontier point.
      - heading "Evaluating the Evaluator" [level=3] [ref=e87]
      - paragraph [ref=e88]: "A meta-level trap: a flawed evaluation pipeline gives confident wrong answers. Before trusting your evaluation, assess the evaluator itself on four dimensions:"
      - list [ref=e89]:
        - listitem [ref=e90]:
          - strong [ref=e91]: "Signal quality:"
          - text: Does the metric actually correlate with the business outcome you care about? Run experiments with deliberately good and bad outputs and confirm the metric separates them.
        - listitem [ref=e92]:
          - strong [ref=e93]: "Consistency:"
          - text: Run the same evaluation twice. LLM judges should agree with themselves >85% of the time on clear cases. Disagreement indicates too-coarse rubrics.
        - listitem [ref=e94]:
          - strong [ref=e95]: "Calibration:"
          - text: Are metric scores meaningful across models and time, or do they drift? LLM judges trained on GPT-4 outputs are biased toward rating GPT-4-like outputs as better (self-evaluation bias).
        - listitem [ref=e96]:
          - strong [ref=e97]: "Cost:"
          - text: Running GPT-4 as judge on 10,000 examples costs ~$20–80. At scale, use a smaller judge model validated against human raters for that task.
      - heading "Production Reality" [level=3] [ref=e98]
      - paragraph [ref=e99]: "Real evaluation pipelines at companies like Anthropic, OpenAI, and scale-AI run continuously. The typical production setup involves: a curated golden set of 200–2000 labeled examples updated quarterly, a nightly evaluation job scoring deployed models, a dashboard tracking quality/cost/latency over time, and an alerting system that pages oncall when quality drops 3+ sigma from baseline. Teams that invest here catch silent model regressions days before users notice — teams that don't are reactive."
      - paragraph [ref=e100]:
        - text: "Tool ecosystem:"
        - strong [ref=e101]: LangSmith
        - text: (LangChain's evaluation platform),
        - strong [ref=e102]: Braintrust
        - text: (evaluation and prompt management),
        - strong [ref=e103]: RAGAS
        - text: (RAG-specific metrics),
        - strong [ref=e104]: Phoenix (Arize)
        - text: (model observability),
        - strong [ref=e105]: Weights & Biases Weave
        - text: (tracing + evaluation),
        - strong [ref=e106]: OpenAI Evals
        - text: (framework for defining and running evals). Each has different strengths — LangSmith integrates most tightly with LangChain pipelines, Braintrust has the cleanest human review UI, and RAGAS excels at faithfulness/relevance metrics for RAG.
