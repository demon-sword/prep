<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Agent Pipeline — Interview Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--el:#161b22;--cd:#21262d;--bd:#30363d;--fg:#e6edf3;--mu:#8b949e;--dim:#6e7681;
--ac:#58a6ff;--acd:#1f6feb;--gr:#3fb950;--am:#d29922;--rd:#f85149;--pu:#a371f7;
--mono:'JetBrains Mono',ui-monospace,monospace;--ui:'Space Grotesk',system-ui,sans-serif;--r:8px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--ui);background:var(--bg);color:var(--fg);line-height:1.62}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
code{font-family:var(--mono);font-size:.88em;background:var(--el);padding:.1em .4em;border-radius:4px}
.wrap{max-width:1000px;margin:0 auto;padding:1.5rem 1.15rem 5rem}

/* header */
.hd{border-bottom:1px solid var(--bd);padding-bottom:1.1rem;margin-bottom:1.3rem}
.hd h1{font-size:1.55rem;letter-spacing:-.02em}
.hd p{color:var(--mu);font-size:.9rem;margin-top:.3rem;max-width:74ch}

/* sticky nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(13,17,23,.94);backdrop-filter:blur(8px);
border-bottom:1px solid var(--bd)}
.nav-in{max-width:1000px;margin:0 auto;padding:.5rem 1.15rem;display:flex;gap:.35rem;
align-items:center;flex-wrap:wrap}
.nav a{font-family:var(--mono);font-size:.68rem;color:var(--mu);padding:.2rem .45rem;border-radius:4px;
border:1px solid transparent;white-space:nowrap}
.nav a:hover{color:var(--ac);border-color:var(--bd);text-decoration:none}
.nav .sp{margin-left:auto;display:flex;gap:.4rem}
.btn2{font-family:var(--ui);font-size:.7rem;font-weight:600;padding:.28rem .7rem;background:var(--cd);
border:1px solid var(--bd);border-radius:999px;color:var(--mu);cursor:pointer}
.btn2:hover{border-color:var(--ac);color:var(--ac)}
.btn2[aria-pressed=true]{background:var(--acd);color:#fff;border-color:var(--acd)}

/* pipeline map */
.map{display:flex;flex-wrap:wrap;gap:.3rem;align-items:stretch;margin:1rem 0 .4rem}
.map a{flex:1 1 92px;min-width:92px;background:var(--el);border:1px solid var(--bd);border-radius:6px;
padding:.5rem .45rem;text-align:center;transition:.15s}
.map a:hover{border-color:var(--ac);text-decoration:none;transform:translateY(-2px)}
.map a.key{border-color:var(--am)}
.map .mi{font-size:1.05rem;display:block;line-height:1.2}
.map .mn{font-size:.68rem;font-weight:600;color:var(--fg);display:block;margin-top:.15rem}
.map .mt{font-size:.58rem;color:var(--dim);font-family:var(--mono);display:block}

/* opener */
.open{background:var(--el);border:1px solid var(--bd);border-left:3px solid var(--gr);
border-radius:var(--r);padding:1rem 1.2rem;margin:1.2rem 0}
.open h3{font-size:.95rem;margin-bottom:.5rem}
.open .script{font-size:.9rem;border-left:2px solid var(--gr);padding-left:.85rem;color:var(--fg)}
.open .script em{color:var(--mu);font-style:normal}

/* phase card */
.ph{border:1px solid var(--bd);border-radius:var(--r);background:var(--el);margin:1rem 0;overflow:hidden;
scroll-margin-top:3.4rem}
.ph.key{border-color:var(--am)}
.ph-h{display:flex;gap:.75rem;align-items:center;padding:.85rem 1.1rem;background:var(--cd);
border-bottom:1px solid var(--bd)}
.ph-n{font-family:var(--mono);font-size:.72rem;font-weight:700;width:1.6rem;height:1.6rem;flex:none;
border-radius:50%;display:grid;place-items:center;background:var(--acd);color:#fff}
.ph.key .ph-n{background:var(--am);color:#0d1117}
.ph-t{font-weight:700;font-size:1rem}
.ph-tag{font-family:var(--mono);font-size:.62rem;color:var(--dim);margin-left:auto;white-space:nowrap}
.ph-b{padding:1rem 1.1rem}
.one{font-size:.95rem;color:var(--fg);margin-bottom:.6rem}
.how{font-size:.87rem;color:var(--mu);max-width:82ch}

.lbl{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;
color:var(--dim);margin:1.1rem 0 .35rem;display:flex;align-items:center;gap:.4rem}
.lbl::after{content:'';flex:1;height:1px;background:var(--bd)}

.best{background:rgba(63,185,80,.07);border:1px solid #23863644;border-radius:6px;padding:.7rem .9rem;
font-size:.87rem}
.why{margin:.6rem 0 0;padding-left:1.05rem}
.why li{font-size:.84rem;color:var(--mu);margin-bottom:.3rem}
.say{background:rgba(163,113,247,.07);border:1px solid #8957e544;border-left:3px solid var(--pu);
border-radius:6px;padding:.75rem .95rem;font-size:.88rem;font-style:italic}
.qa{border-top:1px solid var(--bd)}
.qa:first-of-type{border-top:none}
.qa-q{width:100%;text-align:left;background:none;border:none;color:var(--fg);font:inherit;
font-size:.86rem;font-weight:600;padding:.6rem 0;cursor:pointer;display:flex;gap:.5rem;align-items:baseline}
.qa-q::before{content:'Q';font-family:var(--mono);font-size:.62rem;color:var(--am);flex:none}
.qa-q .cv2{margin-left:auto;color:var(--dim);font-size:.7rem;transition:.15s}
.qa[open] .cv2{transform:rotate(90deg)}
.qa-a{font-size:.85rem;color:var(--mu);padding:0 0 .7rem 1.05rem;border-left:2px solid var(--bd);
margin-left:.2rem}
.kw{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem}
.kw i{font-family:var(--mono);font-size:.66rem;font-style:normal;padding:.15rem .45rem;border-radius:4px;
background:var(--cd);border:1px solid var(--bd);color:var(--mu)}

/* viz shell */
.viz{border:1px solid var(--bd);border-radius:6px;background:var(--bg);padding:.85rem .95rem;margin-top:.5rem}
.vh{margin-bottom:.7rem}
.vh.sub{margin-top:1.2rem;padding-top:.9rem;border-top:1px solid var(--bd)}
.vh b{display:block;font-size:.87rem}
.vh span{display:block;font-size:.78rem;color:var(--mu);margin-top:.15rem}
.note{font-size:.81rem;color:var(--mu);margin-top:.7rem;border-left:2px solid var(--bd);
padding-left:.75rem;min-height:3.4em;line-height:1.55}
.bad{color:#ff7b72}.good{color:var(--gr)}
.seg2{display:inline-flex;border:1px solid var(--bd);border-radius:999px;overflow:hidden;
background:var(--el);margin-bottom:.7rem}
.seg2 button{font-family:var(--ui);font-size:.72rem;font-weight:600;padding:.3rem .8rem;background:none;
border:none;color:var(--mu);cursor:pointer}
.seg2 button[aria-pressed=true]{background:var(--acd);color:#fff}
.sl{display:block;font-family:var(--mono);font-size:.72rem;color:var(--mu);margin-top:.7rem}
.sl b{color:var(--ac)}
.sl input{width:100%;accent-color:var(--ac);margin-top:.25rem}
.btn{font-family:var(--ui);font-size:.72rem;font-weight:600;padding:.3rem .8rem;background:var(--cd);
border:1px solid var(--bd);border-radius:999px;color:var(--mu);cursor:pointer;margin-top:.6rem}
.btn:hover{border-color:var(--ac);color:var(--ac)}
.cv{width:100%;display:block;background:#010409;border-radius:6px}

/* 1 jitter */
.jb-lane{display:flex;align-items:center;gap:.5rem;margin:.3rem 0;min-height:30px}
.jb-lane i{font-family:var(--mono);font-size:.6rem;color:var(--dim);width:52px;flex:none;font-style:normal}
.jb-track{display:flex;gap:2px;flex:1;align-items:flex-start;height:30px}
.jb-track .pkt{width:9px;height:11px;background:var(--acd);border-radius:2px;flex:none;transition:.2s}
.jb-track .pkt.slow{background:var(--am)}
.jb-track .pkt.ok{background:var(--gr);margin-top:0!important}
.jb-track .pkt.gone{background:#3d1f1f;border:1px dashed var(--rd);margin-top:0!important}
.jb-track .pkt.flash{transform:scale(1.5)}
.jb-buf{height:9px;background:linear-gradient(90deg,var(--acd),var(--pu));border-radius:4px;transition:width .2s}

/* 2 vad */
.vadbars{display:flex;gap:2px;align-items:flex-end;height:82px}
.vb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative;cursor:help}
.vb i{display:block;background:var(--dim);border-radius:2px 2px 0 0;transition:.2s}
.vb.truth i{background:var(--gr)}
.vb s{display:block;height:5px;margin-top:2px;border-radius:2px;background:#30363d}
.vb.pred s{background:var(--ac)}
.vb.wrong s{background:var(--rd)}
.vb.wrong i{outline:1px solid var(--rd)}

/* 3 endpointer */
.ep-tl{display:flex;height:44px;border-radius:5px;overflow:hidden;position:relative;background:var(--cd)}
.ep-seg{background:#1c2128;border-right:1px solid var(--bg);display:flex;align-items:center;
justify-content:center;transition:.25s;overflow:hidden}
.ep-seg.sp{background:var(--acd)}
.ep-seg span{font-size:.58rem;color:#fff;opacity:.85;white-space:nowrap;padding:0 2px;
text-overflow:ellipsis;overflow:hidden}
.ep-seg.cut{opacity:.18}
.ep-fire{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--rd);transition:left .25s;
box-shadow:0 0 8px var(--rd)}

/* 4 asr */
.asr-box{display:flex;align-items:center;gap:.6rem;background:var(--cd);border:1px solid var(--bd);
border-radius:6px;padding:.7rem .85rem;min-height:52px}
.asr-txt{font-family:var(--mono);font-size:1rem;flex:1;transition:.15s}
.asr-txt.rev{color:var(--am)}
.asr-txt.fin{color:var(--gr);font-weight:700}
.asr-badge{font-family:var(--mono);font-size:.6rem;padding:.15rem .45rem;border-radius:4px;
background:var(--bd);color:var(--mu)}
.asr-badge.fin{background:var(--gr);color:#0d1117;font-weight:700}
.asr-bar{height:4px;background:var(--cd);border-radius:2px;margin-top:.4rem;overflow:hidden}
.asr-bar div{height:100%;width:0;background:var(--ac);transition:width .3s}

/* 5 llm */
.llm-row{display:flex;align-items:center;gap:.6rem;margin:.5rem 0}
.llm-row i{font-family:var(--mono);font-size:.62rem;color:var(--dim);width:78px;flex:none;font-style:normal;
line-height:1.25}
.llm-row i small{color:#586069}
.llm-row b{font-family:var(--mono);font-size:.68rem;color:var(--mu);width:72px;text-align:right}
.llm-pre{display:flex;gap:2px;flex:1}
.llm-pre .blk{flex:1;height:20px;background:var(--cd);border-radius:2px;transition:.25s}
.llm-pre .blk.on{background:var(--pu)}
.llm-dec{display:flex;gap:3px;flex:1}
.llm-dec .tok{flex:1;height:20px;background:var(--cd);border-radius:2px;transition:.15s}
.llm-dec .tok.on{background:var(--gr)}
.llm-dec .tok.clause{outline:2px solid var(--am);outline-offset:1px}

/* 6 frontend */
.fe-stage{background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:.8rem .9rem;min-height:104px}
.fe-io{display:flex;flex-direction:column;gap:.25rem;align-items:flex-start}
.fe-io.alt{margin-top:.7rem;padding-top:.7rem;border-top:1px dashed var(--bd)}
.fe-in{font-family:var(--mono);font-size:.8rem;color:var(--mu)}
.fe-ar{color:var(--dim);font-size:.7rem}
.fe-out{font-size:.86rem;color:var(--gr)}
.fe-io em{font-size:.74rem;color:#ff7b72;font-style:normal}
.phrow{display:flex;flex-wrap:wrap;gap:3px;margin-top:.5rem}
.phrow i{font-family:var(--mono);font-size:.66rem;font-style:normal;padding:.18rem .4rem;border-radius:3px;
background:var(--acd);color:#fff}
.phrow.prosody{align-items:flex-end;gap:4px;height:88px}
.phrow.prosody i{background:none;padding:0;display:flex;flex-direction:column;justify-content:flex-end;
flex:var(--w);height:100%}
.phrow.prosody s{display:block;height:var(--h);background:linear-gradient(180deg,var(--am),var(--acd));
border-radius:2px 2px 0 0;text-decoration:none}
.phrow.prosody u{font-family:var(--mono);font-size:.55rem;color:var(--mu);text-decoration:none;
text-align:center;margin-top:2px}

/* 7 synth */
.sy-flow{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.sy-flow span{color:var(--dim);font-size:.85rem}
.sy-b{background:var(--cd);border:1px solid var(--bd);border-radius:5px;padding:.45rem .6rem;
font-size:.74rem;text-align:center}
.sy-b small{display:block;font-family:var(--mono);font-size:.58rem;color:var(--dim);margin-top:.1rem}
.sy-b.model{border-color:var(--acd)}
.sy-b.wide{flex:1;min-width:200px;border-color:var(--gr)}
.sy-b.seam{border-color:var(--rd);background:rgba(248,81,73,.08)}
.algrid{display:grid;gap:2px;margin-top:.3rem}
.ac{display:block;aspect-ratio:1;background:var(--cd);border-radius:2px;transition:.2s}
.ac.warm{background:#1f6feb55}
.ac.hot{background:var(--ac);transform:scale(1.15)}

/* 9 rtp */
.mu{width:100%;height:150px;display:block;background:#010409;border-radius:6px}
.mu .lv{stroke:var(--ac);stroke-width:1;opacity:.65}
.mu .quiet{fill:rgba(248,81,73,.10);stroke:#6e3030;stroke-width:1}
.mu .lb{fill:#8b949e;font-size:9px;font-family:var(--mono)}
.pacer{display:flex;gap:2px;height:24px}
.pacer .pc{flex:1;background:var(--cd);border-radius:2px;transition:.12s}
.pacer .pc.on{background:var(--gr)}
.pacer .pc.drop{background:#3d1f1f;outline:1px dashed var(--rd)}

/* numbers + cross Q */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:.45rem}
.num{background:var(--el);border:1px solid var(--bd);border-radius:6px;padding:.6rem .75rem}
.num b{font-family:var(--mono);font-size:.9rem;color:var(--am);display:block}
.num span{font-size:.78rem;color:var(--mu)}
.cross{background:var(--el);border:1px solid var(--bd);border-radius:var(--r);padding:.3rem 1.1rem;margin:.5rem 0}


/* Flex tracks must be allowed to shrink below their content's min-content size.
   Without min-width:0 a flex item defaults to min-width:auto and refuses to
   shrink, pushing its children past the viewport. */
.jb-track,.llm-pre,.llm-dec,.vadbars,.pacer,.phrow,.ep-tl,.algrid{min-width:0}
.jb-track .pkt,.llm-pre .blk,.llm-dec .tok,.vadbars .vb,.pacer .pc{min-width:0}
.jb-lane,.llm-row{min-width:0}
.viz{overflow:hidden}
.foot{margin-top:3rem;padding-top:1.2rem;border-top:1px solid var(--bd);color:var(--dim);font-size:.76rem}
body[data-hide="1"] .say,body[data-hide="1"] .qa-a{filter:blur(5px);cursor:pointer;user-select:none}
body[data-hide="1"] .say:hover,body[data-hide="1"] .qa-a:hover{filter:none}
@media(max-width:640px){
  .ph-tag{display:none}.nav .sp{width:100%;margin-left:0}
  .llm-row i,.llm-row b{width:60px}
  .jb-lane i{width:42px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>

<script id="iv-data" type="application/json">{"phases":[{"n":1,"id":"jitter","icon":"📥","name":"Jitter Buffer","tag":"Network in","one":"Holds arriving packets for a few milliseconds so uneven network timing plays out smoothly.","how":"Voice crosses the network as one small packet every 20 ms, but they do not arrive evenly spaced — one may take 15 ms, the next 60 ms. If you played them the instant they landed, the audio would stutter. So you hold a small reserve and play from that at a steady rate. The buffer is not free: everything you hold is latency you have added to the call, and it is paid on BOTH legs.","viz":"jitter","best":"WebRTC NetEq — an adaptive buffer sized from the measured RFC 3550 jitter estimate, plus Opus in-band FEC for isolated losses and DRED for longer gaps.","why":["Adaptive, not fixed: it grows when the network is bad and shrinks when it recovers, so you only pay latency you currently need.","On an underrun it time-stretches later audio without changing pitch, so you get a stutter-and-catch-up rather than a hole.","A jitter buffer does not remove loss — it converts latency into a lower effective loss rate. Anything arriving after its playout deadline is discarded and looks exactly like a network drop."],"say":"A jitter buffer trades latency for effective loss. If I model excess delay as exponential with mean sigma, late loss goes as e^(−B/sigma), so each extra sigma of buffer divides it by e — going from 1% to 0.1% costs about 2.3 sigma. At sigma = 12 ms that is another 28 ms, and I am paying it on both legs, so it is a real line item in an 800 ms budget, not a detail.","qa":[{"q":"How big should the buffer be?","a":"It is not a constant — size it from the measured jitter, adaptively. The fixed-buffer question is the trap: too small and you drop late packets, too large and you have silently spent 100 ms of your response budget. I would report buffer depth as a live metric alongside latency."},{"q":"Is 1% packet loss bad?","a":"You cannot answer that from the rate alone — it depends entirely on burst length. 1% spread uniformly is a 40 ms hole every 200 seconds and concealment hides it. 1% arriving in bursts of three is a 60 ms hole every 6 seconds, which is past what concealment can invent. Same metric, completely different call."},{"q":"Why does pacing the sender matter?","a":"Two reasons. Bursting packets gets the tail of the burst dropped at a queue. And it inflates the far end’s jitter estimate, so their adaptive buffer grows to absorb variation you invented — you cause latency on the other side."}],"keywords":["NetEq","RFC 3550","playout deadline","PLC","Opus FEC","DRED","Gilbert-Elliott","underrun","pacing"]},{"n":2,"id":"vad","icon":"🎚️","name":"VAD","tag":"Is anyone talking?","one":"A frame-by-frame classifier that says \"this 32 ms chunk contains speech\" or \"it does not\".","how":"Audio arrives in fixed small chunks. For each one the VAD answers a single yes/no question: speech or not. That is all it does — it has no idea about sentences or turns. The naive version thresholds loudness, which fails in exactly the two cases that matter on a phone call: unvoiced consonants like /s/ and /f/ are genuinely quiet and get marked as silence, while a noisy clinic or hold music is loud and gets marked as speech.","viz":"vad","best":"Silero-class neural VAD, ONNX, running in-process on the media server on fixed 32 ms chunks.","why":["Neural detection beats energy-plus-zero-crossings on precisely the frames that break the naive version: quiet hissy consonants and loud rooms.","In-process keeps recorded voice inside the compliance boundary — no extra network hop with PHI on it.","It is small and cheap enough to run on every frame of every call without a GPU."],"say":"I would separate the two things people call VAD. Frame-level detection is nearly solved — a Silero-class neural VAD on 32 ms chunks beats energy plus zero-crossing on anything with background noise, because energy thresholding fails on exactly the frames that matter. The hard part is not the detector, it is the state machine on top of it.","qa":[{"q":"Why not just use an energy threshold?","a":"Because the errors are correlated with what you care about. Unvoiced fricatives are low-energy speech and loud waiting rooms are high-energy non-speech, so a threshold is wrong in both directions at once, and no single value fixes both."},{"q":"What is the ordering constraint people miss?","a":"Echo cancellation must run BEFORE the VAD. If it does not, the agent hears its own outbound speech, triggers its own detector, and interrupts itself. I would want ERLE above about 25 dB before trusting anything downstream."},{"q":"VAD vs endpointer?","a":"VAD is a per-frame classifier. The endpointer is the state machine above it that decides the turn is over. Conflating them is the single most common mistake here — they have different inputs, different failure modes and different owners."}],"keywords":["Silero","ONNX","32 ms frames","zero-crossing rate","fricative","ERLE","echo cancellation","babble"]},{"n":3,"id":"endpoint","icon":"⏱️","name":"Endpointer","tag":"Are they DONE?","star":true,"one":"The state machine that decides the caller has finished their turn — and the largest single number in your latency budget.","how":"After the VAD stops seeing speech you cannot reply immediately, because people pause mid-sentence. So you wait — that wait is called hangover. The problem is that a mid-sentence pause and an end-of-turn pause look identical to a timer. Someone reading a member ID off a card leaves 600–900 ms between chunks, which is longer than a typical 700 ms timeout, so the agent barges in halfway through the number and destroys the turn and all the data in it.","viz":"endpoint","best":"Completeness-driven adaptive endpointing: wait(p) = clamp(t_min + (t_max − t_min)(1 − p), t_min, t_max), with t_min ≈ 200 ms and t_max ≈ 1600 ms, driven by a small classifier reading the ASR partial, running on the media node.","why":["Mid-utterance pauses are not shorter than end-of-utterance pauses, so NO fixed timeout can separate thinking from finished — only the content of the partial transcript can.","It is the biggest number in the budget you can move without touching a model or buying a GPU.","On an utterance that already looks complete it cuts the wait from ~320 ms to ~140 ms; on an obviously unfinished one it waits longer, which is exactly the right trade."],"say":"Endpointing is the biggest single number in my response budget and the only one I can move without touching a model. A 700 ms silence threshold, plus 120 for ASR finalisation, 320 for time-to-first-token, 150 for first audio and about 140 of network, is 1.4 seconds before the caller hears anything. The temptation is to cut the 700 — and that is exactly where agents start talking over people. The fix is not a shorter timer, it is a timer that reads the partial transcript.","qa":[{"q":"Why not just shorten the timeout?","a":"Because the cost is asymmetric. Waiting 200 ms too long costs 200 ms. Cutting someone off mid member-ID destroys the turn and every piece of data in it, and you pay for the repair. I would tune on expected cost — hangover plus probability-of-cut times cost-of-repair — not on accuracy."},{"q":"What is the free 300 ms?","a":"ASR finalisation and LLM prefill can both run INSIDE the hangover window. You are already waiting; that is not extra time. Streaming ASR finalises during the wait, and you speculatively prefill the LLM on the last stable partial. That is 300 ms off the budget without touching a model."},{"q":"What does that speculation cost?","a":"Wasted compute every time the caller resumes talking and you throw the prefill away — which on a mid-sentence pause is often. It is a real trade, but GPU time is cheaper than the caller hearing dead air."}],"keywords":["hangover","completeness","partial transcript","t_min/t_max","asymmetric cost","barge-in","speculative prefill","RFC 3389"]},{"n":4,"id":"asr","icon":"📄","name":"ASR","tag":"Audio → text","one":"Turns the caller’s audio into text, emitting revisable guesses as it goes and a final answer at the end.","how":"A streaming recogniser does not wait for you to finish. It emits a partial transcript that it is allowed to revise — \"four seven\" may become \"four seventy\" once more audio arrives. When the endpointer says the turn is over, the recogniser flushes: it rescores with full context, adds punctuation and casing, and commits a final transcript. That finalisation step is what costs about 120 ms, and it is why streaming matters — a non-streaming recogniser cannot start until the turn ends, so its whole cost is serial dead time.","viz":"asr","best":"A streaming recogniser that finalises inside the endpoint hangover window, with domain biasing on the entities you actually capture.","why":["Streaming lets the ~120 ms finalisation hide inside the ~320 ms you were already waiting, so it costs zero added latency.","ASR runs at roughly 100% duty cycle — it is listening the whole call, unlike TTS which speaks about a third of the time. It is the quiet half of the bill.","The text boundary is a control surface: it is where you bias vocabulary, redact PHI, and check entities before anything is spoken."],"say":"I would insist on a streaming recogniser, not for the recognition quality but for the scheduling. Finalisation is about 120 ms of flush, rescore and punctuate — if it is streaming, that hides entirely inside the endpoint hangover and costs me nothing. If it is not, it is 120 ms of pure serial dead time added straight to the caller’s silence.","qa":[{"q":"Partial vs final — why does it matter?","a":"Partials are revisable and are what you drive endpointing and speculative prefill from. The final is what you commit to a tool call. Acting on a partial as if it were final is how you book the wrong appointment."},{"q":"Where does ASR sit in the cost model?","a":"It is usually the expensive leg, which surprises people. It runs the entire call at full duty cycle, whereas TTS only works while the agent is speaking — around 35% of the time. TTS is usually the cheap leg."},{"q":"Why keep text in the loop at all?","a":"Because text is where you can inspect, bias and redact. A speech-to-speech model deletes that seam, and with it the place your guardrail and PHI redaction were running."}],"keywords":["streaming","partial","finalisation","rescore","biasing","duty cycle","WER","PHI redaction"]},{"n":5,"id":"llm","icon":"🧠","name":"LLM","tag":"Decide what to say","one":"Reads the conversation and generates the reply text — in two very different phases, prefill and decode.","how":"The model first reads everything it has been given — system prompt plus history — in one parallel pass called prefill. Then it writes the reply one token at a time, which is decode. These have completely different cost shapes: prefill is a big parallel chunk you can start speculatively during the hangover, while decode is strictly sequential. The step everyone forgets is that TTS cannot start on a single token — it needs a whole speakable clause, roughly ten more tokens after the model's advertised time-to-first-token.","viz":"llm","best":"Speculative prefill on the last stable partial, a KV-cache hit on the repeated system-prompt prefix, and hand off to TTS at the first clause boundary rather than the first token.","why":["Prefill on a couple of thousand tokens is ~180 ms and fits entirely inside the hangover window, so it can cost nothing.","A prefix cache hit on an unchanging system prompt is the cheapest 200 ms you will ever find — without it a long prompt pushes prefill to ~620 ms and it stops fitting.","Budgeting \"time to first token\" hides the ~180 ms of decode needed to reach a speakable clause; measure time-to-first-CLAUSE."],"say":"I would split the LLM into prefill and decode because they behave differently. Prefill is parallel and speculative — I can start it on the last stable partial while I am still waiting out the hangover, so it is effectively free. Decode is sequential and it is where the forgotten cost lives: TTS cannot speak one token, it needs a clause, so about ten more tokens after time-to-first-token. If you budget TTFT you are 180 ms over on day one.","qa":[{"q":"Where does batching hurt you?","a":"Under load, milliseconds-per-token rises — 18 to 26 ms is the loaded case — so decode-to-first-clause stretches from ~180 to ~260 ms. Throughput improved and the caller’s experience got worse."},{"q":"What is the guardrail cost?","a":"About 40 ms, and it is serial by construction — its whole purpose is to sit between generation and the wire. You cannot hide it and you should not skip it."},{"q":"Can you stream the LLM into TTS?","a":"Yes, and you should — clause by clause. That is what makes long replies feel fast. But you commit to speaking the first clause before you have seen the rest, so the guardrail has to run per clause."}],"keywords":["prefill","decode","KV cache","prefix cache","TTFT","time-to-first-clause","ms/token","guardrail"]},{"n":6,"id":"frontend","icon":"📝","name":"TTS Frontend","tag":"normalize → G2P → prosody","one":"Turns reply text into pronounceable symbols with a rhythm and melody attached.","how":"Three steps in order. Normalization rewrites anything that is not a plain word — \"$1,500\" and \"3/4\" and \"004821\" — into the words you would actually say, and that depends on context: 004821 is a record number, not the cardinal four thousand eight hundred and twenty-one. G2P converts each word into phonemes, the sounds. Prosody predicts how long each sound lasts and how pitch and energy move across it, which is the difference between speech and a speaking clock.","viz":"frontend","best":"WFST verbalizers (Kestrel / Sparrowhawk / NeMo) driven by a small learned classifier for the semiotic class; then a lexicon-first G2P dispatcher — homograph table → tenant overlay → CMUdict → small seq2seq → cache; then FastSpeech 2-style explicit duration, pitch and energy predictors.","why":["A grammar can only rearrange what you gave it, so it structurally CANNOT substitute a different number. A neural sequence model can, and does — that is disqualifying for medical or financial read-outs.","Put the learning only in the class decision (is this money, a date, an ID?) and keep the verbalization deterministic. Best of both.","A dictionary is simply more accurate than a model on anything it covers, and a lookup is a hash hit — so ordering the layers costs nothing and buys accuracy. The model answers only the slice nothing else can."],"say":"Normalization is a classify-then-verbalize problem and almost all the difficulty is in the classifier. Once I know 004821 is a medical record number rather than a cardinal, verbalizing it is a lookup table — but deciding that needs context the token does not carry. So I keep the verbalizers as finite-state grammars because they are auditable and structurally cannot invent a different number, and I put the learned part only in the class decision. G2P I would treat as a dispatcher, not a model: homograph table first, then a per-tenant overlay of the names this clinic actually says, then CMUdict, then a small seq2seq for the remainder.","qa":[{"q":"Why not one neural model end to end for normalization?","a":"Because its failure mode is silent substitution of a different quantity. On a clinic line that is a wrong dose or a wrong appointment. A WFST cannot do that — it can only rearrange the tokens it was given."},{"q":"Why is the phoneme set a big deal?","a":"The symbol set IS the model’s input embedding table, and you cannot swap it after training. ARPAbet and IPA are not a clean one-to-one map — AH0 is schwa but AH1 is not — so mixing corpora without a checked mapping trains two symbols onto one sound. I would pin the phoneme inventory in CI next to the mel formula."},{"q":"Why explicit prosody predictors?","a":"Because they give you a control surface at serve time — speaking rate, emphasis, expressiveness — and a monitorable tensor. F0 span per utterance makes flatness visible; buried in a latent it is invisible until a human listens."},{"q":"What is prosody collapse?","a":"One sentence has many valid readings. A deterministic predictor trained on all of them learns their average, which is none of them — that is the flat, robotic read. The fix is a stochastic predictor that samples one valid reading instead of averaging."}],"keywords":["WFST","verbalizer","semiotic class","G2P dispatcher","homograph","CMUdict","OOV","ARPAbet vs IPA","schwa","variance adaptor","F0 span","one-to-many"]},{"n":7,"id":"synth","icon":"🗣️","name":"Synthesis (VITS)","tag":"phonemes → waveform","star":true,"one":"One model that turns phonemes straight into audio — the spectrogram that used to sit in the middle is gone.","how":"The old way was two models with a handoff: an acoustic model made a mel spectrogram, and a separate vocoder turned that picture into a wave. The problem is the seam — the vocoder was trained on REAL spectrograms but at serve time it is fed PREDICTED ones, and that mismatch is what buzzes. VITS trains the whole thing as one model. Internally it passes a latent, not a mel, and HiFi-GAN sits inside it as the decoder. Alignment is done by monotonic alignment search, which can only move forward, so repeats and skips become structurally impossible rather than merely unlikely.","viz":"synth","best":"VITS — conditional VAE + normalizing flow + monotonic alignment search + stochastic duration predictor + HiFi-GAN decoder — chunked at clause boundaries with cross-fade, exported narrowband via ONNX to Triton.","why":["One model, one training run, no train/serve mismatch and no external aligner. The mel survives only as an L1 training loss.","MAS deletes the whole attention-failure class by construction: a monotonic path cannot revisit a sound or skip one, so no repeats, no stutters, no babble.","The stochastic duration predictor is a flow, not a regressor, so you get human-like rhythm variety rather than the averaged, flat read.","Non-autoregressive means the compute is known before you start — you are buying the p99, not the mean."],"say":"VITS collapses the acoustic model and the vocoder into one conditional VAE. The decoder is just HiFi-GAN, trained adversarially on slices of the latent, and the mel never leaves the model — it only shows up as an L1 reconstruction loss. Alignment is monotonic alignment search rather than attention, so skipping and stuttering are not mitigated, they are unrepresentable. What I am really trading away is the seam: when it buzzes there is no mel to inspect and no vocoder to swap, so the fix is a retrain rather than a component change. That is a real trade, not a strict improvement.","qa":[{"q":"Why non-autoregressive for a phone call?","a":"The tail. Autoregressive generation ends on a stop token, and a stop token is a prediction — when it fails you do not get slow, you get thirty seconds of babble down the line. NAR makes synthesis time a deterministic function of text length, so it contributes no tail to an 800 ms budget."},{"q":"Is VITS truly deterministic then?","a":"Not quite, and I would say so. Its durations are SAMPLED from a flow, so the total length varies per call and one unlucky draw drawls a phoneme. It is deterministic given the durations, which is not the same thing."},{"q":"What do you lose versus a cascade?","a":"Debuggability, and the ability to swap or retrain halves independently. A cascade keeps a mel you can look at, a vocoder you can replace, and two components you can train on different corpora. That is genuinely valuable — it is a trade, and I would want to say which side I am on and why."},{"q":"Do you still get prosody knobs?","a":"No, and this is the honest catch. FastSpeech 2’s explicit predictors give you rate and emphasis controls; VITS buries prosody in a latent. Your controls collapse to length_scale, noise_scale and noise_scale_w. If product needs per-word emphasis, that argues for the cascade."},{"q":"How do you stream it?","a":"VITS emits nothing until the full latent is decoded, so its time-to-first-audio IS whole-utterance synthesis time. The only lever is chunking at clause boundaries with a cross-fade, each chunk redrawing its own durations."}],"keywords":["conditional VAE","normalizing flow","MAS","stochastic duration","HiFi-GAN","train/serve mismatch","the seam","NAR","stop token","clause chunking","length_scale"]},{"n":8,"id":"resample","icon":"📉","name":"Resample 24 → 8 kHz","tag":"Down to phone rate","one":"Drops the studio-rate audio to the 8 kHz the phone line actually carries — filter first, then decimate.","how":"Your model produces 24 kHz audio but the phone network carries 8 kHz. You cannot just throw away two of every three samples: any frequency above half the new rate does not disappear, it FOLDS back down and lands on top of real speech as a buzz. So you low-pass filter first to remove everything above the new ceiling, and only then drop samples. Order is the entire point — filtering after decimating is useless because the folding already happened.","viz":"resample","best":"A single anti-aliased polyphase step — resample_poly(up=1, down=3) — going 24 → 8 kHz directly, never array slicing, and never two chained conversions.","why":["The library filter is built in and correct; hand-rolled slicing (x[::3]) folds 6 kHz energy down into a 2 kHz buzz sitting in the vowel band.","Every extra conversion is another chance to fold, so do it in one step rather than 24 → 16 → 8.","Carry the polyphase filter state across chunks when streaming, or you reintroduce a click at every chunk boundary right after you fixed the vocoder seam."],"say":"Energy above Nyquist does not disappear, it folds — so the order is filter, then decimate, and I would do it in one polyphase step rather than chaining conversions. The classic bug is someone writing x[::3] because it looks like resampling; that folds 6 kHz down to 2 kHz, straight into the vowel band, and it sounds like a buzz that no amount of model work will fix.","qa":[{"q":"What is aliasing in one sentence?","a":"A sample rate can only describe frequencies below half itself; anything above that is indistinguishable from a lower frequency, so it comes back as a tone that was never in the room."},{"q":"Should you serve 24 kHz audio to an 8 kHz leg?","a":"No — export a narrowband decoder. Serving wideband into a phone leg burns about 2.76x the compute generating frequency bands the line is about to discard."},{"q":"What about the mel front end?","a":"Same trap one level up. On an 8 kHz leg roughly 18 to 20 of your 80 mel filters sit above what the line can carry and receive nothing at all — about a fifth of the bank. They are not measuring quietness, they are measuring absence. I would assert the empty-filter count in CI."}],"keywords":["Nyquist","aliasing","folding","anti-alias FIR","polyphase","resample_poly","decimate","filter state","narrowband export"]},{"n":9,"id":"rtp","icon":"📤","name":"RTP / μ-law","tag":"Onto the wire","one":"Compresses each sample to 8 bits the way the phone network expects, and paces it out as one packet every 20 ms.","how":"G.711 μ-law is companding: instead of spacing the 256 available levels evenly, it packs them densely near quiet and sparsely near loud, because the ear hears ratios rather than absolute steps. That buys roughly a flat 38 dB signal-to-noise across the whole volume range instead of great SNR when loud and terrible when quiet. Then you packetise: 20 ms per packet, sent on a steady 20 ms clock — paced, not burst.","viz":"rtp","best":"G.711 μ-law at 8 kHz, 20 ms packetisation, paced on a real clock, with the outbound leg and the far-end jitter buffer counted inside your latency budget.","why":["Companding gives consistent quality across loud and quiet talkers, which uniform 8-bit quantisation cannot.","Pacing prevents the tail of a burst being dropped at a queue, and prevents inflating the far end’s jitter estimate so their buffer grows unnecessarily.","These last two hops elapse AFTER your trace says the request completed — invisible to every metric you own, and still inside the silence the caller is sitting in."],"say":"The last thing I would flag is that my own metrics stop too early. The outbound leg and the caller’s own jitter buffer are maybe 85 ms that elapse after my span closes, so if I only measure server-side I am about that much optimistic. I would define the SLO as last-speech-sample-in to first-sample-out-of-their-speaker and instrument it as one span, not eight.","qa":[{"q":"Why μ-law and not linear PCM?","a":"Dynamic range. Uniform 8-bit quantisation gives you good SNR at full scale and audible hiss on a quiet talker. Companding trades peak precision for consistency and holds roughly 38 dB across the range."},{"q":"Why exactly 20 ms?","a":"It is the standard packetisation interval — small enough that a single loss is concealable, large enough that per-packet header overhead is not absurd. It also sets the granularity of everything downstream, including what a \"hole\" costs you."},{"q":"What is the failure mode here?","a":"Dead air, not an error. Nothing throws — chunk N+1 simply arrives after chunk N finished playing and the caller hears the agent stop mid-word. That is why I alarm on chunk deadline misses rather than on HTTP status."}],"keywords":["G.711","μ-law","companding","38 dB SNR","20 ms ptime","RTP","pacing","tail-drop","dead air","SLO span"]}],"cross":[{"q":"Walk me through the architecture.","a":"Give the spine in four moves, then stop and let them pick. \"Caller audio arrives over RTP into a jitter buffer. A VAD tells me which frames are speech, and an endpointer decides when the turn is over — that is the biggest number in my budget. Streaming ASR gives me text, the LLM gives me a reply, and the TTS side is frontend then synthesis: normalize and G2P and prosody, then one model — VITS — straight to a waveform. Then I resample to 8k, mu-law it, and pace it out at 20 ms.\" Then: \"The interesting parts are the endpointer and the synthesis choice — where do you want to go?\""},{"q":"What is your latency budget?","a":"Define the clock first: last speech sample out of their mouth to first sample in their ear — which puts both network legs inside it even though they never appear in your traces. Laid end to end the stages cost about 1060 ms; the pipeline only fits under 800 because ASR finalisation and LLM prefill both hide inside the endpoint hangover. That overlap is worth 300 ms and costs no hardware."},{"q":"What breaks in production?","a":"Almost everything here fails SILENTLY. A wrong mel formula, a sample-rate drift, a normalizer misclassifying an ID — none of them throw, they reach the caller as buzz or as a wrong number read aloud. So: pin the front end in CI, and alert on confidence rather than on exceptions. The one loud-sounding failure, dead air, is also silent from the server’s point of view — no 503, just a chunk that arrived late."},{"q":"How do you size the GPUs?","a":"From offered load, not from concurrent calls. Calls times duty cycle — the agent speaks about 35% of the time, not 100% — times a barge-in waste factor, times the batched RTF. Then pick the GPU count from Erlang-C at rho around 0.7, not from the ceiling of the average. At rho 0.8 a queued stage waits five times its own service time by W = S/(1−rho), with the model not one millisecond slower."},{"q":"How do you evaluate it?","a":"Three metrics and I know what each one lies about. Delta-WER through a recogniser, measured against that recogniser’s own floor on human reads of the same prompts — that is the one I gate on, because it catches skipped and repeated words. MCD and speaker cosine as a screen, never a gate, and MCD needs DTW alignment first or it is scoring duration mismatch. Then periodic CMOS with real listeners. And all of it computed through the 8 kHz mu-law path, not on the clean render."},{"q":"Would you use a speech-to-speech model instead?","a":"For the conversational shell, increasingly yes — it collapses four sequential commit points into one learned decision and it reads hesitation from the pitch contour rather than from a timeout. But it deletes the text seam, and the text seam is where my guardrail, my PHI redaction and my entity checks run. So: full-duplex for conversation, cascade for transactions. Split by capability, not by product."},{"q":"Why not clone the caller’s voice / use zero-shot?","a":"I would not ship it as the agent voice. The autoregressive stage has to emit 75 frames a second, so every decode step must land under 13.3 ms or the caller hears the agent stop mid-word — and the failure modes are repetition and non-termination, not graceful degradation. One consented, fine-tuned voice is faster and more stable. And a member’s voice is a biometric identifier; the paperwork is once, not once per caller."}],"numbers":[["800 ms","Where a caller stops hearing thought and starts hearing a broken line."],["~320 ms","Endpoint hangover — the biggest single line item, and the only free overlap window."],["120 + 180 ms","ASR finalisation + LLM prefill — both hide inside the hangover. This is the free 300 ms."],["3.4 kHz","The PSTN passband. Not 8 kHz. This is why /s/, /f/ and /th/ collapse into each other."],["20 ms","RTP packetisation interval — and the size of one concealable hole."],["400–800 ms","Ordinary mid-sentence hesitation. 600–900 ms when reading digits off a card."],["ρ ≈ 0.7","Utilisation target. At 0.8 the wait is already 5× the service time."],["~35%","Agent talk-time duty cycle. Concurrent calls ≠ concurrent streams."],["13.3 ms","Per-frame decode deadline at 75 fps — why zero-shot cloning underruns."],["18–20 of 80","Mel filters that see nothing on an 8 kHz leg — about a fifth, not half."]]}</script>
<script>
/* ---------- viz runtime ---------- */
const V = {};
V.reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
V.vis = function (el, enter, exit) {
  if (!('IntersectionObserver' in window)) { enter(); return; }
  let inside = false;
  new IntersectionObserver(es => { for (const e of es) {
    if (e.isIntersecting && !inside) { inside = true; enter(); }
    else if (!e.isIntersecting && inside) { inside = false; exit(); } }
  }, { rootMargin: '100px' }).observe(el);
};

/* ---------- 1. JITTER BUFFER ---------- */
V.jitter = function (r) {
  r.innerHTML = `
   <div class="vh"><b>Packets arrive unevenly. The buffer makes playout even.</b>
     <span>Top row = arrival (jittery). Bottom = what the ear gets. The buffer is the gap between them — and that gap is latency you added.</span></div>
   <div class="jb">
     <div class="jb-lane"><i>network</i><div class="jb-track" id="jb-in"></div></div>
     <div class="jb-lane"><i>buffer</i><div class="jb-buf" id="jb-buf"></div></div>
     <div class="jb-lane"><i>ear</i><div class="jb-track" id="jb-out"></div></div>
   </div>
   <label class="sl">Buffer depth <b id="jb-v">60</b> ms
     <input type="range" id="jb-d" min="0" max="140" step="20" value="60"></label>
   <p class="note" id="jb-n"></p>`;
  const IN = r.querySelector('#jb-in'), OUT = r.querySelector('#jb-out'), BUF = r.querySelector('#jb-buf');
  const d = r.querySelector('#jb-d'), dv = r.querySelector('#jb-v'), note = r.querySelector('#jb-n');
  const N = 22;
  // per-packet network delay in ms (jittery), fixed so the demo is stable
  const DELAY = [20,25,80,30,22,120,28,24,26,95,30,21,23,140,26,29,25,27,110,24,28,26];
  let t = null;
  function render() {
    const B = +d.value; dv.textContent = B;
    IN.innerHTML = ''; OUT.innerHTML = '';
    let late = 0;
    for (let i = 0; i < N; i++) {
      const jitter = DELAY[i] - 20;              // excess over nominal
      const ok = jitter <= B;                    // arrived before its playout deadline
      if (!ok) late++;
      const a = document.createElement('i');
      a.className = 'pkt' + (jitter > 40 ? ' slow' : '');
      a.style.marginTop = Math.min(18, jitter / 8) + 'px';
      IN.appendChild(a);
      const b = document.createElement('i');
      b.className = 'pkt' + (ok ? ' ok' : ' gone');
      OUT.appendChild(b);
    }
    BUF.style.width = (B / 140 * 100) + '%';
    const pct = (late / N * 100).toFixed(0);
    note.innerHTML = B === 0
      ? `<b class="bad">No buffer.</b> Every packet that took longer than nominal misses its slot — <b>${late} of ${N}</b> gaps. The call stutters constantly.`
      : late === 0
      ? `<b class="good">No holes</b>, but you are now holding <b>${B} ms</b> — and you pay it on BOTH legs, so that is <b>${B * 2} ms</b> of your 800 ms budget spent on smoothing.`
      : `<b>${B} ms</b> of buffer still leaves <b class="bad">${late} late packets</b> (${pct}%) that miss playout and are discarded — indistinguishable from network loss. Each extra sigma of buffer divides late-loss by e.`;
  }
  d.addEventListener('input', render);
  V.vis(r, () => { render(); if (!t) t = setInterval(() => {
    const k = IN.children[Math.floor(Math.random() * N)]; if (k) { k.classList.add('flash'); setTimeout(()=>k.classList.remove('flash'), 260); }
  }, 380); }, () => { if (t) { clearInterval(t); t = null; } });
  render();
};

/* ---------- 2. VAD ---------- */
V.vad = function (r) {
  // frame: [energy 0-1, isSpeech truth, label]
  const F = [
    [.05,0,'silence'],[.06,0,'silence'],[.55,1,'vowel /a/'],[.72,1,'vowel /i/'],[.68,1,'vowel /e/'],
    [.09,1,'fricative /s/'],[.07,1,'fricative /f/'],[.60,1,'vowel /o/'],[.58,1,'nasal /m/'],[.06,0,'pause'],
    [.05,0,'pause'],[.48,0,'ROOM NOISE'],[.52,0,'ROOM NOISE'],[.44,0,'hold music'],[.06,0,'silence'],
    [.62,1,'vowel /u/'],[.08,1,'stop /t/'],[.55,1,'vowel /a/'],[.05,0,'silence'],[.04,0,'silence']
  ];
  r.innerHTML = `
   <div class="vh"><b>Loudness is the wrong signal.</b>
     <span>Each bar is a 32 ms frame. Green = really speech. The threshold gets the two cases that matter exactly backwards.</span></div>
   <div class="seg2" id="vad-m">
     <button data-m="energy" aria-pressed="true">Energy threshold</button>
     <button data-m="neural" aria-pressed="false">Neural VAD</button></div>
   <div class="vadbars" id="vad-b"></div>
   <p class="note" id="vad-n"></p>`;
  const box = r.querySelector('#vad-b'), note = r.querySelector('#vad-n');
  let mode = 'energy';
  F.forEach((f, i) => {
    const c = document.createElement('div'); c.className = 'vb'; c.dataset.i = i;
    c.innerHTML = `<i style="height:${Math.round(f[0]*100)}%"></i><s></s>`;
    box.appendChild(c);
  });
  const TH = 0.30;
  function render() {
    let wrong = 0, missedFric = 0, falseNoise = 0;
    F.forEach((f, i) => {
      const el = box.children[i];
      const pred = mode === 'energy' ? (f[0] > TH ? 1 : 0) : f[1];
      el.classList.toggle('truth', !!f[1]);
      el.classList.toggle('pred', !!pred);
      const bad = pred !== f[1];
      el.classList.toggle('wrong', bad);
      if (bad) { wrong++; if (f[1] === 1) missedFric++; else falseNoise++; }
      el.title = f[2];
    });
    note.innerHTML = mode === 'energy'
      ? `<b class="bad">${wrong} frames wrong.</b> It misses <b>${missedFric}</b> quiet consonants (/s/, /f/, /t/ are genuinely low-energy SPEECH) and fires on <b>${falseNoise}</b> loud non-speech frames (room noise, hold music). The errors point in <em>both</em> directions, so no single threshold value fixes it.`
      : `<b class="good">All ${F.length} frames correct.</b> A neural VAD is classifying spectral shape, not loudness — so a quiet /s/ still looks like speech and loud room noise still does not. This is why the detector is essentially a solved problem, and the endpointer above it is not.`;
  }
  r.querySelector('#vad-m').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    mode = b.dataset.m;
    [...b.parentElement.children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render();
  });
  render();
};

/* ---------- 3. ENDPOINTER ---------- */
V.endpoint = function (r) {
  // caller reads a member ID: chunks of speech with gaps between them
  const SEG = [
    { t:'"my member ID is"', ms:900, sp:1 }, { t:'(looks at card)', ms:700, sp:0 },
    { t:'"four four seven"', ms:800, sp:1 }, { t:'(next chunk)',    ms:750, sp:0 },
    { t:'"two nine one"',   ms:750, sp:1 }, { t:'(next chunk)',     ms:820, sp:0 },
    { t:'"eight zero"',     ms:600, sp:1 }, { t:'(done)',           ms:1400,sp:0 }
  ];
  r.innerHTML = `
   <div class="vh"><b>A caller reading a member ID off a card.</b>
     <span>Blue = speaking. Grey = pausing. The question is which grey gap means "finished" — and a timer cannot tell.</span></div>
   <div class="ep-tl" id="ep-t"></div>
   <label class="sl">Fixed silence timer <b id="ep-v">700</b> ms
     <input type="range" id="ep-d" min="300" max="1600" step="50" value="700"></label>
   <div class="seg2" id="ep-m">
     <button data-m="fixed" aria-pressed="true">Fixed timer</button>
     <button data-m="smart" aria-pressed="false">Completeness-driven</button></div>
   <p class="note" id="ep-n"></p>`;
  const tl = r.querySelector('#ep-t'), note = r.querySelector('#ep-n');
  const d = r.querySelector('#ep-d'), dv = r.querySelector('#ep-v');
  let mode = 'fixed';
  const total = SEG.reduce((a, b) => a + b.ms, 0);
  SEG.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'ep-seg' + (s.sp ? ' sp' : '');
    el.style.width = (s.ms / total * 100) + '%';
    el.innerHTML = `<span>${s.t}</span>`;
    tl.appendChild(el);
  });
  const mark = document.createElement('div'); mark.className = 'ep-fire'; tl.appendChild(mark);
  function render() {
    const T = +d.value; dv.textContent = T;
    let acc = 0, fireAt = null, fireIdx = -1;
    for (let i = 0; i < SEG.length; i++) {
      const s = SEG[i];
      if (!s.sp) {
        // completeness: only the LAST gap follows a complete-sounding utterance
        const complete = (i === SEG.length - 1);
        const wait = mode === 'smart' ? (complete ? 200 : 1600) : T;
        if (s.ms >= wait) { fireAt = acc + wait; fireIdx = i; break; }
      }
      acc += s.ms;
    }
    if (fireAt === null) { fireAt = total; fireIdx = SEG.length - 1; }
    mark.style.left = (fireAt / total * 100) + '%';
    [...tl.querySelectorAll('.ep-seg')].forEach((e, i) => e.classList.toggle('cut', i > fireIdx));
    const early = fireIdx < SEG.length - 1;
    note.innerHTML = early
      ? `<b class="bad">Fired mid-number.</b> The timer expired during a gap where the caller was just moving their eye to the next chunk. The agent starts talking over "${SEG[fireIdx + 1] ? SEG[fireIdx + 1].t : ''}" — you have destroyed the turn <em>and</em> every digit in it, and now you pay for the repair.`
      : mode === 'smart'
      ? `<b class="good">Waited correctly, then fired fast.</b> The classifier read the partial transcript: after "eight zero" the utterance looks complete, so it waits only ~200 ms. On the earlier gaps it saw an <em>incomplete</em> ID and held on. Content decides, not the clock.`
      : `<b class="good">Correct — but slow.</b> At ${T} ms you cleared the longest gap (820 ms), so you never cut in. You are now adding ${T} ms of dead air to <em>every single turn</em>, including the ones that were obviously finished.`;
  }
  d.addEventListener('input', render);
  r.querySelector('#ep-m').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    mode = b.dataset.m;
    [...b.parentElement.children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    r.querySelector('.sl').style.opacity = mode === 'smart' ? .4 : 1;
    render();
  });
  render();
};

/* ---------- 4. ASR: partials get revised, then finalise ---------- */
V.asr = function (r) {
  const STEPS = [
    { p:'four',                 f:0 }, { p:'four seven',           f:0 },
    { p:'four seventy',         f:0 }, { p:'four seven two',       f:0 },
    { p:'four seven two nine',  f:0 }, { p:'four seven two nine one', f:0 },
    { p:'4 7 2 9 1.',           f:1 }
  ];
  r.innerHTML = `
   <div class="vh"><b>A streaming recogniser guesses, then corrects itself.</b>
     <span>Partials are revisable — watch "four seven" become "four seventy" and then get corrected back. Only the final is safe to act on.</span></div>
   <div class="asr-box"><div class="asr-txt" id="asr-t">…</div><span class="asr-badge" id="asr-b">partial</span></div>
   <div class="asr-bar"><div id="asr-p"></div></div>
   <p class="note" id="asr-n">A partial is a guess in progress. Driving <b>endpointing</b> and <b>speculative prefill</b> from it is correct. Booking an appointment from it is not.</p>
   <button class="btn" id="asr-go">Replay</button>`;
  const t = r.querySelector('#asr-t'), b = r.querySelector('#asr-b'),
        p = r.querySelector('#asr-p'), note = r.querySelector('#asr-n');
  let timers = [];
  function play() {
    timers.forEach(clearTimeout); timers = [];
    STEPS.forEach((s, i) => timers.push(setTimeout(() => {
      const revised = i > 0 && !s.f && !s.p.startsWith(STEPS[i-1].p);
      t.textContent = s.p;
      t.classList.toggle('rev', revised);
      t.classList.toggle('fin', !!s.f);
      b.textContent = s.f ? 'FINAL' : 'partial';
      b.classList.toggle('fin', !!s.f);
      p.style.width = ((i + 1) / STEPS.length * 100) + '%';
      if (revised) note.innerHTML = `<b class="bad">Revised.</b> It had committed to "four seventy" and more audio changed its mind. This is exactly why you never act on a partial.`;
      if (s.f) note.innerHTML = `<b class="good">Finalised.</b> Flush, rescore with full context, punctuate — about <b>120 ms</b>. Because it is streaming, that runs <em>inside</em> the endpoint hangover you were already waiting out, so it costs zero added latency.`;
    }, i * 520 + 300)));
  }
  r.querySelector('#asr-go').addEventListener('click', play);
  V.vis(r, play, () => { timers.forEach(clearTimeout); timers = []; });
};

/* ---------- 5. LLM: prefill (parallel) vs decode (sequential) ---------- */
V.llm = function (r) {
  r.innerHTML = `
   <div class="vh"><b>Prefill is one parallel gulp. Decode is one token at a time.</b>
     <span>And TTS cannot start on one token — it needs a whole clause. That is the cost everybody forgets.</span></div>
   <div class="llm-row"><i>prefill<br><small>2k tokens</small></i><div class="llm-pre" id="lm-pre"></div><b id="lm-pt"></b></div>
   <div class="llm-row"><i>decode<br><small>1 at a time</small></i><div class="llm-dec" id="lm-dec"></div><b id="lm-dt"></b></div>
   <p class="note" id="lm-n"></p>
   <button class="btn" id="lm-go">Replay</button>`;
  const pre = r.querySelector('#lm-pre'), dec = r.querySelector('#lm-dec');
  const pt = r.querySelector('#lm-pt'), dt = r.querySelector('#lm-dt'), note = r.querySelector('#lm-n');
  const NT = 14, CLAUSE = 10;
  for (let i = 0; i < 24; i++) pre.appendChild(Object.assign(document.createElement('i'), { className: 'blk' }));
  for (let i = 0; i < NT; i++) {
    const e = document.createElement('i'); e.className = 'tok' + (i === CLAUSE - 1 ? ' clause' : '');
    dec.appendChild(e);
  }
  let timers = [];
  function play() {
    timers.forEach(clearTimeout); timers = [];
    [...pre.children].forEach(e => e.classList.remove('on'));
    [...dec.children].forEach(e => e.classList.remove('on'));
    pt.textContent = ''; dt.textContent = '';
    note.innerHTML = 'Prefill reads the whole prompt at once — so it can be started <b>speculatively during the hangover</b>, on different hardware from the ASR. Effectively free.';
    timers.push(setTimeout(() => {
      [...pre.children].forEach(e => e.classList.add('on'));
      pt.textContent = '180 ms · 1 pass';
    }, 400));
    for (let i = 0; i < NT; i++) timers.push(setTimeout(() => {
      dec.children[i].classList.add('on');
      dt.textContent = ((i + 1) * 18) + ' ms';
      if (i === CLAUSE - 1) {
        note.innerHTML = `<b class="good">First speakable clause at token 10 — about 180 ms of decode.</b> This is where TTS can finally start. If you budgeted "time to first <em>token</em>" you are <b class="bad">180 ms over</b> before you have written a line of code. Under load, ms/token rises 18 → 26 and this becomes ~260 ms.`;
      }
    }, 900 + i * 150));
  }
  r.querySelector('#lm-go').addEventListener('click', play);
  V.vis(r, play, () => { timers.forEach(clearTimeout); timers = []; });
};

         <span>→</span><div class="sy-b">waveform</div>`;
    fnote.innerHTML = m === 'cascade'
      ? `Two models, trained separately, with a spectrogram handed between them. The vocoder saw <b>real</b> mels in training but is served <b>predicted</b> ones — that mismatch is the buzz. The fix is to fine-tune the vocoder on the acoustic model's <em>own</em> predicted mel. <b class="good">What you keep:</b> a mel you can inspect and a vocoder you can swap.`
      : `<b class="good">The mel never leaves the model</b> — it survives only as an L1 training loss. No handoff, so no train/serve mismatch, and no external aligner. <b class="bad">What you pay:</b> when it buzzes there is no mel to look at and no half to A/B. The fix becomes a retrain, not a component swap. That is a real trade.`;
  }
  r.querySelector('#sy-m').addEventListener('click', e => {

  const at = (p, f) => cells[p * F + f];
  const FREE = [0,1,1,2,3,3,3,3,3,3,2,3,4,5,6,5,6,7,10,10,10,10,10,10];

};

/* ---------- 8. RESAMPLE: aliasing ---------- */
V.resample = function (r) {
  r.innerHTML = `
   <div class="vh"><b>Drop samples without filtering and the tone comes back as a different tone.</b>
     <span>Green = the real wave. White dots = what you kept. Red = the wave those dots actually describe.</span></div>
   <canvas class="cv" id="rs-c" height="160"></canvas>
   <div class="seg2" id="rs-m">
     <button data-m="naive" aria-pressed="true">x[::3] — just slice</button>
     <button data-m="filt" aria-pressed="false">filter, then decimate</button></div>
   <label class="sl">Tone in the source <b id="rs-v">6000</b> Hz
     <input type="range" id="rs-f" min="1000" max="11000" step="250" value="6000"></label>
   <p class="note" id="rs-n"></p>`;
  const c = r.querySelector('#rs-c'), ctx = c.getContext('2d');
  const f = r.querySelector('#rs-f'), fv = r.querySelector('#rs-v'), note = r.querySelector('#rs-n');
  const FS = 8000, NYQ = FS / 2;
  let mode = 'naive', raf = null, t0 = performance.now();
  function size() { const w = r.clientWidth || 600; c.width = w * devicePixelRatio; c.height = 160 * devicePixelRatio;
    c.style.width = w + 'px'; c.style.height = '160px'; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
  function alias(F) { let a = F % FS; if (a > NYQ) a = FS - a; return a; }
  function verdict() {
    const F = +f.value; fv.textContent = F;
    const above = F > NYQ, fa = alias(F);
    if (mode === 'filt') {
      note.innerHTML = above
        ? `<b class="good">Filtered out.</b> The low-pass removed ${F} Hz <em>before</em> decimating, so it is simply gone — you lost it, but you did not get a <b>fake tone</b> in its place. Losing high frequencies on a phone line is expected; inventing new ones is a bug.`
        : `<b class="good">Passes through cleanly.</b> ${F} Hz is under the ${NYQ} Hz ceiling, so filtering leaves it alone and decimating is safe.`;
    } else {
      note.innerHTML = above
        ? `<b class="bad">Folded.</b> ${F} Hz is above the ${NYQ} Hz ceiling, so the samples fit a <b>${Math.round(fa)} Hz</b> tone instead — one that was never in the room. At 6 kHz that lands near 2 kHz, straight into the vowel band, and it sounds like a buzz no model change will fix.`
        : `<b class="good">Safe by luck.</b> ${F} Hz happens to be under the ceiling. Slice a source containing anything above ${NYQ} Hz and it folds — which is why you filter first rather than hoping.`;
    }
  }
  function draw(now) {
    const w = c.width / devicePixelRatio, h = 160, mid = h / 2;
    const F = +f.value, above = F > NYQ, fa = alias(F);
    const filtered = mode === 'filt' && above;
    const cycles = 5, secs = cycles / F, ph = ((now - t0) / 1000) * 0.3;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = '#30363d'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(w, mid); ctx.stroke();
    if (!filtered) {
      ctx.strokeStyle = '#3fb950'; ctx.lineWidth = 2; ctx.beginPath();
      for (let x = 0; x <= w; x++) { const tt = (x / w) * secs + ph / F;
        const y = mid - Math.sin(2*Math.PI*F*tt) * (mid - 24); x ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }
      ctx.stroke();
    } else {
      ctx.strokeStyle = '#3fb95044'; ctx.lineWidth = 1.5; ctx.setLineDash([3,5]); ctx.beginPath();
      for (let x = 0; x <= w; x++) { const tt = (x / w) * secs + ph / F;
        const y = mid - Math.sin(2*Math.PI*F*tt) * (mid - 24); x ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }
      ctx.stroke(); ctx.setLineDash([]);
    }
    if (above && mode === 'naive') {
      ctx.strokeStyle = '#f85149'; ctx.lineWidth = 2.5; ctx.setLineDash([6,4]); ctx.beginPath();
      for (let x = 0; x <= w; x++) { const tt = (x / w) * secs + ph / F;
        const y = mid - Math.sin(2*Math.PI*fa*tt) * (mid - 24); x ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }
      ctx.stroke(); ctx.setLineDash([]);
    }
    const n = Math.max(2, Math.round(secs * FS));
    ctx.fillStyle = filtered ? '#6e7681' : '#e6edf3';
    for (let i = 0; i <= n; i++) {
      const tt = i / FS + ph / F, x = ((tt - ph / F) / secs) * w;
      if (x < 0 || x > w) continue;
      const src = filtered ? 0 : Math.sin(2*Math.PI*F*tt);
      const y = mid - src * (mid - 24);
      ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill();
    }
    raf = requestAnimationFrame(draw);
  }
  f.addEventListener('input', verdict);
  r.querySelector('#rs-m').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    mode = b.dataset.m;
    [...b.parentElement.children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    verdict();
  });
  size(); addEventListener('resize', size); verdict();
  V.vis(r, () => { if (!raf) raf = requestAnimationFrame(draw); },
             () => { if (raf) { cancelAnimationFrame(raf); raf = null; } });
};

/* ---------- 9. RTP / MU-LAW ---------- */
V.rtp = function (r) {
  r.innerHTML = `
   <div class="vh"><b>μ-law spends its 256 levels where the ear is looking.</b>
     <span>Uniform spacing wastes precision on loud parts and starves the quiet ones. Companding fixes the quiet end.</span></div>
   <div class="seg2" id="rt-m">
     <button data-m="uniform" aria-pressed="true">Uniform 8-bit</button>
     <button data-m="mu" aria-pressed="false">μ-law (G.711)</button></div>
   <svg class="mu" id="rt-s" viewBox="0 0 460 150" preserveAspectRatio="none"></svg>
   <p class="note" id="rt-n"></p>
   <div class="vh sub"><b>Then pace it: one packet every 20 ms.</b>
     <span>Burst them and the tail gets dropped — and you inflate the far end's jitter estimate too.</span></div>
   <div class="seg2" id="rt-p">
     <button data-m="paced" aria-pressed="true">Paced</button>
     <button data-m="burst" aria-pressed="false">Bursty</button></div>
   <div class="pacer" id="rt-t"></div>
   <p class="note" id="rt-pn"></p>`;
  const svg = r.querySelector('#rt-s'), note = r.querySelector('#rt-n');
  function drawMu(m) {
    svg.innerHTML = '';
    const N = 16;
    for (let i = 0; i <= N; i++) {
      const lin = i / N;
      const y = m === 'mu'
        ? Math.log(1 + 255 * lin) / Math.log(256)   // mu-law companding curve
        : lin;
      const yy = 140 - y * 130;
      const l = document.createElementNS('http://www.w3.org/2000/svg','line');
      l.setAttribute('x1', 8); l.setAttribute('x2', 452);
      l.setAttribute('y1', yy); l.setAttribute('y2', yy);
      l.setAttribute('class', 'lv'); svg.appendChild(l);
    }
    const q = document.createElementNS('http://www.w3.org/2000/svg','rect');
    q.setAttribute('x', 8); q.setAttribute('y', 108); q.setAttribute('width', 444);
    q.setAttribute('height', 34); q.setAttribute('class', 'quiet'); svg.appendChild(q);
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x', 14); t.setAttribute('y', 130); t.setAttribute('class','lb');
    t.textContent = 'quiet talker lives here'; svg.appendChild(t);
    note.innerHTML = m === 'mu'
      ? `<b class="good">Levels bunch up at the quiet end.</b> A soft talker now gets many distinct steps instead of two or three, so the noise floor scales with the signal — roughly a <b>flat 38 dB SNR</b> across the whole range. That is why the phone network companded in the first place.`
      : `<b class="bad">Evenly spaced levels.</b> Great precision where the signal is loud, and almost none where a quiet caller actually sits — you can see how few lines fall in the shaded band. That is audible hiss on exactly the callers who are hardest to hear.`;
  }
  r.querySelector('#rt-m').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
    [...b.parentElement.children].forEach(x => x.setAttribute('aria-pressed', String(x === b))); drawMu(b.dataset.m); });
  drawMu('uniform');

  const track = r.querySelector('#rt-t'), pnote = r.querySelector('#rt-pn');
  for (let i = 0; i < 24; i++) track.appendChild(Object.assign(document.createElement('i'), { className: 'pc' }));
  let pm = 'paced', tt = null;
  function pace() {
    if (tt) clearInterval(tt);
    [...track.children].forEach(e => e.className = 'pc');
    let i = 0;
    tt = setInterval(() => {
      if (i >= 24) { clearInterval(tt); tt = null; return; }
      if (pm === 'paced') { track.children[i].classList.add('on'); i++; }
      else {
        for (let k = 0; k < 6 && i < 24; k++, i++)
          track.children[i].classList.add(k >= 4 ? 'drop' : 'on');
      }
    }, pm === 'paced' ? 90 : 420);
  }
  r.querySelector('#rt-p').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
    pm = b.dataset.m;
    [...b.parentElement.children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    pnote.innerHTML = pm === 'paced'
      ? `<b class="good">One packet every 20 ms on a real clock.</b> The queue never sees a burst, so nothing is tail-dropped, and the far end's jitter estimate stays small — meaning <em>their</em> buffer stays small, which is latency you did not cause.`
      : `<b class="bad">Six packets at once, then nothing.</b> The queue drops the tail of each burst (red), and the far end measures wild arrival variance — so it grows its buffer to absorb variation <em>you invented</em>. You caused both loss and latency.`;
    pace(); });
  pnote.innerHTML = `<b class="good">One packet every 20 ms on a real clock.</b> The queue never sees a burst, so nothing is tail-dropped.`;
  V.vis(r, pace, () => { if (tt) { clearInterval(tt); tt = null; } });
};

/* ---------- page ---------- */
const D = JSON.parse(document.getElementById('iv-data').textContent);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function phaseHTML(p) {
  return `
  <section class="ph${p.star ? ' key' : ''}" id="p${p.n}">
    <div class="ph-h">
      <span class="ph-n">${p.n}</span>
      <span class="ph-t">${p.icon} ${esc(p.name)}</span>
      <span class="ph-tag">${esc(p.tag)}</span>
    </div>
    <div class="ph-b">
      <p class="one">${esc(p.one)}</p>
      <p class="how">${esc(p.how)}</p>

      <div class="lbl">See it</div>
      <div class="viz" data-viz="${p.viz}"></div>

      <div class="lbl">Best choice</div>
      <div class="best">${esc(p.best)}</div>
      <ul class="why">${p.why.map(w => `<li>${esc(w)}</li>`).join('')}</ul>

      <div class="lbl">Say it like this</div>
      <div class="say">${esc(p.say)}</div>

      <div class="lbl">They'll ask</div>
      ${p.qa.map(x => `<details class="qa">
        <summary class="qa-q">${esc(x.q)}<span class="cv2">▶</span></summary>
        <div class="qa-a">${esc(x.a)}</div></details>`).join('')}

      <div class="lbl">Words to use</div>
      <div class="kw">${p.keywords.map(k => `<i>${esc(k)}</i>`).join('')}</div>
    </div>
  </section>`;
}

document.getElementById('app').innerHTML = `
<div class="nav"><div class="nav-in">
  ${D.phases.map(p => `<a href="#p${p.n}">${p.n} ${esc(p.name.split(' ')[0])}</a>`).join('')}
  <a href="#cross">Q&amp;A</a><a href="#nums">Numbers</a>
  <span class="sp">
    <button class="btn2" id="hide" aria-pressed="false">Self-test</button>
    <button class="btn2" id="expand" aria-pressed="false">Open all Q</button>
  </span>
</div></div>

<div class="wrap">
  <header class="hd">
    <h1>Voice Agent Pipeline — Interview Sheet</h1>
    <p>The nine stages a caller's voice passes through, what to pick at each one, and the words to explain it in. Built for a one-hour conversation.</p>
  </header>

  <div class="map">
    ${D.phases.map(p => `<a href="#p${p.n}" class="${p.star ? 'key' : ''}">
      <span class="mi">${p.icon}</span><span class="mn">${esc(p.name)}</span>
      <span class="mt">${p.n}</span></a>`).join('')}
  </div>

  <div class="open">
    <h3>Open with this — the 40-second walkthrough</h3>
    <p class="script">"Caller audio arrives over RTP into a <b>jitter buffer</b>. A <b>VAD</b> tells me which frames are speech, and an <b>endpointer</b> decides when the turn is actually over — that's the biggest number in my latency budget. Streaming <b>ASR</b> gives me text, the <b>LLM</b> gives me a reply, and the TTS side is two parts: a <b>frontend</b> that normalizes, converts to phonemes and predicts prosody, then <b>synthesis</b> — one model, VITS, straight to a waveform. Then I <b>resample</b> to 8k, <b>μ-law</b> it, and pace it out as one packet every 20 ms."
    <br><br><em>Then hand them the wheel:</em> "The interesting decisions are the endpointer and the synthesis choice — where do you want to dig in?"</p>
  </div>

  ${D.phases.map(phaseHTML).join('')}

  <h2 class="lbl" id="cross" style="font-size:.75rem;margin-top:2rem">Questions that span the whole system</h2>
  <div class="cross">
    ${D.cross.map(x => `<details class="qa">
      <summary class="qa-q">${esc(x.q)}<span class="cv2">▶</span></summary>
      <div class="qa-a">${esc(x.a)}</div></details>`).join('')}
  </div>

  <h2 class="lbl" id="nums" style="font-size:.75rem;margin-top:2rem">Numbers to have ready</h2>
  <div class="nums">
    ${D.numbers.map(n => `<div class="num"><b>${esc(n[0])}</b><span>${esc(n[1])}</span></div>`).join('')}
  </div>

  <div class="open" style="border-left-color:var(--rd);margin-top:2rem">
    <h3>If you remember nothing else</h3>
    <p class="script" style="border-left-color:var(--rd)">
      <b>1.</b> Define the clock as last-speech-sample-in to first-sample-in-their-ear — both network legs are inside your budget.<br>
      <b>2.</b> The endpointer is the biggest movable number, and ASR finalisation + LLM prefill hide inside it. That's 300 ms free.<br>
      <b>3.</b> VITS deletes the mel seam; what you pay is debuggability. Say it's a trade, not a win.<br>
      <b>4.</b> Pick NAR for the <em>tail</em>, not the mean — a stop token is a prediction, and when it fails you get babble.<br>
      <b>5.</b> Almost everything here fails <em>silently</em>. Pin the front end in CI; alert on confidence, not exceptions.
    </p>
  </div>

  <footer class="foot">
    Nine stages · <a href="tts-architecture-interactive.html">full architecture page</a> ·
    <a href="tts/concepts/index.html">32 concept deep-dives</a>
  </footer>
</div>`;

/* mount visualisations */
document.querySelectorAll('.viz[data-viz]').forEach(el => {
  const fn = V[el.dataset.viz];
  if (!fn) { el.innerHTML = '<p class="note">missing viz: ' + el.dataset.viz + '</p>'; return; }
  try { fn(el); el.dataset.mounted = '1'; }
  catch (e) { el.innerHTML = '<p class="note bad">viz error: ' + esc(e.message) + '</p>'; }
});

/* self-test blur */
document.getElementById('hide').addEventListener('click', e => {
  const on = document.body.dataset.hide !== '1';
  document.body.dataset.hide = on ? '1' : '0';
  e.target.setAttribute('aria-pressed', String(on));
  e.target.textContent = on ? 'Reveal all' : 'Self-test';
});
/* open/close every question */
document.getElementById('expand').addEventListener('click', e => {
  const on = e.target.getAttribute('aria-pressed') !== 'true';
  document.querySelectorAll('details.qa').forEach(d => { d.open = on; });
  e.target.setAttribute('aria-pressed', String(on));
  e.target.textContent = on ? 'Close all Q' : 'Open all Q';
});

</script>
